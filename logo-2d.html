<style>
html,body{margin:0;padding:0;background:transparent}
.wrap{display:flex;align-items:center;justify-content:center;padding:10px 0}
.logo2d{position:relative;width:100%;max-width:340px}
.logo2d img{display:block;width:100%;height:auto}
.logo2d.playing img{animation:logoIn 1.05s cubic-bezier(.16,.84,.44,1) both,imgFlash 4.6s ease-out .9s infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes imgFlash{0%{filter:brightness(1)}6%{filter:brightness(1.18)}16%{filter:brightness(1)}100%{filter:brightness(1)}}
.ring{position:absolute;left:24.9%;top:52.8%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #c17a3a;opacity:0;pointer-events:none}
.logo2d.playing .ring{animation:ringPulse 4.6s ease-out .9s infinite}
@keyframes ringPulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.55);box-shadow:0 0 0 0 rgba(193,122,58,.6)}6%{opacity:1;transform:translate(-50%,-50%) scale(.75);box-shadow:0 0 18px 4px rgba(193,122,58,.55)}28%{opacity:0;transform:translate(-50%,-50%) scale(2.05);box-shadow:0 0 0 0 rgba(193,122,58,0)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.05)}}
.flashpop{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 24.9% 52.8%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 9%,transparent 22%);opacity:0}
.logo2d.playing .flashpop{animation:flashPop 4.6s ease-out .9s infinite}
@keyframes flashPop{0%{opacity:0}6%{opacity:1}16%{opacity:0}100%{opacity:0}}
.sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sheen::after{content:"";position:absolute;top:0;left:-70%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.98) 50%,transparent);transform:skewX(-18deg);opacity:0}
.logo2d.playing .sheen::after{animation:sheenSweep 4.6s ease-in-out .9s infinite}
@keyframes sheenSweep{0%{left:-70%;opacity:0}5%{opacity:1}19%{opacity:0}100%{left:140%;opacity:0}}
.mark{position:absolute;right:2px;bottom:-14px;font:600 10px -apple-system,Segoe UI,Roboto,sans-serif;color:rgba(0,0,0,.28);letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){
  .logo2d.playing img,.logo2d.playing .ring,.logo2d.playing .sheen::after,.logo2d.playing .flashpop{animation:none!important;opacity:1;filter:none}
}
</style>

<script>
/* Bescherming: dit logo-element werkt alleen op photobyarno.com en het eigen GitHub-adres. */
const PBA_HOSTS=['photobyarno.com','www.photobyarno.com','arno123max.github.io'];
const pbaHostOk=h=>{h=String(h||'').toLowerCase();return PBA_HOSTS.indexOf(h)>=0||h==='jouwweb.nl'||/\.jouwweb\.nl$/.test(h)};
const PBA_OK=(()=>{
  if(!pbaHostOk(location.hostname))return false;
  let top=true;try{top=window.self===window.top}catch(e){top=false}
  if(top)return true;
  try{const ao=location.ancestorOrigins;if(ao&&ao.length){for(let i=0;i<ao.length;i++)if(!pbaHostOk(new URL(ao[i]).hostname))return false;return true}}catch(e){}
  try{if(document.referrer)return pbaHostOk(new URL(document.referrer).hostname)}catch(e){}
  return true;
})();
if(!PBA_OK){document.body.innerHTML='';}
function postToParent(msg){try{if(window.parent!==window)window.parent.postMessage(msg,'*')}catch(e){}}
function postHeight(){postToParent({pbaHeight:Math.ceil(document.documentElement.scrollHeight)})}
try{new ResizeObserver(postHeight).observe(document.body)}catch(e){setInterval(postHeight,1000)}
postHeight();
</script>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){
  const root=document.getElementById('pbaPodcast');
  if(!PBA_OK){root.innerHTML='';postHeight();return}
  root.innerHTML=EPISODES.map(ep=>`
    <div class="ep">
      <h3>${esc(ep.title)}</h3>
      <div class="meta${ep.placeholder?' placeholder':''}">${esc(ep.date)}${ep.placeholder?' · ⚠️ testaudio, nog geen echte opname':''}</div>
      <audio controls preload="none" src="${ep.audioSrc}"></audio>
      <p>${esc(ep.intro)}</p>
      <div class="notes">
        <div class="row"><span class="ic">📍</span><span>${esc(ep.parking)}</span></div>
        <div class="row"><span class="ic">🕐</span><span>${esc(ep.timeNote)}</span></div>
        <div class="row"><span class="ic">🧭</span><span><a href="${ep.navUrl}" target="_blank" rel="noopener">Navigeer hierheen ↗</a></span></div>
      </div>
    </div>
  `).join('')+'<span class="mark">photobyarno.com</span>';
  postHeight();
}
render();
try{new ResizeObserver(postHeight).observe(document.body)}catch(e){setInterval(postHeight,1000)}
</script>

let LANG="nl";
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function t(obj){return obj&&(obj[LANG]||obj.nl)}

function render(){
  const root=document.getElementById('pbaPodcast');
  if(!PBA_OK){root.innerHTML='';postHeight();return}
  root.innerHTML=EPISODES.map(ep=>`
    <div class="ep">
      <h3>${esc(t(ep.title))}</h3>
      <div class="meta${ep.placeholder?' placeholder':''}">${esc(t(ep.date))}${ep.placeholder?' · '+esc(t(UI.placeholderWarn)):''}</div>
      <div class="audiolang">${esc(t(UI.audioLang))}</div>
      <audio controls preload="none" src="${ep.audioSrc}"></audio>
      <p>${esc(t(ep.intro))}</p>
      <div class="notes">
        <div class="row"><span class="ic">📍</span><span>${esc(t(ep.parking))}</span></div>
        <div class="row"><span class="ic">🕐</span><span>${esc(t(ep.timeNote))}</span></div>
        <div class="row"><span class="ic">🧭</span><span><a href="${ep.navUrl}" target="_blank" rel="noopener">${esc(t(UI.navigate))} ↗</a></span></div>
      </div>
    </div>
  `).join('')+'<span class="mark">photobyarno.com</span>';
  postHeight();
}

function setLang(l){
  if(["nl","en","de","es"].indexOf(l)<0)l="nl";
  LANG=l;
  try{localStorage.setItem("ps-lang",l)}catch(e){}
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
  render();
}

(function initLang(){
  let v=null;
  try{v=new URLSearchParams(location.search).get("lang")}catch(e){}
  if(["nl","en","de","es"].indexOf(v)<0){
    v=null;
    try{v=localStorage.getItem("ps-lang")}catch(e){}
  }
  LANG=["nl","en","de","es"].indexOf(v)>=0?v:"nl";
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===LANG));
})();

render();
try{new ResizeObserver(postHeight).observe(document.body)}catch(e){setInterval(postHeight,1000)}
</script>

<title>PhotoByArno Academy – learn photography with free interactive animations</title>
<meta name="description" content="Learn photography with interactive 3D lessons: get to know your camera, the exposure triangle, focus modes, depth of field, focal length and composition. Free, no account needed, in English, Dutch, German and Spanish.">

<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--soft:#efede8;--text:#1d1d1b;--text2:#5f5e5a;--muted:#8a8984;
  --line:rgba(0,0,0,.10);--line2:rgba(0,0,0,.18);--accent:#1d6fd1;--accent-bg:#e6f0fb;--accent-text:#0c447c;
  --ok:#2f7a1f;--ok-bg:#eaf3de;--bad:#a32d2d;--bad-bg:#fcebeb;--radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not(.embedded){--bg:#161615;--card:#21211f;--soft:#2a2a28;--text:#f1efe8;--text2:#b4b2a9;--muted:#888780;
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.20);--accent:#5c9ce6;--accent-bg:#0c2f55;--accent-text:#b5d4f4;
  --ok:#97c459;--ok-bg:#1f3410;--bad:#f09595;--bad-bg:#4a1717;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:600;letter-spacing:-.01em}
.badge{font-size:12px;font-weight:500;background:var(--accent-bg);color:var(--accent-text);padding:2px 9px;border-radius:999px}
.lang{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.lang button{border:0;background:transparent;color:var(--text2);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--text);color:var(--bg)}
h1{font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600;margin:28px 0 8px}
h3{font-size:16px;font-weight:600;margin:0 0 4px}
p{margin:0 0 12px}
.lead{color:var(--text2);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;font:inherit;color:inherit;width:100%}
button.card{cursor:pointer;transition:border-color .15s}
button.card:hover{border-color:var(--accent)}
.card i{font-size:24px;color:var(--accent)}
.card p{font-size:14px;color:var(--text2);margin:0}
.card.soon{opacity:.6}
.card.soon i{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;margin-top:10px;background:var(--soft);color:var(--text2)}
.tag.go{background:var(--accent-bg);color:var(--accent-text)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.concepts{display:grid;gap:10px;margin:14px 0 6px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px}
.concept i{font-size:22px;color:var(--accent);margin-top:2px}
.concept p{font-size:14px;color:var(--text2);margin:0}
.key{background:var(--accent-bg);color:var(--accent-text);border-radius:12px;padding:12px 14px;margin:4px 0 6px;display:flex;gap:12px}
.key i{font-size:22px;margin-top:2px}
.key p{font-size:14px;margin:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
canvas{width:100%;display:block;border-radius:10px}
.meterlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 0 4px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.meter .mid{position:absolute;left:50%;top:-4px;width:1px;height:14px;background:var(--line2)}
.meter .mk{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);left:50%;transition:left .3s}
.evtxt{font-size:14px;font-weight:600;text-align:center;margin:8px 0 14px}
.row{display:flex;align-items:center;gap:10px}
.row label{font-size:14px;color:var(--text2);width:90px;flex-shrink:0}
.row input{flex:1;accent-color:var(--accent)}
.row span{font-size:14px;font-weight:600;min-width:72px;text-align:right}
.hint{font-size:12px;color:var(--muted);margin:2px 0 12px 100px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:var(--radius);padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cap{font-size:14px;color:var(--text2);margin:12px 0 0;min-height:44px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.q h3{font-size:15px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px}
.opt input{accent-color:var(--accent)}
.fb{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.err{font-size:13px;color:var(--bad);margin-top:6px;display:none}
.score{font-size:15px;font-weight:600;margin-top:10px}
.tool{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;text-decoration:none;color:inherit}
.tool:hover{border-color:var(--accent)}
.tool>i{font-size:24px;color:var(--accent)}
.tool p{font-size:14px;color:var(--text2);margin:0}
.tool .go{margin-left:auto;font-size:20px;color:var(--accent)}
.seg.wrap button{white-space:normal;line-height:1.3}
.small{font-size:13px;color:var(--muted);margin:8px 0 12px}
.pick{display:inline-flex}
#asgOut img{display:block;max-width:100%;max-height:300px;margin:14px auto 10px;border-radius:10px}
.imgwrap{position:relative;width:fit-content;max-width:100%;margin:14px auto 10px}
.imgwrap img{margin:0 !important}
.imgwrap .sbox{position:absolute;border:3px solid #3fb950;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.imgwrap .tbox{position:absolute;background:rgba(63,185,80,.32);outline:1px solid rgba(63,185,80,.9);outline-offset:-1px}
.dofbar{position:relative;height:58px;margin:14px 10px 0}
.dofbar .tr{position:absolute;left:0;right:0;top:30px;height:6px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.dofbar .band{position:absolute;top:29px;height:8px;border-radius:4px;background:#3fb950;opacity:.85}
.dofbar .obj{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--text2);white-space:nowrap;text-align:center}
.dofbar .obj b{display:block;width:2px;height:10px;background:var(--text2);margin:2px auto 0}
.dofbar .fm{position:absolute;top:40px;transform:translateX(-50%);font-size:11px;color:var(--accent);white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:2px 0 10px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.pair figure{margin:0}
.pair img{display:block;width:100%;border-radius:8px}
.pair figcaption{font-size:13px;color:var(--text2);margin-top:4px;text-align:center}
.seg.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.grid2 button{border-left:0}
.seg.grid2 button:nth-child(2n){border-left:1px solid var(--line)}
.seg.grid2 button:nth-child(n+3){border-top:1px solid var(--line)}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.lfoot .lbl{margin:0}
.thumbs{display:flex;gap:6px}
.thumbs .btn{padding:7px 12px}
.thumbs .btn i{font-size:18px}
.lfoot .share{margin-left:auto}
.lmsg{width:100%;font-size:13px;color:var(--text2);margin:0}
.lmsg input{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--text)}
@media (max-width:520px){.lfoot .share{margin-left:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:13px;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 10px}
.fbk{list-style:none;padding:0;margin:6px 0 12px}
.fbk li{display:flex;gap:10px;font-size:14px;padding:9px 12px;border-radius:10px;margin-bottom:6px}
.fbk li i{font-size:18px;margin-top:1px}
.fbk .g{background:var(--ok-bg);color:var(--ok)}
.fbk .t{background:var(--accent-bg);color:var(--accent-text)}
.fbk .n{background:var(--soft);color:var(--text2)}
#histo,.histo-cv{width:100%;height:120px;display:block;border-radius:8px;background:var(--soft);margin:4px 0 10px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--text2);padding:9px 4px;font:inherit;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.lbl{font-size:13px;color:var(--text2);margin:0}
.dbar{position:relative;height:62px;margin:14px 28px 0}
.dbar .tr{position:absolute;left:0;right:0;top:27px;height:4px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.dbar .mkr{position:absolute;transform:translateX(-50%);text-align:center;font-size:11px;white-space:nowrap}
.dbar .mkr b{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto}
.dbar .sub{top:2px}.dbar .sub b{margin-top:4px}
.dbar .foc{top:23px}.dbar .foc b{margin-bottom:3px}
.dends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:2px 0 8px}
.fstat{font-size:14px;font-weight:600;text-align:center;margin:4px 0 12px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.embedded,.embedded body{background:transparent}
.embedded .wrap{max-width:none;padding:0 0 8px}
.lead{max-width:75ch}
@media (min-width:900px){
  .embedded .concepts{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .embedded .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .embedded .stage,.embedded #quiz,.embedded #asg,.embedded .tool{max-width:860px}
}
@media (max-width:420px){.row label{width:78px}.hint{margin-left:88px}.row span{min-width:64px}}
/* 3D-onderdelen (v1.16) */
.k3v{position:relative;width:100%;aspect-ratio:4/3;max-height:460px;border-radius:10px;overflow:hidden;background:var(--soft);touch-action:pan-y;cursor:grab}
.k3v:active{cursor:grabbing}
.k3v.k3wide{aspect-ratio:16/10;margin-top:4px}
.k3v canvas{width:100%;height:100%;border-radius:0}
.k3msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;margin:0;font-size:13px;color:var(--muted)}
.k3bar{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:10px 0 10px}
.k3bar .seg{margin:0;flex:0 1 auto}
.k3bar .seg button{padding:7px 12px}
.k3hint{font-size:12px;color:var(--muted);margin-left:auto}
.k3stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 0}
.k3stats div{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:2px;align-content:start}
.k3stats span{font-size:11.5px;color:var(--text2);line-height:1.3}
.k3stats b{font-size:15px;font-variant-numeric:tabular-nums}
.k3photo{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#3c5a3a;margin-top:4px}
.k3photo canvas{position:absolute;inset:-6%;width:112%;height:112%;border-radius:0}
.k3photo canvas.fg{inset:0;width:100%;height:100%}
.k3sw{margin:0 0 10px;max-width:340px}
.k3sw button i{font-size:15px;vertical-align:-2px}
.k3sec .seg{margin-top:0}
.cstep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 2px}
.cstep button{flex-shrink:0}
.cstep .dots{display:flex;gap:6px}
.cstep .dots span{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer}
.cstep .dots span.on{background:var(--accent)}
/* Les 'Je camera leren kennen' (v1.17) */
.hsov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.45);transition:opacity .2s,background .2s}
.hs.off{opacity:0;pointer-events:none}
.hs.sel{background:#fff;color:var(--accent);border-color:var(--accent)}
.hs.q{background:rgba(255,255,255,.92);border-color:var(--accent);width:24px;height:24px;margin:-12px 0 0 -12px}
.hs.ok{background:#3fb950;border-color:#fff}
.hs.no{background:#e24b4a;border-color:#fff}
.hs:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.caminfo{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;min-height:60px}
.caminfo h3{font-size:15px;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.caminfo p{margin:0;font-size:14px;color:var(--text2)}
.caminfo p.lbl{font-size:12px;margin-bottom:2px}
.caminfo .btn{margin-top:10px;padding:6px 12px;font-size:13px}
.caminfo.ok{background:var(--ok-bg)}.caminfo.ok h3{color:var(--ok)}
.caminfo.no{background:var(--bad-bg)}.caminfo.no h3{color:var(--bad)}
.cnum{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.camlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0 0 6px}
.camlist button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;line-height:1.3;cursor:pointer;min-width:0}
.camlist button:hover{border-color:var(--accent)}
.camlist button b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.camlist button span{min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.camlist button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
</style>
</head>

  cParts:{"shutter": ["Shutter button", "Press halfway: the camera focuses and measures the light. Press all the way: the photo is taken. That half-press comes back in the lesson on focus modes."], "dial": ["Control dial", "Changes the setting that belongs to the chosen mode, such as shutter speed or aperture. Many cameras have two: one at the front and one at the back."], "mode": ["Mode dial", "Decides who chooses what. AUTO: the camera does everything. P: the camera chooses, you can adjust. A (or Av): you choose the aperture. S (or Tv): you choose the shutter speed. M: you choose everything yourself."], "hotshoe": ["Hot shoe", "A slot with contacts on top of the camera. Slide an external flash, a microphone or a wireless remote in here."], "evf": ["Viewfinder", "You hold your eye to this. On a mirrorless camera it's a small screen that shows exactly how your photo will look. The little wheel next to it (diopter) adjusts it to your own eyesight."], "screen": ["Screen", "Shows the live view, the menu and your photos. Often you can tilt it and use it as a touchscreen: handy for shots close to the ground or above your head."], "buttons": ["Buttons and joystick", "The joystick moves the focus point. The buttons around it open the menu, play back your photos or delete them. The layout differs per camera, but the functions are almost always the same."], "lens": ["Lens", "The camera's eye. Two numbers are printed on the rim: the focal length (here 24-70 mm) and the widest aperture (here 1:2.8, so f/2.8)."], "zoom": ["Zoom ring", "Turn it to zoom in and out: you change the focal length. A lens with a single fixed focal length has no zoom ring."], "focus": ["Focus ring", "Lets you focus by hand (MF). Useful for close-ups, stars or shooting through a window, where autofocus hesitates."], "release": ["Lens release button", "Press it and turn the lens to take it off. Change lenses with the camera pointing down, so less dust lands on the sensor."], "card": ["Memory card door", "Behind this door is the slot for the memory card (usually SD). Wait until the light is off before you take the card out."], "tripod": ["Tripod socket", "A screw thread on the bottom for a tripod. Almost all cameras and tripods use the same size (1/4 inch)."], "lenses": ["Lens elements", "Inside the lens are several glass elements in a row. Together they bend the light so a sharp image lands on the sensor. When you zoom or focus, some of them slide back and forth."], "iris": ["Aperture", "A ring of blades that makes a larger or smaller opening. Big hole: more light and a softer background. Small hole: less light and more sharpness from front to back."], "shutterc": ["Shutter", "Two curtains just in front of the sensor. They decide how long light falls on the sensor: the shutter speed. Many cameras and all phones can also expose electronically, without a moving curtain."], "sensor": ["Sensor", "The heart of the camera: a chip with millions of light-sensitive pixels. Notice the image is upside down? That's how light comes through the lens; the camera simply flips it back. A large sensor (full frame) gathers more light than a smaller one (APS-C or phone)."], "proc": ["Image processor", "The camera's small computer. It turns the sensor data into a JPEG, reduces noise and calculates the autofocus. If you shoot RAW, the camera keeps the raw data so you can edit it yourself later."], "battery": ["Battery", "Usually sits in the grip. The screen and viewfinder use a lot of power: bring a spare battery for a full day of shooting and keep it warm when it's cold."]},
  camQs:[{"q": "What happens when you press the shutter button halfway?", "o": ["The camera focuses and measures the light", "The photo is taken", "The menu opens"], "a": 0, "e": "Half-pressing means focusing and metering. The photo is only taken when you press all the way."}, {"q": "Where does the light end up?", "o": ["On the sensor", "In the viewfinder", "On the memory card"], "a": 0, "e": "Light passes through the lens elements, the aperture and the shutter, and then lands on the sensor."}, {"q": "Your lens says 24-70 mm. What does that mean?", "o": ["The focal length ranges from 24 to 70 mm", "The lens is 24 to 70 mm long", "The widest aperture"], "a": 0, "e": "It's the focal length: 24 mm is wide angle, 70 mm is a bit zoomed in."}, {"q": "Which part lets you choose between AUTO, P, A, S and M?", "o": ["The mode dial", "The focus ring", "The zoom ring"], "a": 0, "e": "The mode dial decides who chooses what: you or the camera."}, {"q": "What's the safest way to change lenses?", "o": ["With the camera pointing down", "With the opening facing up, so you can see what you're doing", "It doesn't matter"], "a": 0, "e": "With the opening facing down, less dust lands on the sensor."}, {"q": "What does the shutter do?", "o": ["It decides how long light falls on the sensor", "It decides how big the opening is", "It zooms in and out"], "a": 0, "e": "The shutter controls the shutter speed. The size of the opening is the aperture."}, {"q": "Why is the image on the sensor upside down?", "o": ["That's how lenses bend light; the camera flips it back", "The sensor is mounted the wrong way", "It only happens with cheap cameras"], "a": 0, "e": "Every lens turns the image upside down, including the one in your eye. Your brain and your camera simply flip it back."}, {"q": "What is the screw thread on the bottom for?", "o": ["A tripod", "A flash", "The memory card"], "a": 0, "e": "That's where you screw the camera onto a tripod. A flash goes in the hot shoe on top."}, {"q": "What does a phone usually NOT have?", "o": ["An adjustable aperture", "A sensor", "A lens"], "a": 0, "e": "On most phones the aperture is fixed. They all have lenses and a sensor."}],

  wIntro:"White balance makes white actually look white, whatever the light. Without correction, a light bulb gives an orange glow and an overcast sky gives a blue tint.",
  wA:"The Kelvin scale",wAd:"Light has a colour temperature in Kelvin (K). Low (2000-3500K) is warm and orange, like a candle or light bulb. High (6500-10000K) is cool and blue, like an overcast sky or shade.",
  wB:"Auto white balance can be fooled",wBd:"Auto White Balance (AWB) guesses the light from the whole scene. A scene dominated by one colour, like a sunset, can confuse the camera.",
  wC:"Correcting in RAW vs. JPG",wCd:"In RAW you can adjust white balance afterwards with no quality loss. In JPG you can too, but a big correction risks losing some colour detail.",
  wKey:"Pick a fixed setting when the light changes",wKeyd:"For a series of photos in the same place, a fixed white balance setting gives more consistent colours between shots than Auto, which can vary slightly from photo to photo.",

  liIntro:"The direction light comes from shapes form, shadow and mood in your photo, often more than how much light there is.",
  liA:"Front, side and back light",liAd:"Front light shows little shadow and flattens the subject. Side light emphasizes shape and texture with clear shadows. Back light can give a silhouette or a dramatic glow.",
  liB:"Hard versus soft light",liBd:"A small, bright light source like midday sun gives hard light with sharp shadow edges. A large, diffuse source like an overcast sky gives soft light with smooth transitions.",
  liC:"The golden hour",liCd:"The hour after sunrise and before sunset gives low, warm light with long soft shadows, often called the most beautiful light of the day.",
  liKey:"Expose for the subject, not the background",liKeyd:"In backlit shots your camera often reads the whole bright background and makes the subject too dark. Use exposure compensation or spot metering on the subject to avoid that.",
  liTryLead:"Rotate the light direction and watch how shadow and shape change. Switch between hard and soft light.",

  omIntro:"P, A/Av, S/Tv and M decide who controls exposure: the camera, you, or a bit of both.",
  omA:"P — Program auto",omAd:"The camera picks both shutter speed and aperture. You still set ISO, white balance and more. A good starting point.",
  omB:"A/Av — Aperture priority",omBd:"You pick the aperture (depth of field), the camera picks a matching shutter speed. The most-used mode for portraits and landscapes.",
  omC:"S/Tv — Shutter priority",omCd:"You pick the shutter speed (freeze or blur motion), the camera picks a matching aperture. Handy for sports and action.",
  omKey:"M — Manual for full control",omKeyd:"In M you pick both yourself. Essential in tricky light where the camera gets it wrong, such as a stage with spotlights, or when you want consistent settings between shots.",
  omTryLead:"Pick a mode and slide the shutter speed and/or aperture. See what moves automatically and what doesn't, and the effect on the photo.",
  omModeLbl:"Mode",omShutterLbl:"Shutter speed",omApertureLbl:"Aperture",

  mcIntro:"Macro photography is about shooting extremely close up, where small subjects fill the frame and depth of field becomes razor-thin.",
  mcA:"Minimum focus distance",mcAd:"A macro lens can focus much closer than an ordinary lens, often down to a few centimetres from the subject.",
  mcB:"1:1 magnification",mcBd:"At 'true' macro (1:1), the subject is exactly life-size on the sensor. Lenses that don't quite reach that, like 1:2, are often called macro too.",
  mcC:"Extremely shallow depth of field",mcCd:"The closer you focus, the thinner the sharp zone gets, sometimes just a few millimetres, even at a closed aperture like f/11.",
  mcKey:"Focus stacking for more sharpness",mcKeyd:"Because the sharp zone is so thin, macro photographers often take several photos with slightly different focus and merge them (focus stacking) so the subject is sharp throughout.",
  mcTryLead:"Slide the aperture wide open and closed and see how thin the sharp zone stays, even up close.",
  mcApertureLbl:"Aperture",mcZoneLbl:"Sharp zone at this distance: about {v} mm",
  mcTours:["Wide open aperture: an extremely thin sharp zone.","A mid-range aperture: still very thin.","Aperture fully closed: wider, but still only a few millimetres."],
  mcAsgLead:"Upload a close-up photo and we'll check the exposure.",
  lmIntro:"Your camera has to guess how much light there is, and that guess can go wrong. Understanding how metering works avoids surprises.",
  lmA:"Matrix/evaluative metering",lmAd:"Splits the whole photo into zones and combines them into one reading. The default choice for most situations.",
  lmB:"Centre-weighted metering",lmBd:"Puts the emphasis on the centre of the frame, the edges count less. Handy when your subject is usually in the middle.",
  lmC:"Spot metering",lmCd:"Measures only a small point, often around the focus point. Ideal for strong contrast, like a face against a bright sky.",
  lmKey:"A bright or dark scene fools the meter",lmKeyd:"The light meter aims for an average grey. With lots of snow or a white beach it makes the photo too dark; with a dark background or concert it makes it too bright. Compensate with exposure compensation: plus for lots of white, minus for lots of black.",
  lmTryLead:"Pick a scene and a metering method, and see which part of the photo drives the exposure.",

  intro:"Every photo is a balance of three settings. Change one, and another has to move to keep the same brightness. Each setting also has a side effect.",
  cA:"Aperture",cAd:"The opening in your lens. It feels backwards: the smaller the number, the bigger the opening. That's because the f-number is a fraction: f/2 means an opening of 1/2, f/16 only 1/16. Half a pizza is more than a sixteenth. Big opening (f/1.8) = lots of light and a blurry background. Small opening (f/16) = less light and everything sharp.",
  cS:"Shutter speed",cSd:"How long the sensor collects light. Short (1/1000 s) freezes motion. Long (1/15 s) makes moving subjects blur.",
  cI:"ISO",cId:"How much the signal is amplified. Higher makes your photo brighter but adds noise.",
  cK:"How they work together",cKd:"Photographers measure light in stops. A stop is simply one step: twice as much light, or half. Open the aperture one stop and you get twice the light. You balance that with one stop faster shutter or one stop lower ISO. Every click on a slider below is exactly one stop.",
  lf:"Focus modes",
  lfd:"Single, continuous, automatic or manual: when do you use which?",
  fIntro:"Your camera can focus in four ways. The difference is what happens after it finds focus: does it lock, or does it keep following your subject?",
  fS:"Single (AF-S)",
  fSd:"The camera focuses once and then locks. Ideal for still subjects like landscapes, buildings and portraits.",
  fC:"Continuous (AF-C)",
  fCd:"The camera keeps focusing as long as you half-press the button. For anything that moves: sports, animals, children at play.",
  fA:"Automatic (AF-A)",
  fAd:"The camera decides. It starts in single and switches to continuous when the subject starts moving. Handy when in doubt, but sometimes just too late.",
  fM:"Manual (MF)",
  fMd:"You turn the focus ring yourself. Useful for macro, stars, or when autofocus keeps hunting, for example through glass or in the dark.",
  fKey:"How you start focusing",
  fKeyd:"On most cameras you half-press the shutter button to focus and press it fully to take the photo. Names sometimes differ per camera: single is also called 'One Shot' and continuous 'Servo'.",

  faNoExif:"This photo has no shooting data (EXIF), for example because it was sent through WhatsApp or social media. I did check the sharpness.",
  hIntro:"The histogram is a small graph that shows exactly how your photo is exposed — far more precise than your camera's screen. The left side holds the dark pixels, the right side the light ones, and the height shows how many pixels share that tone.",
  hA:"What you're looking at",hAd:"The horizontal axis runs from black (left) to white (right). The height of the graph at any point shows how many pixels have that tone. A peak on the left means lots of dark pixels, a peak on the right means lots of light ones.",
  hB:"Clipping: data you've lost",hBd:"When pixels pile up right against the edge, that's clipping: pure black or pure white, with zero detail left. It's worst on the right: blown highlights are gone for good and can't be brought back in editing. Dark shadows can often still be brightened a little.",
  hC:"There's no single 'correct' shape",hCd:"A snow scene naturally leans right, a night photo naturally leans left — neither is a mistake. The histogram is there to check for clipping, not to force every photo into the same mountain shape.",
  hKey:"Why the screen sometimes fools you",hKeyd:"In bright sunlight your camera's screen is hard to judge: a photo can look fine and still have blown highlights. The histogram doesn't care about ambient light — outdoors, trust the graph over your eyes. Most mirrorless and DSLR cameras let you show a live histogram right on the rear screen and in the viewfinder, so you can check it while you're still framing the shot — look in your display or info settings.",
  hTryLead:"Move the exposure slider and watch the graph follow along, until pixels pile up against the edge — that's clipping.",
  hSceneLbl:"Scene",hScene1:"Normal",hScene2:"Snow",hScene3:"Fog",hEv:"Exposure",
  hSceneTipSnow:"Snow photos quickly pick up a blue cast. That's because the camera often underexposes bright white, leaving snow looking grey, and because snow reflects a lot of blue skylight. Compensate with roughly +1 stop of exposure compensation and warm up the white balance a little (for example 'cloudy' instead of 'auto'), or shoot RAW and correct it afterwards.",
  hSceneTipMist:"A foggy scene naturally has low contrast: almost all pixels cluster together in the middle of the histogram, with no deep blacks or bright whites. That's not a wrong exposure — fog is simply a low-contrast scene. If you want more mood, expose it a touch darker, or the fog can start to look flat and grey.",
  hTours:["Correctly exposed: the graph is spread across the middle, nothing piled up against either edge.","Underexposed: the whole graph shifts left. Not pretty, but that shadow detail can often still be brought back in editing.","Overexposed: pixels pile up against the right edge. That's clipping — the detail is gone for good, even in editing.","A snow scene, correctly exposed: the histogram naturally leans right. Not a mistake, as long as it doesn't touch the very edge.","A foggy scene, correctly exposed: the histogram sits narrow and bunched in the middle — low contrast, and that's how it should be.","Push it further and almost everything clips. When in doubt, a slight underexposure is usually safer than overexposing."],
  hAsgLead:"Pick a photo and look at its histogram. You'll see right away whether any highlights or shadows were lost. Your photo stays on your own device: nobody else sees it.",
  hQs:[{"q":"What does the horizontal axis of a histogram show?","o":["Black (left) to white (right)","Sharp to blurry","Far to near"],"a":0,"e":"The dark tones sit on the left, the light tones on the right."},{"q":"What does the height of the graph at a point mean?","o":["How many pixels have that tone","How sharp the photo is","Which aperture was used"],"a":0,"e":"The higher the graph at a point, the more pixels share that tone."},{"q":"Pixels pile up right against the right edge of the histogram. What does that mean?","o":["Blown highlights, detail is gone","The photo is too dark","The photo is sharp"],"a":0,"e":"That's clipping: pure white, with no detail left at all."},{"q":"Can blown highlights be recovered later in editing?","o":["No, that data is gone for good","Yes, always fully recoverable","Only in RAW files, never JPG"],"a":0,"e":"Once it's blown there's no information left to bring back — not even in RAW."},{"q":"Is a histogram that leans fully to the left always a mistake?","o":["No, that's normal for a dark scene like night","Yes, always a mistake","Only in portraits"],"a":0,"e":"A dark or night scene naturally leans left — that's normal."},{"q":"Why is the histogram more reliable than your camera's screen?","o":["The screen is hard to judge in bright light","The screen always shows the wrong colour","The histogram only exists on expensive cameras"],"a":0,"e":"Outdoors in sunlight the screen is barely readable; the histogram stays reliable."},{"q":"What does a snow scene's histogram usually look like, even when correctly exposed?","o":["It leans right, with lots of light pixels","It leans left","It sits exactly in the middle"],"a":0,"e":"Snow is naturally bright, so the histogram leans right — as long as it doesn't touch the edge, nothing's wrong."},{"q":"You're torn between slightly over- or underexposing. Which is usually safer?","o":["Slightly underexposing","Slightly overexposing","It doesn't matter"],"a":0,"e":"Shadows can often still be brightened, blown highlights never can — so when in doubt, go a bit darker."}],

  dIntro:"Depth of field is the zone in front of and behind your focus point that still looks sharp. Sometimes you want everything sharp, like in a landscape. Sometimes only your subject, like in a portrait. Three things decide how deep that zone is.",

  dAd:"Large f-number (f/11, f/16) = lots of depth of field. Small f-number (f/1.8, f/2.8) = little depth of field and a soft background.",
  dD:"Distance to your subject",
  dDd:"The closer you focus, the thinner the sharp zone. Up close, sometimes only a few millimetres are sharp.",
  dF:"Focal length",
  dFd:"Zooming in (for example 200 mm) gives less depth of field and a blurrier background than zooming out (for example 24 mm).",
  dKey:"The background matters too",
  dKeyd:"The further the background is behind your subject, the blurrier it gets. So don't put someone against a wall, but a few metres in front of it.",

  dTours:["Starting point: f/2.8, focused on the walker at 5 metres. She is sharp, the flower in front and the trees behind are soft.", "Aperture to f/16: the sharp zone gets much deeper. Almost everything is sharp now.", "Aperture to f/1.4: only the walker is sharp, the rest melts away.", "Focus on the flower at 2 metres: now the flower is sharp and the walker is soft. You choose where attention goes.", "Zoom in to 200 mm, focused at 5 metres: the sharp zone is paper-thin and the background dissolves into a soft haze.", "Zoom out to 24 mm at f/8, focused at 3 metres: sharp from close by to far away. Ideal for landscapes.", "In short: small f-number, close and zoomed in = little depth of field. Large f-number, further away and zoomed out = lots of depth of field."],
  dQs:[{"q": "You want a landscape sharp from front to back. What do you choose?", "o": ["f/1.8 and zoom in", "f/11 and zoom out", "f/4 and focus close"], "a": 1, "e": "A large f-number and a short focal length give lots of depth of field."}, {"q": "In a portrait the background isn't blurry enough. What helps most?", "o": ["Background further away and a small f-number", "Higher ISO", "Faster shutter speed"], "a": 0, "e": "A small f-number and more distance between subject and background make the background softer."}, {"q": "You photograph a flower very close up and only an edge is sharp. What do you do?", "o": ["Larger f-number, for example f/8", "Smaller f-number, for example f/1.8", "Slower shutter speed"], "a": 0, "e": "Up close, depth of field is very small. A larger f-number makes it deeper."},

   {"q": "Why isn't f/22 always the sharpest choice?", "o": ["Diffraction makes the whole photo slightly softer", "Because the photo gets too bright", "Because autofocus stops working"], "a": 0, "e": "With a very small opening, light bends. That makes the whole photo a little less sharp."},

  bIntro:"Focal length, in millimetres, decides how much of the world fits in your frame. A small number is wide angle: lots of space in the picture. A large number is telephoto: like zooming in. But more happens than just bringing things closer.",
  bA:"Angle of view",
  bAd:"At 24 mm you see a wide angle of about 84°, at 50 mm about 47° and at 200 mm only 12°. The bigger the number, the smaller the slice of the world you capture.",
  bP:"Perspective",
  bPd:"With a wide angle, things close by look big and the background far away. With a telephoto, the background looks closer and bigger. That's called compression.",
  bU:"What do you use when?",
  bUd:"Wide angle (14–35 mm): landscapes, architecture and interiors. Standard (around 50 mm): roughly how your eye sees it. Portrait (85–135 mm): natural-looking faces. Telephoto (200 mm and up): wildlife, sports and details from afar.",
  bKey:"Perspective comes from your distance",
  bKeyd:"It's not really the lens that creates compression, but your distance to the subject. A telephoto lets you stand further back, and from there the background looks bigger. Try it yourself with 'Subject same size' below.",
  bKey2:"Phone or smaller sensor?",
  bKey2d:"The millimetres in this lesson apply to a full-frame camera. On your phone you see 0.5×, 1× or 3×; 1× usually matches about 24 to 28 mm. If your camera has a smaller sensor (APS-C), a lens looks about 1.5× more zoomed in: 50 mm then feels like roughly 75 mm.",
  bTryLead:"Choose what you want to see and move the focal length. At the top right you see from above where the camera stands and how wide it looks.",

  bTours:["Same spot, 24 mm: you see the walker, the path, the trees and the mountain. Lots of space in the frame.", "50 mm: the view gets narrower, roughly how your eye sees it.", "200 mm from the same spot: you bring the walker close without walking. Only her upper body still fits.", "Now the walker stays the same size. At 24 mm you stand right next to her, and the mountain is a small bump in the distance.", "85 mm: you've walked back to keep her the same size. Watch the mountain grow.", "200 mm, more than 40 metres back: the mountain seems right behind her. That's compression, created by your distance.", "In short: focal length decides how much you see, your distance decides the perspective."],
  bQs:[{"q": "Which focal length shows the most of your surroundings?", "o": ["14 mm", "50 mm", "200 mm"], "a": 0, "e": "The smaller the number, the wider the angle of view."}, {"q": "What do you call a 200 mm lens?", "o": ["Telephoto", "Wide angle", "Fisheye"], "a": 0, "e": "From about 85 mm we speak of telephoto, and 200 mm is clearly telephoto."}, {"q": "You want a whole room or a wide landscape in the frame. What do you choose?", "o": ["Wide angle, 16 to 24 mm", "Telephoto, 200 mm", "Portrait, 85 mm"], "a": 0, "e": "A wide angle captures the widest part of your surroundings."}, {"q": "Which focal length is often used for portraits?", "o": ["85 mm", "14 mm", "600 mm"], "a": 0, "e": "Around 85 mm you stand at a comfortable distance and facial proportions stay natural."}, {"q": "You photograph a walker in front of a mountain and want the mountain big behind her. What do you do?", "o": ["Stand further back and zoom in", "Stand close with a wide angle", "Raise the ISO"], "a": 0, "e": "From further away with a telephoto, the background looks bigger relative to your subject."}, {"q": "What actually causes 'compression'?", "o": ["The greater distance to your subject", "The glass in a telephoto lens", "A higher ISO"], "a": 0, "e": "A telephoto lets you stand further back, and that distance changes the perspective."}, {"q": "Why can a wide angle make a nose look big in a very close portrait?", "o": ["Because what's closer to the camera looks much bigger", "Because a wide angle changes the colours", "Because the shutter speed is longer"], "a": 0, "e": "Very close up, the nose is relatively much closer to the lens than the ears, so it looks bigger."}, {"q": "Your phone shows 1×. Which focal length does that roughly match?", "o": ["24 to 28 mm", "85 mm", "200 mm"], "a": 0, "e": "The main camera on most phones is a slight wide angle."}, {"q": "What happens to the angle of view when you go from 24 to 50 mm?", "o": ["It becomes roughly half as wide", "It becomes wider", "It stays the same"], "a": 0, "e": "From about 84° to about 47°: twice as zoomed in is roughly half the angle."}, {"q": "Your camera has a smaller sensor (APS-C) and you use a 50 mm lens. What does it look like?", "o": ["Roughly like 75 to 80 mm", "Roughly like 25 mm", "Exactly like 50 mm on full frame"], "a": 0, "e": "A smaller sensor crops a smaller part of the image, as if you zoom in about 1.5× more."}],

   {"q": "You go from 1/250 s to 1/500 s. How do you keep the same brightness without changing ISO?", "o": ["Open the aperture one stop, for example from f/8 to f/5.6", "Close the aperture one stop, from f/8 to f/11", "Nothing, it stays the same"], "a": 0, "e": "1/500 s gives one stop less light. You make up for it with one stop wider aperture."}],
  cIntro:"Composition is how you arrange what's in your frame. The same subject can look dull or striking depending on where you place it, what lines lead the eye, and how much empty space you leave.",
  cWhyH:"Why composition matters",cWhyP:"A technically perfect photo (sharp, well-exposed) can still feel flat if it's badly composed. These rules aren't strict laws — they're starting points that usually make a photo more balanced and interesting.",
  cStepH:"8 rules, one at a time",cStepLead:"Step through each rule below. The blue lines show what to look for; try to spot them the next time you frame a shot.",
  cT1:"Rule of thirds",cD1:"Imagine a 3×3 grid over your frame. Placing your subject on one of the lines — especially where two lines cross — usually looks more natural than dead centre.",
  cT2:"Leading lines",cD2:"Roads, fences, shorelines or rows of trees can lead the eye straight to your subject. Look for lines in the scene and frame so they point inward.",
  cT3:"Symmetry",cD3:"A mirrored scene — reflections, a straight path, matching shapes on both sides — feels calm and deliberate. Centre it carefully; symmetry only works if it's really even.",
  cT4:"Layers (foreground, midground, background)",cD4:"Adding something close to the camera, something in the middle, and something far away gives a flat photo real depth. Tap a layer below to see it on its own, or view it in 3D.",
  cT5:"Fill the frame",cD5:"Get close. Letting your subject take up almost the whole frame removes distractions and makes the shot feel intimate and strong.",
  cT6:"Negative space",cD6:"The opposite of filling the frame: a small subject surrounded by a lot of empty sky, water or wall can feel calm or lonely, or give a sense of scale.",
  cT7:"Diagonals",cD7:"A line running from corner to corner feels more dynamic than a straight horizontal or vertical one. Tilt your angle or find a diagonal already in the scene.",
  cT8:"Frame within a frame",cD8:"Shoot through a doorway, an arch, overhanging branches or a window. It frames your subject naturally and adds foreground interest.",
  cLayerPick:"Highlight one layer:",cLayerAll:"All layers",cLayerBg:"Background",cLayerMid:"Midground",cLayerFg:"Foreground",
  k3clLead:"Drag to look around the scene from any angle. Use the buttons above to highlight just the foreground, midground or background.",
  cMoreH:"Also worth trying",cMoreLead:"These composition ideas are worth knowing too, even without a full walkthrough:",
  cMore:[{"t":"Patterns","d":"Repeating shapes, colours or textures are pleasing on their own, and a single break in the pattern draws the eye."},
   {"t":"Foreground interest","d":"Placing something interesting close to the camera (grass, rocks, flowers) adds depth and invites the eye into the photo, even without full layering."},
   {"t":"Balance","d":"A strong subject on one side can be balanced by something smaller or lighter on the other, instead of leaving it empty."},
   {"t":"Triangular composition","d":"Arranging three points of interest in a triangle gives a scene a stable, pleasing structure."},
   {"t":"Golden ratio","d":"A variant of the rule of thirds with unevenly spaced lines, often drawn as a spiral. Subtler, same idea."},
   {"t":"Figure to ground","d":"Make sure your subject stands out clearly from its background, in shape, colour or sharpness."},
   {"t":"Radiating lines","d":"Lines spreading out from one point, like sun rays or branches, pull the eye toward the centre."},
   {"t":"Circular composition","d":"Shapes arranged in a circle, or a literally round subject, keep the eye moving around the frame instead of drifting off."},
   {"t":"Split screen","d":"Dividing the frame into two clear halves — sky and sea, light and shadow — can make a strong graphic statement."},
   {"t":"Centered composition","d":"Breaking the rule of thirds on purpose: a bold, simple subject dead centre can look powerful rather than static."},
   {"t":"Off-grid thirds","d":"Sometimes only the horizon (on a third, not the middle) or a single vertical third matters — you don't always need the full grid."}],
  cAsgLead:"Pick which rule you tried, upload your photo, and we'll draw a matching guide on top so you can check it yourself.",
  cQs:[{"q":"Where does the rule of thirds suggest you place your subject?","o":["Dead centre","On one of the grid lines, especially where two cross","Always in a corner"],"a":1,"e":"Placing the subject on a third, especially an intersection, usually feels more natural than centring it."},
   {"q":"What do leading lines do in a photo?","o":["Make the photo symmetrical","Guide the viewer's eye toward the subject","Blur the background"],"a":1,"e":"Roads, fences or shorelines can pull the eye straight to your subject."},
   {"q":"You want a photo to feel calm and deliberate, with matching shapes on both sides. Which rule fits?","o":["Negative space","Symmetry","Diagonals"],"a":1,"e":"Symmetry works when the two halves really mirror each other."},
   {"q":"What makes 'filling the frame' effective?","o":["It adds a lot of empty space","It removes distractions by letting the subject take up most of the photo","It only works with landscapes"],"a":1,"e":"Getting close and filling the frame keeps attention on the subject."},
   {"q":"A tiny bird in a huge empty sky is an example of which rule?","o":["Negative space","Frame within a frame","Fill the frame"],"a":0,"e":"A lot of empty space around a small subject is negative space — it can suggest scale or calm."},
   {"q":"Which combination gives a photo real depth?","o":["Only a background","Foreground, midground and background together","Only a subject filling the frame"],"a":1,"e":"Something close, something in the middle and something far away make a flat photo feel three-dimensional."},
   {"q":"Shooting through a doorway or overhanging branches is an example of…","o":["Frame within a frame","Radiating lines","Split screen"],"a":0,"e":"A natural frame around your subject adds foreground interest and draws the eye inward."}]

nl:{
  title:"PhotoByArno Academy – gratis fotografie leren met animaties",
  blkH:"Deze les staat op photobyarno.com",blkP:"De PhotoByArno Academy is gratis te gebruiken, maar alleen op de eigen website. Daar vind je ook altijd de nieuwste versie.",blkGo:"Naar de Academy",copy:"© 2026 PhotoByArno. Alle rechten voorbehouden. Je mag de lessen gratis in je eigen les laten zien, rechtstreeks vanaf photobyarno.com en met vermelding van de bron.",
  footer:"Gratis, geen account nodig. Nieuwe lessen komen er regelmatig bij.",privacy:"Anonieme bezoekersstatistieken, zonder cookies.",

  k3load:"3D laden…",k3fail:"3D wordt niet ondersteund in deze browser. De rest van de les werkt gewoon.",k3drag:"Sleep om te draaien",k3front:"Voor",k3angle:"Schuin",k3side:"Zijkant",k3top:"Boven",k3behind:"Achter camera",k3photo:"Foto",k3view3d:"3D-weergave",
  k3irisH:"Kijk in de camera",k3irisLead:"Het diafragma is een ring van dunne metalen lamellen. Schuif en zie de opening kleiner worden: er valt minder licht op de sensor, die daardoor donkerder wordt.",
  k3shutLead:"Vlak voor de sensor zitten twee gordijntjes. Het eerste gaat open, het tweede volgt en sluit weer. Bij een korte sluitertijd schuift er maar een smalle spleet over de sensor, maar elke regel van de sensor krijgt precies even lang licht.",
  k3light:"Licht t.o.v. f/1.8",k3stops:"Stops minder licht",k3open:"Opening bij 50 mm",k3fire:"Ontspan sluiter",k3slit:"Open spleet",k3slitAll:"Hele sensor",k3time:"Belichtingstijd",k3slow:"Vertraagd",
  k3fLead:"Het gekleurde vlak is waar de camera op scherpstelt. Groen: de hond staat in dat vlak en is scherp. Rood: de hond is uit het vlak gelopen.",
  k3dLead:"Het groene blok is alles wat scherp lijkt, het blauwe vlak is waar je op scherpstelt. Verander diafragma, afstand of brandpuntsafstand en zie het blok groeien of krimpen.",
  k3bLead:"De blauwe vorm is wat de camera ziet. Hoe langer de brandpuntsafstand, hoe smaller. Bij 'Onderwerp even groot' loopt de camera naar achteren: de persoon blijft even groot en de berg lijkt dichterbij te komen.",
  k3bokH:"Waarom lichtvlekjes een vorm krijgen",k3bokLead:"Lichtjes in een vage achtergrond krijgen de vorm van de diafragma-opening (bokeh). Wijd open zijn ze groot en zacht. Knijp je het diafragma dicht, dan worden ze kleiner en hoekig: hier zevenhoekig, omdat dit objectief 7 lamellen heeft.",
  l0:"Je camera leren kennen",
  l0d:"Hoe heten alle knoppen en wat zit er binnenin?",
  cIntro:"Voordat je gaat instellen: dit is je camera. Draai hem rond, tik op de nummers en kijk ook naar binnen, waar het licht zijn weg naar de sensor vindt. Je hoeft niet alles in één keer te onthouden; je kunt hier altijd terugkijken.",
  cOut:"Buitenkant: bedienen",
  cOutd:"Knoppen, wielen en ringen waarmee je de camera instelt. De ontspanknop, het instelwiel en het programmakeuzewiel gebruik je het meest.",
  cIn:"Binnenkant: de weg van het licht",
  cInd:"Het licht gaat door de lenzen, het diafragma en de sluiter en valt dan op de sensor. In een spiegelreflexcamera zit daar nog een spiegel tussen, in deze systeemcamera niet.",
  cPh:"En je telefoon?",
  cPhd:"Die heeft dezelfde onderdelen, alleen piepklein: lenzen, een sensor en een processor. Het diafragma staat meestal vast, de sluiter is elektronisch, en zoomen doe je door te wisselen tussen lenzen (0,5×, 1×, 3×).",
  cKey:"Zo houd je hem stil",
  cKeyd:"Rechterhand om de handgreep, wijsvinger op de ontspanknop. Leg het objectief van onderen in je linkerhand en houd je ellebogen tegen je lichaam. Zo maak je minder bewogen foto's.",
  cTryLead:"Sleep om de camera te draaien. Tik op een nummer of op een naam in de lijst. Met 'Binnenkant' kijk je door de camera heen.",
  cOutside:"Buitenkant",
  cInside:"Binnenkant",
  cPick:"Tik op een nummer om te zien hoe dat onderdeel heet en wat het doet. Zie je een nummer niet? Draai de camera of kies Achter of Boven.",
  cPickIn:"Volg het licht: door de lenzen (A), het diafragma (B) en de sluiter (C) naar de sensor (D). Tik op een letter voor uitleg.",
  cMore:"Meer hierover in:",
  k3back:"Achter",
  cGameStart:"Speel: wijs het aan",
  cGameStop:"Stop het spel",
  cGameAgain:"Nog een keer spelen",
  cGameN:"Vraag {i} van {n}",
  cGameQ:"Waar zit: {p}?",
  cGameHint:"Tik op het juiste punt op de camera. Zie je het niet? Draai de camera.",
  cGameOk:"Goed!",
  cGameNo:"Niet goed. Het groene punt is: {p}.",
  cNext:"Volgende",
  cGameScore:"Bekijk je score",
  cGameEnd:"Je had er {s} van de {n} goed.",

  cGameMid:"Al aardig! Tik de onderdelen nog eens langs en speel opnieuw.",

  cParts:{"shutter": ["Ontspanknop", "Half indrukken: de camera stelt scherp en meet het licht. Helemaal indrukken: de foto wordt gemaakt. Dat half indrukken komt terug in de les over scherpstelmodi."], "dial": ["Instelwiel", "Hiermee verander je de instelling die bij de gekozen stand hoort, zoals de sluitertijd of het diafragma. Veel camera's hebben er twee: één voor en één achter."], "mode": ["Programmakeuzewiel", "Kiest wie wat bepaalt. AUTO: de camera doet alles. P: de camera kiest, jij kunt bijsturen. A (of Av): jij kiest het diafragma. S (of Tv): jij kiest de sluitertijd. M: jij kiest alles zelf."], "hotshoe": ["Flitsschoen", "Een sleuf met contacten bovenop de camera. Hier schuif je een losse flitser, een microfoon of een draadloze afstandsbediening op."], "evf": ["Zoeker", "Hier kijk je met je oog doorheen. Bij een systeemcamera is dit een klein schermpje dat precies laat zien hoe je foto wordt. Met het wieltje ernaast (dioptrie) stel je hem scherp voor je eigen ogen."], "screen": ["Scherm", "Laat het live beeld, het menu en je gemaakte foto's zien. Vaak kun je het kantelen en aanraken: handig voor foto's laag bij de grond of boven je hoofd."], "buttons": ["Knoppen en joystick", "Met de joystick verplaats je het scherpstelpunt. De knoppen eromheen openen het menu, laten je foto's terugzien of wissen ze. De indeling verschilt per camera, de functies zijn bijna altijd hetzelfde."], "lens": ["Objectief", "Het oog van de camera. Op de rand staan twee getallen: de brandpuntsafstand (hier 24-70 mm) en de grootste diafragma-opening (hier 1:2.8, dus f/2.8)."], "zoom": ["Zoomring", "Draai eraan om in en uit te zoomen: je verandert de brandpuntsafstand. Een objectief met één vaste brandpuntsafstand heeft geen zoomring."], "focus": ["Scherpstelring", "Hiermee stel je met de hand scherp (MF). Handig bij close-ups, sterren of foto's door een raam, waar de autofocus twijfelt."], "release": ["Ontgrendelknop objectief", "Indrukken en het objectief draaien om het los te maken. Wissel met de camera naar beneden gericht, dan valt er minder stof op de sensor."], "card": ["Geheugenkaartklep", "Achter dit klepje zit het slot voor de geheugenkaart (meestal SD). Wacht tot het lampje uit is voordat je de kaart eruit haalt."], "tripod": ["Statiefaansluiting", "Een schroefdraad aan de onderkant voor een statief. Bijna alle camera's en statieven gebruiken dezelfde maat (1/4 inch)."], "lenses": ["Lenzen", "Binnen in het objectief zitten meerdere glazen lenzen achter elkaar. Samen buigen ze het licht zo dat er een scherp beeld op de sensor valt. Bij zoomen of scherpstellen schuiven sommige lenzen heen en weer."], "iris": ["Diafragma", "Een ring van lamellen die een grotere of kleinere opening maakt. Groot gat: meer licht en een vagere achtergrond. Klein gat: minder licht en meer scherpte van voor tot achter."], "shutterc": ["Sluiter", "Twee gordijntjes vlak voor de sensor. Ze bepalen hoe lang het licht op de sensor valt: de sluitertijd. Veel camera's en alle telefoons kunnen ook elektronisch belichten, zonder bewegend gordijn."], "sensor": ["Sensor", "Het hart van de camera: een chip met miljoenen lichtgevoelige pixels. Zie je dat het beeld op zijn kop staat? Zo komt het licht door de lenzen binnen; de camera draait het weer om. Een grote sensor (full frame) vangt meer licht dan een kleinere (APS-C of telefoon)."], "proc": ["Beeldprocessor", "De kleine computer van de camera. Maakt van de sensorgegevens een JPEG, onderdrukt ruis en rekent de autofocus uit. Fotografeer je in RAW, dan bewaart de camera de ruwe gegevens, zodat jij ze later zelf bewerkt."], "battery": ["Accu", "Zit meestal in de handgreep. Het scherm en de zoeker gebruiken veel stroom: neem bij een dag fotograferen een reserve-accu mee en houd hem warm als het koud is."]},
  camQs:[{"q": "Wat gebeurt er als je de ontspanknop half indrukt?", "o": ["De camera stelt scherp en meet het licht", "De foto wordt gemaakt", "Het menu gaat open"], "a": 0, "e": "Half indrukken is scherpstellen en meten. Pas als je helemaal indrukt, wordt de foto gemaakt."}, {"q": "Waar valt het licht uiteindelijk op?", "o": ["De sensor", "De zoeker", "De geheugenkaart"], "a": 0, "e": "Het licht gaat door de lenzen, het diafragma en de sluiter en valt dan op de sensor."}, {"q": "Op je objectief staat 24-70 mm. Wat betekent dat?", "o": ["De brandpuntsafstand loopt van 24 tot 70 mm", "Het objectief is 24 tot 70 mm lang", "De grootste diafragma-opening"], "a": 0, "e": "Het is de brandpuntsafstand: 24 mm is groothoek, 70 mm al wat ingezoomd."}, {"q": "Met welk onderdeel kies je tussen AUTO, P, A, S en M?", "o": ["Het programmakeuzewiel", "De scherpstelring", "De zoomring"], "a": 0, "e": "Het programmakeuzewiel bepaalt wie wat kiest: jij of de camera."}, {"q": "Hoe wissel je het objectief het veiligst?", "o": ["Met de camera naar beneden gericht", "Met de opening naar boven, zodat je goed ziet wat je doet", "Het maakt niet uit"], "a": 0, "e": "Met de opening naar beneden valt er minder stof op de sensor."}, {"q": "Wat doet de sluiter?", "o": ["Bepaalt hoe lang het licht op de sensor valt", "Bepaalt hoe groot de opening is", "Zoomt in en uit"], "a": 0, "e": "De sluiter regelt de sluitertijd. De grootte van de opening is het diafragma."}, {"q": "Waarom staat het beeld op de sensor op zijn kop?", "o": ["Zo buigen de lenzen het licht; de camera draait het weer om", "De sensor zit verkeerd om in de camera", "Dat gebeurt alleen bij goedkope camera's"], "a": 0, "e": "Elke lens zet het beeld op zijn kop, ook die in je oog. Je hersenen en je camera draaien het gewoon weer om."}, {"q": "Waarvoor is de schroefdraad aan de onderkant?", "o": ["Voor een statief", "Voor een flitser", "Voor de geheugenkaart"], "a": 0, "e": "Daar schroef je de camera op een statief. De flitser gaat op de flitsschoen bovenop."}, {"q": "Wat heeft een telefoon meestal níet?", "o": ["Een diafragma dat je kunt verstellen", "Een sensor", "Een lens"], "a": 0, "e": "Bij de meeste telefoons staat het diafragma vast. Lenzen en een sensor hebben ze allemaal."}],

  expLo:"{p}% van je foto is helemaal zwart. Iets lichter kan: langere sluitertijd, hogere ISO of opener diafragma.",
  expDark:"De foto is in zijn geheel vrij donker. Bewust gedaan? Prima. Zo niet, geef wat meer licht.",

  encourage:"Elke foto is oefening. Probeer het nog eens met deze tips en vergelijk het resultaat.",
  faNoExif:"Deze foto bevat geen opnamegegevens (EXIF), bijvoorbeeld omdat hij via WhatsApp of sociale media is verstuurd. De scherpte heb ik wel bekeken.",
  hIntro:"Het histogram is een grafiekje dat precies laat zien hoe je foto is belicht — veel duidelijker dan het schermpje van je camera. Links staan de donkere pixels, rechts de lichte, en de hoogte laat zien hoeveel pixels elke toon hebben.",
  hA:"Wat je ziet",hAd:"De horizontale as loopt van zwart (links) naar wit (rechts). De hoogte van de grafiek op elk punt laat zien hoeveel pixels die toon hebben. Een piek linksin betekent veel donkere pixels, een piek rechts veel lichte.",
  hB:"Clipping: data die je kwijt bent",hBd:"Stapelen pixels zich op helemaal tegen de rand op, dan is dat clipping: zuiver zwart of zuiver wit, zonder enig detail. Bij de rechterrand is dat het ergst: uitgebrande hooglichten zijn voorgoed verdwenen en met bewerken niet meer terug te halen. Donkere schaduwen zijn vaak nog wel iets op te lichten.",
  hC:"Geen vaste 'goede' vorm",hCd:"Een sneeuwlandschap leunt van nature naar rechts, een nachtfoto naar links — dat is geen fout. Het histogram is er om clipping te checken, niet om elke foto dezelfde bergvorm te geven.",
  hKey:"Waarom het schermpje je soms voor de gek houdt",hKeyd:"In fel zonlicht is het camerascherm nauwelijks te beoordelen: een foto kan er prima uitzien en toch uitgebrande hooglichten hebben. Het histogram heeft daar geen last van — vertrouw buiten liever op de grafiek dan op je ogen. Bij de meeste systeem- en spiegelreflexcamera's kun je een live histogram laten tonen op het achterscherm en in de zoeker, zodat je het al kunt bekijken terwijl je nog aan het samenstellen bent — kijk in je scherm- of info-instellingen.",
  hTryLead:"Schuif met de belichting en kijk wat er met de grafiek gebeurt: hij schuift mee, tot de pixels tegen de rand opstapelen — dat is clipping.",
  hSceneLbl:"Scène",hScene1:"Normaal",hScene2:"Sneeuw",hScene3:"Mist",hEv:"Belichting",
  hSceneTipSnow:"Sneeuwfoto's krijgen al snel een blauwe waas. Dat komt doordat de camera het felle wit vaak te donker belicht — waardoor sneeuw grijzig oogt — én doordat sneeuw veel blauw hemellicht weerkaatst. Compenseer met ongeveer +1 stop belichtingscorrectie en zet de witbalans iets warmer (bijvoorbeeld 'bewolkt' in plaats van 'auto'), of werk in RAW en corrigeer het later.",
  hSceneTipMist:"Een mistscène heeft van nature weinig contrast: bijna alle pixels zitten dicht bij elkaar in het midden van het histogram, zonder diepe zwarten of felle witten. Dat is geen foute belichting — mist is een laagcontrast-scène. Belicht desgewenst iets donkerder, anders oogt de mist al snel te vlak en grijs.",
  hTours:["Goed belicht: de grafiek is verspreid over het midden, nergens stapelt het op tegen een rand.","Onderbelicht: de hele grafiek schuift naar links. Niet mooi, maar die schaduwdetails zijn vaak nog terug te halen bij het bewerken.","Overbelicht: de pixels stapelen op tegen de rechterrand. Dat is clipping — dat detail is voorgoed weg, ook bij bewerken.","Een sneeuwscène, goed belicht: het histogram leunt van nature naar rechts. Geen fout, zolang het de uiterste rand niet raakt.","Een mistscène, goed belicht: het histogram zit smal opeengepakt in het midden — weinig contrast, en dat hoort zo.","Nog verder erin: bijna alles klipt. Twijfel je? Dan is iets onderbelichten vaak veiliger dan overbelichten."],
  hAsgLead:"Kies een foto en bekijk het histogram. Je ziet meteen of er hooglichten of schaduwen zijn kwijtgeraakt. Je foto blijft op je eigen toestel: niemand anders ziet hem.",
  hQs:[{"q":"Wat laat de horizontale as van een histogram zien?","o":["Van zwart (links) naar wit (rechts)","Van scherp naar wazig","Van ver naar dichtbij"],"a":0,"e":"Links staan de donkere tinten, rechts de lichte."},{"q":"Wat betekent de hoogte van de grafiek op een bepaald punt?","o":["Hoeveel pixels die toon hebben","Hoe scherp de foto is","Welk diafragma is gebruikt"],"a":0,"e":"Hoe hoger de grafiek op een punt, hoe meer pixels die toon hebben."},{"q":"Pixels stapelen zich helemaal op tegen de rechterrand van het histogram. Wat betekent dat?","o":["Uitgebrande hooglichten, detail is weg","De foto is te donker","De foto is scherp"],"a":0,"e":"Dat is clipping: zuiver wit, zonder enig detail meer."},{"q":"Kun je uitgebrande hooglichten later herstellen in een bewerkingsprogramma?","o":["Nee, die data is voorgoed verdwenen","Ja, altijd volledig te herstellen","Alleen bij RAW-bestanden, nooit bij JPG"],"a":0,"e":"Eenmaal uitgebrand is er geen informatie meer om terug te halen — ook niet in RAW."},{"q":"Een histogram dat helemaal naar links leunt, is dat altijd een fout?","o":["Nee, dat hoort bij een donkere scène zoals nacht","Ja, altijd een fout","Alleen bij portretten"],"a":0,"e":"Een donkere of nachtscène leunt van nature naar links — dat is normaal."},{"q":"Waarom is het histogram betrouwbaarder dan het schermpje van je camera?","o":["Het schermpje is in fel licht lastig te beoordelen","Het schermpje toont altijd een verkeerde kleur","Het histogram is alleen beschikbaar bij dure camera's"],"a":0,"e":"Buiten in de zon is het scherm nauwelijks te beoordelen; het histogram blijft betrouwbaar."},{"q":"Hoe ziet het histogram van een sneeuwscène er doorgaans uit, ook al is hij goed belicht?","o":["Het leunt naar rechts, met veel lichte pixels","Het leunt naar links","Het staat precies in het midden"],"a":0,"e":"Sneeuw is van nature licht, dus het histogram leunt naar rechts — zolang het de rand niet raakt is er niets mis."},{"q":"Je twijfelt tussen iets over- of onderbelichten. Wat is meestal veiliger?","o":["Iets onderbelichten","Iets overbelichten","Maakt niet uit"],"a":0,"e":"Schaduwen zijn vaak nog op te lichten, uitgebrande hooglichten nooit — dus bij twijfel liever iets donkerder."}],
  fa1:"Stilstaand en scherp",

  dQs:[{"q": "Je wilt een landschap van voor tot achter scherp. Wat kies je?", "o": ["f/1.8 en inzoomen", "f/11 en uitzoomen", "f/4 en dichtbij scherpstellen"], "a": 1, "e": "Een groot f-getal en een korte brandpuntsafstand geven veel scherptediepte."}, {"q": "Bij een portret is de achtergrond niet wazig genoeg. Wat helpt het meest?", "o": ["Achtergrond verder weg en een klein f-getal", "Hogere ISO", "Kortere sluitertijd"], "a": 0, "e": "Een klein f-getal en meer afstand tussen onderwerp en achtergrond maken de achtergrond zachter."}, {"q": "Je fotografeert een bloem van heel dichtbij en maar een randje is scherp. Wat doe je?", "o": ["Groter f-getal, bijvoorbeeld f/8", "Kleiner f-getal, bijvoorbeeld f/1.8", "Langere sluitertijd"], "a": 0, "e": "Van dichtbij is de scherptediepte heel klein. Een groter f-getal maakt hem dieper."},

  bMtn:"Berg",
  bTours:["Zelfde plek, 24 mm: je ziet de wandelaar, het pad, de bomen en de berg. Veel ruimte in beeld.", "50 mm: het beeld wordt smaller, ongeveer zoals je oog het ziet.", "200 mm vanaf dezelfde plek: je haalt de wandelaar dichtbij zonder te lopen. Alleen haar bovenlichaam past nog in beeld.", "Nu blijft de wandelaar even groot. Met 24 mm sta je vlak bij haar, en de berg is een klein bultje in de verte.", "85 mm: je bent naar achteren gelopen om haar even groot te houden. Kijk hoe de berg groeit.", "200 mm, ruim 40 meter terug: de berg lijkt vlak achter haar te staan. Dat is compressie, gemaakt door jouw afstand.", "Kort samengevat: het brandpunt bepaalt hoeveel je ziet, je afstand bepaalt het perspectief."],
  bQs:[{"q": "Welke brandpuntsafstand laat het meeste van de omgeving zien?", "o": ["14 mm", "50 mm", "200 mm"], "a": 0, "e": "Hoe kleiner het getal, hoe breder de kijkhoek."}, {"q": "Hoe noem je een lens van 200 mm?", "o": ["Tele", "Groothoek", "Fisheye"], "a": 0, "e": "Vanaf ongeveer 85 mm spreek je van tele, en 200 mm is duidelijk tele."}, {"q": "Je wilt een hele kamer of een breed landschap in beeld. Wat kies je?", "o": ["Groothoek, 16 tot 24 mm", "Tele, 200 mm", "Portret, 85 mm"], "a": 0, "e": "Een groothoek legt het breedste stuk van de omgeving vast."}, {"q": "Welk brandpunt wordt vaak gebruikt voor portretten?", "o": ["85 mm", "14 mm", "600 mm"], "a": 0, "e": "Rond 85 mm sta je op een prettige afstand en blijven de verhoudingen van een gezicht natuurlijk."}, {"q": "Je fotografeert een wandelaar voor een berg en wilt de berg groot achter haar. Wat doe je?", "o": ["Verder weg gaan staan en inzoomen", "Dichtbij gaan staan met een groothoek", "De ISO verhogen"], "a": 0, "e": "Van verder weg met tele lijkt de achtergrond groter ten opzichte van je onderwerp."}, {"q": "Wat veroorzaakt eigenlijk 'compressie'?", "o": ["De grotere afstand tot je onderwerp", "Het glas in een telelens", "Een hogere ISO"], "a": 0, "e": "Een telelens laat je verder weg staan, en die afstand verandert het perspectief."}, {"q": "Waarom kan een groothoek bij een portret van heel dichtbij een neus groot maken?", "o": ["Omdat wat dichter bij de camera is veel groter lijkt", "Omdat een groothoek de kleuren verandert", "Omdat de sluitertijd langer is"], "a": 0, "e": "Van heel dichtbij is de neus relatief veel dichter bij de lens dan de oren, dus lijkt hij groter."}, {"q": "Je telefoon toont 1×. Met welk brandpunt komt dat ongeveer overeen?", "o": ["24 tot 28 mm", "85 mm", "200 mm"], "a": 0, "e": "De hoofdcamera van de meeste telefoons is een lichte groothoek."}, {"q": "Wat gebeurt er met de kijkhoek als je van 24 naar 50 mm gaat?", "o": ["Die wordt ongeveer half zo groot", "Die wordt groter", "Die blijft gelijk"], "a": 0, "e": "Van ongeveer 84° naar ongeveer 47°: twee keer zo ingezoomd is ongeveer de helft van de hoek."}, {"q": "Je camera heeft een kleinere sensor (APS-C) en je gebruikt een 50 mm-lens. Hoe ziet dat eruit?", "o": ["Ongeveer als 75 tot 80 mm", "Ongeveer als 25 mm", "Precies als 50 mm op full frame"], "a": 0, "e": "Een kleinere sensor knipt een kleiner stuk uit het beeld, alsof je ongeveer 1,5× verder inzoomt."}],

  ba1d:"Fotografeer een landschap, straat of ruimte met een groothoek: 24 mm of korter. Op een telefoon: de 0.5×- of 1×-camera. Zet iets interessants in de voorgrond.",

  ba3:"Compressie",
  ba3d:"Maak twee foto's van hetzelfde onderwerp met iets ver erachter, zoals een toren of heuvel: één van dichtbij met groothoek, één van ver weg met tele. Houd je onderwerp op beide foto's even groot. Kies daarna de foto's één voor één.",

  b3first:"Foto 1 staat klaar ({v}). Kies nu je tweede foto, met een heel ander brandpunt.",
  b3ok:"Foto 1: {a}, foto 2: {b}. Een groot verschil, dus je ziet de compressie goed. Kijk hoe groot de achtergrond is ten opzichte van je onderwerp.",

  bNoFl:"Deze foto bevat geen brandpuntsafstand. Gebruik het originele bestand, dan kan ik je brandpunt beoordelen.",

  tours:["Startpunt: f/5.6, 1/125 s, ISO 100. Goed belicht, achtergrond redelijk scherp.",
    "Diafragma open naar f/1.8: drie stops meer licht. Mooie wazige achtergrond, maar veel te licht.",
    "Compenseer met een snellere sluiter, 1/1000 s. Weer goed belicht, fietser bevroren, achtergrond blijft zacht.",
    "Nu f/16 voor alles scherp: zes stops minder licht. Veel te donker.",
    "ISO naar 6400 maakt het weer licht, maar kijk naar de ruis.",
    "Alternatief: ISO terug, sluiter naar 1/15 s. Geen ruis, wel een vegende fietser. Elke keuze kost iets.",
    "Dat is de driehoek: wat je bij de een wint, lever je bij de ander in."],
  quiz:"Test jezelf",check:"Controleer",pick:"Kies eerst een antwoord",right:"Goed!",wrong:"Niet helemaal.",score:"Score",
  qs:[
   {q:"Je wilt een wazige achtergrond bij een portret. Wat verander je?",o:["Diafragma naar f/16","Diafragma naar f/1.8","ISO naar 6400"],a:1,e:"Een klein f-getal geeft een kleine scherptediepte."},
   {q:"Je foto van een rennende hond is onscherp door beweging. Wat helpt?",o:["Langere sluitertijd","Kortere sluitertijd","Groter f-getal"],a:1,e:"Een korte sluitertijd bevriest beweging."},
   {q:"Je gaat van f/4 naar f/8, twee stops minder licht. Hoe houd je dezelfde belichting zonder de sluitertijd te veranderen?",o:["ISO 400 naar 1600","ISO 400 naar 800","ISO 400 naar 100"],a:0,e:"Twee stops is twee keer verdubbelen: 400, 800, 1600."},
   {"q": "Je foto is te donker en je wilt sluitertijd en diafragma niet veranderen. Wat doe je?", "o": ["ISO verhogen", "ISO verlagen", "Flitser uitzetten"], "a": 0, "e": "Een hogere ISO maakt je foto lichter, met wat meer ruis als bijwerking."},
   {"q": "Wat is de bijwerking van een hoge ISO?", "o": ["Meer ruis", "Een wazige achtergrond", "Bewegingsonscherpte"], "a": 0, "e": "Hoe hoger de ISO, hoe meer korrel of ruis je in je foto ziet."},
   {"q": "Hoeveel licht krijg je erbij als je het diafragma één stop opent?", "o": ["Twee keer zoveel", "Tien procent meer", "Vier keer zoveel"], "a": 0, "e": "Eén stop is altijd een verdubbeling of halvering van het licht."},
   {"q": "Welke sluitertijd laat meer licht binnen?", "o": ["1/60 s", "1/500 s", "Allebei evenveel"], "a": 0, "e": "1/60 s staat langer open dan 1/500 s, dus er komt meer licht binnen."},
   {"q": "Welk diafragma laat het meeste licht door?", "o": ["f/16", "f/8", "f/2"], "a": 2, "e": "Kleiner getal = grotere opening = meer licht."},
   {"q": "Je wilt stromend water zacht en vloeiend vastleggen. Welke sluitertijd past het best?", "o": ["1/1000 s", "1/2 s", "1/250 s"], "a": 1, "e": "Een lange sluitertijd laat beweging zien als zachte vegen."},
   {"q": "Je gaat van 1/250 s naar 1/500 s. Hoe houd je dezelfde helderheid zonder de ISO te veranderen?", "o": ["Diafragma één stop opener, bijvoorbeeld van f/8 naar f/5.6", "Diafragma één stop dichter, van f/8 naar f/11", "Niets, het blijft gelijk"], "a": 0, "e": "1/500 s geeft één stop minder licht. Dat maak je goed met één stop opener diafragma."}],
  cIntro:"Compositie is hoe je dingen in je kader rangschikt. Hetzelfde onderwerp kan saai of juist pakkend ogen, afhankelijk van waar je het plaatst, welke lijnen het oog leiden en hoeveel lege ruimte je laat.",
  cWhyH:"Waarom compositie ertoe doet",cWhyP:"Een technisch perfecte foto (scherp, goed belicht) kan toch vlak aanvoelen als de compositie niet klopt. Deze regels zijn geen harde wetten — het zijn vertrekpunten die een foto meestal evenwichtiger en interessanter maken.",
  cStepH:"8 regels, stap voor stap",cStepLead:"Loop hieronder door elke regel heen. De blauwe lijnen laten zien waar je op moet letten — probeer ze de volgende keer zelf te herkennen.",
  cT1:"Derdenregel",cD1:"Stel je een raster van 3×3 vlakken over je kader voor. Je onderwerp op een van de lijnen plaatsen — zeker waar twee lijnen kruisen — oogt meestal natuurlijker dan precies in het midden.",
  cT2:"Lijnen",cD2:"Wegen, hekken, oevers of bomenrijen kunnen het oog recht naar je onderwerp leiden. Zoek lijnen in de scène en kader zo dat ze naar binnen wijzen.",
  cT3:"Symmetrie",cD3:"Een gespiegelde scène — een reflectie, een rechte pad, gelijke vormen aan beide kanten — voelt rustig en doordacht. Centreer zorgvuldig; symmetrie werkt alleen als het écht gelijk is.",
  cT4:"Lagen (voor-, midden- en achtergrond)",cD4:"Iets dichtbij de camera, iets in het midden en iets veraf samen geven een platte foto echte diepte. Tik op een laag hieronder om die apart te zien, of bekijk het in 3D.",
  cT5:"Kader vullen",cD5:"Kom dichterbij. Door je onderwerp bijna het hele kader te laten vullen, verdwijnen afleidende details en voelt de foto krachtig en intiem aan.",
  cT6:"Negatieve ruimte",cD6:"Het tegenovergestelde van kader vullen: een klein onderwerp omringd door veel lege lucht, water of muur kan rustig of eenzaam aanvoelen, of juist de schaal benadrukken.",
  cT7:"Diagonalen",cD7:"Een lijn die van hoek naar hoek loopt voelt dynamischer dan een rechte horizontale of verticale lijn. Kantel je hoek of zoek een diagonaal die al in de scène zit.",
  cT8:"Kader-in-kader",cD8:"Fotografeer door een deuropening, boog, overhangende takken of een raam. Dat omkadert je onderwerp vanzelf en voegt een interessante voorgrond toe.",
  cLayerPick:"Licht één laag uit:",cLayerAll:"Alle lagen",cLayerBg:"Achtergrond",cLayerMid:"Middengrond",cLayerFg:"Voorgrond",
  k3clLead:"Sleep om de scène vanuit elke hoek te bekijken. Gebruik de knoppen hierboven om alleen de voorgrond, middengrond of achtergrond uit te lichten.",
  cMoreH:"Ook het proberen waard",cMoreLead:"Deze compositie-ideeën zijn ook goed om te kennen, ook zonder volledige uitleg:",
  cMore:[{"t":"Patronen","d":"Herhalende vormen, kleuren of texturen zijn op zichzelf al prettig om te zien, en één onderbreking in het patroon trekt meteen de aandacht."},
   {"t":"Voorgrond","d":"Iets interessants dicht bij de camera plaatsen (gras, stenen, bloemen) geeft diepte en trekt het oog de foto in, ook zonder volledige lagen."},
   {"t":"Balans","d":"Een sterk onderwerp aan de ene kant kan je in balans brengen met iets kleiners of lichters aan de andere kant, in plaats van die kant leeg te laten."},
   {"t":"Driehoekscompositie","d":"Drie interessante punten in een driehoek plaatsen geeft een scène een stabiele, prettige opbouw."},
   {"t":"Gulden snede","d":"Een variant op de derdenregel met ongelijk verdeelde lijnen, vaak als spiraal getekend. Subtieler, zelfde idee."},
   {"t":"Figuur versus grond","d":"Zorg dat je onderwerp duidelijk opvalt tegen de achtergrond — in vorm, kleur of scherpte."},
   {"t":"Stralende lijnen","d":"Lijnen die vanuit één punt uitwaaieren, zoals zonnestralen of boomtakken, trekken het oog naar het midden."},
   {"t":"Cirkelvormige compositie","d":"Vormen die in een cirkel staan, of een letterlijk rond onderwerp, houden het oog bewegend door het kader in plaats van het te laten wegglijden."},
   {"t":"Split screen","d":"Het kader in twee duidelijke helften verdelen — lucht en zee, licht en schaduw — kan een sterk grafisch effect geven."},
   {"t":"Centrale compositie","d":"Bewust de derdenregel doorbreken: een gedurfd, eenvoudig onderwerp precies in het midden kan juist krachtig ogen in plaats van statisch."},
   {"t":"Losse derden","d":"Soms telt alleen de horizon (op een derde, niet in het midden) of één verticale derde — je hebt niet altijd het hele raster nodig."}],
  cAsgLead:"Kies welke regel je hebt geprobeerd, upload je foto, en we tekenen er een bijpassende hulplijn overheen zodat je het zelf kunt checken.",
  cQs:[{"q":"Waar plaatst de derdenregel je onderwerp het liefst?","o":["Precies in het midden","Op een van de rasterlijnen, zeker op een kruispunt","Altijd in een hoek"],"a":1,"e":"Je onderwerp op een derde plaatsen, zeker op een kruispunt, oogt meestal natuurlijker dan centreren."},
   {"q":"Wat doen lijnen in een foto?","o":["Ze maken de foto symmetrisch","Ze leiden het oog van de kijker naar het onderwerp","Ze maken de achtergrond wazig"],"a":1,"e":"Wegen, hekken of oevers kunnen het oog recht naar je onderwerp trekken."},
   {"q":"Je wilt een foto rustig en doordacht laten aanvoelen, met gelijke vormen aan beide kanten. Welke regel past?","o":["Negatieve ruimte","Symmetrie","Diagonalen"],"a":1,"e":"Symmetrie werkt als de twee helften elkaar écht spiegelen."},
   {"q":"Wat maakt 'het kader vullen' effectief?","o":["Het voegt veel lege ruimte toe","Het haalt afleiding weg doordat het onderwerp bijna het hele kader vult","Het werkt alleen bij landschappen"],"a":1,"e":"Dichterbij komen en het kader vullen houdt de aandacht bij het onderwerp."},
   {"q":"Een klein vogeltje in een enorme lege lucht is een voorbeeld van welke regel?","o":["Negatieve ruimte","Kader-in-kader","Kader vullen"],"a":0,"e":"Veel lege ruimte rond een klein onderwerp is negatieve ruimte — dat kan schaal of rust benadrukken."},
   {"q":"Welke combinatie geeft een foto echte diepte?","o":["Alleen een achtergrond","Voorgrond, middengrond en achtergrond samen","Alleen een onderwerp dat het kader vult"],"a":1,"e":"Iets dichtbij, iets in het midden en iets veraf samen laten een platte foto driedimensionaal aanvoelen."},
   {"q":"Fotograferen door een deuropening of overhangende takken is een voorbeeld van…","o":["Kader-in-kader","Stralende lijnen","Split screen"],"a":0,"e":"Een natuurlijk kader rond je onderwerp voegt voorgrond toe en trekt het oog naar binnen."}]

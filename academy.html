<title>PhotoByArno Academy – learn photography with free interactive animations</title>
<meta name="description" content="Learn photography with interactive animations. Free, no account needed. Start with the exposure triangle: aperture, shutter speed and ISO. Available in English, Dutch, German and Spanish.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--soft:#efede8;--text:#1d1d1b;--text2:#5f5e5a;--muted:#8a8984;
  --line:rgba(0,0,0,.10);--line2:rgba(0,0,0,.18);--accent:#1d6fd1;--accent-bg:#e6f0fb;--accent-text:#0c447c;
  --ok:#2f7a1f;--ok-bg:#eaf3de;--bad:#a32d2d;--bad-bg:#fcebeb;--radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not(.embedded){--bg:#161615;--card:#21211f;--soft:#2a2a28;--text:#f1efe8;--text2:#b4b2a9;--muted:#888780;
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.20);--accent:#5c9ce6;--accent-bg:#0c2f55;--accent-text:#b5d4f4;
  --ok:#97c459;--ok-bg:#1f3410;--bad:#f09595;--bad-bg:#4a1717;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:600;letter-spacing:-.01em}
.badge{font-size:12px;font-weight:500;background:var(--accent-bg);color:var(--accent-text);padding:2px 9px;border-radius:999px}
.lang{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.lang button{border:0;background:transparent;color:var(--text2);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--text);color:var(--bg)}
h1{font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600;margin:28px 0 8px}
h3{font-size:16px;font-weight:600;margin:0 0 4px}
p{margin:0 0 12px}
.lead{color:var(--text2);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;font:inherit;color:inherit;width:100%}
button.card{cursor:pointer;transition:border-color .15s}
button.card:hover{border-color:var(--accent)}
.card i{font-size:24px;color:var(--accent)}
.card p{font-size:14px;color:var(--text2);margin:0}
.card.soon{opacity:.6}
.card.soon i{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;margin-top:10px;background:var(--soft);color:var(--text2)}
.tag.go{background:var(--accent-bg);color:var(--accent-text)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.concepts{display:grid;gap:10px;margin:14px 0 6px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px}
.concept i{font-size:22px;color:var(--accent);margin-top:2px}
.concept p{font-size:14px;color:var(--text2);margin:0}
.key{background:var(--accent-bg);color:var(--accent-text);border-radius:12px;padding:12px 14px;margin:4px 0 6px;display:flex;gap:12px}
.key i{font-size:22px;margin-top:2px}
.key p{font-size:14px;margin:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
canvas{width:100%;display:block;border-radius:10px}
.meterlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 0 4px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.meter .mid{position:absolute;left:50%;top:-4px;width:1px;height:14px;background:var(--line2)}
.meter .mk{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);left:50%;transition:left .3s}
.evtxt{font-size:14px;font-weight:600;text-align:center;margin:8px 0 14px}
.row{display:flex;align-items:center;gap:10px}
.row label{font-size:14px;color:var(--text2);width:90px;flex-shrink:0}
.row input{flex:1;accent-color:var(--accent)}
.row span{font-size:14px;font-weight:600;min-width:72px;text-align:right}
.hint{font-size:12px;color:var(--muted);margin:2px 0 12px 100px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:var(--radius);padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cap{font-size:14px;color:var(--text2);margin:12px 0 0;min-height:44px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.q h3{font-size:15px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px}
.opt input{accent-color:var(--accent)}
.fb{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.err{font-size:13px;color:var(--bad);margin-top:6px;display:none}
.score{font-size:15px;font-weight:600;margin-top:10px}
.tool{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;text-decoration:none;color:inherit}
.tool:hover{border-color:var(--accent)}
.tool>i{font-size:24px;color:var(--accent)}
.tool p{font-size:14px;color:var(--text2);margin:0}
.tool .go{margin-left:auto;font-size:20px;color:var(--accent)}
.seg.wrap button{white-space:normal;line-height:1.3}
.small{font-size:13px;color:var(--muted);margin:8px 0 12px}
.pick{display:inline-flex}
#asgOut img{display:block;max-width:100%;max-height:300px;margin:14px auto 10px;border-radius:10px}
.imgwrap{position:relative;width:fit-content;max-width:100%;margin:14px auto 10px}
.imgwrap img{margin:0 !important}
.imgwrap .sbox{position:absolute;border:3px solid #3fb950;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.imgwrap .tbox{position:absolute;background:rgba(63,185,80,.32);outline:1px solid rgba(63,185,80,.9);outline-offset:-1px}
.dofbar{position:relative;height:58px;margin:14px 10px 0}
.dofbar .tr{position:absolute;left:0;right:0;top:30px;height:6px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.dofbar .band{position:absolute;top:29px;height:8px;border-radius:4px;background:#3fb950;opacity:.85}
.dofbar .obj{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--text2);white-space:nowrap;text-align:center}
.dofbar .obj b{display:block;width:2px;height:10px;background:var(--text2);margin:2px auto 0}
.dofbar .fm{position:absolute;top:40px;transform:translateX(-50%);font-size:11px;color:var(--accent);white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:2px 0 10px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.pair figure{margin:0}
.pair img{display:block;width:100%;border-radius:8px}
.pair figcaption{font-size:13px;color:var(--text2);margin-top:4px;text-align:center}
.seg.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.grid2 button{border-left:0}
.seg.grid2 button:nth-child(2n){border-left:1px solid var(--line)}
.seg.grid2 button:nth-child(n+3){border-top:1px solid var(--line)}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.lfoot .lbl{margin:0}
.thumbs{display:flex;gap:6px}
.thumbs .btn{padding:7px 12px}
.thumbs .btn i{font-size:18px}
.lfoot .share{margin-left:auto}
.lmsg{width:100%;font-size:13px;color:var(--text2);margin:0}
.lmsg input{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--text)}
@media (max-width:520px){.lfoot .share{margin-left:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:13px;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 10px}
.fbk{list-style:none;padding:0;margin:6px 0 12px}
.fbk li{display:flex;gap:10px;font-size:14px;padding:9px 12px;border-radius:10px;margin-bottom:6px}
.fbk li i{font-size:18px;margin-top:1px}
.fbk .g{background:var(--ok-bg);color:var(--ok)}
.fbk .t{background:var(--accent-bg);color:var(--accent-text)}
.fbk .n{background:var(--soft);color:var(--text2)}
#histo{width:100%;height:70px;display:block;border-radius:8px;background:var(--soft);margin:4px 0 10px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--text2);padding:9px 4px;font:inherit;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.lbl{font-size:13px;color:var(--text2);margin:0}
.dbar{position:relative;height:62px;margin:14px 28px 0}
.dbar .tr{position:absolute;left:0;right:0;top:27px;height:4px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.dbar .mkr{position:absolute;transform:translateX(-50%);text-align:center;font-size:11px;white-space:nowrap}
.dbar .mkr b{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto}
.dbar .sub{top:2px}.dbar .sub b{margin-top:4px}
.dbar .foc{top:23px}.dbar .foc b{margin-bottom:3px}
.dends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:2px 0 8px}
.fstat{font-size:14px;font-weight:600;text-align:center;margin:4px 0 12px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.embedded,.embedded body{background:transparent}
.embedded .wrap{max-width:none;padding:0 0 8px}
.lead{max-width:75ch}
@media (min-width:900px){
  .embedded .concepts{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .embedded .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .embedded .stage,.embedded #quiz,.embedded #asg,.embedded .tool{max-width:860px}
}
@media (max-width:420px){.row label{width:78px}.hint{margin-left:88px}.row span{min-width:64px}}
</style>
</head>

  fa3:"Pre-focus",
  fa3d:"Pick a spot your subject will pass. Focus there in advance (manual or single) and take the shot as soon as your subject reaches that spot.",

  dIntro:"Depth of field is the zone in front of and behind your focus point that still looks sharp. Sometimes you want everything sharp, like in a landscape. Sometimes only your subject, like in a portrait. Three things decide how deep that zone is.",

  dAd:"Large f-number (f/11, f/16) = lots of depth of field. Small f-number (f/1.8, f/2.8) = little depth of field and a soft background.",

  dFd:"Zooming in (for example 200 mm) gives less depth of field and a blurrier background than zooming out (for example 24 mm).",

  dKeyd:"The further the background is behind your subject, the blurrier it gets. So don't put someone against a wall, but a few metres in front of it.",

  dTours:["Starting point: f/2.8, focused on the walker at 5 metres. She is sharp, the flower in front and the trees behind are soft.", "Aperture to f/16: the sharp zone gets much deeper. Almost everything is sharp now.", "Aperture to f/1.4: only the walker is sharp, the rest melts away.", "Focus on the flower at 2 metres: now the flower is sharp and the walker is soft. You choose where attention goes.", "Zoom in to 200 mm, focused at 5 metres: the sharp zone is paper-thin and the background dissolves into a soft haze.", "Zoom out to 24 mm at f/8, focused at 3 metres: sharp from close by to far away. Ideal for landscapes.", "In short: small f-number, close and zoomed in = little depth of field. Large f-number, further away and zoomed out = lots of depth of field."],
  dQs:[{"q": "You want a landscape sharp from front to back. What do you choose?", "o": ["f/1.8 and zoom in", "f/11 and zoom out", "f/4 and focus close"], "a": 1, "e": "A large f-number and a short focal length give lots of depth of field."}, {"q": "In a portrait the background isn't blurry enough. What helps most?", "o": ["Background further away and a small f-number", "Higher ISO", "Faster shutter speed"], "a": 0, "e": "A small f-number and more distance between subject and background make the background softer."}, {"q": "You photograph a flower very close up and only an edge is sharp. What do you do?", "o": ["Larger f-number, for example f/8", "Smaller f-number, for example f/1.8", "Slower shutter speed"], "a": 0, "e": "Up close, depth of field is very small. A larger f-number makes it deeper."},
   {"q": "Which combination gives the LEAST depth of field?", "o": ["f/2, close and zoomed in", "f/11, far away and zoomed out", "f/8, far away and zoomed out"], "a": 0, "e": "A small f-number, short distance and zooming in all make the sharp zone thinner."},
   {"q": "Why isn't f/22 always the sharpest choice?", "o": ["Diffraction makes the whole photo slightly softer", "Because the photo gets too bright", "Because autofocus stops working"], "a": 0, "e": "With a very small opening, light bends. That makes the whole photo a little less sharp."},
   {"q": "Where is the sharpest setting for many lenses, roughly?", "o": ["Around f/5.6 to f/8", "Always at the smallest f-number", "Always at f/22"], "a": 0, "e": "Most lenses are sharpest two to three stops below their widest opening."},
   {"q": "You photograph a mushroom up close. How do you get it fully sharp with a soft background?", "o": ["f/5.6 to f/8 and a mushroom with lots of space behind it", "f/1.8 and as close as possible", "f/22 with the background right behind it"], "a": 0, "e": "A medium f-number makes the mushroom sharp. Distance to the background makes it soft."},
   {"q": "Someone stands against a wall and the wall stays sharp. What helps most?", "o": ["Have the person stand a few metres in front of the wall", "A higher ISO", "A faster shutter speed"], "a": 0, "e": "The further the background is behind your subject, the blurrier it gets."},

  dSweet:"A bigger number isn't always sharper",
  dSweetd:"Most lenses are sharpest around f/5.6 to f/8. At f/16 and above the whole photo gets slightly softer through diffraction: light bends around the tiny opening. If you want lots of depth of field, f/8 to f/11 is usually the safe choice.",

  bIntro:"Focal length, in millimetres, decides how much of the world fits in your frame. A small number is wide angle: lots of space in the picture. A large number is telephoto: like zooming in. But more happens than just bringing things closer.",
  bA:"Angle of view",
  bAd:"At 24 mm you see a wide angle of about 84°, at 50 mm about 47° and at 200 mm only 12°. The bigger the number, the smaller the slice of the world you capture.",
  bP:"Perspective",
  bPd:"With a wide angle, things close by look big and the background far away. With a telephoto, the background looks closer and bigger. That's called compression.",
  bU:"What do you use when?",
  bUd:"Wide angle (14–35 mm): landscapes, architecture and interiors. Standard (around 50 mm): roughly how your eye sees it. Portrait (85–135 mm): natural-looking faces. Telephoto (200 mm and up): wildlife, sports and details from afar.",
  bKey:"Perspective comes from your distance",
  bKeyd:"It's not really the lens that creates compression, but your distance to the subject. A telephoto lets you stand further back, and from there the background looks bigger. Try it yourself with 'Subject same size' below.",
  bKey2:"Phone or smaller sensor?",
  bKey2d:"The millimetres in this lesson apply to a full-frame camera. On your phone you see 0.5×, 1× or 3×; 1× usually matches about 24 to 28 mm. If your camera has a smaller sensor (APS-C), a lens looks about 1.5× more zoomed in: 50 mm then feels like roughly 75 mm.",
  bTryLead:"Choose what you want to see and move the focal length. At the top right you see from above where the camera stands and how wide it looks.",
  bModeLbl:"What do you want to see?",
  bMode1:"Same spot",
  bMode2:"Subject same size",
  bFL:"Focal length",
  bAngle:"angle of view",
  bDist:"distance to walker",
  bWalker:"Walker",
  bMtn:"Mountain",
  bTours:["Same spot, 24 mm: you see the walker, the path, the trees and the mountain. Lots of space in the frame.", "50 mm: the view gets narrower, roughly how your eye sees it.", "200 mm from the same spot: you bring the walker close without walking. Only her upper body still fits.", "Now the walker stays the same size. At 24 mm you stand right next to her, and the mountain is a small bump in the distance.", "85 mm: you've walked back to keep her the same size. Watch the mountain grow.", "200 mm, more than 40 metres back: the mountain seems right behind her. That's compression, created by your distance.", "In short: focal length decides how much you see, your distance decides the perspective."],
  bQs:[{"q": "Which focal length shows the most of your surroundings?", "o": ["14 mm", "50 mm", "200 mm"], "a": 0, "e": "The smaller the number, the wider the angle of view."}, {"q": "What do you call a 200 mm lens?", "o": ["Telephoto", "Wide angle", "Fisheye"], "a": 0, "e": "From about 85 mm we speak of telephoto, and 200 mm is clearly telephoto."}, {"q": "You want a whole room or a wide landscape in the frame. What do you choose?", "o": ["Wide angle, 16 to 24 mm", "Telephoto, 200 mm", "Portrait, 85 mm"], "a": 0, "e": "A wide angle captures the widest part of your surroundings."}, {"q": "Which focal length is often used for portraits?", "o": ["85 mm", "14 mm", "600 mm"], "a": 0, "e": "Around 85 mm you stand at a comfortable distance and facial proportions stay natural."}, {"q": "You photograph a walker in front of a mountain and want the mountain big behind her. What do you do?", "o": ["Stand further back and zoom in", "Stand close with a wide angle", "Raise the ISO"], "a": 0, "e": "From further away with a telephoto, the background looks bigger relative to your subject."}, {"q": "What actually causes 'compression'?", "o": ["The greater distance to your subject", "The glass in a telephoto lens", "A higher ISO"], "a": 0, "e": "A telephoto lets you stand further back, and that distance changes the perspective."}, {"q": "Why can a wide angle make a nose look big in a very close portrait?", "o": ["Because what's closer to the camera looks much bigger", "Because a wide angle changes the colours", "Because the shutter speed is longer"], "a": 0, "e": "Very close up, the nose is relatively much closer to the lens than the ears, so it looks bigger."}, {"q": "Your phone shows 1×. Which focal length does that roughly match?", "o": ["24 to 28 mm", "85 mm", "200 mm"], "a": 0, "e": "The main camera on most phones is a slight wide angle."}, {"q": "What happens to the angle of view when you go from 24 to 50 mm?", "o": ["It becomes roughly half as wide", "It becomes wider", "It stays the same"], "a": 0, "e": "From about 84° to about 47°: twice as zoomed in is roughly half the angle."}, {"q": "Your camera has a smaller sensor (APS-C) and you use a 50 mm lens. What does it look like?", "o": ["Roughly like 75 to 80 mm", "Roughly like 25 mm", "Exactly like 50 mm on full frame"], "a": 0, "e": "A smaller sensor crops a smaller part of the image, as if you zoom in about 1.5× more."}],
  ba1:"Wide",
  ba1d:"Photograph a landscape, street or room with a wide angle: 24 mm or shorter. On a phone: the 0.5× or 1× camera. Put something interesting in the foreground.",
  ba2:"Zoomed-in detail",
  ba2d:"Zoom in to pick a detail out of a larger scene: a window, a bird or a tree in the distance. Goal: 85 mm or more. On a phone: the 2× or 3× camera.",

  tour:"Tour",stop:"Stop",reset:"Reset",

  tours:["Starting point: f/5.6, 1/125 s, ISO 100. Well exposed, background fairly sharp.",
    "Open the aperture to f/1.8: three stops more light. Lovely soft background, but far too bright.",
    "Compensate with a faster shutter, 1/1000 s. Well exposed again, cyclist frozen, background stays soft.",

   {q:"You want a blurry background for a portrait. What do you change?",o:["Aperture to f/16","Aperture to f/1.8","ISO to 6400"],a:1,e:"A small f-number gives a shallow depth of field."},

   {"q": "Your photo is too dark and you don't want to change shutter speed or aperture. What do you do?", "o": ["Raise the ISO", "Lower the ISO", "Turn off the flash"], "a": 0, "e": "A higher ISO makes your photo brighter, with a bit more noise as a side effect."},

  bQs:[{"q": "Welke brandpuntsafstand laat het meeste van de omgeving zien?", "o": ["14 mm", "50 mm", "200 mm"], "a": 0, "e": "Hoe kleiner het getal, hoe breder de kijkhoek."}, {"q": "Hoe noem je een lens van 200 mm?", "o": ["Tele", "Groothoek", "Fisheye"], "a": 0, "e": "Vanaf ongeveer 85 mm spreek je van tele, en 200 mm is duidelijk tele."}, {"q": "Je wilt een hele kamer of een breed landschap in beeld. Wat kies je?", "o": ["Groothoek, 16 tot 24 mm", "Tele, 200 mm", "Portret, 85 mm"], "a": 0, "e": "Een groothoek legt het breedste stuk van de omgeving vast."}, {"q": "Welk brandpunt wordt vaak gebruikt voor portretten?", "o": ["85 mm", "14 mm", "600 mm"], "a": 0, "e": "Rond 85 mm sta je op een prettige afstand en blijven de verhoudingen van een gezicht natuurlijk."}, {"q": "Je fotografeert een wandelaar voor een berg en wilt de berg groot achter haar. Wat doe je?", "o": ["Verder weg gaan staan en inzoomen", "Dichtbij gaan staan met een groothoek", "De ISO verhogen"], "a": 0, "e": "Van verder weg met tele lijkt de achtergrond groter ten opzichte van je onderwerp."}, {"q": "Wat veroorzaakt eigenlijk 'compressie'?", "o": ["De grotere afstand tot je onderwerp", "Het glas in een telelens", "Een hogere ISO"], "a": 0, "e": "Een telelens laat je verder weg staan, en die afstand verandert het perspectief."}, {"q": "Waarom kan een groothoek bij een portret van heel dichtbij een neus groot maken?", "o": ["Omdat wat dichter bij de camera is veel groter lijkt", "Omdat een groothoek de kleuren verandert", "Omdat de sluitertijd langer is"], "a": 0, "e": "Van heel dichtbij is de neus relatief veel dichter bij de lens dan de oren, dus lijkt hij groter."}, {"q": "Je telefoon toont 1×. Met welk brandpunt komt dat ongeveer overeen?", "o": ["24 tot 28 mm", "85 mm", "200 mm"], "a": 0, "e": "De hoofdcamera van de meeste telefoons is een lichte groothoek."}, {"q": "Wat gebeurt er met de kijkhoek als je van 24 naar 50 mm gaat?", "o": ["Die wordt ongeveer half zo groot", "Die wordt groter", "Die blijft gelijk"], "a": 0, "e": "Van ongeveer 84° naar ongeveer 47°: twee keer zo ingezoomd is ongeveer de helft van de hoek."}, {"q": "Je camera heeft een kleinere sensor (APS-C) en je gebruikt een 50 mm-lens. Hoe ziet dat eruit?", "o": ["Ongeveer als 75 tot 80 mm", "Ongeveer als 25 mm", "Precies als 50 mm op full frame"], "a": 0, "e": "Een kleinere sensor knipt een kleiner stuk uit het beeld, alsof je ongeveer 1,5× verder inzoomt."}],

de:{
  title:"PhotoByArno Academy – Fotografie lernen mit kostenlosen Animationen",
  footer:"Kostenlos, kein Konto nötig. Neue Lektionen kommen regelmäßig dazu.",privacy:"Anonyme Besucherstatistik, ohne Cookies.",
  homeTitle:"Fotografie lernen, Schritt für Schritt",
  homeLead:"Kurze Lektionen mit Animationen, die du selbst steuerst. Schieben, beobachten und verstehen, warum.",
  lessons:"Lektionen",available:"Lektion starten",soon:"Demnächst",back:"Alle Lektionen",
  l1:"Das Belichtungsdreieck",l1d:"Blende, Belichtungszeit und ISO: wie sie gemeinsam dein Foto bestimmen.",
  l2:"Schärfentiefe",l2d:"Was bestimmt, wie viel von deinem Foto scharf ist?",
  l3:"Brennweite",l3d:"Weitwinkel oder Tele: Was macht das mit deinem Bild?",
  l4:"Das Histogramm lesen",l4d:"Auf einen Blick sehen, ob dein Foto richtig belichtet ist.",
  l5:"Weißabgleich",l5d:"Warum Fotos manchmal zu blau oder zu orange werden.",
  l7:"Lichteinfall",l7d:"Warum die Richtung des Lichts über dein Foto entscheidet.",
  l6:"Bildgestaltung",l6d:"Drittelregel, Linien und Raum im Bild.",
  intro:"Jedes Foto ist ein Gleichgewicht aus drei Einstellungen. Änderst du eine, muss eine andere mitgehen, damit die Helligkeit gleich bleibt. Jede Einstellung hat außerdem eine Nebenwirkung.",
  cA:"Blende",cAd:"Die Öffnung im Objektiv. Es wirkt verkehrt herum: Je kleiner die Zahl, desto größer die Öffnung. Das liegt daran, dass die Blendenzahl ein Bruch ist: f/2 bedeutet eine Öffnung von 1/2, f/16 nur 1/16. Eine halbe Pizza ist mehr als ein Sechzehntel. Große Öffnung (f/1.8) = viel Licht und ein unscharfer Hintergrund. Kleine Öffnung (f/16) = weniger Licht und alles scharf.",
  cS:"Belichtungszeit",cSd:"Wie lange der Sensor Licht sammelt. Kurz (1/1000 s) friert Bewegung ein. Lang (1/15 s) lässt bewegte Motive verwischen.",
  cI:"ISO",cId:"Wie stark das Signal verstärkt wird. Höher macht dein Foto heller, bringt aber mehr Bildrauschen.",
  cK:"So arbeiten sie zusammen",cKd:"Fotografen messen Licht in Stufen (englisch: stops). Eine Stufe ist einfach ein Schritt: doppelt so viel Licht oder die Hälfte. Öffnest du die Blende um eine Stufe, bekommst du doppelt so viel Licht. Das gleichst du mit einer Stufe kürzerer Zeit oder einer Stufe niedrigerer ISO aus. Jeder Klick auf einem Schieberegler unten ist genau eine Stufe.",
  lf:"Fokusmodi",
  lfd:"Einzel, kontinuierlich, automatisch oder manuell: Wann nimmst du was?",
  fIntro:"Deine Kamera kann auf vier Arten scharfstellen. Der Unterschied liegt darin, was danach passiert: Bleibt die Schärfe fixiert oder folgt sie deinem Motiv?",
  fS:"Einzel (AF-S)",
  fSd:"Die Kamera stellt einmal scharf und speichert die Schärfe. Ideal für unbewegte Motive wie Landschaften, Gebäude und Porträts.",
  fC:"Kontinuierlich (AF-C)",
  fCd:"Die Kamera stellt weiter scharf, solange du den Auslöser halb gedrückt hältst. Für alles, was sich bewegt: Sport, Tiere, spielende Kinder.",
  fA:"Automatisch (AF-A)",
  fAd:"Die Kamera entscheidet selbst. Sie beginnt mit Einzel-AF und wechselt zu kontinuierlich, wenn sich das Motiv bewegt. Praktisch im Zweifel, aber manchmal knapp zu spät.",
  fM:"Manuell (MF)",
  fMd:"Du drehst selbst am Fokusring. Nützlich bei Makro, Sternen oder wenn der Autofokus pumpt, zum Beispiel durch Glas oder im Dunkeln.",
  fKey:"So startest du das Scharfstellen",
  fKeyd:"Bei den meisten Kameras drückst du den Auslöser halb zum Scharfstellen und ganz zum Auslösen. Die Namen unterscheiden sich manchmal: Einzel heißt auch 'One Shot' und kontinuierlich 'Servo'.",
  fTryLead:"Wähle einen Modus und beobachte den Hund. Grüner Rahmen = scharf, rot = unscharf.",
  fMode:"Modus",
  fSubj:"Motiv",
  moving:"Bewegt",
  still:"Ruhig",
  fDist:"Fokus auf",
  sharp:"Scharf",
  blurry:"Unscharf",
  near:"Nah",
  far:"Fern",
  subjLbl:"Hund",
  focusLbl:"Fokus",
  switched:"wechselt zu kontinuierlich",
  fTours:["Ein sitzender Hund im Einzel-AF: Einmal scharfstellen reicht. Scharf.", "Jetzt rennt der Hund auf dich zu. Einzel-AF hält die Schärfe auf der Anfangsentfernung, also wird der Hund immer unschärfer.", "Kontinuierlich geht mit dem Hund mit. Er bleibt scharf, bis ganz nah.", "Automatisch beginnt mit Einzel-AF und wechselt, sobald sich der Hund bewegt. Achte auf den kurzen Moment davor.", "Manuell auf 8 Meter: Der Hund ist nur scharf, wenn er genau dort ist. So funktioniert auch das Vorfokussieren.", "Faustregel: ruhig = Einzel, bewegt = kontinuierlich."],
  fQs:[{"q": "Du fotografierst eine Landschaft vom Stativ. Welcher Modus?", "o": ["Kontinuierlich", "Einzel", "Manuell ist Pflicht"], "a": 1, "e": "Eine Landschaft bewegt sich nicht, einmal scharfstellen reicht."}, {"q": "Dein Kind rennt beim Fußball auf dich zu. Welcher Modus?", "o": ["Einzel", "Kontinuierlich", "Automatisch ist immer besser"], "a": 1, "e": "Kontinuierlich folgt dem bewegten Motiv."}, {"q": "Der Autofokus pumpt beim Fotografieren durch ein Fenster. Was hilft?", "o": ["Manuell scharfstellen", "Höhere ISO", "Kürzere Belichtungszeit"], "a": 0, "e": "Manuell stellst du selbst scharf, so kann das Glas die Kamera nicht ablenken."},
   {"q": "Was macht die Kamera im kontinuierlichen AF (AF-C), solange du den Auslöser halb drückst?", "o": ["Stellt weiter auf das bewegte Motiv scharf", "Stellt einmal scharf und speichert", "Stellt gar nicht scharf"], "a": 0, "e": "Kontinuierlich folgt deinem Motiv, solange du den Auslöser halb gedrückt hältst."},
   {"q": "Wie startest du bei den meisten Kameras das Scharfstellen?", "o": ["Auslöser halb drücken", "Auslöser zweimal schnell drücken", "Objektiv ab- und wieder ansetzen"], "a": 0, "e": "Halb drücken stellt scharf, ganz drücken löst aus."},
   {"q": "Du fotografierst eine ruhig sitzende Person für ein Porträt. Welcher Modus ist am einfachsten?", "o": ["Einzel (AF-S)", "Kontinuierlich (AF-C)", "Immer manuell"], "a": 0, "e": "Wer ruhig sitzt, bewegt sich kaum, also reicht einmal scharfstellen."},
   {"q": "Du willst den Sternenhimmel fotografieren und der Autofokus findet nichts. Was tust du?", "o": ["Manuell auf einen hellen Stern scharfstellen", "Den kontinuierlichen Modus nutzen", "Die ISO senken"], "a": 0, "e": "Im Dunkeln findet der Autofokus oft nichts. Von Hand, mit Vergrößerung auf einem hellen Stern, klappt es."},
   {"q": "Was ist ein Nachteil des automatischen Modus (AF-A)?", "o": ["Er wechselt manchmal knapp zu spät zu kontinuierlich", "Er funktioniert nur bei Tageslicht", "Er macht das Foto dunkler"], "a": 0, "e": "AF-A muss erst Bewegung erkennen, und diese kurze Verzögerung kann dich ein scharfes Foto kosten."},
   {"q": "Was bedeutet 'Vorfokussieren'?", "o": ["Auf eine Stelle scharfstellen, an der dein Motiv gleich vorbeikommt", "Scharfstellen, bevor du die Kamera einschaltest", "Scharfstellen, nachdem du das Foto gemacht hast"], "a": 0, "e": "Du legst die Schärfe vorab auf die richtige Stelle und löst aus, sobald dein Motiv dort ist."},
   {"q": "Im Einzel-AF stellst du auf einen Hund in 10 Metern scharf, der dann auf dich zurennt. Was passiert?", "o": ["Der Hund wird unscharf, weil die Schärfe bei 10 Metern bleibt", "Der Hund bleibt scharf", "Das Foto wird dunkler"], "a": 0, "e": "Einzel-AF speichert die Schärfe. Kommt der Hund näher, fällt er aus dem scharfen Bereich."}],
  toolTry:"Weiter mit deinen eigenen Fotos",tool1:"Sieh dir im EXIF-Tab der Photography Suite an, mit welcher Blende, Belichtungszeit und ISO deine eigenen Fotos entstanden sind.",toolGo:"Geh selbst üben",tool2:"Willst du mit bewegten Motiven üben? Finde Orte für Wildtiere und Natur in PhotoByArno Scout.",

  a2d:"Fotografiere etwas, das sich schnell bewegt, etwa einen rennenden Hund, einen Radfahrer oder spritzendes Wasser, sodass es scharf und still wirkt. Ziel: Belichtungszeit 1/500 s oder kürzer.",
  a3:"Bewegung zeigen",
  a3d:"Zeige Bewegung als weiche Wischer, zum Beispiel fließendes Wasser oder vorbeifahrenden Verkehr. Ziel: Belichtungszeit 1/15 s oder länger. Nutze ein Stativ oder lehne dich irgendwo an.",

  goodH:"Gut gemacht",
  tipsH:"Tipps für das nächste Mal",
  noExif:"Dieses Foto enthält keine Aufnahmedaten (EXIF). Das passiert oft bei Fotos, die über WhatsApp oder soziale Medien verschickt wurden. Nutze die Originaldatei, dann kann ich deine Einstellungen bewerten. Die Belichtung habe ich trotzdem geprüft.",
  badFile:"Dieses Foto kann ich nicht öffnen. Versuche eine JPG-Datei.",
  phoneNote:"Du fotografierst mit dem Handy, prima zum Lernen. Beachte nur: Bei Handys ist die Blende fest.",
  a1ok:"Blende {v}: schön offen, das ergibt einen unscharfen Hintergrund.",
  a1mid:"Blende {v}: schon ziemlich offen. Für mehr Unschärfe: Versuche f/2.8 oder so offen, wie dein Objektiv es erlaubt.",
  a1bad:"Blende {v}: Damit bleibt viel scharf. Stell deine Kamera auf A oder Av (Blendenvorwahl) und wähle die kleinste Blendenzahl, zum Beispiel f/2.8 oder f/4.",
  a1extra:"Noch unschärfer: Geh näher an dein Motiv heran und sorge dafür, dass der Hintergrund weit weg ist. Etwas hineinzoomen hilft auch.",
  a1phone:"Nutze den Porträtmodus deines Handys, geh nah an dein Motiv und sorge dafür, dass der Hintergrund weit weg ist.",
  a2ok:"Belichtungszeit {v}: kurz genug, um Bewegung einzufrieren.",
  a2mid:"Belichtungszeit {v}: reicht für ruhige Bewegungen, ist für schnelle Action aber knapp zu lang. Versuche 1/1000 s.",
  a2bad:"Belichtungszeit {v}: zu lang, um Bewegung einzufrieren. Stell deine Kamera auf S oder Tv (Zeitvorwahl) und wähle 1/500 s oder kürzer. Zu dunkel? Erhöhe die ISO.",
  a3ok:"Belichtungszeit {v}: lang genug, um Bewegung als Wischer zu zeigen.",
  a3mid:"Belichtungszeit {v}: Etwas Bewegung ist zu sehen, aber es geht weicher. Versuche 1/4 s oder länger.",

  a3light:"Tagsüber zu hell mit langer Belichtungszeit? Ein ND-Filter wirkt wie eine Sonnenbrille für dein Objektiv.",
  a3phone:"Viele Handys haben dafür einen Nachtmodus oder einen Langzeitbelichtungs-Effekt. Mit einem Pro-Modus oder einer Pro-App wählst du die Belichtungszeit selbst.",
  shake:"Belichtungszeit {v} aus der Hand ist lang für diese Brennweite. Deine Hände könnten sich bewegt haben: Bleib kürzer als 1/{f} s oder nutze ein Stativ.",
  isoLow:"ISO {v}: schön niedrig, wenig Rauschen.",

  expOk:"Die Belichtung sieht gut aus: keine großen Flächen, die komplett weiß oder schwarz sind.",
  expHi:"{p}% deines Fotos sind komplett weiß. Dieses Detail ist weg und später nicht mehr zu retten. Nächstes Mal etwas dunkler: kürzere Zeit, niedrigere ISO oder Belichtungskorrektur minus.",
  expLo:"{p}% deines Fotos sind komplett schwarz. Etwas heller geht: längere Zeit, höhere ISO oder offenere Blende.",
  expDark:"Das Foto ist insgesamt ziemlich dunkel. Absicht? Prima. Wenn nicht, gib etwas mehr Licht.",
  expBright:"Das Foto ist insgesamt ziemlich hell. Absicht? Prima. Wenn nicht, gib etwas weniger Licht.",
  sharpNo:"Ich finde keine wirklich scharfen Details. Prüfe deine Scharfstellung und halte die Kamera ruhig.",

  intro:"Cada foto es un equilibrio entre tres ajustes. Si cambias uno, otro tiene que moverse para mantener el mismo brillo. Cada ajuste tiene además un efecto secundario.",
  cA:"Apertura",cAd:"La abertura del objetivo. Parece al revés: cuanto menor es el número, mayor es la abertura. Es porque el número f es una fracción: f/2 significa una abertura de 1/2, f/16 solo 1/16. Media pizza es más que un dieciseisavo. Abertura grande (f/1.8) = mucha luz y fondo desenfocado. Abertura pequeña (f/16) = menos luz y todo nítido.",

  cI:"ISO",cId:"Cuánto se amplifica la señal. Más alto aclara la foto, pero añade ruido.",

  fTours:["Un perro sentado, en modo único: enfocar una vez basta. Nítido.", "Ahora el perro corre hacia ti. El modo único mantiene el enfoque a la distancia inicial, así que el perro sale cada vez más desenfocado.", "El continuo acompaña al perro. Se mantiene nítido hasta muy cerca.", "El automático empieza en único y cambia en cuanto el perro se mueve. Fíjate en el breve momento anterior.", "Manual a 8 metros: el perro solo está nítido cuando pasa justo por ahí. Así funciona el enfoque previo.", "Regla práctica: quieto = único, en movimiento = continuo."],

function pickLang(){
  try{const p=new URLSearchParams(location.search).get('lang');if(p&&LANGS.includes(p.toLowerCase()))return p.toLowerCase()}catch(e){}
  try{const s=localStorage.getItem('pba-lang');if(LANGS.includes(s))return s}catch(e){}
  const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(const l of list){const c=String(l).slice(0,2).toLowerCase();if(LANGS.includes(c))return c}
  return 'en';
}

/* Bezoekersstatistieken via GoatCounter (geen cookies, geen Google).
   Pas GC_CODE aan als je bij GoatCounter een andere code kiest. */
const GC_CODE='photobyarno';
const gcQueue=[];let gcReady=false;
function track(path,title,isEvent){
  if(!gcReady){gcQueue.push([path,title,isEvent]);return}
  try{if(window.goatcounter&&typeof window.goatcounter.count==='function')window.goatcounter.count({path:path,title:title||path,event:!!isEvent})}catch(e){}
}
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  window.goatcounter={no_onload:true,allow_frame:true};
  const gs=document.createElement('script');
  gs.async=true;gs.src='https://gc.zgo.at/count.js';
  gs.setAttribute('data-goatcounter','https://'+GC_CODE+'.goatcounter.com/count');
  gs.setAttribute('data-goatcounter-settings','{"no_onload":true,"allow_frame":true}');
  gs.onload=()=>{gcReady=true;gcQueue.splice(0).forEach(a=>track(a[0],a[1],a[2]))};
  document.head.appendChild(gs);
})();

function renderQuiz(box,key){
  const pool=t(key||'qs'),SHOW=5;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const qs=shuffle(pool.map((_,i)=>i)).slice(0,Math.min(SHOW,pool.length)).map(i=>{const q=pool[i];const order=shuffle(q.o.map((_,k)=>k));return{q:q.q,e:q.e,o:order.map(k=>q.o[k]),a:order.indexOf(q.a)}});

  box.innerHTML=qs.map((q,n)=>`<div class="q" data-n="${n}"><h3>${n+1}. ${q.q}</h3>${q.o.map((o,k)=>`<label class="opt"><input type="radio" name="q${n}" value="${k}">${o}</label>`).join('')}

  <div class="btns" style="margin-top:10px"><button class="btn" id="newQs"><i class="ti ti-refresh" aria-hidden="true"></i>${t('newQs')}</button></div>`;
  box.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.check,el=box.querySelector(`.q[data-n="${n}"]`),sel=el.querySelector('input:checked'),err=el.querySelector('.err'),fb=el.querySelector('.fb');
    if(!sel){err.style.display='block';return}

    const done=Object.keys(answered).length;
    if(done===qs.length){const sc=Object.values(answered).filter(Boolean).length;box.querySelector('#score').textContent=`${t('score')}: ${sc} / ${qs.length}`;
      if(!box.dataset.tracked){box.dataset.tracked='1';track((location.hash.slice(1)||'home')+'/quiz-done','Quiz done, score '+sc+'/'+qs.length,true)}}

  box.querySelector('#newQs').onclick=()=>{delete box.dataset.tracked;renderQuiz(box,key);box.scrollIntoView({block:'start'});postToParent({pbaTop:true});postHeight()};
}

function parseExif(buf){
  try{
    const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-10){
      const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return readTiff(v,o+10);
      if(m===0xFFDA)return null;
      o+=2+len;
    }

        else if(type===5||type===10){const p=t+u32(vo),a=u32(p),b=u32(p+4);r[name]=b?a/b:0}

    }

  const id=foot.dataset.lesson,msg=foot.querySelector('#lmsg');
  const vb=e.target.closest('[data-vote]');
  if(vb){const v=vb.dataset.vote;try{localStorage.setItem('pba-vote-'+id,v)}catch(err){}
    track(id+'/feedback-'+v,v==='up'?'Lesson useful':'Lesson not useful',true);
    foot.querySelector('.thumbs').innerHTML=`<span class="lmsg" style="width:auto">${t('thanks')}</span>`;postHeight();return}
  if(e.target.closest('.share')){
    const url=SITE_URL+'#'+id,title=t(foot.dataset.title)+' – PhotoByArno Academy';
    try{if(navigator.share){await navigator.share({title:title,url:url});track(id+'/share','Lesson shared',true);return}}catch(err){if(err&&err.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);msg.textContent=t('copied');track(id+'/share-copy','Lesson link copied',true)}
    catch(err){msg.innerHTML=`${t('copyFail')}<input type="text" readonly value="${url}">`;const inp=msg.querySelector('input');inp.focus();inp.select()}
    postHeight();
  }
});

      const exif=parseExif(rd.result);
      if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);

     <p class="small">${t('encourage')}</p>`;

  function go(){const [m,v,mf]=steps[st];if(mf){$('mf').value=mf;mfo()}subj=v;setSub(v);setMode(m);$('cap').textContent=(st+1)+'/'+steps.length+' · '+t('fTours')[st];st++;if(st>=steps.length)stopT()}
  function stopT(){if(tm){clearInterval(tm);tm=null}st=0;tb.innerHTML=playLbl()}
  tb.onclick=()=>{if(tm){stopT();return}if(!toured){toured=true;track('scherpstelmodi/tour-start','Focus tour started',true)}st=0;go();tm=setInterval(go,5800);tb.innerHTML=`<i class="ti ti-player-pause" aria-hidden="true"></i>${t('stop')}`};
  mfo();setSub('moving');setMode('S');raf=requestAnimationFrame(frame);
  cleanup=()=>{cancelAnimationFrame(raf);if(tm)clearInterval(tm)};
}

const langBox=document.getElementById('langs');
langBox.innerHTML=LANGS.map(l=>`<button data-l="${l}" aria-label="${l.toUpperCase()}">${l.toUpperCase()}</button>`).join('');
function markLang(){langBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));document.documentElement.lang=lang}
langBox.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem('pba-lang',lang)}catch(e){}
  markLang();track('lang/'+lang+'/chosen','Language chosen: '+lang,true);route();
});
markLang();
track('lang/'+lang,'Language: '+lang,true);
window.addEventListener('hashchange',route);
try{new ResizeObserver(postHeight).observe(document.body)}catch(e){setInterval(postHeight,1000)}
window.addEventListener('load',postHeight);
route();
</script>

de:{
  title:"PhotoByArno Academy – Fotografie lernen mit kostenlosen Animationen",
  blkH:"Diese Lektion findest du auf photobyarno.com",blkP:"Die PhotoByArno Academy ist kostenlos, aber nur auf der eigenen Website. Dort findest du auch immer die neueste Version.",blkGo:"Zur Academy",copy:"© 2026 PhotoByArno. Alle Rechte vorbehalten. Du darfst die Lektionen kostenlos in deinem eigenen Unterricht zeigen, direkt von photobyarno.com und mit Quellenangabe.",
  footer:"Kostenlos, kein Konto nötig. Neue Lektionen kommen regelmäßig dazu.",privacy:"Anonyme Besucherstatistik, ohne Cookies.",
  homeTitle:"Fotografie lernen, Schritt für Schritt",
  homeLead:"Kurze Lektionen mit Animationen, die du selbst steuerst. Schieben, beobachten und verstehen, warum.",
  lessons:"Lektionen",available:"Lektion starten",soon:"Demnächst",back:"Alle Lektionen",
  k3load:"3D wird geladen…",k3fail:"3D wird in diesem Browser nicht unterstützt. Der Rest der Lektion funktioniert normal.",k3drag:"Zum Drehen ziehen",k3front:"Vorne",k3angle:"Schräg",k3side:"Seite",k3top:"Oben",k3behind:"Hinter der Kamera",k3photo:"Foto",k3view3d:"3D-Ansicht",
  k3irisH:"Ein Blick in die Kamera",k3irisLead:"Die Blende ist ein Ring aus dünnen Metalllamellen. Schiebe den Regler und sieh, wie die Öffnung kleiner wird: Es fällt weniger Licht auf den Sensor, der dadurch dunkler wird.",
  k3shutLead:"Direkt vor dem Sensor sitzen zwei Vorhänge. Der erste öffnet sich, der zweite folgt und schließt wieder. Bei kurzer Belichtungszeit wandert nur ein schmaler Schlitz über den Sensor, aber jede Zeile des Sensors bekommt genau gleich lange Licht.",
  k3light:"Licht im Vergleich zu f/1.8",k3stops:"Stufen weniger Licht",k3open:"Öffnung bei 50 mm",k3fire:"Auslösen",k3slit:"Offener Schlitz",k3slitAll:"Ganzer Sensor",k3time:"Belichtungszeit",k3slow:"Verlangsamt",
  k3fLead:"Die farbige Fläche zeigt, worauf die Kamera scharfstellt. Grün: Der Hund ist in dieser Ebene und scharf. Rot: Der Hund hat die Ebene verlassen.",
  k3dLead:"Der grüne Block ist alles, was scharf wirkt, die blaue Fläche ist die Schärfeebene. Ändere Blende, Entfernung oder Brennweite und sieh, wie der Block wächst oder schrumpft.",
  k3bLead:"Die blaue Form zeigt, was die Kamera sieht. Je länger die Brennweite, desto schmaler. Bei „Motiv gleich groß“ geht die Kamera zurück: Die Person bleibt gleich groß, und der Berg scheint näher zu kommen.",
  k3bokH:"Warum Lichtpunkte eine Form bekommen",k3bokLead:"Kleine Lichter im unscharfen Hintergrund nehmen die Form der Blendenöffnung an (Bokeh). Bei offener Blende sind sie groß und weich. Blendest du ab, werden sie kleiner und eckig: hier siebeneckig, weil dieses Objektiv 7 Lamellen hat.",
  l0:"Deine Kamera kennenlernen",
  l0d:"Wie heißen all die Tasten, und was steckt im Inneren?",
  cIntro:"Bevor du etwas einstellst: Das ist deine Kamera. Dreh sie herum, tippe auf die Nummern und schau auch hinein, wo das Licht seinen Weg zum Sensor findet. Du musst dir nicht alles auf einmal merken; du kannst jederzeit hierher zurückkommen.",
  cOut:"Außen: die Bedienung",
  cOutd:"Tasten, Räder und Ringe, mit denen du die Kamera einstellst. Auslöser, Einstellrad und Moduswahlrad brauchst du am häufigsten.",
  cIn:"Innen: der Weg des Lichts",
  cInd:"Das Licht geht durch die Linsen, die Blende und den Verschluss und fällt dann auf den Sensor. Bei einer Spiegelreflexkamera sitzt dazwischen noch ein Spiegel, bei dieser spiegellosen Kamera nicht.",
  cPh:"Und dein Handy?",
  cPhd:"Es hat dieselben Teile, nur winzig klein: Linsen, einen Sensor und einen Prozessor. Die Blende ist meist fest, der Verschluss elektronisch, und gezoomt wird durch Wechseln zwischen den Objektiven (0,5×, 1×, 3×).",
  cKey:"So hältst du sie ruhig",
  cKeyd:"Rechte Hand um den Griff, Zeigefinger auf den Auslöser. Leg das Objektiv von unten in die linke Hand und halte die Ellbogen am Körper. So werden weniger Fotos verwackelt.",
  cTryLead:"Ziehe, um die Kamera zu drehen. Tippe auf eine Nummer oder einen Namen in der Liste. Mit „Innen“ schaust du durch die Kamera hindurch.",
  cOutside:"Außen",
  cInside:"Innen",
  cPick:"Tippe auf eine Nummer, um zu sehen, wie das Teil heißt und was es macht. Du siehst eine Nummer nicht? Dreh die Kamera oder wähle Hinten oder Oben.",
  cPickIn:"Folge dem Licht: durch die Linsen (A), die Blende (B) und den Verschluss (C) zum Sensor (D). Tippe auf einen Buchstaben für mehr Infos.",
  cMore:"Mehr dazu in:",
  k3back:"Hinten",
  cGameStart:"Spiel: Zeig drauf",
  cGameStop:"Spiel beenden",
  cGameAgain:"Noch einmal spielen",
  cGameN:"Frage {i} von {n}",
  cGameQ:"Wo ist: {p}?",
  cGameHint:"Tippe auf den richtigen Punkt an der Kamera. Du siehst ihn nicht? Dreh die Kamera.",
  cGameOk:"Richtig!",
  cGameNo:"Nicht ganz. Der grüne Punkt ist: {p}.",
  cNext:"Weiter",
  cGameScore:"Ergebnis ansehen",
  cGameEnd:"Du hattest {s} von {n} richtig.",
  cGameTop:"Du kennst deine Kamera. Weiter zum Belichtungsdreieck!",
  cGameMid:"Schon gut! Tippe die Teile noch einmal durch und spiel erneut.",
  cGameLow:"Keine Sorge, das ist neu. Tippe die Teile in Ruhe durch und versuch es noch einmal.",
  cParts:{"shutter": ["Auslöser", "Halb drücken: Die Kamera stellt scharf und misst das Licht. Ganz drücken: Das Foto wird aufgenommen. Das halbe Drücken kommt in der Lektion über Fokusmodi wieder vor."], "dial": ["Einstellrad", "Damit änderst du die Einstellung, die zum gewählten Modus gehört, etwa Belichtungszeit oder Blende. Viele Kameras haben zwei: eines vorne und eines hinten."], "mode": ["Moduswahlrad", "Legt fest, wer was bestimmt. AUTO: Die Kamera macht alles. P: Die Kamera wählt, du kannst korrigieren. A (oder Av): Du wählst die Blende. S (oder Tv): Du wählst die Belichtungszeit. M: Du wählst alles selbst."], "hotshoe": ["Blitzschuh", "Eine Schiene mit Kontakten oben auf der Kamera. Hier schiebst du einen Aufsteckblitz, ein Mikrofon oder einen Funkauslöser auf."], "evf": ["Sucher", "Hier schaust du mit dem Auge hinein. Bei einer spiegellosen Kamera ist das ein kleiner Bildschirm, der genau zeigt, wie dein Foto wird. Mit dem Rädchen daneben (Dioptrien) stellst du ihn auf deine Augen ein."], "screen": ["Display", "Zeigt das Livebild, das Menü und deine Fotos. Oft kannst du es kippen und per Touch bedienen: praktisch für Fotos knapp über dem Boden oder über dem Kopf."], "buttons": ["Tasten und Joystick", "Mit dem Joystick verschiebst du das Fokusfeld. Die Tasten daneben öffnen das Menü, zeigen deine Fotos an oder löschen sie. Die Anordnung ist je nach Kamera anders, die Funktionen fast immer gleich."], "lens": ["Objektiv", "Das Auge der Kamera. Auf dem Ring stehen zwei Zahlen: die Brennweite (hier 24-70 mm) und die größte Blendenöffnung (hier 1:2.8, also f/2.8)."], "zoom": ["Zoomring", "Dreh daran, um hinein- und herauszuzoomen: Du änderst die Brennweite. Ein Objektiv mit fester Brennweite hat keinen Zoomring."], "focus": ["Fokusring", "Damit stellst du von Hand scharf (MF). Praktisch bei Nahaufnahmen, Sternen oder Fotos durch eine Scheibe, wo der Autofokus zögert."], "release": ["Objektiventriegelung", "Drücken und das Objektiv drehen, um es abzunehmen. Wechsle mit der Kamera nach unten gerichtet, dann gelangt weniger Staub auf den Sensor."], "card": ["Speicherkartenfach", "Hinter dieser Klappe steckt die Speicherkarte (meist SD). Warte, bis die Lampe aus ist, bevor du die Karte herausnimmst."], "tripod": ["Stativgewinde", "Ein Gewinde an der Unterseite für ein Stativ. Fast alle Kameras und Stative haben dieselbe Größe (1/4 Zoll)."], "lenses": ["Linsen", "Im Objektiv sitzen mehrere Glaslinsen hintereinander. Zusammen lenken sie das Licht so, dass ein scharfes Bild auf dem Sensor entsteht. Beim Zoomen oder Scharfstellen verschieben sich einige davon."], "iris": ["Blende", "Ein Ring aus Lamellen, der eine größere oder kleinere Öffnung bildet. Großes Loch: mehr Licht und ein weicherer Hintergrund. Kleines Loch: weniger Licht und mehr Schärfe von vorne bis hinten."], "shutterc": ["Verschluss", "Zwei Vorhänge direkt vor dem Sensor. Sie bestimmen, wie lange Licht auf den Sensor fällt: die Belichtungszeit. Viele Kameras und alle Handys können auch elektronisch belichten, ohne beweglichen Vorhang."], "sensor": ["Sensor", "Das Herz der Kamera: ein Chip mit Millionen lichtempfindlicher Pixel. Siehst du, dass das Bild auf dem Kopf steht? So kommt das Licht durch die Linsen; die Kamera dreht es einfach wieder um. Ein großer Sensor (Vollformat) fängt mehr Licht ein als ein kleiner (APS-C oder Handy)."], "proc": ["Bildprozessor", "Der kleine Computer der Kamera. Er macht aus den Sensordaten ein JPEG, reduziert Rauschen und berechnet den Autofokus. Fotografierst du in RAW, speichert die Kamera die Rohdaten, damit du sie später selbst bearbeitest."], "battery": ["Akku", "Sitzt meist im Griff. Display und Sucher brauchen viel Strom: Nimm für einen Fototag einen Ersatzakku mit und halte ihn bei Kälte warm."]},
  camQs:[{"q": "Was passiert, wenn du den Auslöser halb drückst?", "o": ["Die Kamera stellt scharf und misst das Licht", "Das Foto wird aufgenommen", "Das Menü öffnet sich"], "a": 0, "e": "Halb drücken heißt scharfstellen und messen. Erst wenn du ganz drückst, wird das Foto aufgenommen."}, {"q": "Wo landet das Licht am Ende?", "o": ["Auf dem Sensor", "Im Sucher", "Auf der Speicherkarte"], "a": 0, "e": "Das Licht geht durch die Linsen, die Blende und den Verschluss und fällt dann auf den Sensor."}, {"q": "Auf deinem Objektiv steht 24-70 mm. Was bedeutet das?", "o": ["Die Brennweite reicht von 24 bis 70 mm", "Das Objektiv ist 24 bis 70 mm lang", "Die größte Blendenöffnung"], "a": 0, "e": "Es ist die Brennweite: 24 mm ist Weitwinkel, 70 mm schon etwas herangezoomt."}, {"q": "Mit welchem Teil wählst du zwischen AUTO, P, A, S und M?", "o": ["Mit dem Moduswahlrad", "Mit dem Fokusring", "Mit dem Zoomring"], "a": 0, "e": "Das Moduswahlrad legt fest, wer was bestimmt: du oder die Kamera."}, {"q": "Wie wechselst du das Objektiv am sichersten?", "o": ["Mit der Kamera nach unten gerichtet", "Mit der Öffnung nach oben, damit du gut siehst, was du tust", "Das ist egal"], "a": 0, "e": "Mit der Öffnung nach unten gelangt weniger Staub auf den Sensor."}, {"q": "Was macht der Verschluss?", "o": ["Er bestimmt, wie lange Licht auf den Sensor fällt", "Er bestimmt, wie groß die Öffnung ist", "Er zoomt hinein und heraus"], "a": 0, "e": "Der Verschluss regelt die Belichtungszeit. Die Größe der Öffnung ist die Blende."}, {"q": "Warum steht das Bild auf dem Sensor auf dem Kopf?", "o": ["So lenken Linsen das Licht; die Kamera dreht es zurück", "Der Sensor ist falsch herum eingebaut", "Das passiert nur bei billigen Kameras"], "a": 0, "e": "Jede Linse stellt das Bild auf den Kopf, auch die in deinem Auge. Dein Gehirn und deine Kamera drehen es einfach wieder um."}, {"q": "Wofür ist das Gewinde an der Unterseite?", "o": ["Für ein Stativ", "Für einen Blitz", "Für die Speicherkarte"], "a": 0, "e": "Dort schraubst du die Kamera auf ein Stativ. Der Blitz kommt in den Blitzschuh oben."}, {"q": "Was hat ein Handy meistens NICHT?", "o": ["Eine verstellbare Blende", "Einen Sensor", "Eine Linse"], "a": 0, "e": "Bei den meisten Handys ist die Blende fest. Linsen und einen Sensor haben sie alle."}],

  wA:"Die Kelvin-Skala",wAd:"Licht hat eine Farbtemperatur in Kelvin (K). Niedrig (2000-3500K) ist warm und orange, wie eine Kerze oder Glühlampe. Hoch (6500-10000K) ist kühl und blau, wie ein bewölkter Himmel oder Schatten.",
  wB:"Der automatische Weißabgleich kann sich täuschen",wBd:"Auto White Balance (AWB) schätzt das Licht anhand der ganzen Szene. Eine Szene mit viel von einer Farbe, wie ein Sonnenuntergang, kann die Kamera verwirren.",
  wC:"Korrektur in RAW vs. JPG",wCd:"In RAW kannst du den Weißabgleich später ohne Qualitätsverlust anpassen. In JPG geht das auch, aber bei einer starken Korrektur drohen Farbverluste.",
  wKey:"Feste Einstellung bei wechselndem Licht",wKeyd:"Bei einer Fotoserie am gleichen Ort sorgt ein fester Weißabgleich für gleichmäßigere Farben zwischen den Bildern als Auto, das von Foto zu Foto leicht variieren kann.",
  wTryLead:"Wähle das Licht, bei dem das Foto entstanden ist, und verschiebe den Weißabgleich, bis die Szene neutral wirkt.",

  liIntro:"Die Richtung, aus der das Licht kommt, bestimmt Form, Schatten und Stimmung deines Fotos, oft wichtiger als die Lichtmenge.",
  liA:"Vorderlicht, Seitenlicht, Gegenlicht",liAd:"Vorderlicht zeigt wenig Schatten und flacht das Motiv ab. Seitenlicht betont Form und Textur mit deutlichen Schatten. Gegenlicht kann eine Silhouette oder einen dramatischen Glanz ergeben.",
  liB:"Hartes versus weiches Licht",liBd:"Eine kleine, grelle Lichtquelle wie die Mittagssonne erzeugt hartes Licht mit scharfen Schattenkanten. Eine große, diffuse Quelle wie ein bewölkter Himmel erzeugt weiches Licht mit sanften Übergängen.",
  liC:"Die goldene Stunde",liCd:"Die Stunde nach Sonnenaufgang und vor Sonnenuntergang bringt tiefes, warmes Licht mit langen weichen Schatten, von vielen Fotografen das schönste Licht des Tages genannt.",
  liKey:"Belichte auf das Motiv, nicht auf den Hintergrund",liKeyd:"Bei Gegenlicht misst deine Kamera oft den ganzen grellen Hintergrund und macht das Motiv zu dunkel. Nutze Belichtungskorrektur oder Spotmessung auf das Motiv, um das zu vermeiden.",
  liTryLead:"Drehe die Lichtrichtung und sieh, wie sich Schatten und Form verändern. Wechsle zwischen hartem und weichem Licht.",

  liAsgLead:"Lade ein Foto hoch, und wir schauen uns den Kontrast des Lichts darin an.",

  omA:"P — Programmautomatik",omAd:"Die Kamera wählt Verschlusszeit und Blende zusammen. Du bestimmst weiterhin ISO, Weißabgleich und mehr. Ein guter Ausgangspunkt.",
  omB:"A/Av — Blendenvorwahl",omBd:"Du wählst die Blende (Schärfentiefe), die Kamera wählt die passende Verschlusszeit. Der meistgenutzte Modus für Porträts und Landschaften.",
  omC:"S/Tv — Zeitvorwahl",omCd:"Du wählst die Verschlusszeit (Bewegung einfrieren oder verwischen), die Kamera wählt die passende Blende. Praktisch bei Sport und Action.",
  omKey:"M — Manuell für volle Kontrolle",omKeyd:"In M wählst du beides selbst. Unverzichtbar bei schwierigem Licht, das die Kamera täuscht, etwa eine Bühne mit Scheinwerfern, oder wenn du konstante Einstellungen zwischen Fotos willst.",
  omTryLead:"Wähle einen Modus und verschiebe Verschlusszeit und/oder Blende. Sieh, was sich automatisch mitbewegt und was nicht, und welchen Effekt das aufs Foto hat.",

  omAsgLead:"Lade ein Foto hoch, und wir prüfen die Belichtung.",
  mcIntro:"Makrofotografie bedeutet extrem nahes Fotografieren, bei dem kleine Motive den Bildausschnitt füllen und die Schärfentiefe hauchdünn wird.",
  mcA:"Minimale Fokusdistanz",mcAd:"Ein Makroobjektiv kann viel näher fokussieren als ein gewöhnliches Objektiv, oft bis auf wenige Zentimeter an das Motiv heran.",
  mcB:"Abbildungsmaßstab 1:1",mcBd:"Bei 'echtem' Makro (1:1) ist das Motiv auf dem Sensor genauso groß wie in Wirklichkeit. Objektive, die das nicht ganz erreichen, wie 1:2, werden oft auch Makro genannt.",
  mcC:"Extrem geringe Schärfentiefe",mcCd:"Je näher du fokussierst, desto dünner wird die scharfe Zone, manchmal nur wenige Millimeter, selbst bei geschlossener Blende wie f/11.",
  mcKey:"Focus Stacking für mehr Schärfe",mcKeyd:"Weil die scharfe Zone so dünn ist, machen Makrofotografen oft mehrere Fotos mit leicht unterschiedlicher Fokussierung und fügen sie zusammen (Focus Stacking), damit das Motiv durchgehend scharf wird.",
  mcTryLead:"Schiebe die Blende auf und zu und sieh, wie dünn die scharfe Zone bleibt, selbst aus der Nähe.",

  lmB:"Mittenbetonte Messung",lmBd:"Legt den Schwerpunkt auf die Bildmitte, der Rand zählt weniger. Praktisch, wenn dein Motiv meist in der Mitte steht.",
  lmC:"Spotmessung",lmCd:"Misst nur einen kleinen Punkt, oft rund um den Fokuspunkt. Ideal bei starkem Kontrast, etwa einem Gesicht vor hellem Himmel.",
  lmKey:"Eine helle oder dunkle Szene täuscht die Messung",lmKeyd:"Der Belichtungsmesser strebt ein mittleres Grau an. Bei viel Schnee oder einem weißen Strand macht er das Foto zu dunkel; bei einem dunklen Hintergrund oder Konzert macht er es zu hell. Korrigiere mit Belichtungskorrektur: plus bei viel Weiß, minus bei viel Schwarz.",
  lmTryLead:"Wähle eine Szene und eine Messmethode, und sieh, welcher Bildteil die Belichtung bestimmt.",

  intro:"Jedes Foto ist ein Gleichgewicht aus drei Einstellungen. Änderst du eine, muss eine andere mitgehen, damit die Helligkeit gleich bleibt. Jede Einstellung hat außerdem eine Nebenwirkung.",
  cA:"Blende",cAd:"Die Öffnung im Objektiv. Es wirkt verkehrt herum: Je kleiner die Zahl, desto größer die Öffnung. Das liegt daran, dass die Blendenzahl ein Bruch ist: f/2 bedeutet eine Öffnung von 1/2, f/16 nur 1/16. Eine halbe Pizza ist mehr als ein Sechzehntel. Große Öffnung (f/1.8) = viel Licht und ein unscharfer Hintergrund. Kleine Öffnung (f/16) = weniger Licht und alles scharf.",
  cS:"Belichtungszeit",cSd:"Wie lange der Sensor Licht sammelt. Kurz (1/1000 s) friert Bewegung ein. Lang (1/15 s) lässt bewegte Motive verwischen.",
  cI:"ISO",cId:"Wie stark das Signal verstärkt wird. Höher macht dein Foto heller, bringt aber mehr Bildrauschen.",
  cK:"So arbeiten sie zusammen",cKd:"Fotografen messen Licht in Stufen (englisch: stops). Eine Stufe ist einfach ein Schritt: doppelt so viel Licht oder die Hälfte. Öffnest du die Blende um eine Stufe, bekommst du doppelt so viel Licht. Das gleichst du mit einer Stufe kürzerer Zeit oder einer Stufe niedrigerer ISO aus. Jeder Klick auf einem Schieberegler unten ist genau eine Stufe.",

  fTours:["Ein sitzender Hund im Einzel-AF: Einmal scharfstellen reicht. Scharf.", "Jetzt rennt der Hund auf dich zu. Einzel-AF hält die Schärfe auf der Anfangsentfernung, also wird der Hund immer unschärfer.", "Kontinuierlich geht mit dem Hund mit. Er bleibt scharf, bis ganz nah.", "Automatisch beginnt mit Einzel-AF und wechselt, sobald sich der Hund bewegt. Achte auf den kurzen Moment davor.", "Manuell auf 8 Meter: Der Hund ist nur scharf, wenn er genau dort ist. So funktioniert auch das Vorfokussieren.", "Faustregel: ruhig = Einzel, bewegt = kontinuierlich."],
  fQs:[{"q": "Du fotografierst eine Landschaft vom Stativ. Welcher Modus?", "o": ["Kontinuierlich", "Einzel", "Manuell ist Pflicht"], "a": 1, "e": "Eine Landschaft bewegt sich nicht, einmal scharfstellen reicht."}, {"q": "Dein Kind rennt beim Fußball auf dich zu. Welcher Modus?", "o": ["Einzel", "Kontinuierlich", "Automatisch ist immer besser"], "a": 1, "e": "Kontinuierlich folgt dem bewegten Motiv."}, {"q": "Der Autofokus pumpt beim Fotografieren durch ein Fenster. Was hilft?", "o": ["Manuell scharfstellen", "Höhere ISO", "Kürzere Belichtungszeit"], "a": 0, "e": "Manuell stellst du selbst scharf, so kann das Glas die Kamera nicht ablenken."},

   {"q": "Du willst den Sternenhimmel fotografieren und der Autofokus findet nichts. Was tust du?", "o": ["Manuell auf einen hellen Stern scharfstellen", "Den kontinuierlichen Modus nutzen", "Die ISO senken"], "a": 0, "e": "Im Dunkeln findet der Autofokus oft nichts. Von Hand, mit Vergrößerung auf einem hellen Stern, klappt es."},

  toolTry:"Weiter mit deinen eigenen Fotos",tool1:"Sieh dir im EXIF-Tab der Photography Suite an, mit welcher Blende, Belichtungszeit und ISO deine eigenen Fotos entstanden sind.",toolGo:"Geh selbst üben",tool2:"Willst du mit bewegten Motiven üben? Finde Orte für Wildtiere und Natur in PhotoByArno Scout.",

  a2d:"Fotografiere etwas, das sich schnell bewegt, etwa einen rennenden Hund, einen Radfahrer oder spritzendes Wasser, sodass es scharf und still wirkt. Ziel: Belichtungszeit 1/500 s oder kürzer.",
  a3:"Bewegung zeigen",
  a3d:"Zeige Bewegung als weiche Wischer, zum Beispiel fließendes Wasser oder vorbeifahrenden Verkehr. Ziel: Belichtungszeit 1/15 s oder länger. Nutze ein Stativ oder lehne dich irgendwo an.",

  a1bad:"Blende {v}: Damit bleibt viel scharf. Stell deine Kamera auf A oder Av (Blendenvorwahl) und wähle die kleinste Blendenzahl, zum Beispiel f/2.8 oder f/4.",

  a2bad:"Belichtungszeit {v}: zu lang, um Bewegung einzufrieren. Stell deine Kamera auf S oder Tv (Zeitvorwahl) und wähle 1/500 s oder kürzer. Zu dunkel? Erhöhe die ISO.",
  a3ok:"Belichtungszeit {v}: lang genug, um Bewegung als Wischer zu zeigen.",

  a3light:"Tagsüber zu hell mit langer Belichtungszeit? Ein ND-Filter wirkt wie eine Sonnenbrille für dein Objektiv.",

  expHi:"{p}% deines Fotos sind komplett weiß. Dieses Detail ist weg und später nicht mehr zu retten. Nächstes Mal etwas dunkler: kürzere Zeit, niedrigere ISO oder Belichtungskorrektur minus.",

  faNoExif:"Dieses Foto enthält keine Aufnahmedaten (EXIF), zum Beispiel weil es über WhatsApp oder soziale Medien verschickt wurde. Die Schärfe habe ich trotzdem geprüft.",
  hIntro:"Das Histogramm ist eine kleine Grafik, die genau zeigt, wie dein Foto belichtet ist — viel präziser als der Bildschirm deiner Kamera. Links stehen die dunklen Pixel, rechts die hellen, und die Höhe zeigt, wie viele Pixel diesen Ton haben.",
  hA:"Was du siehst",hAd:"Die horizontale Achse reicht von Schwarz (links) bis Weiß (rechts). Die Höhe der Kurve an einem Punkt zeigt, wie viele Pixel diesen Ton haben. Ein Peak links bedeutet viele dunkle Pixel, ein Peak rechts viele helle.",
  hB:"Clipping: verlorene Daten",hBd:"Stapeln sich Pixel direkt am Rand, ist das Clipping: reines Schwarz oder reines Weiß, ganz ohne Detail. Am schlimmsten ist es rechts: ausgebrannte Lichter sind für immer weg und lassen sich beim Bearbeiten nicht zurückholen. Dunkle Schatten lassen sich oft noch etwas aufhellen.",
  hC:"Keine feste 'richtige' Form",hCd:"Eine Schneeszene neigt von Natur aus nach rechts, ein Nachtfoto nach links — beides ist kein Fehler. Das Histogramm dient dazu, Clipping zu prüfen, nicht jedem Foto dieselbe Bergform aufzuzwingen.",
  hKey:"Warum dich der Bildschirm manchmal täuscht",hKeyd:"Bei hellem Sonnenlicht ist der Kamerabildschirm kaum zu beurteilen: Ein Foto kann gut aussehen und trotzdem ausgebrannte Lichter haben. Dem Histogramm macht das Umgebungslicht nichts aus — draußen besser der Grafik vertrauen als den Augen. Bei den meisten Systemkameras und Spiegelreflexkameras lässt sich ein Live-Histogramm direkt auf dem Display und im Sucher einblenden, sodass du es schon beim Komponieren prüfen kannst — schau in deinen Anzeige- oder Infoeinstellungen.",
  hTryLead:"Verschiebe den Belichtungsregler und beobachte, wie die Kurve mitwandert, bis sich Pixel am Rand stapeln — das ist Clipping.",
  hSceneLbl:"Szene",hScene1:"Normal",hScene2:"Schnee",hScene3:"Nebel",hEv:"Belichtung",
  hSceneTipSnow:"Schneefotos bekommen schnell einen Blaustich. Das liegt daran, dass die Kamera das helle Weiß oft zu dunkel belichtet — der Schnee wirkt dann gräulich — und daran, dass Schnee viel blaues Himmelslicht reflektiert. Kompensiere mit etwa +1 Stufe Belichtungskorrektur und stelle den Weißabgleich etwas wärmer ein (zum Beispiel 'bewölkt' statt 'auto'), oder fotografiere in RAW und korrigiere es später.",
  hSceneTipMist:"Eine Nebelszene hat von Natur aus wenig Kontrast: Fast alle Pixel liegen dicht beieinander in der Mitte des Histogramms, ohne tiefe Schwarz- oder helle Weißtöne. Das ist keine falsche Belichtung — Nebel ist einfach eine kontrastarme Szene. Für mehr Stimmung kannst du etwas dunkler belichten, sonst wirkt der Nebel schnell flach und grau.",
  hTours:["Richtig belichtet: Die Kurve verteilt sich über die Mitte, nirgends stapelt sich etwas an einem Rand.","Unterbelichtet: Die ganze Kurve verschiebt sich nach links. Nicht schön, aber diese Schattendetails lassen sich beim Bearbeiten oft noch zurückholen.","Überbelichtet: Pixel stapeln sich am rechten Rand. Das ist Clipping — das Detail ist für immer weg, auch beim Bearbeiten.","Eine Schneeszene, richtig belichtet: Das Histogramm neigt von Natur aus nach rechts. Kein Fehler, solange es nicht ganz an den Rand reicht.","Eine Nebelszene, richtig belichtet: Das Histogramm liegt schmal gebündelt in der Mitte — wenig Kontrast, und das ist so gewollt.","Noch weiter rein, und fast alles klippt. Im Zweifel ist leichtes Unterbelichten meist sicherer als Überbelichten."],
  hAsgLead:"Wähle ein Foto und schau dir sein Histogramm an. Du siehst sofort, ob Lichter oder Schatten verloren gegangen sind. Dein Foto bleibt auf deinem eigenen Gerät: Niemand sonst sieht es.",
  hQs:[{"q":"Was zeigt die horizontale Achse eines Histogramms?","o":["Schwarz (links) bis Weiß (rechts)","Scharf bis unscharf","Weit bis nah"],"a":0,"e":"Die dunklen Töne stehen links, die hellen rechts."},{"q":"Was bedeutet die Höhe der Kurve an einem Punkt?","o":["Wie viele Pixel diesen Ton haben","Wie scharf das Foto ist","Welche Blende benutzt wurde"],"a":0,"e":"Je höher die Kurve an einem Punkt, desto mehr Pixel haben diesen Ton."},{"q":"Pixel stapeln sich direkt am rechten Rand des Histogramms. Was bedeutet das?","o":["Ausgebrannte Lichter, Detail ist weg","Das Foto ist zu dunkel","Das Foto ist scharf"],"a":0,"e":"Das ist Clipping: reines Weiß, ganz ohne Detail."},{"q":"Lassen sich ausgebrannte Lichter später beim Bearbeiten zurückholen?","o":["Nein, diese Daten sind für immer weg","Ja, immer vollständig zurückzuholen","Nur bei RAW-Dateien, nie bei JPG"],"a":0,"e":"Einmal ausgebrannt gibt es keine Information mehr zum Zurückholen — auch nicht bei RAW."},{"q":"Ist ein Histogramm, das komplett nach links neigt, immer ein Fehler?","o":["Nein, das ist normal bei einer dunklen Szene wie Nacht","Ja, immer ein Fehler","Nur bei Porträts"],"a":0,"e":"Eine dunkle oder Nachtszene neigt von Natur aus nach links — das ist normal."},{"q":"Warum ist das Histogramm zuverlässiger als der Bildschirm deiner Kamera?","o":["Der Bildschirm ist bei hellem Licht schwer zu beurteilen","Der Bildschirm zeigt immer die falsche Farbe","Das Histogramm gibt es nur bei teuren Kameras"],"a":0,"e":"Draußen im Sonnenlicht ist der Bildschirm kaum lesbar; das Histogramm bleibt zuverlässig."},{"q":"Wie sieht das Histogramm einer Schneeszene meist aus, selbst bei korrekter Belichtung?","o":["Es neigt nach rechts, mit vielen hellen Pixeln","Es neigt nach links","Es steht genau in der Mitte"],"a":0,"e":"Schnee ist von Natur aus hell, daher neigt das Histogramm nach rechts — solange es nicht den Rand berührt, ist alles in Ordnung."},{"q":"Du schwankst zwischen leichtem Über- oder Unterbelichten. Was ist meist sicherer?","o":["Leicht unterbelichten","Leicht überbelichten","Egal"],"a":0,"e":"Schatten lassen sich oft noch aufhellen, ausgebrannte Lichter nie — im Zweifel also lieber etwas dunkler."}],

  faWhere:"Der grüne Rahmen zeigt, wo dein Foto am schärfsten ist. Liegt er auf deinem Motiv? Dann saß der Fokus richtig. Liegt er daneben, hat die Kamera dort scharfgestellt: Setz den Fokuspunkt nächstes Mal auf dein Motiv.",

  bIntro:"Die Brennweite in Millimetern bestimmt, wie viel von der Welt ins Bild passt. Eine kleine Zahl ist Weitwinkel: viel Raum im Bild. Eine große Zahl ist Tele: als würdest du hineinzoomen. Aber es passiert mehr, als nur Dinge näher zu holen.",

  cIntro:"Bildgestaltung bedeutet, wie du die Dinge in deinem Bildausschnitt anordnest. Dasselbe Motiv kann langweilig oder eindrucksvoll wirken, je nachdem, wo du es platzierst, welche Linien den Blick lenken und wie viel leeren Raum du lässt.",
  cWhyH:"Warum Bildgestaltung wichtig ist",cWhyP:"Ein technisch perfektes Foto (scharf, gut belichtet) kann trotzdem flach wirken, wenn die Bildgestaltung nicht stimmt. Diese Regeln sind keine starren Gesetze — sie sind Ausgangspunkte, die ein Foto meist ausgewogener und interessanter machen.",
  cStepH:"8 Regeln, Schritt für Schritt",cStepLead:"Gehe unten jede Regel durch. Die blauen Linien zeigen, worauf du achten solltest — versuche sie beim nächsten Mal selbst zu erkennen.",
  cT1:"Drittelregel",cD1:"Stell dir ein 3×3-Raster über deinem Bild vor. Dein Motiv auf einer der Linien zu platzieren — besonders dort, wo sich zwei Linien kreuzen — wirkt meist natürlicher als genau in der Mitte.",
  cT2:"Linien",cD2:"Straßen, Zäune, Ufer oder Baumreihen können den Blick direkt zu deinem Motiv führen. Suche Linien in der Szene und wähle den Ausschnitt so, dass sie nach innen weisen.",
  cT3:"Symmetrie",cD3:"Eine gespiegelte Szene — eine Spiegelung, ein gerader Weg, gleiche Formen auf beiden Seiten — wirkt ruhig und bewusst gestaltet. Zentriere sorgfältig; Symmetrie funktioniert nur, wenn sie wirklich gleichmäßig ist.",
  cT4:"Ebenen (Vorder-, Mittel- und Hintergrund)",cD4:"Etwas Nahes, etwas in der Mitte und etwas Fernes zusammen geben einem flachen Foto echte Tiefe. Tippe unten auf eine Ebene, um sie einzeln zu sehen, oder schau sie dir in 3D an.",
  cT5:"Bildfüllend fotografieren",cD5:"Geh näher ran. Wenn dein Motiv fast den ganzen Rahmen ausfüllt, verschwinden Ablenkungen und das Foto wirkt kraftvoll und nah.",
  cT6:"Negativraum",cD6:"Das Gegenteil vom Bildfüllen: Ein kleines Motiv, umgeben von viel leerem Himmel, Wasser oder Wand, kann ruhig oder einsam wirken — oder die Größenverhältnisse betonen.",
  cT7:"Diagonalen",cD7:"Eine Linie von Ecke zu Ecke wirkt dynamischer als eine gerade waagerechte oder senkrechte Linie. Kippe deinen Winkel oder suche eine Diagonale, die bereits in der Szene steckt.",
  cT8:"Rahmen im Rahmen",cD8:"Fotografiere durch einen Türrahmen, einen Bogen, überhängende Äste oder ein Fenster. Das rahmt dein Motiv natürlich ein und schafft einen interessanten Vordergrund.",
  cLayerPick:"Eine Ebene hervorheben:",cLayerAll:"Alle Ebenen",cLayerBg:"Hintergrund",cLayerMid:"Mittelgrund",cLayerFg:"Vordergrund",
  k3clLead:"Ziehe, um die Szene aus jedem Winkel zu betrachten. Nutze die Schaltflächen oben, um nur Vorder-, Mittel- oder Hintergrund hervorzuheben.",
  cMoreH:"Auch einen Versuch wert",cMoreLead:"Diese weiteren Gestaltungsideen lohnen sich ebenfalls zu kennen, auch ohne ausführliche Erklärung:",
  cMore:[{"t":"Muster","d":"Sich wiederholende Formen, Farben oder Texturen sind an sich schon ansprechend, und eine einzelne Unterbrechung im Muster zieht sofort den Blick an."},
   {"t":"Vordergrund","d":"Etwas Interessantes nah an der Kamera (Gras, Steine, Blumen) sorgt für Tiefe und zieht den Blick ins Bild, auch ohne vollständige Ebenen."},
   {"t":"Balance","d":"Ein starkes Motiv auf einer Seite kannst du mit etwas Kleinerem oder Leichterem auf der anderen Seite ausgleichen, statt sie leer zu lassen."},
   {"t":"Dreieckskomposition","d":"Drei interessante Punkte in einem Dreieck anzuordnen gibt einer Szene einen stabilen, angenehmen Aufbau."},
   {"t":"Goldener Schnitt","d":"Eine Variante der Drittelregel mit ungleich verteilten Linien, oft als Spirale dargestellt. Subtiler, gleiche Idee."},
   {"t":"Figur und Grund","d":"Achte darauf, dass sich dein Motiv klar vom Hintergrund abhebt — in Form, Farbe oder Schärfe."},
   {"t":"Strahlende Linien","d":"Linien, die von einem Punkt ausgehen, wie Sonnenstrahlen oder Äste, ziehen den Blick zur Mitte."},
   {"t":"Kreisförmige Komposition","d":"Im Kreis angeordnete Formen, oder ein rundes Motiv, halten den Blick im Bild, statt ihn abdriften zu lassen."},
   {"t":"Split Screen","d":"Das Bild in zwei klare Hälften zu teilen — Himmel und Meer, Licht und Schatten — kann eine starke grafische Wirkung haben."},
   {"t":"Zentrierte Komposition","d":"Die Drittelregel bewusst brechen: Ein mutiges, einfaches Motiv genau in der Mitte kann kraftvoll statt statisch wirken."},
   {"t":"Einzelne Drittel","d":"Manchmal zählt nur der Horizont (auf einem Drittel, nicht in der Mitte) oder ein einzelnes senkrechtes Drittel — du brauchst nicht immer das ganze Raster."}],
  cAsgLead:"Wähle, welche Regel du ausprobiert hast, lade dein Foto hoch, und wir zeichnen eine passende Hilfslinie darüber, damit du es selbst prüfen kannst.",
  cQs:[{"q":"Wo platziert die Drittelregel am liebsten dein Motiv?","o":["Genau in der Mitte","Auf einer Rasterlinie, besonders an einer Kreuzung","Immer in einer Ecke"],"a":1,"e":"Das Motiv auf einem Drittel zu platzieren, besonders an einer Kreuzung, wirkt meist natürlicher als Zentrieren."},
   {"q":"Was bewirken Linien in einem Foto?","o":["Sie machen das Foto symmetrisch","Sie lenken den Blick des Betrachters zum Motiv","Sie lassen den Hintergrund unscharf werden"],"a":1,"e":"Straßen, Zäune oder Ufer können den Blick direkt zu deinem Motiv ziehen."},
   {"q":"Ein Foto soll ruhig und bewusst wirken, mit gleichen Formen auf beiden Seiten. Welche Regel passt?","o":["Negativraum","Symmetrie","Diagonalen"],"a":1,"e":"Symmetrie funktioniert, wenn sich die beiden Hälften wirklich spiegeln."},
   {"q":"Was macht 'bildfüllend fotografieren' wirkungsvoll?","o":["Es fügt viel leeren Raum hinzu","Es entfernt Ablenkung, weil das Motiv fast den ganzen Rahmen füllt","Es funktioniert nur bei Landschaften"],"a":1,"e":"Näher herangehen und den Rahmen füllen hält die Aufmerksamkeit beim Motiv."},
   {"q":"Ein winziger Vogel in einem riesigen leeren Himmel ist ein Beispiel für welche Regel?","o":["Negativraum","Rahmen im Rahmen","Bildfüllend fotografieren"],"a":0,"e":"Viel leerer Raum um ein kleines Motiv ist Negativraum — das kann Größe oder Ruhe betonen."},
   {"q":"Welche Kombination gibt einem Foto echte Tiefe?","o":["Nur ein Hintergrund","Vorder-, Mittel- und Hintergrund zusammen","Nur ein bildfüllendes Motiv"],"a":1,"e":"Etwas Nahes, etwas in der Mitte und etwas Fernes zusammen lassen ein flaches Foto dreidimensional wirken."},
   {"q":"Durch einen Türrahmen oder überhängende Äste zu fotografieren ist ein Beispiel für…","o":["Rahmen im Rahmen","Strahlende Linien","Split Screen"],"a":0,"e":"Ein natürlicher Rahmen um dein Motiv schafft Vordergrund und zieht den Blick ins Bild."}]
},
es:{
  title:"PhotoByArno Academy – aprende fotografía con animaciones gratuitas",
  blkH:"Esta lección está en photobyarno.com",blkP:"La PhotoByArno Academy es gratuita, pero solo en su propia web. Allí encontrarás siempre la versión más reciente.",blkGo:"Ir a la Academy",copy:"© 2026 PhotoByArno. Todos los derechos reservados. Puedes mostrar las lecciones gratis en tus propias clases, directamente desde photobyarno.com y citando la fuente.",
  footer:"Gratis, sin cuenta. Se añaden nuevas lecciones con regularidad.",privacy:"Estadísticas de visitas anónimas, sin cookies.",
  homeTitle:"Aprende fotografía, paso a paso",
  homeLead:"Lecciones cortas con animaciones que controlas tú. Desliza, observa qué pasa y entiende por qué.",
  lessons:"Lecciones",available:"Empezar lección",soon:"Próximamente",back:"Todas las lecciones",
  k3load:"Cargando 3D…",k3fail:"Este navegador no admite 3D. El resto de la lección funciona con normalidad.",k3drag:"Arrastra para girar",k3front:"Frente",k3angle:"Inclinada",k3side:"Lateral",k3top:"Arriba",k3behind:"Tras la cámara",k3photo:"Foto",k3view3d:"Vista 3D",
  k3irisH:"Mira dentro de la cámara",k3irisLead:"El diafragma es un anillo de finas láminas metálicas. Desliza y verás cómo la abertura se hace más pequeña: llega menos luz al sensor, que se oscurece.",
  k3shutLead:"Justo delante del sensor hay dos cortinillas. La primera se abre y la segunda la sigue y vuelve a cerrar. Con una velocidad rápida solo recorre el sensor una rendija estrecha, pero cada línea del sensor recibe luz exactamente el mismo tiempo.",
  k3light:"Luz respecto a f/1.8",k3stops:"Pasos menos de luz",k3open:"Abertura a 50 mm",k3fire:"Disparar",k3slit:"Rendija abierta",k3slitAll:"Sensor completo",k3time:"Tiempo de exposición",k3slow:"Ralentizado",
  k3fLead:"El plano de color es donde enfoca la cámara. Verde: el perro está en ese plano y nítido. Rojo: el perro ha salido del plano.",
  k3dLead:"El bloque verde es todo lo que se ve nítido; el plano azul es donde enfocas. Cambia la apertura, la distancia o la focal y verás crecer o encoger el bloque.",
  k3bLead:"La forma azul es lo que ve la cámara. Cuanto más larga la focal, más estrecha. Con «Sujeto del mismo tamaño» la cámara retrocede: la persona mantiene su tamaño y la montaña parece acercarse.",
  k3bokH:"Por qué las luces toman una forma",k3bokLead:"Las pequeñas luces de un fondo desenfocado toman la forma de la abertura del diafragma (bokeh). Con el diafragma abierto son grandes y suaves. Al cerrarlo se hacen más pequeñas y con lados rectos: aquí de siete lados, porque este objetivo tiene 7 láminas.",
  l0:"Conoce tu cámara",
  l0d:"¿Cómo se llaman todos los botones y qué hay dentro?",
  cIntro:"Antes de empezar a ajustar: esta es tu cámara. Gírala, toca los números y mira también dentro, donde la luz encuentra su camino hasta el sensor. No tienes que recordarlo todo de golpe; siempre puedes volver aquí.",
  cOut:"Por fuera: los controles",
  cOutd:"Botones, diales y anillos con los que ajustas la cámara. El disparador, el dial de control y el dial de modos son los que más usarás.",
  cIn:"Por dentro: el camino de la luz",
  cInd:"La luz atraviesa las lentes, el diafragma y el obturador y llega al sensor. Una réflex tiene además un espejo en medio; esta cámara sin espejo, no.",
  cPh:"¿Y tu móvil?",
  cPhd:"Tiene las mismas piezas, pero diminutas: lentes, un sensor y un procesador. El diafragma suele ser fijo, el obturador es electrónico y el zoom se hace cambiando de lente (0,5×, 1×, 3×).",
  cKey:"Cómo sujetarla firme",
  cKeyd:"Mano derecha en la empuñadura, índice en el disparador. Apoya el objetivo por debajo en la palma izquierda y pega los codos al cuerpo. Así salen menos fotos movidas.",
  cTryLead:"Arrastra para girar la cámara. Toca un número o un nombre de la lista. Con «Por dentro» ves a través de la cámara.",
  cOutside:"Por fuera",
  cInside:"Por dentro",
  cPick:"Toca un número para ver cómo se llama esa pieza y para qué sirve. ¿No ves un número? Gira la cámara o elige Detrás o Arriba.",
  cPickIn:"Sigue la luz: por las lentes (A), el diafragma (B) y el obturador (C) hasta el sensor (D). Toca una letra para saber más.",
  cMore:"Más sobre esto en:",
  k3back:"Detrás",
  cGameStart:"Juego: señálalo",
  cGameStop:"Parar el juego",
  cGameAgain:"Jugar otra vez",
  cGameN:"Pregunta {i} de {n}",
  cGameQ:"¿Dónde está: {p}?",
  cGameHint:"Toca el punto correcto de la cámara. ¿No lo ves? Gira la cámara.",
  cGameOk:"¡Correcto!",
  cGameNo:"No exactamente. El punto verde es: {p}.",
  cNext:"Siguiente",
  cGameScore:"Ver tu resultado",
  cGameEnd:"Has acertado {s} de {n}.",
  cGameTop:"Conoces tu cámara. ¡Adelante con el triángulo de exposición!",
  cGameMid:"¡Bien! Repasa las piezas otra vez y vuelve a jugar.",
  cGameLow:"Tranquilo, esto es nuevo. Repasa las piezas con calma e inténtalo de nuevo.",
  cParts:{"shutter": ["Disparador", "Pulsado a medias: la cámara enfoca y mide la luz. Pulsado del todo: se hace la foto. Esa media pulsación vuelve a salir en la lección sobre modos de enfoque."], "dial": ["Dial de control", "Cambia el ajuste que corresponde al modo elegido, como la velocidad de obturación o el diafragma. Muchas cámaras tienen dos: uno delante y otro detrás."], "mode": ["Dial de modos", "Decide quién elige qué. AUTO: la cámara lo hace todo. P: la cámara elige y tú puedes corregir. A (o Av): tú eliges el diafragma. S (o Tv): tú eliges la velocidad. M: tú lo eliges todo."], "hotshoe": ["Zapata de flash", "Una ranura con contactos encima de la cámara. Aquí se coloca un flash externo, un micrófono o un disparador inalámbrico."], "evf": ["Visor", "Aquí acercas el ojo. En una cámara sin espejo es una pantallita que muestra exactamente cómo quedará la foto. Con la ruedecita de al lado (dioptrías) lo ajustas a tu vista."], "screen": ["Pantalla", "Muestra la imagen en directo, el menú y tus fotos. A menudo se puede inclinar y es táctil: práctico para fotos a ras de suelo o por encima de la cabeza."], "buttons": ["Botones y joystick", "Con el joystick mueves el punto de enfoque. Los botones de alrededor abren el menú, muestran tus fotos o las borran. La distribución cambia según la cámara, pero las funciones casi siempre son las mismas."], "lens": ["Objetivo", "El ojo de la cámara. En el borde hay dos números: la distancia focal (aquí 24-70 mm) y la mayor abertura de diafragma (aquí 1:2.8, es decir, f/2.8)."], "zoom": ["Anillo de zoom", "Gíralo para acercar o alejar: cambias la distancia focal. Un objetivo de focal fija no tiene anillo de zoom."], "focus": ["Anillo de enfoque", "Sirve para enfocar a mano (MF). Útil en primeros planos, estrellas o fotos a través de un cristal, donde el autoenfoque duda."], "release": ["Botón de liberación del objetivo", "Púlsalo y gira el objetivo para quitarlo. Cambia de objetivo con la cámara mirando hacia abajo: así entra menos polvo en el sensor."], "card": ["Tapa de la tarjeta", "Detrás de esta tapa está la ranura de la tarjeta de memoria (normalmente SD). Espera a que se apague la luz antes de sacar la tarjeta."], "tripod": ["Rosca para trípode", "Una rosca en la parte inferior para el trípode. Casi todas las cámaras y trípodes usan la misma medida (1/4 de pulgada)."], "lenses": ["Lentes", "Dentro del objetivo hay varias lentes de cristal en fila. Juntas desvían la luz para que llegue una imagen nítida al sensor. Al hacer zoom o enfocar, algunas se desplazan."], "iris": ["Diafragma", "Un anillo de láminas que forma una abertura mayor o menor. Agujero grande: más luz y un fondo más desenfocado. Agujero pequeño: menos luz y más nitidez de delante a atrás."], "shutterc": ["Obturador", "Dos cortinillas justo delante del sensor. Deciden cuánto tiempo llega la luz al sensor: la velocidad de obturación. Muchas cámaras y todos los móviles también pueden exponer de forma electrónica, sin cortinilla."], "sensor": ["Sensor", "El corazón de la cámara: un chip con millones de píxeles sensibles a la luz. ¿Ves que la imagen está al revés? Así entra la luz por las lentes; la cámara simplemente le da la vuelta. Un sensor grande (full frame) capta más luz que uno pequeño (APS-C o móvil)."], "proc": ["Procesador de imagen", "El pequeño ordenador de la cámara. Convierte los datos del sensor en un JPEG, reduce el ruido y calcula el autoenfoque. Si disparas en RAW, la cámara guarda los datos en bruto para que los edites tú después."], "battery": ["Batería", "Suele ir en la empuñadura. La pantalla y el visor gastan mucha energía: lleva una batería de repuesto para un día de fotos y mantenla caliente cuando haga frío."]},
  camQs:[{"q": "¿Qué pasa al pulsar el disparador a medias?", "o": ["La cámara enfoca y mide la luz", "Se hace la foto", "Se abre el menú"], "a": 0, "e": "Pulsar a medias es enfocar y medir. La foto solo se hace al pulsar del todo."}, {"q": "¿Dónde termina la luz?", "o": ["En el sensor", "En el visor", "En la tarjeta de memoria"], "a": 0, "e": "La luz atraviesa las lentes, el diafragma y el obturador y llega al sensor."}, {"q": "Tu objetivo dice 24-70 mm. ¿Qué significa?", "o": ["La distancia focal va de 24 a 70 mm", "El objetivo mide de 24 a 70 mm", "La mayor abertura"], "a": 0, "e": "Es la distancia focal: 24 mm es gran angular y 70 mm ya está algo acercado."}, {"q": "¿Con qué pieza eliges entre AUTO, P, A, S y M?", "o": ["Con el dial de modos", "Con el anillo de enfoque", "Con el anillo de zoom"], "a": 0, "e": "El dial de modos decide quién elige qué: tú o la cámara."}, {"q": "¿Cuál es la forma más segura de cambiar de objetivo?", "o": ["Con la cámara mirando hacia abajo", "Con la abertura hacia arriba, para ver bien lo que haces", "Da igual"], "a": 0, "e": "Con la abertura hacia abajo entra menos polvo en el sensor."}, {"q": "¿Qué hace el obturador?", "o": ["Decide cuánto tiempo llega la luz al sensor", "Decide el tamaño de la abertura", "Acerca y aleja"], "a": 0, "e": "El obturador controla la velocidad de obturación. El tamaño de la abertura es el diafragma."}, {"q": "¿Por qué la imagen en el sensor está al revés?", "o": ["Así desvían la luz las lentes; la cámara le da la vuelta", "El sensor está montado al revés", "Solo pasa en cámaras baratas"], "a": 0, "e": "Toda lente invierte la imagen, también la de tu ojo. Tu cerebro y tu cámara simplemente le dan la vuelta."}, {"q": "¿Para qué sirve la rosca de la parte inferior?", "o": ["Para un trípode", "Para un flash", "Para la tarjeta de memoria"], "a": 0, "e": "Ahí se enrosca la cámara al trípode. El flash va en la zapata de arriba."}, {"q": "¿Qué NO suele tener un móvil?", "o": ["Un diafragma ajustable", "Un sensor", "Una lente"], "a": 0, "e": "En la mayoría de los móviles el diafragma es fijo. Lentes y sensor tienen todos."}],
  l1:"El triángulo de exposición",l1d:"Apertura, velocidad de obturación e ISO: cómo definen juntos tu foto.",
  l2:"Profundidad de campo",l2d:"¿Qué determina cuánto de tu foto está nítido?",
  l3:"Distancia focal",l3d:"Gran angular o teleobjetivo: ¿qué le hace a tu imagen?",
  l4:"Leer el histograma",l4d:"Comprueba de un vistazo si tu foto está bien expuesta.",
  l5:"Balance de blancos",l5d:"Por qué a veces las fotos salen demasiado azules o naranjas.",
  l7:"Dirección de la luz",l7d:"Por qué la dirección de la luz hace o arruina tu foto.",
  l6:"Composición",l6d:"Regla de los tercios, líneas y espacio en el encuadre.",
  l8:"Medición de luz",l8d:"Cómo mide la luz tu cámara y cuándo tienes que corregirla.",
  l9:"Modos de disparo",l9d:"P, A, S y M: quién decide qué, y cuándo elegir cada modo.",
  l10:"Fotografía macro",l10d:"Fotografiar a muy corta distancia: distancia mínima de enfoque, aumento y profundidad de campo.",
  wIntro:"El balance de blancos hace que el blanco se vea realmente blanco, sea cual sea la luz. Sin corrección, una bombilla da un tono naranja y un cielo nublado un tono azulado.",
  wA:"La escala Kelvin",wAd:"La luz tiene una temperatura de color en Kelvin (K). Baja (2000-3500K) es cálida y naranja, como una vela o una bombilla. Alta (6500-10000K) es fría y azul, como un cielo nublado o la sombra.",
  wB:"El balance de blancos automático puede equivocarse",wBd:"El balance de blancos automático (AWB) adivina la luz a partir de toda la escena. Una escena dominada por un solo color, como una puesta de sol, puede confundir a la cámara.",
  wC:"Corregir en RAW frente a JPG",wCd:"En RAW puedes ajustar el balance de blancos después sin perder calidad. En JPG también puedes, pero una corrección grande arriesga perder algo de color.",
  wKey:"Elige una fijación cuando la luz cambia",wKeyd:"Para una serie de fotos en el mismo lugar, un balance de blancos fijo da colores más consistentes entre fotos que el automático, que puede variar ligeramente de una foto a otra.",
  wTryLead:"Elige la luz con la que se tomó la foto y desliza el ajuste de balance de blancos hasta que la escena se vea neutra.",
  wSceneLbl:"Fuente de luz en la foto",wScene1:"Luz de día",wScene2:"Bombilla",wScene3:"Nublado",
  wKelvinLbl:"Ajuste de balance de blancos",
  wOk:"Neutro — los colores son correctos.",
  wWarm:"Demasiado naranja: el ajuste está {v}K demasiado alto para esta luz.",
  wCool:"Demasiado azul: el ajuste está {v}K demasiado bajo para esta luz.",
  wTours:["Luz de día, balance de blancos a 5500K: neutro.","Luz artificial fotografiada con un balance de blancos de 5500K: demasiado naranja.","Luz artificial con el ajuste correcto de 2800K: neutro.","Nublado fotografiado con un balance de blancos de 2800K: demasiado azul.","Nublado con el ajuste correcto de 7500K: neutro."],
  wAsgLead:"Sube una foto y comprobaremos si tiene una dominante de color.",
  wCastOk:"No se encontró ninguna dominante de color notable.",
  wCastWarm:"Se encontró una ligera dominante naranja. El balance de blancos pudo estar demasiado bajo para esta luz.",
  wCastCool:"Se encontró una ligera dominante azul. El balance de blancos pudo estar demasiado alto para esta luz.",
  wQs:[
  {"q":"¿Qué suele dar la luz de una bombilla normal, sin corrección?","o":["Una dominante azul","Una dominante naranja","Ninguna dominante de color","Una dominante verde"],"a":1,"e":"La luz de bombilla tiene una temperatura de color baja (unos 2800K) y colorea las fotos de cálido/naranja sin corrección."},
  {"q":"¿Qué temperatura de color corresponde a un cielo nublado?","o":["Unos 2000K","Unos 3200K","Unos 5500K","Unos 7500K"],"a":3,"e":"La luz nublada es relativamente fría/azul, en torno a los 7500K."},
  {"q":"¿Qué puede hacer fallar al balance de blancos automático (AWB)?","o":["Una pantalla con pocos píxeles","Una escena dominada por un solo color","Una cámara sin sensor","Muy poco espacio de almacenamiento"],"a":1,"e":"Si una escena es mayoritariamente de un color, como una puesta de sol, la cámara puede interpretar mal la luz."},
  {"q":"¿Por qué es útil fijar el balance de blancos para una serie de fotos?","o":["Ahorra batería","Hace los archivos más pequeños","Da colores más consistentes entre las fotos","Mejora automáticamente la nitidez"],"a":2,"e":"El balance de blancos automático puede variar ligeramente entre fotos; un ajuste fijo mantiene los colores iguales."},
  {"q":"¿En qué formato de archivo puedes ajustar el balance de blancos después sin perder calidad?","o":["JPG","RAW","PNG","GIF"],"a":1,"e":"Los archivos RAW contienen los datos crudos del sensor, así que el balance de blancos se puede ajustar libremente después."},
  {"q":"Ajustas el balance de blancos a un valor Kelvin más alto que la luz real. ¿Qué pasa?","o":["La foto se vuelve más azul","La foto se vuelve más naranja/cálida","No cambia nada","La foto se vuelve en blanco y negro"],"a":1,"e":"Un valor Kelvin ajustado más alto que la fuente de luz real hace que la foto se vea más cálida/naranja."}
  ],
  liIntro:"La dirección de donde viene la luz determina la forma, las sombras y el ambiente de tu foto, a menudo más que la cantidad de luz.",
  liA:"Luz frontal, lateral y a contraluz",liAd:"La luz frontal muestra pocas sombras y aplana el sujeto. La luz lateral resalta forma y textura con sombras claras. El contraluz puede dar una silueta o un brillo dramático.",
  liB:"Luz dura frente a luz suave",liBd:"Una fuente de luz pequeña e intensa, como el sol del mediodía, da luz dura con bordes de sombra marcados. Una fuente grande y difusa, como un cielo nublado, da luz suave con transiciones suaves.",
  liC:"La hora dorada",liCd:"La hora después del amanecer y antes del atardecer da una luz baja y cálida con sombras largas y suaves, considerada por muchos fotógrafos la luz más bonita del día.",
  liKey:"Expón para el sujeto, no para el fondo",liKeyd:"A contraluz, tu cámara a menudo mide todo el fondo brillante y deja el sujeto demasiado oscuro. Usa compensación de exposición o medición puntual sobre el sujeto para evitarlo.",

  cA:"Apertura",cAd:"La abertura del objetivo. Parece al revés: cuanto menor es el número, mayor es la abertura. Es porque el número f es una fracción: f/2 significa una abertura de 1/2, f/16 solo 1/16. Media pizza es más que un dieciseisavo. Abertura grande (f/1.8) = mucha luz y fondo desenfocado. Abertura pequeña (f/16) = menos luz y todo nítido.",

  expDark:"La foto es bastante oscura en general. ¿A propósito? Bien. Si no, dale algo más de luz.",
  expBright:"La foto es bastante clara en general. ¿A propósito? Bien. Si no, dale algo menos de luz.",
  sharpNo:"No encuentro detalles realmente nítidos. Revisa el enfoque y mantén la cámara quieta.",
  sharpOk:"Tu foto tiene detalles nítidos.",
  encourage:"Cada foto es práctica. Inténtalo de nuevo con estos consejos y compara el resultado.",
  faNoExif:"Esta foto no tiene datos de disparo (EXIF), por ejemplo porque se envió por WhatsApp o redes sociales. La nitidez sí la he revisado.",
  hIntro:"El histograma es un pequeño gráfico que muestra exactamente cómo está expuesta tu foto, mucho más preciso que la pantalla de tu cámara. A la izquierda están los píxeles oscuros, a la derecha los claros, y la altura indica cuántos píxeles tienen ese tono.",
  hA:"Qué estás viendo",hAd:"El eje horizontal va del negro (izquierda) al blanco (derecha). La altura del gráfico en cada punto indica cuántos píxeles tienen ese tono. Un pico a la izquierda significa muchos píxeles oscuros, un pico a la derecha, muchos claros.",
  hB:"Clipping: datos perdidos",hBd:"Cuando los píxeles se amontonan justo contra el borde, eso es clipping: negro puro o blanco puro, sin ningún detalle. Es peor en el lado derecho: las luces quemadas se pierden para siempre y no se pueden recuperar al editar. Las sombras oscuras a menudo sí se pueden aclarar un poco.",
  hC:"No hay una forma 'correcta' única",hCd:"Una escena de nieve se inclina de forma natural hacia la derecha, una foto nocturna hacia la izquierda — ninguna de las dos es un error. El histograma sirve para comprobar el clipping, no para forzar la misma forma de montaña en cada foto.",
  hKey:"Por qué la pantalla a veces te engaña",hKeyd:"Con luz solar intensa, la pantalla de la cámara es difícil de juzgar: una foto puede verse bien y aun así tener luces quemadas. Al histograma no le afecta la luz ambiente — al aire libre, confía más en el gráfico que en tus ojos. En la mayoría de cámaras sin espejo y réflex puedes mostrar un histograma en vivo directamente en la pantalla trasera y en el visor, para comprobarlo mientras aún estás componiendo la toma — búscalo en los ajustes de pantalla o información.",
  hTryLead:"Mueve el control de exposición y observa cómo se desplaza el gráfico, hasta que los píxeles se amontonan contra el borde — eso es clipping.",
  hSceneLbl:"Escena",hScene1:"Normal",hScene2:"Nieve",hScene3:"Niebla",hEv:"Exposición",
  hSceneTipSnow:"Las fotos de nieve cogen enseguida un tono azulado. Eso pasa porque la cámara suele subexponer el blanco intenso, dejando la nieve grisácea, y porque la nieve refleja mucha luz azul del cielo. Compensa con aproximadamente +1 paso de compensación de exposición y calienta un poco el balance de blancos (por ejemplo 'nublado' en vez de 'auto'), o dispara en RAW y corrígelo después.",
  hSceneTipMist:"Una escena de niebla tiene de forma natural poco contraste: casi todos los píxeles se agrupan en el centro del histograma, sin negros profundos ni blancos brillantes. No es una exposición incorrecta — la niebla es simplemente una escena de bajo contraste. Si quieres más ambiente, expón un poco más oscuro, o la niebla puede verse plana y gris.",
  hTours:["Bien expuesta: el gráfico se reparte por el centro, no se amontona en ningún borde.","Subexpuesta: todo el gráfico se desplaza a la izquierda. No es bonito, pero ese detalle en las sombras suele poderse recuperar al editar.","Sobreexpuesta: los píxeles se amontonan contra el borde derecho. Eso es clipping: el detalle se pierde para siempre, incluso al editar.","Una escena de nieve, bien expuesta: el histograma se inclina de forma natural hacia la derecha. No es un error, mientras no toque el borde mismo.","Una escena de niebla, bien expuesta: el histograma queda estrecho y agrupado en el centro — poco contraste, y así debe ser.","Si subes aún más, casi todo se quema. En caso de duda, subexponer un poco suele ser más seguro que sobreexponer."],
  hAsgLead:"Elige una foto y mira su histograma. Verás enseguida si se han perdido luces o sombras. Tu foto se queda en tu propio dispositivo: nadie más la ve.",
  hQs:[{"q":"¿Qué muestra el eje horizontal de un histograma?","o":["Negro (izquierda) a blanco (derecha)","Nítido a borroso","Lejos a cerca"],"a":0,"e":"Los tonos oscuros están a la izquierda, los claros a la derecha."},{"q":"¿Qué significa la altura del gráfico en un punto?","o":["Cuántos píxeles tienen ese tono","Cuán nítida es la foto","Qué apertura se usó"],"a":0,"e":"Cuanto más alto el gráfico en un punto, más píxeles comparten ese tono."},{"q":"Los píxeles se amontonan justo contra el borde derecho del histograma. ¿Qué significa?","o":["Luces quemadas, el detalle se ha perdido","La foto está demasiado oscura","La foto está nítida"],"a":0,"e":"Eso es clipping: blanco puro, sin ningún detalle."},{"q":"¿Se pueden recuperar las luces quemadas al editar después?","o":["No, esos datos se pierden para siempre","Sí, siempre se recuperan por completo","Solo en archivos RAW, nunca en JPG"],"a":0,"e":"Una vez quemada, no queda información que recuperar, ni siquiera en RAW."},{"q":"¿Un histograma que se inclina totalmente a la izquierda es siempre un error?","o":["No, es normal en una escena oscura como la noche","Sí, siempre es un error","Solo en retratos"],"a":0,"e":"Una escena oscura o nocturna se inclina de forma natural hacia la izquierda — es normal."},{"q":"¿Por qué es el histograma más fiable que la pantalla de tu cámara?","o":["La pantalla es difícil de juzgar con luz intensa","La pantalla siempre muestra el color equivocado","El histograma solo existe en cámaras caras"],"a":0,"e":"Al aire libre bajo el sol la pantalla apenas se puede leer; el histograma sigue siendo fiable."},{"q":"¿Cómo suele verse el histograma de una escena de nieve, incluso bien expuesta?","o":["Se inclina a la derecha, con muchos píxeles claros","Se inclina a la izquierda","Queda justo en el centro"],"a":0,"e":"La nieve es naturalmente clara, así que el histograma se inclina a la derecha — mientras no toque el borde, no hay problema."},{"q":"Dudas entre sobreexponer o subexponer un poco. ¿Qué suele ser más seguro?","o":["Subexponer un poco","Sobreexponer un poco","Da igual"],"a":0,"e":"Las sombras a menudo se pueden aclarar, las luces quemadas nunca — así que, en caso de duda, mejor algo más oscuro."}],
  fa1:"Quieto y nítido",

  faWhere:"El marco verde muestra dónde está más nítida tu foto. ¿Está sobre tu sujeto? Entonces el enfoque fue correcto. ¿Está al lado? Entonces la cámara enfocó ahí: la próxima vez pon el punto de enfoque sobre tu sujeto.",

  dTours:["Punto de partida: f/2.8, enfocado en la caminante a 5 metros. Ella está nítida, la flor delante y los árboles detrás están suaves.", "Apertura a f/16: la zona nítida se vuelve mucho más profunda. Casi todo está nítido ahora.", "Apertura a f/1.4: solo la caminante está nítida, el resto se difumina.", "Enfoca la flor a 2 metros: ahora la flor está nítida y la caminante suave. Tú decides adónde va la atención.", "Zoom a 200 mm, enfocado a 5 metros: la zona nítida es finísima y el fondo se disuelve en una bruma suave.", "Abre a 24 mm con f/8, enfocado a 3 metros: nítido desde cerca hasta lejos. Ideal para paisajes.", "En resumen: número f pequeño, cerca y con zoom = poca profundidad de campo. Número f grande, más lejos y sin zoom = mucha profundidad de campo."],
  dQs:[{"q": "Quieres un paisaje nítido de delante a atrás. ¿Qué eliges?", "o": ["f/1.8 y zoom", "f/11 y focal corta", "f/4 y enfocar cerca"], "a": 1, "e": "Un número f grande y una focal corta dan mucha profundidad de campo."}, {"q": "En un retrato el fondo no está lo bastante desenfocado. ¿Qué ayuda más?", "o": ["Fondo más lejos y un número f pequeño", "ISO más alto", "Velocidad más rápida"], "a": 0, "e": "Un número f pequeño y más distancia entre sujeto y fondo suavizan el fondo."}, {"q": "Fotografías una flor muy de cerca y solo un borde está nítido. ¿Qué haces?", "o": ["Número f mayor, por ejemplo f/8", "Número f menor, por ejemplo f/1.8", "Velocidad más lenta"], "a": 0, "e": "De cerca la profundidad de campo es muy pequeña. Un número f mayor la hace más profunda."},
   {"q": "¿Qué combinación da la MENOR profundidad de campo?", "o": ["f/2, cerca y con zoom", "f/11, lejos y sin zoom", "f/8, lejos y sin zoom"], "a": 0, "e": "Un número f pequeño, poca distancia y el zoom hacen más fina la zona nítida."},
   {"q": "¿Por qué f/22 no siempre es la opción más nítida?", "o": ["Por la difracción toda la foto se vuelve algo más suave", "Porque la foto sale demasiado clara", "Porque el autoenfoque deja de funcionar"], "a": 0, "e": "Con una abertura muy pequeña la luz se dobla. Eso hace toda la foto algo menos nítida."},
   {"q": "¿Dónde está, más o menos, la apertura más nítida en muchos objetivos?", "o": ["Entre f/5.6 y f/8", "Siempre en el número f más pequeño", "Siempre en f/22"], "a": 0, "e": "La mayoría de objetivos son más nítidos dos o tres pasos por debajo de su máxima abertura."},

   {"q": "Alguien está contra una pared y la pared sale nítida. ¿Qué ayuda más?", "o": ["Poner a la persona unos metros delante de la pared", "Un ISO más alto", "Una velocidad más rápida"], "a": 0, "e": "Cuanto más lejos está el fondo detrás de tu sujeto, más desenfocado sale."},

  bIntro:"La distancia focal, en milímetros, decide cuánto del mundo cabe en tu encuadre. Un número pequeño es gran angular: mucho espacio en la imagen. Un número grande es teleobjetivo: como hacer zoom. Pero pasa algo más que solo acercar las cosas.",

  bAd:"A 24 mm ves un ángulo amplio de unos 84°, a 50 mm unos 47° y a 200 mm solo 12°. Cuanto mayor el número, más pequeño el trozo de mundo que captas.",
  bP:"Perspectiva",
  bPd:"Con un gran angular, lo cercano parece grande y el fondo lejano. Con un teleobjetivo, el fondo parece más cerca y más grande. Eso se llama compresión.",
  bU:"¿Qué usar y cuándo?",
  bUd:"Gran angular (14–35 mm): paisajes, arquitectura e interiores. Normal (unos 50 mm): más o menos como lo ve tu ojo. Retrato (85–135 mm): caras naturales. Teleobjetivo (200 mm o más): fauna, deporte y detalles lejanos.",
  bKey:"La perspectiva viene de tu distancia",
  bKeyd:"En realidad no es el objetivo el que crea la compresión, sino tu distancia al sujeto. Un teleobjetivo te hace alejarte, y desde ahí el fondo parece más grande. Pruébalo abajo con 'Sujeto del mismo tamaño'.",
  bKey2:"¿Móvil o sensor más pequeño?",
  bKey2d:"Los milímetros de esta lección son para una cámara de formato completo. En el móvil ves 0,5×, 1× o 3×; 1× suele equivaler a unos 24 a 28 mm. Si tu cámara tiene un sensor más pequeño (APS-C), un objetivo parece 1,5× más cerrado: 50 mm se siente como unos 75 mm.",

  bTours:["Mismo sitio, 24 mm: ves a la caminante, el camino, los árboles y la montaña. Mucho espacio en la imagen.", "50 mm: el encuadre se estrecha, más o menos como lo ve tu ojo.", "200 mm desde el mismo sitio: acercas a la caminante sin andar. Solo cabe la parte superior de su cuerpo.", "Ahora la caminante mantiene su tamaño. A 24 mm estás justo a su lado, y la montaña es un bultito a lo lejos.", "85 mm: has retrocedido para mantenerla del mismo tamaño. Mira cómo crece la montaña.", "200 mm, más de 40 metros atrás: la montaña parece justo detrás de ella. Eso es compresión, creada por tu distancia.", "En resumen: la focal decide cuánto ves, tu distancia decide la perspectiva."],
  bQs:[{"q": "¿Qué focal muestra más del entorno?", "o": ["14 mm", "50 mm", "200 mm"], "a": 0, "e": "Cuanto menor el número, más amplio el ángulo de visión."}, {"q": "¿Cómo se llama un objetivo de 200 mm?", "o": ["Teleobjetivo", "Gran angular", "Ojo de pez"], "a": 0, "e": "A partir de unos 85 mm se habla de teleobjetivo, y 200 mm lo es claramente."}, {"q": "Quieres una habitación entera o un paisaje amplio en el encuadre. ¿Qué eliges?", "o": ["Gran angular, 16 a 24 mm", "Teleobjetivo, 200 mm", "Retrato, 85 mm"], "a": 0, "e": "Un gran angular capta la parte más amplia del entorno."}, {"q": "¿Qué focal se usa a menudo para retratos?", "o": ["85 mm", "14 mm", "600 mm"], "a": 0, "e": "Hacia 85 mm estás a una distancia cómoda y las proporciones de la cara se mantienen naturales."}, {"q": "Fotografías a una caminante delante de una montaña y quieres la montaña grande detrás de ella. ¿Qué haces?", "o": ["Alejarte y hacer zoom", "Acercarte con un gran angular", "Subir el ISO"], "a": 0, "e": "Desde más lejos con teleobjetivo, el fondo parece más grande respecto a tu sujeto."}, {"q": "¿Qué causa en realidad la 'compresión'?", "o": ["La mayor distancia a tu sujeto", "El cristal de un teleobjetivo", "Un ISO más alto"], "a": 0, "e": "Un teleobjetivo te hace alejarte, y esa distancia cambia la perspectiva."}, {"q": "¿Por qué un gran angular puede agrandar la nariz en un retrato muy de cerca?", "o": ["Porque lo que está más cerca de la cámara parece mucho más grande", "Porque el gran angular cambia los colores", "Porque la velocidad es más lenta"], "a": 0, "e": "Muy de cerca, la nariz está mucho más cerca del objetivo que las orejas, así que parece más grande."}, {"q": "Tu móvil muestra 1×. ¿A qué focal equivale más o menos?", "o": ["24 a 28 mm", "85 mm", "200 mm"], "a": 0, "e": "La cámara principal de la mayoría de móviles es un gran angular suave."}, {"q": "¿Qué pasa con el ángulo de visión al pasar de 24 a 50 mm?", "o": ["Se reduce más o menos a la mitad", "Se hace más amplio", "Sigue igual"], "a": 0, "e": "De unos 84° a unos 47°: el doble de zoom es más o menos la mitad del ángulo."}, {"q": "Tu cámara tiene un sensor más pequeño (APS-C) y usas un objetivo de 50 mm. ¿Cómo se ve?", "o": ["Más o menos como 75 a 80 mm", "Más o menos como 25 mm", "Exactamente como 50 mm en formato completo"], "a": 0, "e": "Un sensor más pequeño recorta una parte menor de la imagen, como si hicieras 1,5× más zoom."}],

function pickLang(){
  try{const p=new URLSearchParams(location.search).get('lang');if(p&&LANGS.includes(p.toLowerCase()))return p.toLowerCase()}catch(e){}
  try{const s=localStorage.getItem('pba-lang');if(LANGS.includes(s))return s}catch(e){}
  const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(const l of list){const c=String(l).slice(0,2).toLowerCase();if(LANGS.includes(c))return c}
  return 'en';
}

/* Bezoekersstatistieken via GoatCounter (geen cookies, geen Google).
   Pas GC_CODE aan als je bij GoatCounter een andere code kiest. */
const GC_CODE='photobyarno';
const gcQueue=[];let gcReady=false;
function track(path,title,isEvent){
  if(!gcReady){gcQueue.push([path,title,isEvent]);return}
  try{if(window.goatcounter&&typeof window.goatcounter.count==='function')window.goatcounter.count({path:path,title:title||path,event:!!isEvent})}catch(e){}
}
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  window.goatcounter={no_onload:true,allow_frame:true};
  const gs=document.createElement('script');
  gs.async=true;gs.src='https://gc.zgo.at/count.js';
  gs.setAttribute('data-goatcounter','https://'+GC_CODE+'.goatcounter.com/count');
  gs.setAttribute('data-goatcounter-settings','{"no_onload":true,"allow_frame":true}');
  gs.onload=()=>{gcReady=true;gcQueue.splice(0).forEach(a=>track(a[0],a[1],a[2]))};
  document.head.appendChild(gs);
})();

  if(!pbaHostOk(location.hostname))return false;
  let top=true;try{top=window.self===window.top}catch(e){top=false}

function renderQuiz(box,key){
  const pool=t(key||'qs'),SHOW=5;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const qs=shuffle(pool.map((_,i)=>i)).slice(0,Math.min(SHOW,pool.length)).map(i=>{const q=pool[i];const order=shuffle(q.o.map((_,k)=>k));return{q:q.q,e:q.e,o:order.map(k=>q.o[k]),a:order.indexOf(q.a)}});
  let answered={};
  box.innerHTML=qs.map((q,n)=>`<div class="q" data-n="${n}"><h3>${n+1}. ${q.q}</h3>${q.o.map((o,k)=>`<label class="opt"><input type="radio" name="q${n}" value="${k}">${o}</label>`).join('')}

  <div class="btns" style="margin-top:10px"><button class="btn" id="newQs"><i class="ti ti-refresh" aria-hidden="true"></i>${t('newQs')}</button></div>`;
  box.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.check,el=box.querySelector(`.q[data-n="${n}"]`),sel=el.querySelector('input:checked'),err=el.querySelector('.err'),fb=el.querySelector('.fb');
    if(!sel){err.style.display='block';return}
    err.style.display='none';const ok=+sel.value===qs[n].a;answered[n]=ok;
    fb.className='fb '+(ok?'ok':'bad');fb.textContent=(ok?t('right'):t('wrong'))+' '+qs[n].e;
    const done=Object.keys(answered).length;
    if(done===qs.length){const sc=Object.values(answered).filter(Boolean).length;box.querySelector('#score').textContent=`${t('score')}: ${sc} / ${qs.length}`;
      if(!box.dataset.tracked){box.dataset.tracked='1';track((location.hash.slice(1)||'home')+'/quiz-done','Quiz done, score '+sc+'/'+qs.length,true)}}
    postHeight();
  });
  box.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{r.closest('.q').querySelector('.err').style.display='none'});
  box.querySelector('#newQs').onclick=()=>{delete box.dataset.tracked;renderQuiz(box,key);box.scrollIntoView({block:'start'});postToParent({pbaTop:true});postHeight()};
}

function parseExif(buf){
  try{
    const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-10){
      const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return readTiff(v,o+10);
      if(m===0xFFDA)return null;
      o+=2+len;
    }
  }catch(e){}
  return null;
}

    const n=u16(t+off);
    for(let i=0;i<n;i++){
      const e=t+off+2+i*12,tag=u16(e),type=u16(e+2),cnt=u32(e+4),vo=e+8,name=tags[tag];
      if(!name)continue;

/* ===== Compositie-les: getekende scenes i.p.v. foto's, zelfde stijl als scherptediepte-les ===== */
const CW=680,CH=420,CHZ=235;
function cScene(g){
  const sky=g.createLinearGradient(0,0,0,CHZ);sky.addColorStop(0,'#a9d4ee');sky.addColorStop(1,'#e9f3ee');
  g.fillStyle=sky;g.fillRect(0,0,CW,CHZ);
  g.fillStyle='#fff1b8';g.beginPath();g.arc(CW*0.84,CH*0.15,24,0,7);g.fill();
  g.fillStyle='#bcd9b0';g.beginPath();g.moveTo(0,CHZ);g.quadraticCurveTo(CW*0.24,CHZ-46,CW*0.54,CHZ-16);g.quadraticCurveTo(CW*0.8,CHZ-54,CW,CHZ-14);g.lineTo(CW,CHZ);g.closePath();g.fill();
  g.fillStyle='#8fbf6c';g.fillRect(0,CHZ,CW,CH-CHZ);
}
function cTree(g,x,y,s,col){g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#6b4a2e';g.fillRect(-4,-38,8,38);
  g.fillStyle=col||'#3f7d45';g.beginPath();g.arc(0,-52,25,0,7);g.fill();
  g.beginPath();g.arc(-15,-40,17,0,7);g.arc(16,-42,18,0,7);g.fill();g.restore()}
function cPerson(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#2d3e5c';g.fillRect(-9,-44,8,44);g.fillRect(2,-44,8,44);
  g.fillStyle='#d8432f';g.beginPath();g.moveTo(-13,-42);g.lineTo(13,-42);g.lineTo(11,-78);g.lineTo(-11,-78);g.fill();
  g.fillStyle='#f1c39b';g.beginPath();g.arc(0,-88,9,0,7);g.fill();
  g.fillStyle='#3a2a1e';g.beginPath();g.arc(0,-91,9,Math.PI,0);g.fill();g.restore()}
function cFlower(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);
  g.strokeStyle='#3b7d2a';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(0,-46);g.stroke();
  g.fillStyle='#4f9a3a';g.beginPath();g.ellipse(7,-18,9,3.5,-0.5,0,7);g.fill();
  g.fillStyle='#f2c230';for(let k=0;k<8;k++){const a=k/8*6.283;g.beginPath();g.ellipse(Math.cos(a)*7,-50+Math.sin(a)*7,6,3,a,0,7);g.fill()}
  g.fillStyle='#8a5a24';g.beginPath();g.arc(0,-50,4,0,7);g.fill();g.restore()}
function cBird(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle='#3a3a38';g.lineWidth=2;
  g.beginPath();g.moveTo(-9,0);g.quadraticCurveTo(-3,-6,0,0);g.quadraticCurveTo(3,-6,9,0);g.stroke();g.restore()}
function cDraw1(g){ /* derdenregel */
  cScene(g);cTree(g,CW*0.12,CHZ+150,1.6);cTree(g,CW*0.08,CHZ+150,1.1,'#2f6b3a');
  cPerson(g,CW*0.665,CHZ+140,2.1);
  g.strokeStyle='rgba(29,111,209,.75)';g.lineWidth=2;g.setLineDash([6,5]);
  [CW/3,CW*2/3].forEach(x=>{g.beginPath();g.moveTo(x,0);g.lineTo(x,CH);g.stroke()});
  [CH/3,CH*2/3].forEach(y=>{g.beginPath();g.moveTo(0,y);g.lineTo(CW,y);g.stroke()});
  g.setLineDash([]);
  g.fillStyle='rgba(29,111,209,.9)';g.beginPath();g.arc(CW*2/3,CH*2/3,7,0,7);g.fill();
}
function cDraw2(g){ /* lijnen (leading lines) */
  cScene(g);
  g.fillStyle='#d9c79a';g.beginPath();g.moveTo(CW*0.1,CH);g.lineTo(CW*0.9,CH);g.lineTo(CW*0.56,CHZ+8);g.lineTo(CW*0.48,CHZ+8);g.closePath();g.fill();
  cTree(g,CW*0.52,CHZ+32,0.55,'#2f6b3a');cTree(g,CW*0.57,CHZ+34,0.5);
  g.strokeStyle='rgba(29,111,209,.85)';g.lineWidth=2.5;
  g.beginPath();g.moveTo(CW*0.1,CH-4);g.lineTo(CW*0.515,CHZ+14);g.stroke();
  g.beginPath();g.moveTo(CW*0.9,CH-4);g.lineTo(CW*0.545,CHZ+14);g.stroke();
  for(let k=0.15;k<0.92;k+=0.18){const x=CW*0.1+(CW*0.515-CW*0.1)*k,y=(CH-4)+((CHZ+14)-(CH-4))*k,a=Math.atan2((CHZ+14)-(CH-4),(CW*0.515-CW*0.1));
    g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(-5,-5);g.lineTo(5,0);g.lineTo(-5,5);g.stroke();g.restore()}
}
function cDraw3(g){ /* symmetrie */
  cScene(g);
  g.save();g.translate(CW/2,CHZ+40);g.scale(0.55,0.75);g.fillStyle='rgba(169,212,238,.55)';g.fillRect(-CW/2,0,CW,185);g.restore();
  cTree(g,CW*0.3,CHZ+10,1.0);cTree(g,CW*0.7,CHZ+10,1.0);
  cTree(g,CW*0.3,CHZ+10+70,0.72,'#2f6b3a');cTree(g,CW*0.7,CHZ+10+70,0.72,'#2f6b3a');
  g.strokeStyle='rgba(29,111,209,.8)';g.lineWidth=2;g.setLineDash([6,5]);
  g.beginPath();g.moveTo(CW/2,0);g.lineTo(CW/2,CH);g.stroke();g.setLineDash([]);
}
function cDraw4(g,layer){ /* lagen */
  cScene(g);
  const dim=l=>layer&&layer!==l?0.28:1;
  g.globalAlpha=dim('bg');cTree(g,CW*0.18,CHZ+2,0.55,'#2f6b3a');cTree(g,CW*0.3,CHZ-4,0.42,'#2f6b3a');cTree(g,CW*0.86,CHZ,0.5,'#2f6b3a');g.globalAlpha=1;
  g.globalAlpha=dim('mid');cPerson(g,CW*0.52,CHZ+92,1.35);g.globalAlpha=1;
  g.globalAlpha=dim('fg');cFlower(g,CW*0.14,CH-18,1.9);cFlower(g,CW*0.22,CH-10,1.5);g.globalAlpha=1;
}
function cDraw5(g){ /* kader vullen */
  const sky=g.createLinearGradient(0,0,0,CH);sky.addColorStop(0,'#cfe6f3');sky.addColorStop(1,'#eef6ea');g.fillStyle=sky;g.fillRect(0,0,CW,CH);
  cFlower(g,CW*0.52,CH*0.95,6.4);
  g.strokeStyle='rgba(29,111,209,.8)';g.lineWidth=2;g.setLineDash([5,5]);g.strokeRect(14,14,CW-28,CH-28);g.setLineDash([]);
}
function cDraw6(g){ /* negatieve ruimte */
  cScene(g);cBird(g,CW*0.22,CHZ-60,2.2);
  g.strokeStyle='rgba(29,111,209,.75)';g.lineWidth=2;g.setLineDash([6,5]);
  g.strokeRect(CW*0.34,16,CW*0.62,CHZ-32);g.setLineDash([]);
}
function cDraw7(g){ /* diagonalen */
  cScene(g);
  g.fillStyle='#d9c79a';g.beginPath();g.moveTo(0,CH);g.lineTo(CW*0.42,CHZ+6);g.lineTo(CW*0.58,CHZ+6);g.lineTo(CW*0.22,CH);g.closePath();g.fill();
  cPerson(g,CW*0.3,CH-50,1.3);
  g.strokeStyle='rgba(29,111,209,.85)';g.lineWidth=2.5;g.beginPath();g.moveTo(0,CH);g.lineTo(CW,CHZ-40);g.stroke();
}
function cDraw8(g){ /* frame-in-frame */
  cScene(g);cTree(g,CW*0.62,CHZ+140,1.7);cPerson(g,CW*0.5,CHZ+130,1.4);
  g.fillStyle='rgba(28,22,16,.88)';
  g.beginPath();g.rect(0,0,CW,CH);
  g.moveTo(CW*0.16,CH*0.14);g.lineTo(CW*0.84,CH*0.14);g.lineTo(CW*0.84,CH*0.92);g.lineTo(CW*0.16,CH*0.92);g.closePath();
  g.fill('evenodd');
  g.strokeStyle='rgba(29,111,209,.9)';g.lineWidth=2.5;g.strokeRect(CW*0.16,CH*0.14,CW*0.68,CH*0.78);
}
const C_RULES=[
  {id:'thirds',draw:cDraw1,tk:'cT1',dk:'cD1'},
  {id:'lines',draw:cDraw2,tk:'cT2',dk:'cD2'},
  {id:'symmetry',draw:cDraw3,tk:'cT3',dk:'cD3'},
  {id:'layers',draw:g=>cDraw4(g,null),tk:'cT4',dk:'cD4'},
  {id:'fill',draw:cDraw5,tk:'cT5',dk:'cD5'},
  {id:'negative',draw:cDraw6,tk:'cT6',dk:'cD6'},
  {id:'diagonal',draw:cDraw7,tk:'cT7',dk:'cD7'},
  {id:'frame',draw:cDraw8,tk:'cT8',dk:'cD8'}
];
function buildLayers(get){return api=>{
  const s=api.scene;
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(22,26),k3mat(0x6f9a4a));ground.rotation.x=-Math.PI/2;ground.position.z=-9;s.add(ground);
  const bg=new THREE.Group();
  [[-3.2,-13,2.1,0x2f6b3a],[-1,-14.5,1.7,0x3f7d45],[4.6,-13.6,1.9,0x2f6b3a]].forEach(([x,z,r,c])=>{const tr=k3tree(2.4*r,r,c);tr.position.set(x,0,z);bg.add(tr)});
  s.add(bg);
  const mid=k3person(1.25,0x2d3e5c);mid.position.set(0.3,0,-5.4);s.add(mid);
  const fg=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.9,6),k3mat(0x3b7d2a));stem.position.set(-2.4,0.45,-1.1);fg.add(stem);
  const bloom=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),k3mat(0xf2c230));bloom.position.set(-2.4,0.95,-1.1);fg.add(bloom);
  s.add(fg);
  const mkPlane=(y,c)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(6,3.6),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));m.position.y=y;return m};
  const hl={bg:mkPlane(1.6,0x3fb950),mid:mkPlane(1.1,0x3fb950),fg:mkPlane(0.5,0x3fb950)};
  hl.bg.position.z=-13.5;hl.mid.position.z=-5.4;hl.fg.position.z=-1.1;
  Object.values(hl).forEach(p=>s.add(p));
  const groups={bg:bg,mid:mid,fg:fg};
  function setOpacity(grp,v){grp.traverse(o=>{if(!o.material)return;const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.transparent=true;m.opacity=v})})}
  return{update(){const st=get();
    ['bg','mid','fg'].forEach(k=>{
      const dim=!!(st.layer&&st.layer!==k);
      setOpacity(groups[k],dim?0.22:1);
      hl[k].material.opacity=st.layer===k?0.16:0;
    });
  }};
}}

    const gr=['#4f7a3f','#6c9850','#88b062','#3c6234','#a3c47a','#2e4f2a'];

    g.lineWidth=3;g.beginPath();g.moveTo(x-20,H*0.8);g.quadraticCurveTo(x-55,H*0.7,x-70,H*0.74);g.stroke();
    [[-26,-6,'#c9221c'],[24,-8,'#d42a22'],[-14,-28,'#e0362b'],[14,-30,'#e8402f'],[0,-4,'#b81c18']].forEach(([dx,dy,c])=>{g.fillStyle=c;g.beginPath();g.ellipse(x+dx,H*0.38+dy,30,26,dx/60,0,Math.PI*2);g.fill()});

    g.fillStyle='#1d1a16';g.beginPath();g.arc(x,H*0.37,11,0,Math.PI*2);g.fill();pbaMark(g,W,H)})(fgc.getContext('2d'));
  const spots=[];for(let i=0;i<22;i++)spots.push([rnd()*W,rnd()*H*0.7,.5+rnd()*.5]);

function renderCamera(){

  const st={mode:'out',sel:null,game:null,mark:{},onPick:id=>pick(id)};
  const zf=$('camv').clientWidth<500?0.8:1;/* op een telefoon iets dichterbij */
  const ctl=k3($('camv'),{build:buildCamera(st),views:K3_CAMV.map(v=>[v[0],v[1],v[2],v[3]*zf]),def:0,target:goal0,dist:7.5*zf,pmin:-1.2,lesson:'camera'});
  const vb=document.querySelectorAll('#camvV button');
  const view=(y,p,d,g)=>{if(!ctl.api)return;ctl.api.setView(y,p,d*zf);ctl.api.goal.set(g[0],g[1],g[2])};
  vb.forEach(b=>b.onclick=()=>{const v=K3_CAMV[+b.dataset.i];view(v[1],v[2],v[3],goal0);vb.forEach(x=>x.classList.toggle('on',x===b))});
  const offViews=()=>vb.forEach(x=>x.classList.remove('on'));
  const gameBtn=(ic,k)=>{$('camGame').innerHTML=`<i class="ti ${ic}" aria-hidden="true"></i>${t(k)}`};
  let usedP=false,usedI=false;
  function info(){
    if(st.game)return;const box=$('camInfo');box.className='caminfo';
    if(!st.sel){box.innerHTML=`<p>${t(st.mode==='in'?'cPickIn':'cPick')}</p>`;postHeight();return}
    const p=CAM_PARTS.find(q=>q.id===st.sel),tx=P[p.id];

    const L=$('camList');L.style.display=st.game?'none':'';

  }

    if(!usedP){usedP=true;track('camera/part','Camera part opened',true)}
  }

    const ids=CAM_PARTS.map(p=>p.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}

  }
  function ask(){
    const g=st.game,p=CAM_PARTS.find(q=>q.id===g.q[g.i]),m=p.inside?'in':'out';st.mark={};g.busy=false;
    setMode(m,st.mode===m);
    const box=$('camInfo');box.className='caminfo';
    box.innerHTML=`<p class="lbl">${t('cGameN').replace('{i}',g.i+1).replace('{n}',GN)}</p><h3>${t('cGameQ').replace('{p}',P[p.id][0])}</h3><p>${t('cGameHint')}</p>`;
    postHeight();
  }
  function answer(p){
    const g=st.game;if(g.busy)return;g.busy=true;
    const right=g.q[g.i],ok=p.id===right,rp=CAM_PARTS.find(q=>q.id===right);
    st.mark={};st.mark[right]='ok';if(ok)g.score++;else{st.mark[p.id]='no';focusPart(rp)}
    const last=g.i+1>=GN,box=$('camInfo');box.className='caminfo '+(ok?'ok':'no');
    box.innerHTML=`<h3>${ok?t('cGameOk'):t('cGameNo').replace('{p}',P[right][0])}</h3><p>${P[right][1]}</p><button class="btn primary" id="camNext">${t(last?'cGameScore':'cNext')}<i class="ti ti-arrow-right" aria-hidden="true"></i></button>`;
    $('camNext').onclick=()=>{g.i++;if(g.i>=GN)endGame();else ask()};
    postHeight();
  }
  function endGame(){
    const g=st.game;st.game=null;st.mark={};
    const box=$('camInfo');box.className='caminfo';
    box.innerHTML=`<h3>${t('cGameEnd').replace('{s}',g.score).replace('{n}',GN)}</h3><p>${t(g.score>=7?'cGameTop':g.score>=4?'cGameMid':'cGameLow')}</p>`;
    gameBtn('ti-refresh','cGameAgain');track('camera/game-end-'+g.score,'Camera game score '+g.score,true);list();postHeight();
  }
  function stopGame(){st.game=null;st.mark={};gameBtn('ti-target','cGameStart');list();info()}
  $('camGame').onclick=()=>{if(st.game)stopGame();else startGame()};
  gameBtn('ti-target','cGameStart');
  setMode('out',true);
}

const langBox=document.getElementById('langs');
langBox.innerHTML=LANGS.map(l=>`<button data-l="${l}" aria-label="${l.toUpperCase()}">${l.toUpperCase()}</button>`).join('');
function markLang(){langBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));document.documentElement.lang=lang}
langBox.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem('pba-lang',lang)}catch(e){}
  markLang();track('lang/'+lang+'/chosen','Language chosen: '+lang,true);route();
});
markLang();
track('lang/'+lang,'Language: '+lang,true);
window.addEventListener('hashchange',route);
try{new ResizeObserver(postHeight).observe(document.body)}catch(e){setInterval(postHeight,1000)}
window.addEventListener('load',postHeight);
route();
</script>
</body>

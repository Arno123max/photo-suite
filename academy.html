/1.8, f/2.8) = weinig scherptediepte en een zachte achtergrond.",dD:"Afstand tot je onderwerp",dDd:"Hoe dichterbij je scherpstelt, hoe dunner het scherpe gebied. Van heel dichtbij is soms maar een paar millimeter scherp.",dF:"Brandpuntsafstand",dFd:"Inzoomen (bijvoorbeeld 200 mm) geeft minder scherptediepte en een wazigere achtergrond dan uitzoomen (bijvoorbeeld 24 mm).",dKey:"De achtergrond telt mee",dKeyd:"Hoe verder de achtergrond achter je onderwerp ligt, hoe waziger hij wordt. Zet iemand dus niet tegen een muur, maar een paar meter ervoor.",dTryLead:"Schuif en kijk welke paaltjes scherp worden. De groene band laat zien waar de scherpte ligt.",dFocus:"Scherp op",dFL:"Brandpunt",dZone:"Toon scherpe zone",dRange:"Scherp van {a} tot {b}",dInf:"oneindig",dObjF:"Bloem",dObjP:"Wandelaar",dObjT:"Bomen",dTours:["Startpunt: f/2.8, scherpgesteld op de wandelaar op 5 meter. Zij is scherp, de bloem vooraan en de bomen achteraan zijn zacht.","Diafragma naar f/16: het scherpe gebied wordt veel dieper. Bijna alles is nu scherp.","Diafragma naar f/1.4: alleen de wandelaar is scherp, de rest smelt weg.","Scherpstellen op de bloem op 2 meter: nu is de bloem scherp en de wandelaar zacht. Jij kiest waar de aandacht heen gaat.","Inzoomen naar 200 mm, scherp op 5 meter: het scherpe gebied is flinterdun en de achtergrond verdwijnt in een zachte waas.","Uitzoomen naar 24 mm met f/8, scherp op 3 meter: scherp van dichtbij tot ver weg. Ideaal voor landschappen.","Samengevat: klein f-getal, dichtbij en ingezoomd = weinig scherptediepte. Groot f-getal, verder weg en uitgezoomd = veel scherptediepte."],dQs:[{q:"Je wilt een landschap van voor tot achter scherp. Wat kies je?",o:["f/1.8 en inzoomen","f/11 en uitzoomen","f/4 en dichtbij scherpstellen"],a:1,e:"Een groot f-getal en een korte brandpuntsafstand geven veel scherptediepte."},{q:"Bij een portret is de achtergrond niet wazig genoeg. Wat helpt het meest?",o:["Achtergrond verder weg en een klein f-getal","Hogere ISO","Kortere sluitertijd"],a:0,e:"Een klein f-getal en meer afstand tussen onderwerp en achtergrond maken de achtergrond zachter."},{q:"Je fotografeert een bloem van heel dichtbij en maar een randje is scherp. Wat doe je?",o:["Groter f-getal, bijvoorbeeld f/8","Kleiner f-getal, bijvoorbeeld f/1.8","Langere sluitertijd"],a:0,e:"Van dichtbij is de scherptediepte heel klein. Een groter f-getal maakt hem dieper."},{q:"Welke combinatie geeft de MINSTE scherptediepte?",o:["f/2, dichtbij en ingezoomd","f/11, ver weg en uitgezoomd","f/8, ver weg en uitgezoomd"],a:0,e:"Een klein f-getal, korte afstand en inzoomen maken het scherpe gebied allemaal dunner."},{q:"Waarom is f/22 niet altijd de scherpste keuze?",o:["Door diffractie wordt de hele foto iets zachter","Omdat de foto dan te licht wordt","Omdat de autofocus dan niet werkt"],a:0,e:"Bij een heel klein gaatje buigt het licht af. Daardoor wordt de hele foto iets minder scherp."},{q:"Waar ligt bij veel lenzen ongeveer de scherpste stand?",o:["Rond f/5.6 tot f/8","Altijd op het kleinste f-getal","Altijd op f/22"],a:0,e:"De meeste lenzen zijn het scherpst twee à drie stops onder hun grootste opening."},{q:"Je fotografeert een paddenstoel van dichtbij. Hoe krijg je hem helemaal scherp en de achtergrond toch zacht?",o:["f/5.6 tot f/8 en een paddenstoel met veel ruimte erachter","f/1.8 en zo dicht mogelijk erbovenop","f/22 met de achtergrond vlak erachter"],a:0,e:"Een middelgroot f-getal maakt de paddenstoel scherp. De afstand tot de achtergrond maakt die zacht."},{q:"Iemand staat tegen een muur en de muur blijft scherp. Wat helpt het meest?",o:["De persoon een paar meter voor de muur laten staan","Een hogere ISO","Een kortere sluitertijd"],a:0,e:"Hoe verder de achtergrond achter je onderwerp ligt, hoe waziger hij wordt."},{q:"Je verandert alleen de scherpstelafstand van 2 naar 10 meter. Wat gebeurt er met de scherptediepte?",o:["Die wordt groter","Die wordt kleiner","Die blijft gelijk"],a:0,e:"Hoe verder weg je scherpstelt, hoe dieper het scherpe gebied."},{q:"Wat doet inzoomen naar 200 mm met de achtergrond?",o:["Die wordt waziger","Die wordt scherper","Er verandert niets"],a:0,e:"Ingezoomd heb je minder scherptediepte, dus de achtergrond wordt zachter."}],da1:"Alles scherp",da1d:"Fotografeer een landschap of straat waarin alles van voor tot achter scherp moet zijn. Doel: f/8 tot f/11.",da2:"Alleen je onderwerp",da2d:"Fotografeer een persoon, dier of voorwerp met een zachte achtergrond. Doel: f/2.8 of lager, met je onderwerp een flink stuk voor de achtergrond.",da3:"Van dichtbij",da3d:"Fotografeer een bloem of klein voorwerp van zo dichtbij als je camera scherp kan stellen. Ontdek hoe dun het scherpe gebied dan wordt.",dMap:"De groene vakjes laten zien waar je foto scherp is. Zo zie je in één oogopslag hoe groot je scherptediepte was.",dShare:"{p}% van je foto is scherp.",d1apOk:"Diafragma {v}: mooi, dat geeft veel scherptediepte en je lens is hier op zijn scherpst.",d1apMid:"Diafragma {v}: redelijk. Voor meer scherpte van voor tot achter: probeer f/8 tot f/11.",d1apBad:"Diafragma {v}: daarmee blijft de scherptediepte klein. Kies f/8 tot f/11 met de A- of Av-stand.",d1fracOk:"Een groot deel van je foto is scherp, precies wat je wilde.",d1fracBad:"Nog maar een klein deel is scherp. Gebruik een groter f-getal, zoom iets uit en stel scherp op ongeveer een derde van je beeld, niet op de verte.",d1fl:"Brandpunt {v}: ingezoomd geeft minder scherptediepte. Zoom eens uit.",d1phone:"Telefoons hebben van nature veel scherptediepte, dus alles scherp lukt daarmee meestal makkelijk.",d2apOk:"Diafragma {v}: mooi open, dat geeft weinig scherptediepte.",d2apMid:"Diafragma {v}: al redelijk open. Kan je lens f/2.8 of lager? Probeer dat eens.",d2apBad:"Diafragma {v}: daarmee blijft veel scherp. Kies het laagste f-getal van je lens.",d2fracOk:"Maar een klein deel is scherp: je onderwerp springt eruit.",d2fracBad:"Een groot deel van je foto is scherp. Ga dichter bij je onderwerp staan, zet de achtergrond verder weg of zoom in.",d3fracOk:"Zo dichtbij is het scherpe gebied heel dun, en dat zie je goed in je foto.",d3thin:"Er is maar heel weinig scherp. Wil je meer van je onderwerp scherp? Kies f/8 of ga een klein stukje verder weg.",d3info:"Diafragma {v}: van heel dichtbij geeft zelfs f/8 nog weinig scherptediepte.",newQs:"Andere vragen",shareBtn:"Deel deze les",copied:"Link gekopieerd",copyFail:"Kopieer deze link:",useful:"Was deze les nuttig?",thanks:"Bedankt voor je reactie!",dSweet:"Groter getal is niet altijd scherper",dSweetd:"De meeste lenzen zijn het scherpst rond f/5.6 tot f/8. Bij f/16 en hoger wordt de hele foto iets zachter door diffractie: het licht buigt af langs het kleine gaatje. Wil je veel scherptediepte, dan is f/8 tot f/11 meestal de veilige keuze.",d1diff:"Diafragma {v}: veel scherptediepte, maar vanaf f/16 wordt de hele foto iets zachter door diffractie. Probeer eens f/8 of f/11 en vergelijk.",da4:"Paddenstoel",da4d:"Fotografeer een paddenstoel van dichtbij: de hele paddenstoel scherp, de achtergrond zacht. Ga op ooghoogte liggen, kies f/5.6 tot f/8 en zoek er een uit met veel ruimte erachter.",d4apOk:"Diafragma {v}: precies goed, zo kan de hele paddenstoel scherp worden.",d4apOpen:"Diafragma {v}: van zo dichtbij is het scherpe gebied dan flinterdun. Kies f/5.6 tot f/8, zodat hoed en steel allebei scherp worden.",d4apClosed:"Diafragma {v}: daarmee wordt de achtergrond ook scherper en de foto door diffractie iets zachter. Probeer f/8.",d4fracOk:"Je paddenstoel springt eruit: de achtergrond is zacht.",d4fracBad:"Een groot deel van je foto is scherp, dus de achtergrond leidt af. Kies een paddenstoel met meer ruimte erachter, of ga iets verder weg en zoom in.",d4slow:"Sluitertijd {v}: vrij lang. Gebruik een statief, een boonzak of je tas op de grond, de paddenstoel loopt toch niet weg. Wacht ook tot de wind even stilvalt.",d4phone:"Gebruik de macro- of portretmodus van je telefoon en houd hem op ooghoogte van de paddenstoel.",bIntro:"De brandpuntsafstand, in millimeters, bepaalt hoeveel van de wereld je in beeld krijgt. Een klein getal is groothoek: veel ruimte in beeld. Een groot getal is tele: alsof je inzoomt. Maar er gebeurt meer dan alleen dichterbij halen.",bA:"Kijkhoek",bAd:"Bij 24 mm zie je een brede hoek van ongeveer 84°, bij 50 mm ongeveer 47° en bij 200 mm nog maar 12°. Hoe groter het getal, hoe kleiner het stukje wereld dat je vastlegt.",bP:"Perspectief",bPd:"Met een groothoek lijkt wat dichtbij is groot en de achtergrond ver weg. Met een tele lijkt de achtergrond juist dichterbij en groter. Dat heet compressie.",bU:"Waarvoor gebruik je wat?",bUd:"Groothoek (14–35 mm): landschap, architectuur en binnenruimtes. Standaard (rond 50 mm): ongeveer zoals je oog het ziet. Portret (85–135 mm): natuurlijke gezichten. Tele (200 mm en meer): wildlife, sport en details van ver.",bKey:"Perspectief komt door jouw afstand",bKeyd:"Eigenlijk maakt niet de lens de compressie, maar je afstand tot het onderwerp. Een telelens laat je verder weg staan, en vanaf daar lijkt de achtergrond groter. Probeer het zelf met 'Onderwerp even groot' hieronder.",bKey2:"Telefoon of kleinere sensor?",bKey2d:"De millimeters in deze les gelden voor een full-frame camera. Op je telefoon zie je 0.5×, 1× of 3×; 1× komt meestal overeen met ongeveer 24 tot 28 mm. Heeft je camera een kleinere sensor (APS-C), dan werkt een lens ongeveer 1,5× zo ingezoomd: 50 mm voelt dan als zo'n 75 mm.",bTryLead:"Kies wat je wilt zien en schuif met het brandpunt. Rechtsboven zie je van bovenaf waar de camera staat en hoe breed hij kijkt.",bModeLbl:"Wat wil je zien?",bMode1:"Zelfde plek",bMode2:"Onderwerp even groot",bFL:"Brandpunt",bAngle:"kijkhoek",bDist:"afstand tot wandelaar",bWalker:"Wandelaar",bMtn:"Berg",bTours:["Zelfde plek, 24 mm: je ziet de wandelaar, het pad, de bomen en de berg. Veel ruimte in beeld.","50 mm: het beeld wordt smaller, ongeveer zoals je oog het ziet.","200 mm vanaf dezelfde plek: je haalt de wandelaar dichtbij zonder te lopen. Alleen haar bovenlichaam past nog in beeld.","Nu blijft de wandelaar even groot. Met 24 mm sta je vlak bij haar, en de berg is een klein bultje in de verte.","85 mm: je bent naar achteren gelopen om haar even groot te houden. Kijk hoe de berg groeit.","200 mm, ruim 40 meter terug: de berg lijkt vlak achter haar te staan. Dat is compressie, gemaakt door jouw afstand.","Kort samengevat: het brandpunt bepaalt hoeveel je ziet, je afstand bepaalt het perspectief."],bQs:[{q:"Welke brandpuntsafstand laat het meeste van de omgeving zien?",o:["14 mm","50 mm","200 mm"],a:0,e:"Hoe kleiner het getal, hoe breder de kijkhoek."},{q:"Hoe noem je een lens van 200 mm?",o:["Tele","Groothoek","Fisheye"],a:0,e:"Vanaf ongeveer 85 mm spreek je van tele, en 200 mm is duidelijk tele."},{q:"Je wilt een hele kamer of een breed landschap in beeld. Wat kies je?",o:["Groothoek, 16 tot 24 mm","Tele, 200 mm","Portret, 85 mm"],a:0,e:"Een groothoek legt het breedste stuk van de omgeving vast."},{q:"Welk brandpunt wordt vaak gebruikt voor portretten?",o:["85 mm","14 mm","600 mm"],a:0,e:"Rond 85 mm sta je op een prettige afstand en blijven de verhoudingen van een gezicht natuurlijk."},{q:"Je fotografeert een wandelaar voor een berg en wilt de berg groot achter haar. Wat doe je?",o:["Verder weg gaan staan en inzoomen","Dichtbij gaan staan met een groothoek","De ISO verhogen"],a:0,e:"Van verder weg met tele lijkt de achtergrond groter ten opzichte van je onderwerp."},{q:"Wat veroorzaakt eigenlijk 'compressie'?",o:["De grotere afstand tot je onderwerp","Het glas in een telelens","Een hogere ISO"],a:0,e:"Een telelens laat je verder weg staan, en die afstand verandert het perspectief."},{q:"Waarom kan een groothoek bij een portret van heel dichtbij een neus groot maken?",o:["Omdat wat dichter bij de camera is veel groter lijkt","Omdat een groothoek de kleuren verandert","Omdat de sluitertijd langer is"],a:0,e:"Van heel dichtbij is de neus relatief veel dichter bij de lens dan de oren, dus lijkt hij groter."},{q:"Je telefoon toont 1×. Met welk brandpunt komt dat ongeveer overeen?",o:["24 tot 28 mm","85 mm","200 mm"],a:0,e:"De hoofdcamera van de meeste telefoons is een lichte groothoek."},{q:"Wat gebeurt er met de kijkhoek als je van 24 naar 50 mm gaat?",o:["Die wordt ongeveer half zo groot","Die wordt groter","Die blijft gelijk"],a:0,e:"Van ongeveer 84° naar ongeveer 47°: twee keer zo ingezoomd is ongeveer de helft van de hoek."},{q:"Je camera heeft een kleinere sensor (APS-C) en je gebruikt een 50 mm-lens. Hoe ziet dat eruit?",o:["Ongeveer als 75 tot 80 mm","Ongeveer als 25 mm","Precies als 50 mm op full frame"],a:0,e:"Een kleinere sensor knipt een kleiner stuk uit het beeld, alsof je ongeveer 1,5× verder inzoomt."}],ba1:"Breed",ba1d:"Fotografeer een landschap, straat of ruimte met een groothoek: 24 mm of korter. Op een telefoon: de 0.5×- of 1×-camera. Zet iets interessants in de voorgrond.",ba2:"Ingezoomd detail",ba2d:"Haal met inzoomen een detail uit een groter tafereel: een raam, een vogel of een boom op afstand. Doel: 85 mm of meer. Op een telefoon: de 2×- of 3×-camera.",ba3:"Compressie",ba3d:"Maak twee foto's van hetzelfde onderwerp met iets ver erachter, zoals een toren of heuvel: één van dichtbij met groothoek, één van ver weg met tele. Houd je onderwerp op beide foto's even groot. Kies daarna de foto's één voor één.",b1ok:"Brandpunt {v}: echt groothoek, je krijgt veel ruimte in beeld.",b1mid:"Brandpunt {v}: bijna groothoek. Zoom nog iets verder uit, naar 24 mm of korter.",b1bad:"Brandpunt {v}: dat is al ingezoomd. Draai je zoomring naar het kleinste getal.",b1fg:"Groothoektip: iets in de voorgrond, zoals een steen, bloem of hek, geeft je foto diepte.",b1phone:"Gebruik op je telefoon de 0.5×-camera voor extra breed beeld.",b2ok:"Brandpunt {v}: mooi ingezoomd, je haalt het detail dichtbij.",b2mid:"Brandpunt {v}: een beetje ingezoomd. Voor echt detail: 85 mm of meer.",b2bad:"Brandpunt {v}: dat is nog breed. Zoom in naar 85 mm of meer.",b2phone:"Gebruik de 2×- of 3×-camera van je telefoon. Verder inzoomen dan dat is digitaal en kost scherpte.",b3first:"Foto 1 staat klaar ({v}). Kies nu je tweede foto, met een heel ander brandpunt.",b3ok:"Foto 1: {a}, foto 2: {b}. Een groot verschil, dus je ziet de compressie goed. Kijk hoe groot de achtergrond is ten opzichte van je onderwerp.",b3small:"Foto 1: {a}, foto 2: {b}. Het verschil is klein. Kies brandpunten verder uit elkaar, bijvoorbeeld 24 en 135 mm, en houd je onderwerp op beide foto's ongeveer even groot.",b3reset:"Opnieuw beginnen",b3photo:"Foto",bNoFl:"Deze foto bevat geen brandpuntsafstand. Gebruik het originele bestand, dan kan ik je brandpunt beoordelen.",bCrop:"Je camera gaf geen kleinbeeld-equivalent door. Heeft je camera een kleinere sensor (APS-C), dan is het effect ongeveer 1,5× zo ingezoomd als het getal doet denken.",toolF:"Op zoek naar een plek met een weids uitzicht om groothoek en tele te vergelijken? Vind uitzichtpunten in PhotoByArno Scout.",tryIt:"Probeer het zelf",tryLead:"Tik op Rondleiding voor een tour, of schuif zelf. Elke stap op een schuifje is één stop.",dark:"Te donker",good:"Goed",light:"Te licht",aperture:"Diafragma",shutter:"Sluitertijd",iso:"ISO",hA:"Kleiner getal = grotere opening = meer licht, wazigere achtergrond",hS:"Langer = meer licht, bewegingsonscherpte",hI:"Hoger = lichter, maar meer ruis",tour:"Rondleiding",stop:"Stop",reset:"Reset",more:"te veel licht",less:"te weinig licht",correct:"Correct belicht",stop1:"stop",stopN:"stops",over:"overbelicht",under:"onderbelicht",tours:["Startpunt: f/5.6, 1/125 s, ISO 100. Goed belicht, achtergrond redelijk scherp.","Diafragma open naar f/1.8: drie stops meer licht. Mooie wazige achtergrond, maar veel te licht.","Compenseer met een snellere sluiter, 1/1000 s. Weer goed belicht, fietser bevroren, achtergrond blijft zacht.","Nu f/16 voor alles scherp: zes stops minder licht. Veel te donker.","ISO naar 6400 maakt het weer licht, maar kijk naar de ruis.","Alternatief: ISO terug, sluiter naar 1/15 s. Geen ruis, wel een vegende fietser. Elke keuze kost iets.","Dat is de driehoek: wat je bij de een wint, lever je bij de ander in."],quiz:"Test jezelf",check:"Controleer",pick:"Kies eerst een antwoord",right:"Goed!",wrong:"Niet helemaal.",score:"Score",qs:[{q:"Je wilt een wazige achtergrond bij een portret. Wat verander je?",o:["Diafragma naar f/16","Diafragma naar f/1.8","ISO naar 6400"],a:1,e:"Een klein f-getal geeft een kleine scherptediepte."},{q:"Je foto van een rennende hond is onscherp door beweging. Wat helpt?",o:["Langere sluitertijd","Kortere sluitertijd","Groter f-getal"],a:1,e:"Een korte sluitertijd bevriest beweging."},{q:"Je gaat van f/4 naar f/8, twee stops minder licht. Hoe houd je dezelfde belichting zonder de sluitertijd te veranderen?",o:["ISO 400 naar 1600","ISO 400 naar 800","ISO 400 naar 100"],a:0,e:"Twee stops is twee keer verdubbelen: 400, 800, 1600."},{q:"Je foto is te donker en je wilt sluitertijd en diafragma niet veranderen. Wat doe je?",o:["ISO verhogen","ISO verlagen","Flitser uitzetten"],a:0,e:"Een hogere ISO maakt je foto lichter, met wat meer ruis als bijwerking."},{q:"Wat is de bijwerking van een hoge ISO?",o:["Meer ruis","Een wazige achtergrond","Bewegingsonscherpte"],a:0,e:"Hoe hoger de ISO, hoe meer korrel of ruis je in je foto ziet."},{q:"Hoeveel licht krijg je erbij als je het diafragma één stop opent?",o:["Twee keer zoveel","Tien procent meer","Vier keer zoveel"],a:0,e:"Eén stop is altijd een verdubbeling of halvering van het licht."},{q:"Welke sluitertijd laat meer licht binnen?",o:["1/60 s","1/500 s","Allebei evenveel"],a:0,e:"1/60 s staat langer open dan 1/500 s, dus er komt meer licht binnen."},{q:"Welk diafragma laat het meeste licht door?",o:["f/16","f/8","f/2"],a:2,e:"Kleiner getal = grotere opening = meer licht."},{q:"Je wilt stromend water zacht en vloeiend vastleggen. Welke sluitertijd past het best?",o:["1/1000 s","1/2 s","1/250 s"],a:1,e:"Een lange sluitertijd laat beweging zien als zachte vegen."},{q:"Je gaat van 1/250 s naar 1/500 s. Hoe houd je dezelfde helderheid zonder de ISO te veranderen?",o:["Diafragma één stop opener, bijvoorbeeld van f/8 naar f/5.6","Diafragma één stop dichter, van f/8 naar f/11","Niets, het blijft gelijk"],a:0,e:"1/500 s geeft één stop minder licht. Dat maak je goed met één stop opener diafragma."}]},de:{title:"PhotoByArno Academy – Fotografie lernen mit kostenlosen Animationen",blkH:"Diese Lektion findest du auf photobyarno.com",blkP:"Die PhotoByArno Academy ist kostenlos, aber nur auf der eigenen Website. Dort findest du auch immer die neueste Version.",blkGo:"Zur Academy",copy:"© 2026 PhotoByArno. Alle Rechte vorbehalten. Du darfst die Lektionen kostenlos in deinem eigenen Unterricht zeigen, direkt von photobyarno.com und mit Quellenangabe.",footer:"Kostenlos, kein Konto nötig. Neue Lektionen kommen regelmäßig dazu.",privacy:"Anonyme Besucherstatistik, ohne Cookies.",homeTitle:"Fotografie lernen, Schritt für Schritt",homeLead:"Kurze Lektionen mit Animationen, die du selbst steuerst. Schieben, beobachten und verstehen, warum.",lessons:"Lektionen",available:"Lektion starten",soon:"Demnächst",back:"Alle Lektionen",k3load:"3D wird geladen…",k3fail:"3D wird in diesem Browser nicht unterstützt. Der Rest der Lektion funktioniert normal.",k3drag:"Zum Drehen ziehen",k3front:"Vorne",k3angle:"Schräg",k3side:"Seite",k3top:"Oben",k3behind:"Hinter der Kamera",k3photo:"Foto",k3view3d:"3D-Ansicht",k3irisH:"Ein Blick in die Kamera",k3irisLead:"Die Blende ist ein Ring aus dünnen Metalllamellen. Schiebe den Regler und sieh, wie die Öffnung kleiner wird: Es fällt weniger Licht auf den Sensor, der dadurch dunkler wird.",k3shutLead:"Direkt vor dem Sensor sitzen zwei Vorhänge. Der erste öffnet sich, der zweite folgt und schließt wieder. Bei kurzer Belichtungszeit wandert nur ein schmaler Schlitz über den Sensor, aber jede Zeile des Sensors bekommt genau gleich lange Licht.",k3light:"Licht im Vergleich zu f/1.8",k3stops:"Stufen weniger Licht",k3open:"Öffnung bei 50 mm",k3fire:"Auslösen",k3slit:"Offener Schlitz",k3slitAll:"Ganzer Sensor",k3time:"Belichtungszeit",k3slow:"Verlangsamt",k3fLead:"Die farbige Fläche zeigt, worauf die Kamera scharfstellt. Grün: Der Hund ist in dieser Ebene und scharf. Rot: Der Hund hat die Ebene verlassen.",k3dLead:"Der grüne Block ist alles, was scharf wirkt, die blaue Fläche ist die Schärfeebene. Ändere Blende, Entfernung oder Brennweite und sieh, wie der Block wächst oder schrumpft.",k3bLead:"Die blaue Form zeigt, was die Kamera sieht. Je länger die Brennweite, desto schmaler. Bei „Motiv gleich groß“ geht die Kamera zurück: Die Person bleibt gleich groß, und der Berg scheint näher zu kommen.",k3bokH:"Warum Lichtpunkte eine Form bekommen",k3bokLead:"Kleine Lichter im unscharfen Hintergrund nehmen die Form der Blendenöffnung an (Bokeh). Bei offener Blende sind sie groß und weich. Blendest du ab, werden sie kleiner und eckig: hier siebeneckig, weil dieses Objektiv 7 Lamellen hat.",l0:"Deine Kamera kennenlernen",l0d:"Wie heißen all die Tasten, und was steckt im Inneren?",cIntro:"Bevor du etwas einstellst: Das ist deine Kamera. Dreh sie herum, tippe auf die Nummern und schau auch hinein, wo das Licht seinen Weg zum Sensor findet. Du musst dir nicht alles auf einmal merken; du kannst jederzeit hierher zurückkommen.",cOut:"Außen: die Bedienung",cOutd:"Tasten, Räder und Ringe, mit denen du die Kamera einstellst. Auslöser, Einstellrad und Moduswahlrad brauchst du am häufigsten.",cIn:"Innen: der Weg des Lichts",cInd:"Das Licht geht durch die Linsen, die Blende und den Verschluss und fällt dann auf den Sensor. Bei einer Spiegelreflexkamera sitzt dazwischen noch ein Spiegel, bei dieser spiegellosen Kamera nicht.",cPh:"Und dein Handy?",cPhd:"Es hat dieselben Teile, nur winzig klein: Linsen, einen Sensor und einen Prozessor. Die Blende ist meist fest, der Verschluss elektronisch, und gezoomt wird durch Wechseln zwischen den Objektiven (0,5×, 1×, 3×).",cKey:"So hältst du sie ruhig",cKeyd:"Rechte Hand um den Griff, Zeigefinger auf den Auslöser. Leg das Objektiv von unten in die linke Hand und halte die Ellbogen am Körper. So werden weniger Fotos verwackelt.",cTryLead:"Ziehe, um die Kamera zu drehen. Tippe auf eine Nummer oder einen Namen in der Liste. Mit „Innen“ schaust du durch die Kamera hindurch.",cOutside:"Außen",cInside:"Innen",cPick:"Tippe auf eine Nummer, um zu sehen, wie das Teil heißt und was es macht. Du siehst eine Nummer nicht? Dreh die Kamera oder wähle Hinten oder Oben.",cPickIn:"Folge dem Licht: durch die Linsen (A), die Blende (B) und den Verschluss (C) zum Sensor (D). Tippe auf einen Buchstaben für mehr Infos.",cMore:"Mehr dazu in:",k3back:"Hinten",cGameStart:"Spiel: Zeig drauf",cGameStop:"Spiel beenden",cGameAgain:"Noch einmal spielen",cGameN:"Frage {i} von {n}",cGameQ:"Wo ist: {p}?",cGameHint:"Tippe auf den richtigen Punkt an der Kamera. Du siehst ihn nicht? Dreh die Kamera.",cGameOk:"Richtig!",cGameNo:"Nicht ganz. Der grüne Punkt ist: {p}.",cNext:"Weiter",cGameScore:"Ergebnis ansehen",cGameEnd:"Du hattest {s} von {n} richtig.",cGameTop:"Du kennst deine Kamera. Weiter zum Belichtungsdreieck!",cGameMid:"Schon gut! Tippe die Teile noch einmal durch und spiel erneut.",cGameLow:"Keine Sorge, das ist neu. Tippe die Teile in Ruhe durch und versuch es noch einmal.",cParts:{shutter:["Auslöser","Halb drücken: Die Kamera stellt scharf und misst das Licht. Ganz drücken: Das Foto wird aufgenommen. Das halbe Drücken kommt in der Lektion über Fokusmodi wieder vor."],dial:["Einstellrad","Damit änderst du die Einstellung, die zum gewählten Modus gehört, etwa Belichtungszeit oder Blende. Viele Kameras haben zwei: eines vorne und eines hinten."],mode:["Moduswahlrad","Legt fest, wer was bestimmt. AUTO: Die Kamera macht alles. P: Die Kamera wählt, du kannst korrigieren. A (oder Av): Du wählst die Blende. S (oder Tv): Du wählst die Belichtungszeit. M: Du wählst alles selbst."],hotshoe:["Blitzschuh","Eine Schiene mit Kontakten oben auf der Kamera. Hier schiebst du einen Aufsteckblitz, ein Mikrofon oder einen Funkauslöser auf."],evf:["Sucher","Hier schaust du mit dem Auge hinein. Bei einer spiegellosen Kamera ist das ein kleiner Bildschirm, der genau zeigt, wie dein Foto wird. Mit dem Rädchen daneben (Dioptrien) stellst du ihn auf deine Augen ein."],screen:["Display","Zeigt das Livebild, das Menü und deine Fotos. Oft kannst du es kippen und per Touch bedienen: praktisch für Fotos knapp über dem Boden oder über dem Kopf."],buttons:["Tasten und Joystick","Mit dem Joystick verschiebst du das Fokusfeld. Die Tasten daneben öffnen das Menü, zeigen deine Fotos an oder löschen sie. Die Anordnung ist je nach Kamera anders, die Funktionen fast immer gleich."],lens:["Objektiv","Das Auge der Kamera. Auf dem Ring stehen zwei Zahlen: die Brennweite (hier 24-70 mm) und die größte Blendenöffnung (hier 1:2.8, also f/2.8)."],zoom:["Zoomring","Dreh daran, um hinein- und herauszuzoomen: Du änderst die Brennweite. Ein Objektiv mit fester Brennweite hat keinen Zoomring."],focus:["Fokusring","Damit stellst du von Hand scharf (MF). Praktisch bei Nahaufnahmen, Sternen oder Fotos durch eine Scheibe, wo der Autofokus zögert."],release:["Objektiventriegelung","Drücken und das Objektiv drehen, um es abzunehmen. Wechsle mit der Kamera nach unten gerichtet, dann gelangt weniger Staub auf den Sensor."],card:["Speicherkartenfach","Hinter dieser Klappe steckt die Speicherkarte (meist SD). Warte, bis die Lampe aus ist, bevor du die Karte herausnimmst."],tripod:["Stativgewinde","Ein Gewinde an der Unterseite für ein Stativ. Fast alle Kameras und Stative haben dieselbe Größe (1/4 Zoll)."],lenses:["Linsen","Im Objektiv sitzen mehrere Glaslinsen hintereinander. Zusammen lenken sie das Licht so, dass ein scharfes Bild auf dem Sensor entsteht. Beim Zoomen oder Scharfstellen verschieben sich einige davon."],iris:["Blende","Ein Ring aus Lamellen, der eine größere oder kleinere Öffnung bildet. Großes Loch: mehr Licht und ein weicherer Hintergrund. Kleines Loch: weniger Licht und mehr Schärfe von vorne bis hinten."],shutterc:["Verschluss","Zwei Vorhänge direkt vor dem Sensor. Sie bestimmen, wie lange Licht auf den Sensor fällt: die Belichtungszeit. Viele Kameras und alle Handys können auch elektronisch belichten, ohne beweglichen Vorhang."],sensor:["Sensor","Das Herz der Kamera: ein Chip mit Millionen lichtempfindlicher Pixel. Siehst du, dass das Bild auf dem Kopf steht? So kommt das Licht durch die Linsen; die Kamera dreht es einfach wieder um. Ein großer Sensor (Vollformat) fängt mehr Licht ein als ein kleiner (APS-C oder Handy)."],proc:["Bildprozessor","Der kleine Computer der Kamera. Er macht aus den Sensordaten ein JPEG, reduziert Rauschen und berechnet den Autofokus. Fotografierst du in RAW, speichert die Kamera die Rohdaten, damit du sie später selbst bearbeitest."],battery:["Akku","Sitzt meist im Griff. Display und Sucher brauchen viel Strom: Nimm für einen Fototag einen Ersatzakku mit und halte ihn bei Kälte warm."]},cQs:[{q:"Was passiert, wenn du den Auslöser halb drückst?",o:["Die Kamera stellt scharf und misst das Licht","Das Foto wird aufgenommen","Das Menü öffnet sich"],a:0,e:"Halb drücken heißt scharfstellen und messen. Erst wenn du ganz drückst, wird das Foto aufgenommen."},{q:"Wo landet das Licht am Ende?",o:["Auf dem Sensor","Im Sucher","Auf der Speicherkarte"],a:0,e:"Das Licht geht durch die Linsen, die Blende und den Verschluss und fällt dann auf den Sensor."},{q:"Auf deinem Objektiv steht 24-70 mm. Was bedeutet das?",o:["Die Brennweite reicht von 24 bis 70 mm","Das Objektiv ist 24 bis 70 mm lang","Die größte Blendenöffnung"],a:0,e:"Es ist die Brennweite: 24 mm ist Weitwinkel, 70 mm schon etwas herangezoomt."},{q:"Mit welchem Teil wählst du zwischen AUTO, P, A, S und M?",o:["Mit dem Moduswahlrad","Mit dem Fokusring","Mit dem Zoomring"],a:0,e:"Das Moduswahlrad legt fest, wer was bestimmt: du oder die Kamera."},{q:"Wie wechselst du das Objektiv am sichersten?",o:["Mit der Kamera nach unten gerichtet","Mit der Öffnung nach oben, damit du gut siehst, was du tust","Das ist egal"],a:0,e:"Mit der Öffnung nach unten gelangt weniger Staub auf den Sensor."},{q:"Was macht der Verschluss?",o:["Er bestimmt, wie lange Licht auf den Sensor fällt","Er bestimmt, wie groß die Öffnung ist","Er zoomt hinein und heraus"],a:0,e:"Der Verschluss regelt die Belichtungszeit. Die Größe der Öffnung ist die Blende."},{q:"Warum steht das Bild auf dem Sensor auf dem Kopf?",o:["So lenken Linsen das Licht; die Kamera dreht es zurück","Der Sensor ist falsch herum eingebaut","Das passiert nur bei billigen Kameras"],a:0,e:"Jede Linse stellt das Bild auf den Kopf, auch die in deinem Auge. Dein Gehirn und deine Kamera drehen es einfach wieder um."},{q:"Wofür ist das Gewinde an der Unterseite?",o:["Für ein Stativ","Für einen Blitz","Für die Speicherkarte"],a:0,e:"Dort schraubst du die Kamera auf ein Stativ. Der Blitz kommt in den Blitzschuh oben."},{q:"Was hat ein Handy meistens NICHT?",o:["Eine verstellbare Blende","Einen Sensor","Eine Linse"],a:0,e:"Bei den meisten Handys ist die Blende fest. Linsen und einen Sensor haben sie alle."}],l1:"Das Belichtungsdreieck",l1d:"Blende, Belichtungszeit und ISO: wie sie gemeinsam dein Foto bestimmen.",l2:"Schärfentiefe",l2d:"Was bestimmt, wie viel von deinem Foto scharf ist?",l3:"Brennweite",l3d:"Weitwinkel oder Tele: Was macht das mit deinem Bild?",l4:"Das Histogramm lesen",l4d:"Auf einen Blick sehen, ob dein Foto richtig belichtet ist.",l5:"Weißabgleich",l5d:"Warum Fotos manchmal zu blau oder zu orange werden.",l7:"Lichteinfall",l7d:"Warum die Richtung des Lichts über dein Foto entscheidet.",l6:"Bildgestaltung",l6d:"Drittelregel, Linien und Raum im Bild.",intro:"Jedes Foto ist ein Gleichgewicht aus drei Einstellungen. Änderst du eine, muss eine andere mitgehen, damit die Helligkeit gleich bleibt. Jede Einstellung hat außerdem eine Nebenwirkung.",cA:"Blende",cAd:"Die Öffnung im Objektiv. Es wirkt verkehrt herum: Je kleiner die Zahl, desto größer die Öffnung. Das liegt daran, dass die Blendenzahl ein Bruch ist: f/2 bedeutet eine Öffnung von 1/2, f/16 nur 1/16. Eine halbe Pizza ist mehr als ein Sechzehntel. Große Öffnung (f/1.8) = viel Licht und ein unscharfer Hintergrund. Kleine Öffnung (f/16) = weniger Licht und alles scharf.",cS:"Belichtungszeit",cSd:"Wie lange der Sensor Licht sammelt. Kurz (1/1000 s) friert Bewegung ein. Lang (1/15 s) lässt bewegte Motive verwischen.",cI:"ISO",cId:"Wie stark das Signal verstärkt wird. Höher macht dein Foto heller, bringt aber mehr Bildrauschen.",cK:"So arbeiten sie zusammen",cKd:"Fotografen messen Licht in Stufen (englisch: stops). Eine Stufe ist einfach ein Schritt: doppelt so viel Licht oder die Hälfte. Öffnest du die Blende um eine Stufe, bekommst du doppelt so viel Licht. Das gleichst du mit einer Stufe kürzerer Zeit oder einer Stufe niedrigerer ISO aus. Jeder Klick auf einem Schieberegler unten ist genau eine Stufe.",lf:"Fokusmodi",lfd:"Einzel, kontinuierlich, automatisch oder manuell: Wann nimmst du was?",fIntro:"Deine Kamera kann auf vier Arten scharfstellen. Der Unterschied liegt darin, was danach passiert: Bleibt die Schärfe fixiert oder folgt sie deinem Motiv?",fS:"Einzel (AF-S)",fSd:"Die Kamera stellt einmal scharf und speichert die Schärfe. Ideal für unbewegte Motive wie Landschaften, Gebäude und Porträts.",fC:"Kontinuierlich (AF-C)",fCd:"Die Kamera stellt weiter scharf, solange du den Auslöser halb gedrückt hältst. Für alles, was sich bewegt: Sport, Tiere, spielende Kinder.",fA:"Automatisch (AF-A)",fAd:"Die Kamera entscheidet selbst. Sie beginnt mit Einzel-AF und wechselt zu kontinuierlich, wenn sich das Motiv bewegt. Praktisch im Zweifel, aber manchmal knapp zu spät.",fM:"Manuell (MF)",fMd:"Du drehst selbst am Fokusring. Nützlich bei Makro, Sternen oder wenn der Autofokus pumpt, zum Beispiel durch Glas oder im Dunkeln.",fKey:"So startest du das Scharfstellen",fKeyd:"Bei den meisten Kameras drückst du den Auslöser halb zum Scharfstellen und ganz zum Auslösen. Die Namen unterscheiden sich manchmal: Einzel heißt auch 'One Shot' und kontinuierlich 'Servo'.",fTryLead:"Wähle einen Modus und beobachte den Hund. Grüner Rahmen = scharf, rot = unscharf.",fMode:"Modus",fSubj:"Motiv",moving:"Bewegt",still:"Ruhig",fDist:"Fokus auf",sharp:"Scharf",blurry:"Unscharf",near:"Nah",far:"Fern",subjLbl:"Hund",focusLbl:"Fokus",switched:"wechselt zu kontinuierlich",fTours:["Ein sitzender Hund im Einzel-AF: Einmal scharfstellen reicht. Scharf.","Jetzt rennt der Hund auf dich zu. Einzel-AF hält die Schärfe auf der Anfangsentfernung, also wird der Hund immer unschärfer.","Kontinuierlich geht mit dem Hund mit. Er bleibt scharf, bis ganz nah.","Automatisch beginnt mit Einzel-AF und wechselt, sobald sich der Hund bewegt. Achte auf den kurzen Moment davor.","Manuell auf 8 Meter: Der Hund ist nur scharf, wenn er genau dort ist. So funktioniert auch das Vorfokussieren.","Faustregel: ruhig = Einzel, bewegt = kontinuierlich."],fQs:[{q:"Du fotografierst eine Landschaft vom Stativ. Welcher Modus?",o:["Kontinuierlich","Einzel","Manuell ist Pflicht"],a:1,e:"Eine Landschaft bewegt sich nicht, einmal scharfstellen reicht."},{q:"Dein Kind rennt beim Fußball auf dich zu. Welcher Modus?",o:["Einzel","Kontinuierlich","Automatisch ist immer besser"],a:1,e:"Kontinuierlich folgt dem bewegten Motiv."},{q:"Der Autofokus pumpt beim Fotografieren durch ein Fenster. Was hilft?",o:["Manuell scharfstellen","Höhere ISO","Kürzere Belichtungszeit"],a:0,e:"Manuell stellst du selbst scharf, so kann das Glas die Kamera nicht ablenken."},{q:"Was macht die Kamera im kontinuierlichen AF (AF-C), solange du den Auslöser halb drückst?",o:["Stellt weiter auf das bewegte Motiv scharf","Stellt einmal scharf und speichert","Stellt gar nicht scharf"],a:0,e:"Kontinuierlich folgt deinem Motiv, solange du den Auslöser halb gedrückt hältst."},{q:"Wie startest du bei den meisten Kameras das Scharfstellen?",o:["Auslöser halb drücken","Auslöser zweimal schnell drücken","Objektiv ab- und wieder ansetzen"],a:0,e:"Halb drücken stellt scharf, ganz drücken löst aus."},{q:"Du fotografierst eine ruhig sitzende Person für ein Porträt. Welcher Modus ist am einfachsten?",o:["Einzel (AF-S)","Kontinuierlich (AF-C)","Immer manuell"],a:0,e:"Wer ruhig sitzt, bewegt sich kaum, also reicht einmal scharfstellen."},{q:"Du willst den Sternenhimmel fotografieren und der Autofokus findet nichts. Was tust du?",o:["Manuell auf einen hellen Stern scharfstellen","Den kontinuierlichen Modus nutzen","Die ISO senken"],a:0,e:"Im Dunkeln findet der Autofokus oft nichts. Von Hand, mit Vergrößerung auf einem hellen Stern, klappt es."},{q:"Was ist ein Nachteil des automatischen Modus (AF-A)?",o:["Er wechselt manchmal knapp zu spät zu kontinuierlich","Er funktioniert nur bei Tageslicht","Er macht das Foto dunkler"],a:0,e:"AF-A muss erst Bewegung erkennen, und diese kurze Verzögerung kann dich ein scharfes Foto kosten."},{q:"Was bedeutet 'Vorfokussieren'?",o:["Auf eine Stelle scharfstellen, an der dein Motiv gleich vorbeikommt","Scharfstellen, bevor du die Kamera einschaltest","Scharfstellen, nachdem du das Foto gemacht hast"],a:0,e:"Du legst die Schärfe vorab auf die richtige Stelle und löst aus, sobald dein Motiv dort ist."},{q:"Im Einzel-AF stellst du auf einen Hund in 10 Metern scharf, der dann auf dich zurennt. Was passiert?",o:["Der Hund wird unscharf, weil die Schärfe bei 10 Metern bleibt","Der Hund bleibt scharf","Das Foto wird dunkler"],a:0,e:"Einzel-AF speichert die Schärfe. Kommt der Hund näher, fällt er aus dem scharfen Bereich."}],toolTry:"Weiter mit deinen eigenen Fotos",tool1:"Sieh dir im EXIF-Tab der Photography Suite an, mit welcher Blende, Belichtungszeit und ISO deine eigenen Fotos entstanden sind.",toolGo:"Geh selbst üben",tool2:"Willst du mit bewegten Motiven üben? Finde Orte für Wildtiere und Natur in PhotoByArno Scout.",asgTitle:"Aufgabe: jetzt du",asgLead:"Wähle eine Aufgabe, mach das Foto und wähle es unten aus. Du bekommst sofort Tipps. Dein Foto bleibt auf deinem Gerät: Niemand sonst sieht es.",asgFileHint:"Verwende ein JPG direkt aus Kamera oder Handy oder einen Export aus deinem Bearbeitungsprogramm mit erhaltenen Metadaten. Fotos, die über WhatsApp oder soziale Medien verschickt wurden, verlieren die Daten, die das Tool braucht.",a1:"Unscharfer Hintergrund",a1d:"Fotografiere ein nahes Motiv vor einem ruhigen, unscharfen Hintergrund. Ziel: Blende f/4 oder eine kleinere Zahl.",a2:"Bewegung einfrieren",a2d:"Fotografiere etwas, das sich schnell bewegt, etwa einen rennenden Hund, einen Radfahrer oder spritzendes Wasser, sodass es scharf und still wirkt. Ziel: Belichtungszeit 1/500 s oder kürzer.",a3:"Bewegung zeigen",a3d:"Zeige Bewegung als weiche Wischer, zum Beispiel fließendes Wasser oder vorbeifahrenden Verkehr. Ziel: Belichtungszeit 1/15 s oder länger. Nutze ein Stativ oder lehne dich irgendwo an.",choose:"Foto wählen",analyzing:"Wird angesehen…",yourSettings:"Deine Einstellungen",goodH:"Gut gemacht",tipsH:"Tipps für das nächste Mal",noExif:"Dieses Foto enthält keine Aufnahmedaten (EXIF). Das passiert oft bei Fotos, die über WhatsApp oder soziale Medien verschickt wurden. Nutze die Originaldatei, dann kann ich deine Einstellungen bewerten. Die Belichtung habe ich trotzdem geprüft.",badFile:"Dieses Foto kann ich nicht öffnen. Versuche eine JPG-Datei.",phoneNote:"Du fotografierst mit dem Handy, prima zum Lernen. Beachte nur: Bei Handys ist die Blende fest.",a1ok:"Blende {v}: schön offen, das ergibt einen unscharfen Hintergrund.",a1mid:"Blende {v}: schon ziemlich offen. Für mehr Unschärfe: Versuche f/2.8 oder so offen, wie dein Objektiv es erlaubt.",a1bad:"Blende {v}: Damit bleibt viel scharf. Stell deine Kamera auf A oder Av (Blendenvorwahl) und wähle die kleinste Blendenzahl, zum Beispiel f/2.8 oder f/4.",a1extra:"Noch unschärfer: Geh näher an dein Motiv heran und sorge dafür, dass der Hintergrund weit weg ist. Etwas hineinzoomen hilft auch.",a1phone:"Nutze den Porträtmodus deines Handys, geh nah an dein Motiv und sorge dafür, dass der Hintergrund weit weg ist.",a2ok:"Belichtungszeit {v}: kurz genug, um Bewegung einzufrieren.",a2mid:"Belichtungszeit {v}: reicht für ruhige Bewegungen, ist für schnelle Action aber knapp zu lang. Versuche 1/1000 s.",a2bad:"Belichtungszeit {v}: zu lang, um Bewegung einzufrieren. Stell deine Kamera auf S oder Tv (Zeitvorwahl) und wähle 1/500 s oder kürzer. Zu dunkel? Erhöhe die ISO.",a3ok:"Belichtungszeit {v}: lang genug, um Bewegung als Wischer zu zeigen.",a3mid:"Belichtungszeit {v}: Etwas Bewegung ist zu sehen, aber es geht weicher. Versuche 1/4 s oder länger.",a3bad:"Belichtungszeit {v}: zu kurz, die Bewegung steht still. Wähle 1/15 s oder länger, mit niedriger ISO und größerer Blendenzahl (zum Beispiel f/11), damit es nicht zu hell wird.",a3light:"Tagsüber zu hell mit langer Belichtungszeit? Ein ND-Filter wirkt wie eine Sonnenbrille für dein Objektiv.",a3phone:"Viele Handys haben dafür einen Nachtmodus oder einen Langzeitbelichtungs-Effekt. Mit einem Pro-Modus oder einer Pro-App wählst du die Belichtungszeit selbst.",shake:"Belichtungszeit {v} aus der Hand ist lang für diese Brennweite. Deine Hände könnten sich bewegt haben: Bleib kürzer als 1/{f} s oder nutze ein Stativ.",isoLow:"ISO {v}: schön niedrig, wenig Rauschen.",isoHigh:"ISO {v}: hoch, also wahrscheinlich sichtbares Rauschen. Geht es mit mehr Licht oder offenerer Blende?",expOk:"Die Belichtung sieht gut aus: keine großen Flächen, die komplett weiß oder schwarz sind.",expHi:"{p}% deines Fotos sind komplett weiß. Dieses Detail ist weg und später nicht mehr zu retten. Nächstes Mal etwas dunkler: kürzere Zeit, niedrigere ISO oder Belichtungskorrektur minus.",expLo:"{p}% deines Fotos sind komplett schwarz. Etwas heller geht: längere Zeit, höhere ISO oder offenere Blende.",expDark:"Das Foto ist insgesamt ziemlich dunkel. Absicht? Prima. Wenn nicht, gib etwas mehr Licht.",expBright:"Das Foto ist insgesamt ziemlich hell. Absicht? Prima. Wenn nicht, gib etwas weniger Licht.",sharpNo:"Ich finde keine wirklich scharfen Details. Prüfe deine Scharfstellung und halte die Kamera ruhig.",sharpOk:"Dein Foto hat scharfe Details.",encourage:"Jedes Foto ist Übung. Versuch es noch einmal mit diesen Tipps und vergleiche das Ergebnis.",faNoExif:"Dieses Foto enthält keine Aufnahmedaten (EXIF), zum Beispiel weil es über WhatsApp oder soziale Medien verschickt wurde. Die Schärfe habe ich trotzdem geprüft.",fa1:"Ruhig und scharf",fa1d:"Fotografiere etwas Unbewegtes, etwa eine Blume, ein Gebäude oder einen Gegenstand, im Einzel-AF (AF-S). Setz den Fokuspunkt genau auf dein Motiv.",fa2:"Bewegt und scharf",fa2d:"Fotografiere ein Motiv, das sich auf dich zubewegt, etwa einen Hund, einen Radfahrer oder ein spielendes Kind, im kontinuierlichen AF (AF-C). Halte den Auslöser halb gedrückt und folge deinem Motiv.",fa3:"Vorfokussieren",fa3d:"Wähle eine Stelle, an der dein Motiv gleich vorbeikommt. Stell dort vorher scharf (manuell oder Einzel-AF) und löse aus, sobald dein Motiv diese Stelle erreicht.",faWhere:"Der grüne Rahmen zeigt, wo dein Foto am schärfsten ist. Liegt er auf deinem Motiv? Dann saß der Fokus richtig. Liegt er daneben, hat die Kamera dort scharfgestellt: Setz den Fokuspunkt nächstes Mal auf dein Motiv.",faMode:"Deine Kamera speichert nicht einheitlich, welchen Fokusmodus du benutzt hast. Deshalb schaut das Tool auf das Ergebnis: Wo ist dein Foto scharf?",faSharpOk:"Dein Foto hat deutlich scharfe Bereiche.",faSharpNo:"Ich finde keine wirklich scharfen Details. Unschärfe hat meist eine von drei Ursachen: Fokus an der falschen Stelle, Bewegung des Motivs oder Bewegung deiner Hände.",fa2ok:"Belichtungszeit {v}: kurz genug, also kommt eventuelle Unschärfe nicht von der Bewegung deines Motivs.",fa2slow:"Belichtungszeit {v}: ziemlich lang für ein bewegtes Motiv. Bewegungsunschärfe sieht einem Fokusfehler sehr ähnlich. Wähle 1/500 s oder kürzer, damit du nur den Fokus testest.",faPhone:"Am Handy tippst du auf dem Bildschirm auf dein Motiv, um dort scharfzustellen. Für bewegte Motive eignet sich der Serienbildmodus gut.",dIntro:"Schärfentiefe ist der Bereich vor und hinter deinem Fokuspunkt, der noch scharf aussieht. Manchmal willst du alles scharf, etwa bei einer Landschaft. Manchmal nur dein Motiv, etwa bei einem Porträt. Drei Dinge bestimmen, wie tief dieser Bereich ist.",dA:"Blende",dAd:"Große Blendenzahl (f/11, f/16) = viel Schärfentiefe. Kleine Blendenzahl (f/1.8, f/2.8) = wenig Schärfentiefe und ein weicher Hintergrund.",dD:"Abstand zum Motiv",dDd:"Je näher du scharfstellst, desto dünner der scharfe Bereich. Ganz nah sind manchmal nur ein paar Millimeter scharf.",dF:"Brennweite",dFd:"Hineinzoomen (zum Beispiel 200 mm) gibt weniger Schärfentiefe und einen unschärferen Hintergrund als Herauszoomen (zum Beispiel 24 mm).",dKey:"Der Hintergrund zählt mit",dKeyd:"Je weiter der Hintergrund hinter deinem Motiv liegt, desto unschärfer wird er. Stell jemanden also nicht an eine Wand, sondern ein paar Meter davor.",dTryLead:"Bewege die Regler und schau, welche Pfosten scharf werden. Das grüne Band zeigt, wo die Schärfe liegt.",dFocus:"Fokus auf",dFL:"Brennweite",dZone:"Scharfen Bereich zeigen",dRange:"Scharf von {a} bis {b}",dInf:"unendlich",dObjF:"Blume",dObjP:"Wanderin",dObjT:"Bäume",dTours:["Ausgangspunkt: f/2.8, scharfgestellt auf die Wanderin in 5 Metern. Sie ist scharf, die Blume vorne und die Bäume hinten sind weich.","Blende auf f/16: Der scharfe Bereich wird viel tiefer. Fast alles ist jetzt scharf.","Blende auf f/1.4: Nur die Wanderin ist scharf, der Rest verschwimmt.","Scharfstellen auf die Blume in 2 Metern: Jetzt ist die Blume scharf und die Wanderin weich. Du entscheidest, wohin der Blick geht.","Hineinzoomen auf 200 mm, scharf auf 5 Meter: Der scharfe Bereich ist hauchdünn und der Hintergrund löst sich in einem weichen Schleier auf.","Herauszoomen auf 24 mm mit f/8, scharf auf 3 Meter: scharf von nah bis fern. Ideal für Landschaften.","Kurz gesagt: kleine Blendenzahl, nah und hineingezoomt = wenig Schärfentiefe. Große Blendenzahl, weiter weg und herausgezoomt = viel Schärfentiefe."],dQs:[{q:"Du willst eine Landschaft von vorne bis hinten scharf. Was wählst du?",o:["f/1.8 und hineinzoomen","f/11 und herauszoomen","f/4 und nah scharfstellen"],a:1,e:"Eine große Blendenzahl und eine kurze Brennweite geben viel Schärfentiefe."},{q:"Bei einem Porträt ist der Hintergrund nicht unscharf genug. Was hilft am meisten?",o:["Hintergrund weiter weg und eine kleine Blendenzahl","Höhere ISO","Kürzere Belichtungszeit"],a:0,e:"Eine kleine Blendenzahl und mehr Abstand zwischen Motiv und Hintergrund machen den Hintergrund weicher."},{q:"Du fotografierst eine Blume ganz nah und nur ein Rand ist scharf. Was tust du?",o:["Größere Blendenzahl, zum Beispiel f/8","Kleinere Blendenzahl, zum Beispiel f/1.8","Längere Belichtungszeit"],a:0,e:"Ganz nah ist die Schärfentiefe sehr gering. Eine größere Blendenzahl macht sie tiefer."},{q:"Welche Kombination gibt die GERINGSTE Schärfentiefe?",o:["f/2, nah und hineingezoomt","f/11, weit weg und herausgezoomt","f/8, weit weg und herausgezoomt"],a:0,e:"Kleine Blendenzahl, kurzer Abstand und Hineinzoomen machen den scharfen Bereich jeweils dünner."},{q:"Warum ist f/22 nicht immer die schärfste Wahl?",o:["Durch Beugung wird das ganze Foto etwas weicher","Weil das Foto dann zu hell wird","Weil der Autofokus dann nicht funktioniert"],a:0,e:"Bei einer sehr kleinen Öffnung wird das Licht gebeugt. Dadurch wird das ganze Foto etwas weniger scharf."},{q:"Wo liegt bei vielen Objektiven ungefähr die schärfste Blende?",o:["Um f/5.6 bis f/8","Immer bei der kleinsten Blendenzahl","Immer bei f/22"],a:0,e:"Die meisten Objektive sind zwei bis drei Stufen unter ihrer größten Öffnung am schärfsten."},{q:"Du fotografierst einen Pilz aus der Nähe. Wie wird er ganz scharf und der Hintergrund trotzdem weich?",o:["f/5.6 bis f/8 und ein Pilz mit viel Raum dahinter","f/1.8 und so nah wie möglich","f/22 mit dem Hintergrund direkt dahinter"],a:0,e:"Eine mittlere Blendenzahl macht den Pilz scharf. Der Abstand zum Hintergrund macht ihn weich."},{q:"Jemand steht an einer Wand und die Wand bleibt scharf. Was hilft am meisten?",o:["Die Person ein paar Meter vor die Wand stellen","Eine höhere ISO","Eine kürzere Belichtungszeit"],a:0,e:"Je weiter der Hintergrund hinter deinem Motiv liegt, desto unschärfer wird er."},{q:"Du änderst nur die Fokusentfernung von 2 auf 10 Meter. Was passiert mit der Schärfentiefe?",o:["Sie wird größer","Sie wird kleiner","Sie bleibt gleich"],a:0,e:"Je weiter weg du scharfstellst, desto tiefer der scharfe Bereich."},{q:"Was macht Hineinzoomen auf 200 mm mit dem Hintergrund?",o:["Er wird unschärfer","Er wird schärfer","Es ändert sich nichts"],a:0,e:"Hineingezoomt hast du weniger Schärfentiefe, also wird der Hintergrund weicher."}],da1:"Alles scharf",da1d:"Fotografiere eine Landschaft oder Straße, in der alles von vorne bis hinten scharf sein soll. Ziel: f/8 bis f/11.",da2:"Nur dein Motiv",da2d:"Fotografiere eine Person, ein Tier oder einen Gegenstand vor weichem Hintergrund. Ziel: f/2.8 oder kleiner, mit deinem Motiv ein gutes Stück vor dem Hintergrund.",da3:"Ganz nah",da3d:"Fotografiere eine Blume oder einen kleinen Gegenstand so nah, wie deine Kamera scharfstellen kann. Entdecke, wie dünn der scharfe Bereich dann wird.",dMap:"Die grünen Kästchen zeigen, wo dein Foto scharf ist. So siehst du auf einen Blick, wie groß deine Schärfentiefe war.",dShare:"{p}% deines Fotos sind scharf.",d1apOk:"Blende {v}: schön, das gibt viel Schärfentiefe und dein Objektiv ist hier am schärfsten.",d1apMid:"Blende {v}: ordentlich. Für mehr Schärfe von vorne bis hinten: versuche f/8 bis f/11.",d1apBad:"Blende {v}: Damit bleibt die Schärfentiefe gering. Wähle f/8 bis f/11 im A- oder Av-Modus.",d1fracOk:"Ein großer Teil deines Fotos ist scharf, genau wie gewollt.",d1fracBad:"Nur ein kleiner Teil ist scharf. Nutze eine größere Blendenzahl, zoome etwas heraus und stell auf etwa ein Drittel ins Bild scharf, nicht auf die Ferne.",d1fl:"Brennweite {v}: Hineinzoomen gibt weniger Schärfentiefe. Zoome mal heraus.",d1phone:"Handys haben von Natur aus viel Schärfentiefe, alles scharf gelingt damit meist leicht.",d2apOk:"Blende {v}: schön offen, das gibt wenig Schärfentiefe.",d2apMid:"Blende {v}: schon ziemlich offen. Schafft dein Objektiv f/2.8 oder weniger? Probier es aus.",d2apBad:"Blende {v}: Damit bleibt viel scharf. Wähle die kleinste Blendenzahl deines Objektivs.",d2fracOk:"Nur ein kleiner Teil ist scharf: Dein Motiv sticht heraus.",d2fracBad:"Ein großer Teil deines Fotos ist scharf. Geh näher an dein Motiv, sorge für mehr Abstand zum Hintergrund oder zoome hinein.",d3fracOk:"So nah ist der scharfe Bereich sehr dünn, und dein Foto zeigt das gut.",d3thin:"Es ist nur sehr wenig scharf. Willst du mehr von deinem Motiv scharf? Wähle f/8 oder geh ein kleines Stück zurück.",d3info:"Blende {v}: Ganz nah gibt selbst f/8 noch wenig Schärfentiefe.",newQs:"Andere Fragen",shareBtn:"Lektion teilen",copied:"Link kopiert",copyFail:"Kopiere diesen Link:",useful:"War diese Lektion hilfreich?",thanks:"Danke für deine Rückmeldung!",dSweet:"Größere Zahl ist nicht immer schärfer",dSweetd:"Die meisten Objektive sind um f/5.6 bis f/8 am schärfsten. Ab f/16 wird das ganze Foto durch Beugung etwas weicher: Das Licht wird an der kleinen Öffnung abgelenkt. Willst du viel Schärfentiefe, ist f/8 bis f/11 meist die sichere Wahl.",d1diff:"Blende {v}: viel Schärfentiefe, aber ab f/16 wird das ganze Foto durch Beugung etwas weicher. Versuche mal f/8 oder f/11 und vergleiche.",da4:"Pilz",da4d:"Fotografiere einen Pilz aus der Nähe: der ganze Pilz scharf, der Hintergrund weich. Geh auf Augenhöhe, wähle f/5.6 bis f/8 und such dir einen mit viel Raum dahinter.",d4apOk:"Blende {v}: genau richtig, so kann der ganze Pilz scharf werden.",d4apOpen:"Blende {v}: So nah ist der scharfe Bereich hauchdünn. Wähle f/5.6 bis f/8, damit Hut und Stiel beide scharf werden.",d4apClosed:"Blende {v}: Damit wird auch der Hintergrund schärfer und das Foto durch Beugung etwas weicher. Versuche f/8.",d4fracOk:"Dein Pilz sticht heraus: Der Hintergrund ist weich.",d4fracBad:"Ein großer Teil deines Fotos ist scharf, also lenkt der Hintergrund ab. Such dir einen Pilz mit mehr Raum dahinter oder geh etwas zurück und zoome hinein.",d4slow:"Belichtungszeit {v}: ziemlich lang. Nutze ein Stativ, einen Bohnensack oder deine Tasche auf dem Boden, der Pilz läuft nicht weg. Warte auch, bis der Wind kurz nachlässt.",d4phone:"Nutze den Makro- oder Porträtmodus deines Handys und halte es auf Augenhöhe des Pilzes.",bIntro:"Die Brennweite in Millimetern bestimmt, wie viel von der Welt ins Bild passt. Eine kleine Zahl ist Weitwinkel: viel Raum im Bild. Eine große Zahl ist Tele: als würdest du hineinzoomen. Aber es passiert mehr, als nur Dinge näher zu holen.",bA:"Bildwinkel",bAd:"Bei 24 mm siehst du einen weiten Winkel von etwa 84°, bei 50 mm etwa 47° und bei 200 mm nur noch 12°. Je größer die Zahl, desto kleiner der Ausschnitt der Welt, den du festhältst.",bP:"Perspektive",bPd:"Mit einem Weitwinkel wirkt Nahes groß und der Hintergrund weit weg. Mit einem Tele wirkt der Hintergrund näher und größer. Das nennt man Kompression.",bU:"Wofür nimmst du was?",bUd:"Weitwinkel (14–35 mm): Landschaft, Architektur und Innenräume. Standard (um 50 mm): ungefähr so, wie dein Auge es sieht. Porträt (85–135 mm): natürliche Gesichter. Tele (200 mm und mehr): Wildtiere, Sport und Details aus der Ferne.",bKey:"Perspektive kommt von deinem Abstand",bKeyd:"Eigentlich erzeugt nicht das Objektiv die Kompression, sondern dein Abstand zum Motiv. Ein Tele lässt dich weiter weg stehen, und von dort wirkt der Hintergrund größer. Probier es unten mit 'Motiv gleich groß' selbst aus.",bKey2:"Handy oder kleinerer Sensor?",bKey2d:"Die Millimeter in dieser Lektion gelten für eine Vollformatkamera. Am Handy siehst du 0,5×, 1× oder 3×; 1× entspricht meist etwa 24 bis 28 mm. Hat deine Kamera einen kleineren Sensor (APS-C), wirkt ein Objektiv etwa 1,5× stärker gezoomt: 50 mm fühlt sich dann wie etwa 75 mm an.",bTryLead:"Wähle, was du sehen willst, und bewege die Brennweite. Oben rechts siehst du von oben, wo die Kamera steht und wie weit sie blickt.",bModeLbl:"Was willst du sehen?",bMode1:"Gleicher Standort",bMode2:"Motiv gleich groß",bFL:"Brennweite",bAngle:"Bildwinkel",bDist:"Abstand zur Wanderin",bWalker:"Wanderin",bMtn:"Berg",bTours:["Gleicher Standort, 24 mm: Du siehst die Wanderin, den Weg, die Bäume und den Berg. Viel Raum im Bild.","50 mm: Der Ausschnitt wird enger, ungefähr so, wie dein Auge es sieht.","200 mm vom gleichen Standort: Du holst die Wanderin nah heran, ohne zu laufen. Nur noch ihr Oberkörper passt ins Bild.","Jetzt bleibt die Wanderin gleich groß. Mit 24 mm stehst du direkt neben ihr, und der Berg ist ein kleiner Hügel in der Ferne.","85 mm: Du bist zurückgegangen, damit sie gleich groß bleibt. Schau, wie der Berg wächst.","200 mm, über 40 Meter zurück: Der Berg scheint direkt hinter ihr zu stehen. Das ist Kompression, erzeugt durch deinen Abstand.","Kurz gesagt: Die Brennweite bestimmt, wie viel du siehst, dein Abstand bestimmt die Perspektive."],bQs:[{q:"Welche Brennweite zeigt am meisten von der Umgebung?",o:["14 mm","50 mm","200 mm"],a:0,e:"Je kleiner die Zahl, desto weiter der Bildwinkel."},{q:"Wie nennt man ein Objektiv mit 200 mm?",o:["Tele","Weitwinkel","Fisheye"],a:0,e:"Ab etwa 85 mm spricht man von Tele, und 200 mm ist eindeutig Tele."},{q:"Du willst einen ganzen Raum oder eine weite Landschaft ins Bild bekommen. Was wählst du?",o:["Weitwinkel, 16 bis 24 mm","Tele, 200 mm","Porträt, 85 mm"],a:0,e:"Ein Weitwinkel erfasst den breitesten Teil der Umgebung."},{q:"Welche Brennweite wird oft für Porträts genutzt?",o:["85 mm","14 mm","600 mm"],a:0,e:"Um 85 mm stehst du in angenehmem Abstand und die Gesichtsproportionen bleiben natürlich."},{q:"Du fotografierst eine Wanderin vor einem Berg und willst den Berg groß hinter ihr. Was tust du?",o:["Weiter weg stellen und hineinzoomen","Nah herangehen mit Weitwinkel","Die ISO erhöhen"],a:0,e:"Aus größerer Entfernung mit Tele wirkt der Hintergrund im Verhältnis zum Motiv größer."},{q:"Was verursacht eigentlich 'Kompression'?",o:["Der größere Abstand zum Motiv","Das Glas in einem Teleobjektiv","Eine höhere ISO"],a:0,e:"Ein Tele lässt dich weiter weg stehen, und dieser Abstand verändert die Perspektive."},{q:"Warum kann ein Weitwinkel bei einem Porträt aus nächster Nähe eine Nase groß wirken lassen?",o:["Weil das, was näher an der Kamera ist, viel größer wirkt","Weil ein Weitwinkel die Farben verändert","Weil die Belichtungszeit länger ist"],a:0,e:"Ganz nah ist die Nase im Verhältnis viel näher am Objektiv als die Ohren, also wirkt sie größer."},{q:"Dein Handy zeigt 1×. Welcher Brennweite entspricht das ungefähr?",o:["24 bis 28 mm","85 mm","200 mm"],a:0,e:"Die Hauptkamera der meisten Handys ist ein leichter Weitwinkel."},{q:"Was passiert mit dem Bildwinkel, wenn du von 24 auf 50 mm gehst?",o:["Er wird ungefähr halb so groß","Er wird größer","Er bleibt gleich"],a:0,e:"Von etwa 84° auf etwa 47°: doppelt so stark gezoomt ist ungefähr der halbe Winkel."},{q:"Deine Kamera hat einen kleineren Sensor (APS-C) und du nutzt ein 50-mm-Objektiv. Wie sieht das aus?",o:["Etwa wie 75 bis 80 mm","Etwa wie 25 mm","Genau wie 50 mm an Vollformat"],a:0,e:"Ein kleinerer Sensor schneidet einen kleineren Teil des Bildes aus, als würdest du etwa 1,5× stärker zoomen."}],ba1:"Weit",ba1d:"Fotografiere eine Landschaft, Straße oder einen Raum mit Weitwinkel: 24 mm oder kürzer. Am Handy: die 0,5×- oder 1×-Kamera. Setz etwas Interessantes in den Vordergrund.",ba2:"Gezoomtes Detail",ba2d:"Hol mit Zoom ein Detail aus einer größeren Szene: ein Fenster, einen Vogel oder einen Baum in der Ferne. Ziel: 85 mm oder mehr. Am Handy: die 2×- oder 3×-Kamera.",ba3:"Kompression",ba3d:"Mach zwei Fotos vom gleichen Motiv mit etwas weit dahinter, etwa einem Turm oder Hügel: eins aus der Nähe mit Weitwinkel, eins von weit weg mit Tele. Halte dein Motiv auf beiden Fotos gleich groß. Wähle die Fotos danach nacheinander aus.",b1ok:"Brennweite {v}: echter Weitwinkel, du bekommst viel Raum ins Bild.",b1mid:"Brennweite {v}: fast Weitwinkel. Zoome noch etwas heraus, auf 24 mm oder kürzer.",b1bad:"Brennweite {v}: Das ist schon gezoomt. Dreh deinen Zoomring auf die kleinste Zahl.",b1fg:"Weitwinkeltipp: Etwas im Vordergrund, etwa ein Stein, eine Blume oder ein Zaun, gibt deinem Foto Tiefe.",b1phone:"Nutze am Handy die 0,5×-Kamera für ein extra weites Bild.",b2ok:"Brennweite {v}: schön gezoomt, du holst das Detail nah heran.",b2mid:"Brennweite {v}: etwas gezoomt. Für echtes Detail: 85 mm oder mehr.",b2bad:"Brennweite {v}: Das ist noch weit. Zoome auf 85 mm oder mehr.",b2phone:"Nutze die 2×- oder 3×-Kamera deines Handys. Weiter zu zoomen ist digital und kostet Schärfe.",b3first:"Foto 1 ist bereit ({v}). Wähle jetzt dein zweites Foto, mit einer ganz anderen Brennweite.",b3ok:"Foto 1: {a}, Foto 2: {b}. Ein großer Unterschied, also siehst du die Kompression gut. Schau, wie groß der Hintergrund im Verhältnis zu deinem Motiv ist.",b3small:"Foto 1: {a}, Foto 2: {b}. Der Unterschied ist klein. Wähle Brennweiten weiter auseinander, zum Beispiel 24 und 135 mm, und halte dein Motiv auf beiden Fotos etwa gleich groß.",b3reset:"Neu beginnen",b3photo:"Foto",bNoFl:"Dieses Foto enthält keine Brennweite. Nutze die Originaldatei, dann kann ich deine Brennweite bewerten.",bCrop:"Deine Kamera hat kein Kleinbild-Äquivalent gespeichert. Hat sie einen kleineren Sensor (APS-C), ist der Effekt etwa 1,5× stärker gezoomt, als die Zahl vermuten lässt.",toolF:"Auf der Suche nach einem Ort mit weiter Aussicht, um Weitwinkel und Tele zu vergleichen? Finde Aussichtspunkte in PhotoByArno Scout.",tryIt:"Probier es selbst",tryLead:"Tippe auf Rundgang für eine Führung oder nutze die Schieberegler. Jeder Schritt ist eine Stufe.",dark:"Zu dunkel",good:"Gut",light:"Zu hell",aperture:"Blende",shutter:"Zeit",iso:"ISO",hA:"Kleinere Zahl = größere Öffnung = mehr Licht, unschärferer Hintergrund",hS:"Länger = mehr Licht, Bewegungsunschärfe",hI:"Höher = heller, aber mehr Rauschen",tour:"Rundgang",stop:"Stopp",reset:"Zurücksetzen",more:"zu viel Licht",less:"zu wenig Licht",correct:"Richtig belichtet",stop1:"Stufe",stopN:"Stufen",over:"überbelichtet",under:"unterbelichtet",tours:["Ausgangspunkt: f/5.6, 1/125 s, ISO 100. Gut belichtet, Hintergrund ziemlich scharf.","Blende auf f/1.8 öffnen: drei Stufen mehr Licht. Schön unscharfer Hintergrund, aber viel zu hell.","Mit kürzerer Zeit ausgleichen, 1/1000 s. Wieder gut belichtet, Radfahrer eingefroren, Hintergrund bleibt weich.","Jetzt f/16, damit alles scharf ist: sechs Stufen weniger Licht. Viel zu dunkel.","ISO 6400 macht es wieder hell, aber achte auf das Rauschen.","Alternative: ISO zurück, Zeit auf 1/15 s. Kein Rauschen, aber ein verwischter Radfahrer. Jede Wahl hat ihren Preis.","Das ist das Dreieck: Was du bei einem gewinnst, gibst du beim anderen ab."],quiz:"Teste dich",check:"Prüfen",pick:"Wähle zuerst eine Antwort",right:"Richtig!",wrong:"Nicht ganz.",score:"Ergebnis",qs:[{q:"Du willst bei einem Porträt einen unscharfen Hintergrund. Was änderst du?",o:["Blende auf f/16","Blende auf f/1.8","ISO auf 6400"],a:1,e:"Eine kleine Blendenzahl ergibt eine geringe Schärfentiefe."},{q:"Dein Foto eines rennenden Hundes ist durch Bewegung unscharf. Was hilft?",o:["Längere Belichtungszeit","Kürzere Belichtungszeit","Größere Blendenzahl"],a:1,e:"Eine kurze Belichtungszeit friert Bewegung ein."},{q:"Du gehst von f/4 auf f/8, zwei Stufen weniger Licht. Wie hältst du die Belichtung gleich, ohne die Zeit zu ändern?",o:["ISO 400 auf 1600","ISO 400 auf 800","ISO 400 auf 100"],a:0,e:"Zwei Stufen heißt zweimal verdoppeln: 400, 800, 1600."},{q:"Dein Foto ist zu dunkel und du willst Zeit und Blende nicht ändern. Was tust du?",o:["ISO erhöhen","ISO senken","Blitz ausschalten"],a:0,e:"Eine höhere ISO macht dein Foto heller, mit etwas mehr Rauschen als Nebenwirkung."},{q:"Was ist die Nebenwirkung einer hohen ISO?",o:["Mehr Rauschen","Ein unscharfer Hintergrund","Bewegungsunschärfe"],a:0,e:"Je höher die ISO, desto mehr Korn oder Rauschen siehst du im Foto."},{q:"Wie viel mehr Licht bekommst du, wenn du die Blende um eine Stufe öffnest?",o:["Doppelt so viel","Zehn Prozent mehr","Viermal so viel"],a:0,e:"Eine Stufe verdoppelt oder halbiert das Licht immer."},{q:"Welche Belichtungszeit lässt mehr Licht herein?",o:["1/60 s","1/500 s","Beide gleich viel"],a:0,e:"1/60 s ist länger offen als 1/500 s, also kommt mehr Licht herein."},{q:"Welche Blende lässt das meiste Licht durch?",o:["f/16","f/8","f/2"],a:2,e:"Kleinere Zahl = größere Öffnung = mehr Licht."},{q:"Du willst fließendes Wasser weich und seidig festhalten. Welche Belichtungszeit passt am besten?",o:["1/1000 s","1/2 s","1/250 s"],a:1,e:"Eine lange Belichtungszeit zeigt Bewegung als weiche Wischer."},{q:"Du gehst von 1/250 s auf 1/500 s. Wie hältst du die Helligkeit gleich, ohne die ISO zu ändern?",o:["Blende eine Stufe öffnen, zum Beispiel von f/8 auf f/5.6","Blende eine Stufe schließen, von f/8 auf f/11","Nichts, es bleibt gleich"],a:0,e:"1/500 s gibt eine Stufe weniger Licht. Das gleichst du mit einer Stufe offenerer Blende aus."}]},es:{title:"PhotoByArno Academy – aprende fotografía con animaciones gratuitas",blkH:"Esta lección está en photobyarno.com",blkP:"La PhotoByArno Academy es gratuita, pero solo en su propia web. Allí encontrarás siempre la versión más reciente.",blkGo:"Ir a la Academy",copy:"© 2026 PhotoByArno. Todos los derechos reservados. Puedes mostrar las lecciones gratis en tus propias clases, directamente desde photobyarno.com y citando la fuente.",footer:"Gratis, sin cuenta. Se añaden nuevas lecciones con regularidad.",privacy:"Estadísticas de visitas anónimas, sin cookies.",homeTitle:"Aprende fotografía, paso a paso",homeLead:"Lecciones cortas con animaciones que controlas tú. Desliza, observa qué pasa y entiende por qué.",lessons:"Lecciones",available:"Empezar lección",soon:"Próximamente",back:"Todas las lecciones",k3load:"Cargando 3D…",k3fail:"Este navegador no admite 3D. El resto de la lección funciona con normalidad.",k3drag:"Arrastra para girar",k3front:"Frente",k3angle:"Inclinada",k3side:"Lateral",k3top:"Arriba",k3behind:"Tras la cámara",k3photo:"Foto",k3view3d:"Vista 3D",k3irisH:"Mira dentro de la cámara",k3irisLead:"El diafragma es un anillo de finas láminas metálicas. Desliza y verás cómo la abertura se hace más pequeña: llega menos luz al sensor, que se oscurece.",k3shutLead:"Justo delante del sensor hay dos cortinillas. La primera se abre y la segunda la sigue y vuelve a cerrar. Con una velocidad rápida solo recorre el sensor una rendija estrecha, pero cada línea del sensor recibe luz exactamente el mismo tiempo.",k3light:"Luz respecto a f/1.8",k3stops:"Pasos menos de luz",k3open:"Abertura a 50 mm",k3fire:"Disparar",k3slit:"Rendija abierta",k3slitAll:"Sensor completo",k3time:"Tiempo de exposición",k3slow:"Ralentizado",k3fLead:"El plano de color es donde enfoca la cámara. Verde: el perro está en ese plano y nítido. Rojo: el perro ha salido del plano.",k3dLead:"El bloque verde es todo lo que se ve nítido; el plano azul es donde enfocas. Cambia la apertura, la distancia o la focal y verás crecer o encoger el bloque.",k3bLead:"La forma azul es lo que ve la cámara. Cuanto más larga la focal, más estrecha. Con «Sujeto del mismo tamaño» la cámara retrocede: la persona mantiene su tamaño y la montaña parece acercarse.",k3bokH:"Por qué las luces toman una forma",k3bokLead:"Las pequeñas luces de un fondo desenfocado toman la forma de la abertura del diafragma (bokeh). Con el diafragma abierto son grandes y suaves. Al cerrarlo se hacen más pequeñas y con lados rectos: aquí de siete lados, porque este objetivo tiene 7 láminas.",l0:"Conoce tu cámara",l0d:"¿Cómo se llaman todos los botones y qué hay dentro?",cIntro:"Antes de empezar a ajustar: esta es tu cámara. Gírala, toca los números y mira también dentro, donde la luz encuentra su camino hasta el sensor. No tienes que recordarlo todo de golpe; siempre puedes volver aquí.",cOut:"Por fuera: los controles",cOutd:"Botones, diales y anillos con los que ajustas la cámara. El disparador, el dial de control y el dial de modos son los que más usarás.",cIn:"Por dentro: el camino de la luz",cInd:"La luz atraviesa las lentes, el diafragma y el obturador y llega al sensor. Una réflex tiene además un espejo en medio; esta cámara sin espejo, no.",cPh:"¿Y tu móvil?",cPhd:"Tiene las mismas piezas, pero diminutas: lentes, un sensor y un procesador. El diafragma suele ser fijo, el obturador es electrónico y el zoom se hace cambiando de lente (0,5×, 1×, 3×).",cKey:"Cómo sujetarla firme",cKeyd:"Mano derecha en la empuñadura, índice en el disparador. Apoya el objetivo por debajo en la palma izquierda y pega los codos al cuerpo. Así salen menos fotos movidas.",cTryLead:"Arrastra para girar la cámara. Toca un número o un nombre de la lista. Con «Por dentro» ves a través de la cámara.",cOutside:"Por fuera",cInside:"Por dentro",cPick:"Toca un número para ver cómo se llama esa pieza y para qué sirve. ¿No ves un número? Gira la cámara o elige Detrás o Arriba.",cPickIn:"Sigue la luz: por las lentes (A), el diafragma (B) y el obturador (C) hasta el sensor (D). Toca una letra para saber más.",cMore:"Más sobre esto en:",k3back:"Detrás",cGameStart:"Juego: señálalo",cGameStop:"Parar el juego",cGameAgain:"Jugar otra vez",cGameN:"Pregunta {i} de {n}",cGameQ:"¿Dónde está: {p}?",cGameHint:"Toca el punto correcto de la cámara. ¿No lo ves? Gira la cámara.",cGameOk:"¡Correcto!",cGameNo:"No exactamente. El punto verde es: {p}.",cNext:"Siguiente",cGameScore:"Ver tu resultado",cGameEnd:"Has acertado {s} de {n}.",cGameTop:"Conoces tu cámara. ¡Adelante con el triángulo de exposición!",cGameMid:"¡Bien! Repasa las piezas otra vez y vuelve a jugar.",cGameLow:"Tranquilo, esto es nuevo. Repasa las piezas con calma e inténtalo de nuevo.",cParts:{shutter:["Disparador","Pulsado a medias: la cámara enfoca y mide la luz. Pulsado del todo: se hace la foto. Esa media pulsación vuelve a salir en la lección sobre modos de enfoque."],dial:["Dial de control","Cambia el ajuste que corresponde al modo elegido, como la velocidad de obturación o el diafragma. Muchas cámaras tienen dos: uno delante y otro detrás."],mode:["Dial de modos","Decide quién elige qué. AUTO: la cámara lo hace todo. P: la cámara elige y tú puedes corregir. A (o Av): tú eliges el diafragma. S (o Tv): tú eliges la velocidad. M: tú lo eliges todo."],hotshoe:["Zapata de flash","Una ranura con contactos encima de la cámara. Aquí se coloca un flash externo, un micrófono o un disparador inalámbrico."],evf:["Visor","Aquí acercas el ojo. En una cámara sin espejo es una pantallita que muestra exactamente cómo quedará la foto. Con la ruedecita de al lado (dioptrías) lo ajustas a tu vista."],screen:["Pantalla","Muestra la imagen en directo, el menú y tus fotos. A menudo se puede inclinar y es táctil: práctico para fotos a ras de suelo o por encima de la cabeza."],buttons:["Botones y joystick","Con el joystick mueves el punto de enfoque. Los botones de alrededor abren el menú, muestran tus fotos o las borran. La distribución cambia según la cámara, pero las funciones casi siempre son las mismas."],lens:["Objetivo","El ojo de la cámara. En el borde hay dos números: la distancia focal (aquí 24-70 mm) y la mayor abertura de diafragma (aquí 1:2.8, es decir, f/2.8)."],zoom:["Anillo de zoom","Gíralo para acercar o alejar: cambias la distancia focal. Un objetivo de focal fija no tiene anillo de zoom."],focus:["Anillo de enfoque","Sirve para enfocar a mano (MF). Útil en primeros planos, estrellas o fotos a través de un cristal, donde el autoenfoque duda."],release:["Botón de liberación del objetivo","Púlsalo y gira el objetivo para quitarlo. Cambia de objetivo con la cámara mirando hacia abajo: así entra menos polvo en el sensor."],card:["Tapa de la tarjeta","Detrás de esta tapa está la ranura de la tarjeta de memoria (normalmente SD). Espera a que se apague la luz antes de sacar la tarjeta."],tripod:["Rosca para trípode","Una rosca en la parte inferior para el trípode. Casi todas las cámaras y trípodes usan la misma medida (1/4 de pulgada)."],lenses:["Lentes","Dentro del objetivo hay varias lentes de cristal en fila. Juntas desvían la luz para que llegue una imagen nítida al sensor. Al hacer zoom o enfocar, algunas se desplazan."],iris:["Diafragma","Un anillo de láminas que forma una abertura mayor o menor. Agujero grande: más luz y un fondo más desenfocado. Agujero pequeño: menos luz y más nitidez de delante a atrás."],shutterc:["Obturador","Dos cortinillas justo delante del sensor. Deciden cuánto tiempo llega la luz al sensor: la velocidad de obturación. Muchas cámaras y todos los móviles también pueden exponer de forma electrónica, sin cortinilla."],sensor:["Sensor","El corazón de la cámara: un chip con millones de píxeles sensibles a la luz. ¿Ves que la imagen está al revés? Así entra la luz por las lentes; la cámara simplemente le da la vuelta. Un sensor grande (full frame) capta más luz que uno pequeño (APS-C o móvil)."],proc:["Procesador de imagen","El pequeño ordenador de la cámara. Convierte los datos del sensor en un JPEG, reduce el ruido y calcula el autoenfoque. Si disparas en RAW, la cámara guarda los datos en bruto para que los edites tú después."],battery:["Batería","Suele ir en la empuñadura. La pantalla y el visor gastan mucha energía: lleva una batería de repuesto para un día de fotos y mantenla caliente cuando haga frío."]},cQs:[{q:"¿Qué pasa al pulsar el disparador a medias?",o:["La cámara enfoca y mide la luz","Se hace la foto","Se abre el menú"],a:0,e:"Pulsar a medias es enfocar y medir. La foto solo se hace al pulsar del todo."},{q:"¿Dónde termina la luz?",o:["En el sensor","En el visor","En la tarjeta de memoria"],a:0,e:"La luz atraviesa las lentes, el diafragma y el obturador y llega al sensor."},{q:"Tu objetivo dice 24-70 mm. ¿Qué significa?",o:["La distancia focal va de 24 a 70 mm","El objetivo mide de 24 a 70 mm","La mayor abertura"],a:0,e:"Es la distancia focal: 24 mm es gran angular y 70 mm ya está algo acercado."},{q:"¿Con qué pieza eliges entre AUTO, P, A, S y M?",o:["Con el dial de modos","Con el anillo de enfoque","Con el anillo de zoom"],a:0,e:"El dial de modos decide quién elige qué: tú o la cámara."},{q:"¿Cuál es la forma más segura de cambiar de objetivo?",o:["Con la cámara mirando hacia abajo","Con la abertura hacia arriba, para ver bien lo que haces","Da igual"],a:0,e:"Con la abertura hacia abajo entra menos polvo en el sensor."},{q:"¿Qué hace el obturador?",o:["Decide cuánto tiempo llega la luz al sensor","Decide el tamaño de la abertura","Acerca y aleja"],a:0,e:"El obturador controla la velocidad de obturación. El tamaño de la abertura es el diafragma."},{q:"¿Por qué la imagen en el sensor está al revés?",o:["Así desvían la luz las lentes; la cámara le da la vuelta","El sensor está montado al revés","Solo pasa en cámaras baratas"],a:0,e:"Toda lente invierte la imagen, también la de tu ojo. Tu cerebro y tu cámara simplemente le dan la vuelta."},{q:"¿Para qué sirve la rosca de la parte inferior?",o:["Para un trípode","Para un flash","Para la tarjeta de memoria"],a:0,e:"Ahí se enrosca la cámara al trípode. El flash va en la zapata de arriba."},{q:"¿Qué NO suele tener un móvil?",o:["Un diafragma ajustable","Un sensor","Una lente"],a:0,e:"En la mayoría de los móviles el diafragma es fijo. Lentes y sensor tienen todos."}],l1:"El triángulo de exposición",l1d:"Apertura, velocidad de obturación e ISO: cómo definen juntos tu foto.",l2:"Profundidad de campo",l2d:"¿Qué determina cuánto de tu foto está nítido?",l3:"Distancia focal",l3d:"Gran angular o teleobjetivo: ¿qué le hace a tu imagen?",l4:"Leer el histograma",l4d:"Comprueba de un vistazo si tu foto está bien expuesta.",l5:"Balance de blancos",l5d:"Por qué a veces las fotos salen demasiado azules o naranjas.",l7:"Dirección de la luz",l7d:"Por qué la dirección de la luz hace o arruina tu foto.",l6:"Composición",l6d:"Regla de los tercios, líneas y espacio en el encuadre.",intro:"Cada foto es un equilibrio entre tres ajustes. Si cambias uno, otro tiene que moverse para mantener el mismo brillo. Cada ajuste tiene además un efecto secundario.",cA:"Apertura",cAd:"La abertura del objetivo. Parece al revés: cuanto menor es el número, mayor es la abertura. Es porque el número f es una fracción: f/2 significa una abertura de 1/2, f/16 solo 1/16. Media pizza es más que un dieciseisavo. Abertura grande (f/1.8) = mucha luz y fondo desenfocado. Abertura pequeña (f/16) = menos luz y todo nítido.",cS:"Velocidad de obturación",cSd:"Cuánto tiempo capta luz el sensor. Corta (1/1000 s) congela el movimiento. Larga (1/15 s) hace que los sujetos en movimiento salgan movidos.",cI:"ISO",cId:"Cuánto se amplifica la señal. Más alto aclara la foto, pero añade ruido.",cK:"Cómo funcionan juntos",cKd:"Los fotógrafos miden la luz en pasos (en inglés, stops). Un paso es simplemente un escalón: el doble de luz o la mitad. Si abres el diafragma un paso, entra el doble de luz. Lo compensas con un paso de obturación más rápida o un paso menos de ISO. Cada clic en un control de abajo es exactamente un paso.",lf:"Modos de enfoque",lfd:"Único, continuo, automático o manual: ¿cuándo usar cada uno?",fIntro:"Tu cámara puede enfocar de cuatro maneras. La diferencia está en lo que pasa después de enfocar: ¿el enfoque se queda fijo o sigue a tu sujeto?",fS:"Único (AF-S)",fSd:"La cámara enfoca una vez y fija el enfoque. Ideal para sujetos quietos como paisajes, edificios y retratos.",fC:"Continuo (AF-C)",fCd:"La cámara sigue enfocando mientras mantienes el botón pulsado a medias. Para todo lo que se mueve: deporte, animales, niños jugando.",fA:"Automático (AF-A)",fAd:"La cámara decide. Empieza en único y cambia a continuo cuando el sujeto se mueve. Útil si dudas, pero a veces llega justo tarde.",fM:"Manual (MF)",fMd:"Giras tú el anillo de enfoque. Útil para macro, estrellas o cuando el autoenfoque no deja de buscar, por ejemplo a través de un cristal o en la oscuridad.",fKey:"Cómo empiezas a enfocar",fKeyd:"En la mayoría de cámaras pulsas el disparador a medias para enfocar y a fondo para hacer la foto. Los nombres a veces cambian: el único también se llama 'One Shot' y el continuo 'Servo'.",fTryLead:"Elige un modo y mira qué le pasa al perro. Marco verde = nítido, rojo = desenfocado.",fMode:"Modo",fSubj:"Sujeto",moving:"En movimiento",still:"Quieto",fDist:"Enfocar a",sharp:"Nítido",blurry:"Desenfocado",near:"Cerca",far:"Lejos",subjLbl:"Perro",focusLbl:"Enfoque",switched:"cambia a continuo",fTours:["Un perro sentado, en modo único: enfocar una vez basta. Nítido.","Ahora el perro corre hacia ti. El modo único mantiene el enfoque a la distancia inicial, así que el perro sale cada vez más desenfocado.","El continuo acompaña al perro. Se mantiene nítido hasta muy cerca.","El automático empieza en único y cambia en cuanto el perro se mueve. Fíjate en el breve momento anterior.","Manual a 8 metros: el perro solo está nítido cuando pasa justo por ahí. Así funciona el enfoque previo.","Regla práctica: quieto = único, en movimiento = continuo."],fQs:[{q:"Fotografías un paisaje con trípode. ¿Qué modo?",o:["Continuo","Único","El manual es obligatorio"],a:1,e:"Un paisaje no se mueve, enfocar una vez basta."},{q:"Tu hijo corre hacia ti en un partido de fútbol. ¿Qué modo?",o:["Único","Continuo","El automático siempre es mejor"],a:1,e:"El continuo sigue al sujeto en movimiento."},{q:"El autoenfoque no deja de buscar al disparar a través de una ventana. ¿Qué ayuda?",o:["Enfoque manual","ISO más alto","Obturación más rápida"],a:0,e:"Con el enfoque manual lo fijas tú y el cristal no confunde a la cámara."},{q:"¿Qué hace la cámara en modo continuo (AF-C) mientras pulsas el botón a medias?",o:["Sigue enfocando al sujeto en movimiento","Enfoca una vez y lo fija","No enfoca nada"],a:0,e:"El continuo sigue a tu sujeto mientras mantienes el botón pulsado a medias."},{q:"¿Cómo empiezas a enfocar en la mayoría de cámaras?",o:["Pulsando el disparador a medias","Pulsando el disparador dos veces rápido","Quitando y volviendo a poner el objetivo"],a:0,e:"A medias enfoca, a fondo hace la foto."},{q:"Fotografías a alguien sentado y quieto para un retrato. ¿Qué modo es más sencillo?",o:["Único (AF-S)","Continuo (AF-C)","Siempre manual"],a:0,e:"Alguien quieto apenas se mueve, así que enfocar una vez basta."},{q:"Quieres fotografiar el cielo estrellado y el autoenfoque no encuentra nada. ¿Qué haces?",o:["Enfocar a mano en una estrella brillante","Usar el modo continuo","Bajar el ISO"],a:0,e:"En la oscuridad el autoenfoque a menudo no encuentra nada. A mano, con ampliación sobre una estrella brillante, funciona."},{q:"¿Qué desventaja tiene el modo automático (AF-A)?",o:["A veces cambia a continuo justo demasiado tarde","Solo funciona con luz de día","Oscurece la foto"],a:0,e:"AF-A primero tiene que notar el movimiento, y ese pequeño retraso puede costarte una foto nítida."},{q:"¿Qué significa 'enfoque previo'?",o:["Enfocar en un sitio por donde pasará tu sujeto","Enfocar antes de encender la cámara","Enfocar después de hacer la foto"],a:0,e:"Dejas el enfoque listo en el punto correcto y disparas en cuanto llega tu sujeto."},{q:"En modo único enfocas a un perro a 10 metros, que luego corre hacia ti. ¿Qué pasa?",o:["El perro sale desenfocado, porque el enfoque se queda a 10 metros","El perro sigue nítido","La foto se oscurece"],a:0,e:"El modo único fija el enfoque. Cuando el perro se acerca, sale de la zona nítida."}],toolTry:"Sigue con tus propias fotos",tool1:"Consulta en la pestaña EXIF de Photography Suite con qué apertura, velocidad e ISO hiciste tus propias fotos.",toolGo:"Sal a practicar",tool2:"¿Quieres practicar con sujetos en movimiento? Encuentra lugares de fauna y naturaleza en PhotoByArno Scout.",asgTitle:"Tarea: ahora tú",asgLead:"Elige una tarea, haz la foto y selecciónala abajo. Recibirás consejos al momento. Tu foto se queda en tu dispositivo: nadie más la ve.",asgFileHint:"Usa un JPG directo de tu cámara o móvil, o una exportación de tu programa de edición conservando los metadatos. Las fotos enviadas por WhatsApp o redes sociales pierden los datos que la herramienta necesita.",a1:"Fondo desenfocado",a1d:"Fotografía un sujeto cercano con un fondo tranquilo y desenfocado. Objetivo: apertura f/4 o un número menor.",a2:"Congelar el movimiento",a2d:"Fotografía algo que se mueva rápido, como un perro corriendo, un ciclista o agua salpicando, para que salga nítido y quieto. Objetivo: velocidad de 1/500 s o más rápida.",a3:"Mostrar movimiento",a3d:"Muestra el movimiento como estelas suaves, por ejemplo agua que fluye o tráfico que pasa. Objetivo: velocidad de 1/15 s o más lenta. Usa un trípode o apóyate en algo.",choose:"Elige tu foto",analyzing:"Echando un vistazo…",yourSettings:"Tus ajustes",goodH:"Bien hecho",tipsH:"Consejos para la próxima vez",noExif:"Esta foto no tiene datos de disparo (EXIF). Suele pasar con fotos enviadas por WhatsApp o redes sociales. Usa el archivo original para que pueda revisar tus ajustes. La exposición sí la he revisado.",badFile:"No puedo abrir esta foto. Prueba con un archivo JPG.",phoneNote:"Disparas con un móvil, perfecto para aprender. Ten en cuenta que en los móviles la apertura es fija.",a1ok:"Apertura {v}: bien abierta, eso da un fondo desenfocado.",a1mid:"Apertura {v}: ya bastante abierta. Para más desenfoque, prueba f/2.8 o lo más abierto que permita tu objetivo.",a1bad:"Apertura {v}: así queda mucho nítido. Pon la cámara en A o Av (prioridad a la apertura) y elige el número f más bajo, por ejemplo f/2.8 o f/4.",a1extra:"Aún más desenfoque: acércate al sujeto y deja el fondo lejos. Hacer un poco de zoom también ayuda.",a1phone:"Usa el modo retrato del móvil, acércate al sujeto y deja el fondo lejos.",a2ok:"Velocidad {v}: lo bastante rápida para congelar el movimiento.",a2mid:"Velocidad {v}: suficiente para movimientos tranquilos, pero algo lenta para acción rápida. Prueba 1/1000 s.",a2bad:"Velocidad {v}: demasiado lenta para congelar el movimiento. Pon la cámara en S o Tv (prioridad a la

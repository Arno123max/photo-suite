velocidad) y elige 1/500 s o más rápida. ¿Demasiado oscura? Sube el ISO.",a3ok:"Velocidad {v}: lo bastante lenta para mostrar el movimiento como estelas.",a3mid:"Velocidad {v}: se ve algo de movimiento, pero puede ser más suave. Prueba 1/4 s o más.",a3bad:"Velocidad {v}: demasiado rápida, el movimiento queda congelado. Elige 1/15 s o más lenta, con ISO bajo y un número f mayor (por ejemplo f/11) para no recibir demasiada luz.",a3light:"¿Demasiada luz de día con una velocidad lenta? Un filtro ND funciona como unas gafas de sol para tu objetivo.",a3phone:"Muchos móviles tienen un modo noche o un efecto de 'larga exposición' para esto. Con un modo pro o una app pro eliges tú la velocidad.",shake:"Una velocidad de {v} a pulso es lenta para esta focal. Puede que tus manos se movieran: mantente por encima de 1/{f} s o usa un trípode.",isoLow:"ISO {v}: bajo, poco ruido.",isoHigh:"ISO {v}: alto, así que es probable que se vea ruido. ¿Podrías usar más luz o abrir más el diafragma?",expOk:"La exposición se ve bien: no hay grandes zonas totalmente blancas o negras.",expHi:"El {p}% de tu foto es blanco puro. Ese detalle se ha perdido y no se puede recuperar después. La próxima vez algo más oscura: velocidad más rápida, ISO más bajo o compensación de exposición negativa.",expLo:"El {p}% de tu foto es negro puro. Podría estar algo más clara: velocidad más lenta, ISO más alto o diafragma más abierto.",expDark:"La foto es bastante oscura en general. ¿A propósito? Bien. Si no, dale algo más de luz.",expBright:"La foto es bastante clara en general. ¿A propósito? Bien. Si no, dale algo menos de luz.",sharpNo:"No encuentro detalles realmente nítidos. Revisa el enfoque y mantén la cámara quieta.",sharpOk:"Tu foto tiene detalles nítidos.",encourage:"Cada foto es práctica. Inténtalo de nuevo con estos consejos y compara el resultado.",faNoExif:"Esta foto no tiene datos de disparo (EXIF), por ejemplo porque se envió por WhatsApp o redes sociales. La nitidez sí la he revisado.",fa1:"Quieto y nítido",fa1d:"Fotografía algo que esté quieto, como una flor, un edificio o un objeto, en modo único (AF-S). Coloca el punto de enfoque justo sobre tu sujeto.",fa2:"En movimiento y nítido",fa2d:"Fotografía un sujeto que se acerque a ti, como un perro, un ciclista o un niño jugando, en modo continuo (AF-C). Mantén el botón pulsado a medias y sigue al sujeto.",fa3:"Enfoque previo",fa3d:"Elige un lugar por donde pasará tu sujeto. Enfoca ahí de antemano (manual o único) y dispara en cuanto el sujeto llegue a ese punto.",faWhere:"El marco verde muestra dónde está más nítida tu foto. ¿Está sobre tu sujeto? Entonces el enfoque fue correcto. ¿Está al lado? Entonces la cámara enfocó ahí: la próxima vez pon el punto de enfoque sobre tu sujeto.",faMode:"Tu cámara no guarda de forma estándar qué modo de enfoque usaste. Por eso la herramienta mira el resultado: ¿dónde está nítida tu foto?",faSharpOk:"Tu foto tiene zonas claramente nítidas.",faSharpNo:"No encuentro detalles realmente nítidos. El desenfoque suele tener una de tres causas: enfoque en el sitio equivocado, movimiento del sujeto o movimiento de tus manos.",fa2ok:"Velocidad {v}: lo bastante rápida, así que el posible desenfoque no se debe al movimiento del sujeto.",fa2slow:"Velocidad {v}: bastante lenta para un sujeto en movimiento. El desenfoque por movimiento se parece mucho a un error de enfoque. Elige 1/500 s o más rápida para probar solo el enfoque.",faPhone:"En el móvil, toca tu sujeto en la pantalla para enfocar ahí. Para sujetos en movimiento, el modo ráfaga funciona bien.",dIntro:"La profundidad de campo es la zona delante y detrás de tu punto de enfoque que todavía se ve nítida. A veces quieres todo nítido, como en un paisaje. A veces solo tu sujeto, como en un retrato. Tres cosas deciden lo profunda que es esa zona.",dA:"Apertura",dAd:"Número f grande (f/11, f/16) = mucha profundidad de campo. Número f pequeño (f/1.8, f/2.8) = poca profundidad de campo y fondo suave.",dD:"Distancia al sujeto",dDd:"Cuanto más cerca enfocas, más fina es la zona nítida. Muy de cerca, a veces solo unos milímetros están nítidos.",dF:"Distancia focal",dFd:"Hacer zoom (por ejemplo 200 mm) da menos profundidad de campo y un fondo más desenfocado que abrir el plano (por ejemplo 24 mm).",dKey:"El fondo también cuenta",dKeyd:"Cuanto más lejos está el fondo detrás de tu sujeto, más desenfocado sale. Así que no pongas a alguien contra una pared, sino unos metros por delante.",dTryLead:"Mueve los controles y mira qué postes se vuelven nítidos. La banda verde muestra dónde está la nitidez.",dFocus:"Enfoque a",dFL:"Focal",dZone:"Mostrar zona nítida",dRange:"Nítido de {a} a {b}",dInf:"infinito",dObjF:"Flor",dObjP:"Caminante",dObjT:"Árboles",dTours:["Punto de partida: f/2.8, enfocado en la caminante a 5 metros. Ella está nítida, la flor delante y los árboles detrás están suaves.","Apertura a f/16: la zona nítida se vuelve mucho más profunda. Casi todo está nítido ahora.","Apertura a f/1.4: solo la caminante está nítida, el resto se difumina.","Enfoca la flor a 2 metros: ahora la flor está nítida y la caminante suave. Tú decides adónde va la atención.","Zoom a 200 mm, enfocado a 5 metros: la zona nítida es finísima y el fondo se disuelve en una bruma suave.","Abre a 24 mm con f/8, enfocado a 3 metros: nítido desde cerca hasta lejos. Ideal para paisajes.","En resumen: número f pequeño, cerca y con zoom = poca profundidad de campo. Número f grande, más lejos y sin zoom = mucha profundidad de campo."],dQs:[{q:"Quieres un paisaje nítido de delante a atrás. ¿Qué eliges?",o:["f/1.8 y zoom","f/11 y focal corta","f/4 y enfocar cerca"],a:1,e:"Un número f grande y una focal corta dan mucha profundidad de campo."},{q:"En un retrato el fondo no está lo bastante desenfocado. ¿Qué ayuda más?",o:["Fondo más lejos y un número f pequeño","ISO más alto","Velocidad más rápida"],a:0,e:"Un número f pequeño y más distancia entre sujeto y fondo suavizan el fondo."},{q:"Fotografías una flor muy de cerca y solo un borde está nítido. ¿Qué haces?",o:["Número f mayor, por ejemplo f/8","Número f menor, por ejemplo f/1.8","Velocidad más lenta"],a:0,e:"De cerca la profundidad de campo es muy pequeña. Un número f mayor la hace más profunda."},{q:"¿Qué combinación da la MENOR profundidad de campo?",o:["f/2, cerca y con zoom","f/11, lejos y sin zoom","f/8, lejos y sin zoom"],a:0,e:"Un número f pequeño, poca distancia y el zoom hacen más fina la zona nítida."},{q:"¿Por qué f/22 no siempre es la opción más nítida?",o:["Por la difracción toda la foto se vuelve algo más suave","Porque la foto sale demasiado clara","Porque el autoenfoque deja de funcionar"],a:0,e:"Con una abertura muy pequeña la luz se dobla. Eso hace toda la foto algo menos nítida."},{q:"¿Dónde está, más o menos, la apertura más nítida en muchos objetivos?",o:["Entre f/5.6 y f/8","Siempre en el número f más pequeño","Siempre en f/22"],a:0,e:"La mayoría de objetivos son más nítidos dos o tres pasos por debajo de su máxima abertura."},{q:"Fotografías una seta muy de cerca. ¿Cómo la consigues totalmente nítida con el fondo suave?",o:["f/5.6 a f/8 y una seta con mucho espacio detrás","f/1.8 y lo más cerca posible","f/22 con el fondo justo detrás"],a:0,e:"Un número f medio deja la seta nítida. La distancia al fondo lo suaviza."},{q:"Alguien está contra una pared y la pared sale nítida. ¿Qué ayuda más?",o:["Poner a la persona unos metros delante de la pared","Un ISO más alto","Una velocidad más rápida"],a:0,e:"Cuanto más lejos está el fondo detrás de tu sujeto, más desenfocado sale."},{q:"Solo cambias la distancia de enfoque de 2 a 10 metros. ¿Qué pasa con la profundidad de campo?",o:["Aumenta","Disminuye","Sigue igual"],a:0,e:"Cuanto más lejos enfocas, más profunda es la zona nítida."},{q:"¿Qué hace el zoom a 200 mm con el fondo?",o:["Se desenfoca más","Se vuelve más nítido","No cambia nada"],a:0,e:"Con zoom tienes menos profundidad de campo, así que el fondo se suaviza."}],da1:"Todo nítido",da1d:"Fotografía un paisaje o una calle donde todo deba estar nítido de delante a atrás. Objetivo: f/8 a f/11.",da2:"Solo tu sujeto",da2d:"Fotografía una persona, un animal o un objeto con el fondo suave. Objetivo: f/2.8 o menos, con el sujeto bien por delante del fondo.",da3:"Muy de cerca",da3d:"Fotografía una flor o un objeto pequeño tan cerca como tu cámara pueda enfocar. Descubre lo fina que se vuelve la zona nítida.",dMap:"Los cuadros verdes muestran dónde está nítida tu foto. Así ves de un vistazo cuánta profundidad de campo tenías.",dShare:"El {p}% de tu foto está nítido.",d1apOk:"Apertura {v}: bien, eso da mucha profundidad de campo y tu objetivo está en su punto más nítido.",d1apMid:"Apertura {v}: bien. Para más nitidez de delante a atrás, prueba f/8 a f/11.",d1apBad:"Apertura {v}: así la profundidad de campo es pequeña. Elige f/8 a f/11 en modo A o Av.",d1fracOk:"Gran parte de tu foto está nítida, justo lo que querías.",d1fracBad:"Solo una pequeña parte está nítida. Usa un número f mayor, reduce el zoom y enfoca a un tercio de la escena, no al fondo.",d1fl:"Focal {v}: con zoom hay menos profundidad de campo. Prueba a reducir el zoom.",d1phone:"Los móviles tienen de forma natural mucha profundidad de campo, así que tenerlo todo nítido suele ser fácil.",d2apOk:"Apertura {v}: bien abierta, eso da poca profundidad de campo.",d2apMid:"Apertura {v}: ya bastante abierta. ¿Tu objetivo llega a f/2.8 o menos? Pruébalo.",d2apBad:"Apertura {v}: así queda mucho nítido. Elige el número f más bajo de tu objetivo.",d2fracOk:"Solo una pequeña parte está nítida: tu sujeto destaca.",d2fracBad:"Gran parte de tu foto está nítida. Acércate al sujeto, aleja el fondo o haz zoom.",d3fracOk:"Tan de cerca, la zona nítida es muy fina, y tu foto lo muestra bien.",d3thin:"Hay muy poco nítido. ¿Quieres más del sujeto nítido? Elige f/8 o aléjate un poco.",d3info:"Apertura {v}: muy de cerca, incluso f/8 da poca profundidad de campo.",newQs:"Otras preguntas",shareBtn:"Compartir esta lección",copied:"Enlace copiado",copyFail:"Copia este enlace:",useful:"¿Te ha sido útil esta lección?",thanks:"¡Gracias por tu opinión!",dSweet:"Un número mayor no siempre es más nítido",dSweetd:"La mayoría de objetivos son más nítidos entre f/5.6 y f/8. A partir de f/16 toda la foto se vuelve algo más suave por la difracción: la luz se dobla al pasar por la abertura pequeña. Si quieres mucha profundidad de campo, f/8 a f/11 suele ser la opción segura.",d1diff:"Apertura {v}: mucha profundidad de campo, pero desde f/16 toda la foto se suaviza algo por la difracción. Prueba f/8 o f/11 y compara.",da4:"Seta",da4d:"Fotografía una seta de cerca: toda la seta nítida y el fondo suave. Ponte a su altura, elige f/5.6 a f/8 y busca una con mucho espacio detrás.",d4apOk:"Apertura {v}: justo lo adecuado para que toda la seta salga nítida.",d4apOpen:"Apertura {v}: tan de cerca, la zona nítida es finísima. Elige f/5.6 a f/8 para que sombrero y pie salgan nítidos.",d4apClosed:"Apertura {v}: así el fondo también sale más nítido y la foto algo más suave por la difracción. Prueba f/8.",d4fracOk:"Tu seta destaca: el fondo está suave.",d4fracBad:"Gran parte de tu foto está nítida, así que el fondo distrae. Busca una seta con más espacio detrás, o aléjate un poco y haz zoom.",d4slow:"Velocidad {v}: bastante lenta. Usa un trípode, un saco de arena o tu mochila en el suelo, la seta no se va a mover. Espera también a que pare el viento.",d4phone:"Usa el modo macro o retrato del móvil y sostenlo a la altura de la seta.",bIntro:"La distancia focal, en milímetros, decide cuánto del mundo cabe en tu encuadre. Un número pequeño es gran angular: mucho espacio en la imagen. Un número grande es teleobjetivo: como hacer zoom. Pero pasa algo más que solo acercar las cosas.",bA:"Ángulo de visión",bAd:"A 24 mm ves un ángulo amplio de unos 84°, a 50 mm unos 47° y a 200 mm solo 12°. Cuanto mayor el número, más pequeño el trozo de mundo que captas.",bP:"Perspectiva",bPd:"Con un gran angular, lo cercano parece grande y el fondo lejano. Con un teleobjetivo,

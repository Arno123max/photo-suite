<title>PhotoByArno Academy – learn photography with free interactive animations</title>
<meta name="description" content="Learn photography with interactive 3D lessons: get to know your camera, the exposure triangle, focus modes, depth of field and focal length. Free, no account needed, in English, Dutch, German and Spanish.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--soft:#efede8;--text:#1d1d1b;--text2:#5f5e5a;--muted:#8a8984;
  --line:rgba(0,0,0,.10);--line2:rgba(0,0,0,.18);--accent:#1d6fd1;--accent-bg:#e6f0fb;--accent-text:#0c447c;
  --ok:#2f7a1f;--ok-bg:#eaf3de;--bad:#a32d2d;--bad-bg:#fcebeb;--radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not(.embedded){--bg:#161615;--card:#21211f;--soft:#2a2a28;--text:#f1efe8;--text2:#b4b2a9;--muted:#888780;
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.20);--accent:#5c9ce6;--accent-bg:#0c2f55;--accent-text:#b5d4f4;
  --ok:#97c459;--ok-bg:#1f3410;--bad:#f09595;--bad-bg:#4a1717;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:600;letter-spacing:-.01em}
.badge{font-size:12px;font-weight:500;background:var(--accent-bg);color:var(--accent-text);padding:2px 9px;border-radius:999px}
.lang{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.lang button{border:0;background:transparent;color:var(--text2);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--text);color:var(--bg)}
h1{font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600;margin:28px 0 8px}
h3{font-size:16px;font-weight:600;margin:0 0 4px}
p{margin:0 0 12px}
.lead{color:var(--text2);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;font:inherit;color:inherit;width:100%}
button.card{cursor:pointer;transition:border-color .15s}
button.card:hover{border-color:var(--accent)}
.card i{font-size:24px;color:var(--accent)}
.card p{font-size:14px;color:var(--text2);margin:0}
.card.soon{opacity:.6}
.card.soon i{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;margin-top:10px;background:var(--soft);color:var(--text2)}
.tag.go{background:var(--accent-bg);color:var(--accent-text)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.concepts{display:grid;gap:10px;margin:14px 0 6px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px}
.concept i{font-size:22px;color:var(--accent);margin-top:2px}
.concept p{font-size:14px;color:var(--text2);margin:0}
.key{background:var(--accent-bg);color:var(--accent-text);border-radius:12px;padding:12px 14px;margin:4px 0 6px;display:flex;gap:12px}
.key i{font-size:22px;margin-top:2px}
.key p{font-size:14px;margin:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
canvas{width:100%;display:block;border-radius:10px}
.meterlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 0 4px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.meter .mid{position:absolute;left:50%;top:-4px;width:1px;height:14px;background:var(--line2)}
.meter .mk{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);left:50%;transition:left .3s}
.evtxt{font-size:14px;font-weight:600;text-align:center;margin:8px 0 14px}
.row{display:flex;align-items:center;gap:10px}
.row label{font-size:14px;color:var(--text2);width:90px;flex-shrink:0}
.row input{flex:1;accent-color:var(--accent)}
.row span{font-size:14px;font-weight:600;min-width:72px;text-align:right}
.hint{font-size:12px;color:var(--muted);margin:2px 0 12px 100px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:var(--radius);padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cap{font-size:14px;color:var(--text2);margin:12px 0 0;min-height:44px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.q h3{font-size:15px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px}
.opt input{accent-color:var(--accent)}
.fb{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.err{font-size:13px;color:var(--bad);margin-top:6px;display:none}
.score{font-size:15px;font-weight:600;margin-top:10px}
.tool{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;text-decoration:none;color:inherit}
.tool:hover{border-color:var(--accent)}
.tool>i{font-size:24px;color:var(--accent)}
.tool p{font-size:14px;color:var(--text2);margin:0}
.tool .go{margin-left:auto;font-size:20px;color:var(--accent)}
.seg.wrap button{white-space:normal;line-height:1.3}
.small{font-size:13px;color:var(--muted);margin:8px 0 12px}
.pick{display:inline-flex}
#asgOut img{display:block;max-width:100%;max-height:300px;margin:14px auto 10px;border-radius:10px}
.imgwrap{position:relative;width:fit-content;max-width:100%;margin:14px auto 10px}
.imgwrap img{margin:0 !important}
.imgwrap .sbox{position:absolute;border:3px solid #3fb950;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.imgwrap .tbox{position:absolute;background:rgba(63,185,80,.32);outline:1px solid rgba(63,185,80,.9);outline-offset:-1px}
.dofbar{position:relative;height:58px;margin:14px 10px 0}
.dofbar .tr{position:absolute;left:0;right:0;top:30px;height:6px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.dofbar .band{position:absolute;top:29px;height:8px;border-radius:4px;background:#3fb950;opacity:.85}
.dofbar .obj{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--text2);white-space:nowrap;text-align:center}
.dofbar .obj b{display:block;width:2px;height:10px;background:var(--text2);margin:2px auto 0}
.dofbar .fm{position:absolute;top:40px;transform:translateX(-50%);font-size:11px;color:var(--accent);white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:2px 0 10px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.pair figure{margin:0}
.pair img{display:block;width:100%;border-radius:8px}
.pair figcaption{font-size:13px;color:var(--text2);margin-top:4px;text-align:center}
.seg.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.grid2 button{border-left:0}
.seg.grid2 button:nth-child(2n){border-left:1px solid var(--line)}
.seg.grid2 button:nth-child(n+3){border-top:1px solid var(--line)}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.lfoot .lbl{margin:0}
.thumbs{display:flex;gap:6px}
.thumbs .btn{padding:7px 12px}
.thumbs .btn i{font-size:18px}
.lfoot .share{margin-left:auto}
.lmsg{width:100%;font-size:13px;color:var(--text2);margin:0}
.lmsg input{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--text)}
@media (max-width:520px){.lfoot .share{margin-left:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:13px;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 10px}
.fbk{list-style:none;padding:0;margin:6px 0 12px}
.fbk li{display:flex;gap:10px;font-size:14px;padding:9px 12px;border-radius:10px;margin-bottom:6px}
.fbk li i{font-size:18px;margin-top:1px}
.fbk .g{background:var(--ok-bg);color:var(--ok)}
.fbk .t{background:var(--accent-bg);color:var(--accent-text)}
.fbk .n{background:var(--soft);color:var(--text2)}
#histo{width:100%;height:70px;display:block;border-radius:8px;background:var(--soft);margin:4px 0 10px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--text2);padding:9px 4px;font:inherit;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.lbl{font-size:13px;color:var(--text2);margin:0}
.dbar{position:relative;height:62px;margin:14px 28px 0}
.dbar .tr{position:absolute;left:0;right:0;top:27px;height:4px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.dbar .mkr{position:absolute;transform:translateX(-50%);text-align:center;font-size:11px;white-space:nowrap}
.dbar .mkr b{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto}
.dbar .sub{top:2px}.dbar .sub b{margin-top:4px}
.dbar .foc{top:23px}.dbar .foc b{margin-bottom:3px}
.dends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:2px 0 8px}
.fstat{font-size:14px;font-weight:600;text-align:center;margin:4px 0 12px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.embedded,.embedded body{background:transparent}
.embedded .wrap{max-width:none;padding:0 0 8px}
.lead{max-width:75ch}
@media (min-width:900px){
  .embedded .concepts{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .embedded .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .embedded .stage,.embedded #quiz,.embedded #asg,.embedded .tool{max-width:860px}
}
@media (max-width:420px){.row label{width:78px}.hint{margin-left:88px}.row span{min-width:64px}}
/* 3D-onderdelen (v1.16) */
.k3v{position:relative;width:100%;aspect-ratio:4/3;max-height:460px;border-radius:10px;overflow:hidden;background:var(--soft);touch-action:pan-y;cursor:grab}
.k3v:active{cursor:grabbing}
.k3v.k3wide{aspect-ratio:16/10;margin-top:4px}
.k3v canvas{width:100%;height:100%;border-radius:0}
.k3msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;margin:0;font-size:13px;color:var(--muted)}
.k3bar{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:10px 0 10px}
.k3bar .seg{margin:0;flex:0 1 auto}
.k3bar .seg button{padding:7px 12px}
.k3hint{font-size:12px;color:var(--muted);margin-left:auto}
.k3stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 0}
.k3stats div{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:2px;align-content:start}
.k3stats span{font-size:11.5px;color:var(--text2);line-height:1.3}
.k3stats b{font-size:15px;font-variant-numeric:tabular-nums}
.k3photo{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#3c5a3a;margin-top:4px}
.k3photo canvas{position:absolute;inset:-6%;width:112%;height:112%;border-radius:0}
.k3photo canvas.fg{inset:0;width:100%;height:100%}
.k3sw{margin:0 0 10px;max-width:340px}
.k3sw button i{font-size:15px;vertical-align:-2px}
.k3sec .seg{margin-top:0}
/* Les 'Je camera leren kennen' (v1.17) */
.hsov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.45);transition:opacity .2s,background .2s}
.hs.off{opacity:0;pointer-events:none}
.hs.sel{background:#fff;color:var(--accent);border-color:var(--accent)}
.hs.q{background:rgba(255,255,255,.92);border-color:var(--accent);width:24px;height:24px;margin:-12px 0 0 -12px}
.hs.ok{background:#3fb950;border-color:#fff}
.hs.no{background:#e24b4a;border-color:#fff}
.hs:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.caminfo{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;min-height:60px}
.caminfo h3{font-size:15px;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.caminfo p{margin:0;font-size:14px;color:var(--text2)}
.caminfo p.lbl{font-size:12px;margin-bottom:2px}
.caminfo .btn{margin-top:10px;padding:6px 12px;font-size:13px}
.caminfo.ok{background:var(--ok-bg)}.caminfo.ok h3{color:var(--ok)}
.caminfo.no{background:var(--bad-bg)}.caminfo.no h3{color:var(--bad)}
.cnum{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.camlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0 0 6px}
.camlist button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;line-height:1.3;cursor:pointer;min-width:0}
.camlist button:hover{border-color:var(--accent)}
.camlist button b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.camlist button span{min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.camlist button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
</style>
</head>

</div>

<script>let n=["en","nl","de","es"],r={suite:"https://photobyarno.com/tools/photography-suite",studio:"https://photobyarno.com/tools/instagram-studio",scout:"https://photobyarno.com/tools/scout"};function L(e,a,t,o,n){return`<a class="tool" href="${r[e]}" target="_top" data-track="${o}/tool-${e}"><i class="ti ${a}" aria-hidden="true"></i><div><h3>${Q(n||"toolTry")}</h3><p>${Q(t)}</p></div><i class="ti ti-arrow-right go" aria-hidden="true"></i></a>`}document.addEventListener("click",e=>{e=e.target.closest&&e.target.closest("a[data-track]");e&&R(e.dataset.track,"Tool link clicked",!0)});let s={en:{title:"PhotoByArno Academy – learn photography with free interactive animations",blkH:"This lesson lives on photobyarno.com",blkP:"The PhotoByArno Academy is free to use, but only on its own website. That's also where you'll always find the latest version.",blkGo:"Go to the Academy",copy:"© 2026 PhotoByArno. All rights reserved. You're welcome to show the lessons in your own class for free, directly from photobyarno.com and with credit.",footer:"Free, no account needed. New lessons are added regularly.",privacy:"Anonymous visitor statistics, no cookies.",homeTitle:"Learn photography, step by step",homeLead:"Short lessons with animations you control yourself. Slide, watch what happens and understand why.",lessons:"Lessons",available:"Start lesson",soon:"Coming soon",back:"All lessons",k3load:"Loading 3D…",k3fail:"3D is not available in this browser. The rest of the lesson works as usual.",k3drag:"Drag to rotate",k3front:"Front",k3angle:"Angled",k3side:"Side",k3top:"Top",k3behind:"Behind camera",k3photo:"Photo",k3view3d:"3D view",k3irisH:"Look inside the camera",k3irisLead:"The aperture is a ring of thin metal blades. Slide and watch the opening get smaller: less light reaches the sensor, which turns darker.",k3shutLead:"Right in front of the sensor sit two curtains. The first one opens, the second follows and closes. At a fast shutter speed only a narrow slit travels across the sensor, yet every line of the sensor gets exactly the same time.",k3light:"Light compared to f/1.8",k3stops:"Stops less light",k3open:"Opening at 50 mm",k3fire:"Release shutter",k3slit:"Open slit",k3slitAll:"Whole sensor",k3time:"Exposure time",k3slow:"Slowed down",k3fLead:"The coloured plane is where the camera focuses. Green: the dog is in that plane and sharp. Red: the dog has left the plane.",k3dLead:"The green block is everything that looks sharp, the blue plane is where you focus. Change aperture, distance or focal length and watch the block grow or shrink.",k3bLead:"The blue shape is what the camera sees. A longer focal length makes it narrower. With 'Subject same size' the camera walks back, so the person stays the same size while the mountain seems to come closer.",k3bokH:"Why highlights take on a shape",k3bokLead:"Small lights in a blurry background take the shape of the aperture opening (bokeh). Wide open they are big and soft. Stop down and they get smaller, with straight edges: seven-sided here, because this lens has 7 blades.",l0:"Getting to know your camera",l0d:"What are all the buttons called, and what's inside?",cIntro:"Before you start adjusting settings: meet your camera. Turn it around, tap the numbers and look inside too, where the light finds its way to the sensor. You don't have to remember everything at once; you can always come back here.",cOut:"Outside: the controls",cOutd:"Buttons, dials and rings you use to set up the camera. You'll use the shutter button, the control dial and the mode dial the most.",cIn:"Inside: the path of the light",cInd:"Light passes through the lens elements, the aperture and the shutter, and then lands on the sensor. A DSLR has a mirror in between as well; this mirrorless camera doesn't.",cPh:"And your phone?",cPhd:"It has the same parts, just tiny: lenses, a sensor and a processor. The aperture is usually fixed, the shutter is electronic, and you 'zoom' by switching between lenses (0.5×, 1×, 3×).",cKey:"How to hold it steady",cKeyd:"Right hand around the grip, index finger on the shutter button. Rest the lens on your left palm from below and keep your elbows against your body. You'll get fewer blurry photos.",cTryLead:"Drag to rotate the camera. Tap a number or a name in the list. Choose 'Inside' to look through the camera.",cOutside:"Outside",cInside:"Inside",cPick:"Tap a number to see what that part is called and what it does. Can't see a number? Rotate the camera or choose Back or Top.",cPickIn:"Follow the light: through the lens elements (A), the aperture (B) and the shutter (C) to the sensor (D). Tap a letter to learn more.",cMore:"More about this in:",k3back:"Back",cGameStart:"Play: point it out",cGameStop:"Stop the game",cGameAgain:"Play again",cGameN:"Question {i} of {n}",cGameQ:"Find this part: {p}",cGameHint:"Tap the right spot on the camera. Can't see it? Rotate the camera.",cGameOk:"Correct!",cGameNo:"Not quite. The green dot is: {p}.",cNext:"Next",cGameScore:"See your score",cGameEnd:"You got {s} out of {n} right.",cGameTop:"You know your camera. On to the exposure triangle!",cGameMid:"Nice! Tap through the parts once more and play again.",cGameLow:"No worries, this is new. Tap through the parts calmly and try again.",cParts:{shutter:["Shutter button","Press halfway: the camera focuses and measures the light. Press all the way: the photo is taken. That half-press comes back in the lesson on focus modes."],dial:["Control dial","Changes the setting that belongs to the chosen mode, such as shutter speed or aperture. Many cameras have two: one at the front and one at the back."],mode:["Mode dial","Decides who chooses what. AUTO: the camera does everything. P: the camera chooses, you can adjust. A (or Av): you choose the aperture. S (or Tv): you choose the shutter speed. M: you choose everything yourself."],hotshoe:["Hot shoe","A slot with contacts on top of the camera. Slide an external flash, a microphone or a wireless remote in here."],evf:["Viewfinder","You hold your eye to this. On a mirrorless camera it's a small screen that shows exactly how your photo will look. The little wheel next to it (diopter) adjusts it to your own eyesight."],screen:["Screen","Shows the live view, the menu and your photos. Often you can tilt it and use it as a touchscreen: handy for shots close to the ground or above your head."],buttons:["Buttons and joystick","The joystick moves the focus point. The buttons around it open the menu, play back your photos or delete them. The layout differs per camera, but the functions are almost always the same."],lens:["Lens","The camera's eye. Two numbers are printed on the rim: the focal length (here 24-70 mm) and the widest aperture (here 1:2.8, so f/2.8)."],zoom:["Zoom ring","Turn it to zoom in and out: you change the focal length. A lens with a single fixed focal length has no zoom ring."],focus:["Focus ring","Lets you focus by hand (MF). Useful for close-ups, stars or shooting through a window, where autofocus hesitates."],release:["Lens release button","Press it and turn the lens to take it off. Change lenses with the camera pointing down, so less dust lands on the sensor."],card:["Memory card door","Behind this door is the slot for the memory card (usually SD). Wait until the light is off before you take the card out."],tripod:["Tripod socket","A screw thread on the bottom for a tripod. Almost all cameras and tripods use the same size (1/4 inch)."],lenses:["Lens elements","Inside the lens are several glass elements in a row. Together they bend the light so a sharp image lands on the sensor. When you zoom or focus, some of them slide back and forth."],iris:["Aperture","A ring of blades that makes a larger or smaller opening. Big hole: more light and a softer background. Small hole: less light and more sharpness from front to back."],shutterc:["Shutter","Two curtains just in front of the sensor. They decide how long light falls on the sensor: the shutter speed. Many cameras and all phones can also expose electronically, without a moving curtain."],sensor:["Sensor","The heart of the camera: a chip with millions of light-sensitive pixels. Notice the image is upside down? That's how light comes through the lens; the camera simply flips it back. A large sensor (full frame) gathers more light than a smaller one (APS-C or phone)."],proc:["Image processor","The camera's small computer. It turns the sensor data into a JPEG, reduces noise and calculates the autofocus. If you shoot RAW, the camera keeps the raw data so you can edit it yourself later."],battery:["Battery","Usually sits in the grip. The screen and viewfinder use a lot of power: bring a spare battery for a full day of shooting and keep it warm when it's cold."]},cQs:[{q:"What happens when you press the shutter button halfway?",o:["The camera focuses and measures the light","The photo is taken","The menu opens"],a:0,e:"Half-pressing means focusing and metering. The photo is only taken when you press all the way."},{q:"Where does the light end up?",o:["On the sensor","In the viewfinder","On the memory card"],a:0,e:"Light passes through the lens elements, the aperture and the shutter, and then lands on the sensor."},{q:"Your lens says 24-70 mm. What does that mean?",o:["The focal length ranges from 24 to 70 mm","The lens is 24 to 70 mm long","The widest aperture"],a:0,e:"It's the focal length: 24 mm is wide angle, 70 mm is a bit zoomed in."},{q:"Which part lets you choose between AUTO, P, A, S and M?",o:["The mode dial","The focus ring","The zoom ring"],a:0,e:"The mode dial decides who chooses what: you or the camera."},{q:"What's the safest way to change lenses?",o:["With the camera pointing down","With the opening facing up, so you can see what you're doing","It doesn't matter"],a:0,e:"With the opening facing down, less dust lands on the sensor."},{q:"What does the shutter do?",o:["It decides how long light falls on the sensor","It decides how big the opening is","It zooms in and out"],a:0,e:"The shutter controls the shutter speed. The size of the opening is the aperture."},{q:"Why is the image on the sensor upside down?",o:["That's how lenses bend light; the camera flips it back","The sensor is mounted the wrong way","It only happens with cheap cameras"],a:0,e:"Every lens turns the image upside down, including the one in your eye. Your brain and your camera simply flip it back."},{q:"What is the screw thread on the bottom for?",o:["A tripod","A flash","The memory card"],a:0,e:"That's where you screw the camera onto a tripod. A flash goes in the hot shoe on top."},{q:"What does a phone usually NOT have?",o:["An adjustable aperture","A sensor","A lens"],a:0,e:"On most phones the aperture is fixed. They all have lenses and a sensor."}],l1:"The exposure triangle",l1d:"Aperture, shutter speed and ISO: how they shape your photo together.",l2:"Depth of field",l2d:"What decides how much of your photo is sharp?",l3:"Focal length",l3d:"Wide angle or telephoto: what does it do to your image?",l4:"Reading the histogram",l4d:"See at a glance whether your photo is well exposed.",l5:"White balance",l5d:"Why photos sometimes turn out too blue or too orange.",l7:"Direction of light",l7d:"Why the direction of light makes or breaks your photo.",l6:"Composition",l6d:"Rule of thirds, lines and space in your frame.",intro:"Every photo is a balance of three settings. Change one, and another has to move to keep the same brightness. Each setting also has a side effect.",cA:"Aperture",cAd:"The opening in your lens. It feels backwards: the smaller the number, the bigger the opening. That's because the f-number is a fraction: f/2 means an opening of 1/2, f/16 only 1/16. Half a pizza is more than a sixteenth. Big opening (f/1.8) = lots of light and a blurry background. Small opening (f/16) = less light and everything sharp.",cS:"Shutter speed",cSd:"How long the sensor collects light. Short (1/1000 s) freezes motion. Long (1/15 s) makes moving subjects blur.",cI:"ISO",cId:"How much the signal is amplified. Higher makes your photo brighter but adds noise.",cK:"How they work together",cKd:"Photographers measure light in stops. A stop is simply one step: twice as much light, or half. Open the aperture one stop and you get twice the light. You balance that with one stop faster shutter or one stop lower ISO. Every click on a slider below is exactly one stop.",lf:"Focus modes",lfd:"Single, continuous, automatic or manual: when do you use which?",fIntro:"Your camera can focus in four ways. The difference is what happens after it finds focus: does it lock, or does it keep following your subject?",fS:"Single (AF-S)",fSd:"The camera focuses once and then locks. Ideal for still subjects like landscapes, buildings and portraits.",fC:"Continuous (AF-C)",fCd:"The camera keeps focusing as long as you half-press the button. For anything that moves: sports, animals, children at play.",fA:"Automatic (AF-A)",fAd:"The camera decides. It starts in single and switches to continuous when the subject starts moving. Handy when in doubt, but sometimes just too late.",fM:"Manual (MF)",fMd:"You turn the focus ring yourself. Useful for macro, stars, or when autofocus keeps hunting, for example through glass or in the dark.",fKey:"How you start focusing",fKeyd:"On most cameras you half-press the shutter button to focus and press it fully to take the photo. Names sometimes differ per camera: single is also called 'One Shot' and continuous 'Servo'.",fTryLead:"Pick a mode and watch what happens to the dog. Green frame = sharp, red = blurry.",fMode:"Mode",fSubj:"Subject",moving:"Moving",still:"Still",fDist:"Focus at",sharp:"Sharp",blurry:"Blurry",near:"Near",far:"Far",subjLbl:"Dog",focusLbl:"Focus",switched:"switches to continuous",fTours:["A dog sitting still, in single mode: focusing once is enough. Sharp.","Now the dog runs towards you. Single keeps focus locked at the starting distance, so the dog gets blurrier and blurrier.","Continuous moves along with the dog. It stays sharp, all the way in.","Automatic starts in single and switches as soon as the dog moves. Watch the short moment before it does.","Manual at 8 metres: the dog is only sharp when it's exactly there. This is how pre-focusing works.","Rule of thumb: still = single, moving = continuous."],fQs:[{q:"You're shooting a landscape from a tripod. Which mode?",o:["Continuous","Single","Manual is required"],a:1,e:"A landscape doesn't move, so focusing once is enough."},{q:"Your child runs towards you during a football match. Which mode?",o:["Single","Continuous","Automatic is always better"],a:1,e:"Continuous keeps following the moving subject."},{q:"Autofocus keeps hunting when you shoot through a window. What helps?",o:["Manual focus","Higher ISO","Faster shutter speed"],a:0,e:"With manual focus you set it yourself, so the glass can't distract the camera."},{q:"What does the camera do in continuous mode (AF-C) while you half-press the button?",o:["Keeps focusing on the moving subject","Focuses once and locks","Doesn't focus at all"],a:0,e:"Continuous keeps following your subject as long as you hold the button half-pressed."},{q:"How do you start focusing on most cameras?",o:["Half-press the shutter button","Press the shutter button twice quickly","Take the lens off and put it back on"],a:0,e:"Half-press focuses, a full press takes the photo."},{q:"You're photographing someone sitting still for a portrait. Which mode is simplest?",o:["Single (AF-S)","Continuous (AF-C)","Always manual"],a:0,e:"Someone sitting still hardly moves, so focusing once is enough."},{q:"You want to photograph the night sky and autofocus can't find anything. What do you do?",o:["Focus manually on a bright star","Use continuous mode","Lower the ISO"],a:0,e:"In the dark autofocus often finds nothing. By hand, with magnification on a bright star, it works."},{q:"What is a drawback of automatic mode (AF-A)?",o:["It sometimes switches to continuous just too late","It only works in daylight","It makes the photo darker"],a:0,e:"AF-A first has to notice movement, and that short delay can cost you a sharp photo."},{q:"What does 'pre-focusing' mean?",o:["Focusing on a spot your subject will pass","Focusing before turning the camera on","Focusing after taking the photo"],a:0,e:"You set focus on the right spot in advance and shoot as soon as your subject gets there."},{q:"In single mode you focus on a dog at 10 metres, which then runs towards you. What happens?",o:["The dog gets blurry, because focus stays at 10 metres","The dog stays sharp","The photo gets darker"],a:0,e:"Single locks focus. When the dog comes closer, it falls outside the sharp zone."}],toolTry:"Continue with your own photos",tool1:"See which aperture, shutter speed and ISO your own photos were taken with, in the EXIF tab of the Photography Suite.",toolGo:"Go and practise",tool2:"Want to practise with moving subjects? Find wildlife and nature spots in PhotoByArno Scout.",asgTitle:"Assignment: your turn",asgLead:"Pick an assignment, take the photo and choose it below. You'll get tips right away. Your photo stays on your own device: nobody else sees it.",asgFileHint:"Use a JPG straight from your camera or phone, or an export from your editing app with metadata kept. Photos sent through WhatsApp or social media lose the data the tool needs.",a1:"Blurry background",a1d:"Photograph a nearby subject with a calm, blurry background. Goal: aperture f/4 or a smaller number.",a2:"Freeze motion",a2d:"Photograph something that moves fast, like a running dog, a cyclist or splashing water, so it looks sharp and still. Goal: shutter speed 1/500 s or faster.",a3:"Show motion",a3d:"Show movement as soft streaks, for example flowing water or passing traffic. Goal: shutter speed 1/15 s or longer. Use a tripod or lean against something.",choose:"Choose your photo",analyzing:"Taking a look…",yourSettings:"Your settings",goodH:"Well done",tipsH:"Tips for next time",noExif:"This photo has no shooting data (EXIF). That often happens with photos sent through WhatsApp or social media. Use the original file so I can review your settings. I did check the exposure.",badFile:"I can't open this photo. Try a JPG file.",phoneNote:"You're shooting with a phone, great for learning. Just note: phones have a fixed aperture.",a1ok:"Aperture {v}: nicely open, which gives a blurry background.",a1mid:"Aperture {v}: fairly open already. For more blur, try f/2.8 or as low as your lens allows.",a1bad:"Aperture {v}: this keeps a lot in focus. Set your camera to A or Av (aperture priority) and choose the lowest f-number, for example f/2.8 or f/4.",a1extra:"Even more blur: move closer to your subject and keep the background far away. Zooming in a bit helps too.",a1phone:"Use your phone's portrait mode, get close to your subject and keep the background far away.",a2ok:"Shutter speed {v}: fast enough to freeze motion.",a2mid:"Shutter speed {v}: fine for calm movement, but just too slow for fast action. Try 1/1000 s.",a2bad:"Shutter speed {v}: too slow to freeze motion. Set your camera to S or Tv (shutter priority) and choose 1/500 s or faster. Too dark? Raise the ISO.",a3ok:"Shutter speed {v}: long enough to show motion as streaks.",a3mid:"Shutter speed {v}: some motion shows, but it can be softer. Try 1/4 s or longer.",a3bad:"Shutter speed {v}: too short, so motion stands still. Choose 1/15 s or longer, with a low ISO and a larger f-number (for example f/11) so you don't get too much light.",a3light:"Too bright in daylight with a long shutter speed? An ND filter works like sunglasses for your lens.",a3phone:"Many phones have a night mode or a 'long exposure' effect for this. With a pro mode or pro app you choose the shutter speed yourself.",shake:"Shutter speed {v} handheld is long for this focal length. Your hands may have moved: keep it faster than 1/{f} s or use a tripod.",isoLow:"ISO {v}: nice and low, little noise.",isoHigh:"ISO {v}: high, so visible noise is likely. Could you use more light or a wider aperture?",expOk:"Exposure looks good: no large areas that are fully white or black.",expHi:"{p}% of your photo is pure white. That detail is gone and can't be recovered later. Next time go a bit darker: faster shutter, lower ISO or negative exposure compensation.",expLo:"{p}% of your photo is pure black. It could be a bit brighter: slower shutter, higher ISO or wider aperture.",expDark:"The photo is quite dark overall. On purpose? Fine. If not, give it a bit more light.",expBright:"The photo is quite bright overall. On purpose? Fine. If not, give it a bit less light.",sharpNo:"I can't find any truly sharp details. Check your focus and keep the camera steady.",sharpOk:"There are sharp details in your photo.",encourage:"Every photo is practice. Try again with these tips and compare the results.",faNoExif:"This photo has no shooting data (EXIF), for example because it was sent through WhatsApp or social media. I did check the sharpness.",fa1:"Still and sharp",fa1d:"Photograph something that stands still, like a flower, a building or an object, in single mode (AF-S). Put the focus point right on your subject.",fa2:"Moving and sharp",fa2d:"Photograph a subject moving towards you, like a dog, a cyclist or a child playing, in continuous mode (AF-C). Keep the button half-pressed and follow your subject.",fa3:"Pre-focus",fa3d:"Pick a spot your subject will pass. Focus there in advance (manual or single) and take the shot as soon as your subject reaches that spot.",faWhere:"The green frame shows where your photo is sharpest. Is it on your subject? Then your focus was right. Is it next to it? Then the camera focused there: next time put your focus point on your subject.",faMode:"Your camera doesn't record which focus mode you used in a standard way. So the tool looks at the result: where is your photo sharp?",faSharpOk:"Your photo has clearly sharp areas.",faSharpNo:"I can't find any truly sharp details. Blur usually has one of three causes: focus in the wrong place, your subject moving, or your hands moving.",fa2ok:"Shutter speed {v}: fast enough, so any blur isn't caused by your subject moving.",fa2slow:"Shutter speed {v}: fairly slow for a moving subject. Motion blur looks a lot like a focus error. Choose 1/500 s or faster so you're only testing your focus.",faPhone:"On a phone, tap your subject on the screen to focus there. For moving subjects, burst mode works well.",dIntro:"Depth of field is the zone in front of and behind your focus point that still looks sharp. Sometimes you want everything sharp, like in a landscape. Sometimes only your subject, like in a portrait. Three things decide how deep that zone is.",dA:"Aperture",dAd:"Large f-number (f/11, f/16) = lots of depth of field. Small f-number (f/1.8, f/2.8) = little depth of field and a soft background.",dD:"Distance to your subject",dDd:"The closer you focus, the thinner the sharp zone. Up close, sometimes only a few millimetres are sharp.",dF:"Focal length",dFd:"Zooming in (for example 200 mm) gives less depth of field and a blurrier background than zooming out (for example 24 mm).",dKey:"The background matters too",dKeyd:"The further the background is behind your subject, the blurrier it gets. So don't put someone against a wall, but a few metres in front of it.",dTryLead:"Use the sliders and watch which posts become sharp. The green band shows where the sharpness is.",dFocus:"Focus at",dFL:"Focal length",dZone:"Show sharp zone",dRange:"Sharp from {a} to {b}",dInf:"infinity",dObjF:"Flower",dObjP:"Walker",dObjT:"Trees",dTours:["Starting point: f/2.8, focused on the walker at 5 metres. She is sharp, the flower in front and the trees behind are soft.","Aperture to f/16: the sharp zone gets much deeper. Almost everything is sharp now.","Aperture to f/1.4: only the walker is sharp, the rest melts away.","Focus on the flower at 2 metres: now the flower is sharp and the walker is soft. You choose where attention goes.","Zoom in to 200 mm, focused at 5 metres: the sharp zone is paper-thin and the background dissolves into a soft haze.","Zoom out to 24 mm at f/8, focused at 3 metres: sharp from close by to far away. Ideal for landscapes.","In short: small f-number, close and zoomed in = little depth of field. Large f-number, further away and zoomed out = lots of depth of field."],dQs:[{q:"You want a landscape sharp from front to back. What do you choose?",o:["f/1.8 and zoom in","f/11 and zoom out","f/4 and focus close"],a:1,e:"A large f-number and a short focal length give lots of depth of field."},{q:"In a portrait the background isn't blurry enough. What helps most?",o:["Background further away and a small f-number","Higher ISO","Faster shutter speed"],a:0,e:"A small f-number and more distance between subject and background make the background softer."},{q:"You photograph a flower very close up and only an edge is sharp. What do you do?",o:["Larger f-number, for example f/8","Smaller f-number, for example f/1.8","Slower shutter speed"],a:0,e:"Up close, depth of field is very small. A larger f-number makes it deeper."},{q:"Which combination gives the LEAST depth of field?",o:["f/2, close and zoomed in","f/11, far away and zoomed out","f/8, far away and zoomed out"],a:0,e:"A small f-number, short distance and zooming in all make the sharp zone thinner."},{q:"Why isn't f/22 always the sharpest choice?",o:["Diffraction makes the whole photo slightly softer","Because the photo gets too bright","Because autofocus stops working"],a:0,e:"With a very small opening, light bends. That makes the whole photo a little less sharp."},{q:"Where is the sharpest setting for many lenses, roughly?",o:["Around f/5.6 to f/8","Always at the smallest f-number","Always at f/22"],a:0,e:"Most lenses are sharpest two to three stops below their widest opening."},{q:"You photograph a mushroom up close. How do you get it fully sharp with a soft background?",o:["f/5.6 to f/8 and a mushroom with lots of space behind it","f/1.8 and as close as possible","f/22 with the background right behind it"],a:0,e:"A medium f-number makes the mushroom sharp. Distance to the background makes it soft."},{q:"Someone stands against a wall and the wall stays sharp. What helps most?",o:["Have the person stand a few metres in front of the wall","A higher ISO","A faster shutter speed"],a:0,e:"The further the background is behind your subject, the blurrier it gets."},{q:"You only change the focus distance from 2 to 10 metres. What happens to depth of field?",o:["It gets larger","It gets smaller","It stays the same"],a:0,e:"The further away you focus, the deeper the sharp zone."},{q:"What does zooming in to 200 mm do to the background?",o:["It gets blurrier","It gets sharper","Nothing changes"],a:0,e:"Zoomed in you have less depth of field, so the background gets softer."}],da1:"Everything sharp",da1d:"Photograph a landscape or street where everything should be sharp from front to back. Goal: f/8 to f/11.",da2:"Only your subject",da2d:"Photograph a person, animal or object with a soft background. Goal: f/2.8 or lower, with your subject well in front of the background.",da3:"Up close",da3d:"Photograph a flower or small object as close as your camera can focus. Discover how thin the sharp zone becomes.",dMap:"The green squares show where your photo is sharp. That way you see at a glance how much depth of field you had.",dShare:"{p}% of your photo is sharp.",d1apOk:"Aperture {v}: nice, that gives lots of depth of field and your lens is at its sharpest here.",d1apMid:"Aperture {v}: decent. For more front-to-back sharpness, try f/8 to f/11.",d1apBad:"Aperture {v}: this keeps depth of field small. Choose f/8 to f/11 in A or Av mode.",d1fracOk:"A large part of your photo is sharp, exactly what you wanted.",d1fracBad:"Only a small part is sharp. Use a larger f-number, zoom out a bit and focus about a third into the scene, not on the far distance.",d1fl:"Focal length {v}: zooming in gives less depth of field. Try zooming out.",d1phone:"Phones naturally have lots of depth of field, so getting everything sharp is usually easy.",d2apOk:"Aperture {v}: nicely open, which gives little depth of field.",d2apMid:"Aperture {v}: fairly open already. Can your lens do f/2.8 or lower? Give it a try.",d2apBad:"Aperture {v}: this keeps a lot sharp. Choose your lens's lowest f-number.",d2fracOk:"Only a small part is sharp: your subject stands out.",d2fracBad:"A large part of your photo is sharp. Get closer to your subject, move the background further away or zoom in.",d3fracOk:"This close, the sharp zone is very thin, and your photo shows it well.",d3thin:"Very little is sharp. Want more of your subject sharp? Choose f/8 or step back a little.",d3info:"Aperture {v}: very close up, even f/8 still gives little depth of field.",newQs:"New questions",shareBtn:"Share this lesson",copied:"Link copied",copyFail:"Copy this link:",useful:"Was this lesson useful?",thanks:"Thanks for your feedback!",dSweet:"A bigger number isn't always sharper",dSweetd:"Most lenses are sharpest around f/5.6 to f/8. At f/16 and above the whole photo gets slightly softer through diffraction: light bends around the tiny opening. If you want lots of depth of field, f/8 to f/11 is usually the safe choice.",d1diff:"Aperture {v}: lots of depth of field, but from f/16 the whole photo gets slightly softer through diffraction. Try f/8 or f/11 and compare.",da4:"Mushroom",da4d:"Photograph a mushroom up close: the whole mushroom sharp, the background soft. Get down to its eye level, choose f/5.6 to f/8 and pick one with lots of space behind it.",d4apOk:"Aperture {v}: just right, so the whole mushroom can be sharp.",d4apOpen:"Aperture {v}: this close, the sharp zone is paper-thin. Choose f/5.6 to f/8 so both cap and stem are sharp.",d4apClosed:"Aperture {v}: this makes the background sharper too, and the photo slightly softer through diffraction. Try f/8.",d4fracOk:"Your mushroom stands out: the background is soft.",d4fracBad:"A large part of your photo is sharp, so the background distracts. Pick a mushroom with more space behind it, or step back a bit and zoom in.",d4slow:"Shutter speed {v}: fairly long. Use a tripod, a beanbag or your bag on the ground, the mushroom isn't going anywhere. Wait until the wind dies down too.",d4phone:"Use your phone's macro or portrait mode and hold it at the mushroom's eye level.",bIntro:"Focal length, in millimetres, decides how much of the world fits in your frame. A small number is wide angle: lots of space in the picture. A large number is telephoto: like zooming in. But more happens than just bringing things closer.",bA:"Angle of view",bAd:"At 24 mm you see a wide angle of about 84°, at 50 mm about 47° and at 200 mm only 12°. The bigger the number, the smaller the slice of the world you capture.",bP:"Perspective",bPd:"With a wide angle, things close by look big and the background far away. With a telephoto, the background looks closer and bigger. That's called compression.",bU:"What do you use when?",bUd:"Wide angle (14–35 mm): landscapes, architecture and interiors. Standard (around 50 mm): roughly how your eye sees it. Portrait (85–135 mm): natural-looking faces. Telephoto (200 mm and up): wildlife, sports and details from afar.",bKey:"Perspective comes from your distance",bKeyd:"It's not really the lens that creates compression, but your distance to the subject. A telephoto lets you stand further back, and from there the background looks bigger. Try it yourself with 'Subject same size' below.",bKey2:"Phone or smaller sensor?",bKey2d:"The millimetres in this lesson apply to a full-frame camera. On your phone you see 0.5×, 1× or 3×; 1× usually matches about 24 to 28 mm. If your camera has a smaller sensor (APS-C), a lens looks about 1.5× more zoomed in: 50 mm then feels like roughly 75 mm.",bTryLead:"Choose what you want to see and move the focal length. At the top right you see from above where the camera stands and how wide it looks.",bModeLbl:"What do you want to see?",bMode1:"Same spot",bMode2:"Subject same size",bFL:"Focal length",bAngle:"angle of view",bDist:"distance to walker",bWalker:"Walker",bMtn:"Mountain",bTours:["Same spot, 24 mm: you see the walker, the path, the trees and the mountain. Lots of space in the frame.","50 mm: the view gets narrower, roughly how your eye sees it.","200 mm from the same spot: you bring the walker close without walking. Only her upper body still fits.","Now the walker stays the same size. At 24 mm you stand right next to her, and the mountain is a small bump in the distance.","85 mm: you've walked back to keep her the same size. Watch the mountain grow.","200 mm, more than 40 metres back: the mountain seems right behind her. That's compression, created by your distance.","In short: focal length decides how much you see, your distance decides the perspective."],bQs:[{q:"Which focal length shows the most of your surroundings?",o:["14 mm","50 mm","200 mm"],a:0,e:"The smaller the number, the wider the angle of view."},{q:"What do you call a 200 mm lens?",o:["Telephoto","Wide angle","Fisheye"],a:0,e:"From about 85 mm we speak of telephoto, and 200 mm is clearly telephoto."},{q:"You want a whole room or a wide landscape in the frame. What do you choose?",o:["Wide angle, 16 to 24 mm","Telephoto, 200 mm","Portrait, 85 mm"],a:0,e:"A wide angle captures the widest part of your surroundings."},{q:"Which focal length is often used for portraits?",o:["85 mm","14 mm","600 mm"],a:0,e:"Around 85 mm you stand at a comfortable distance and facial proportions stay natural."},{q:"You photograph a walker in front of a mountain and want the mountain big behind her. What do you do?",o:["Stand further back and zoom in","Stand close with a wide angle","Raise the ISO"],a:0,e:"From further away with a telephoto, the background looks bigger relative to your subject."},{q:"What actually causes 'compression'?",o:["The greater distance to your subject","The glass in a telephoto lens","A higher ISO"],a:0,e:"A telephoto lets you stand further back, and that distance changes the perspective."},{q:"Why can a wide angle make a nose look big in a very close portrait?",o:["Because what's closer to the camera looks much bigger","Because a wide angle changes the colours","Because the shutter speed is longer"],a:0,e:"Very close up, the nose is relatively much closer to the lens than the ears, so it looks bigger."},{q:"Your phone shows 1×. Which focal length does that roughly match?",o:["24 to 28 mm","85 mm","200 mm"],a:0,e:"The main camera on most phones is a slight wide angle."},{q:"What happens to the angle of view when you go from 24 to 50 mm?",o:["It becomes roughly half as wide","It becomes wider","It stays the same"],a:0,e:"From about 84° to about 47°: twice as zoomed in is roughly half the angle."},{q:"Your camera has a smaller sensor (APS-C) and you use a 50 mm lens. What does it look like?",o:["Roughly like 75 to 80 mm","Roughly like 25 mm","Exactly like 50 mm on full frame"],a:0,e:"A smaller sensor crops a smaller part of the image, as if you zoom in about 1.5× more."}],ba1:"Wide",ba1d:"Photograph a landscape, street or room with a wide angle: 24 mm or shorter. On a phone: the 0.5× or 1× camera. Put something interesting in the foreground.",ba2:"Zoomed-in detail",ba2d:"Zoom in to pick a detail out of a larger scene: a window, a bird or a tree in the distance. Goal: 85 mm or more. On a phone: the 2× or 3× camera.",ba3:"Compression",ba3d:"Take two photos of the same subject with something far behind it, like a tower or hill: one close up with a wide angle, one from far away with a telephoto. Keep your subject the same size in both. Then choose the photos one at a time.",b1ok:"Focal length {v}: truly wide angle, you get lots of space in the frame.",b1mid:"Focal length {v}: nearly wide angle. Zoom out a bit more, to 24 mm or shorter.",b1bad:"Focal length {v}: that's already zoomed in. Turn your zoom ring to the smallest number.",b1fg:"Wide-angle tip: something in the foreground, like a rock, flower or fence, gives your photo depth.",b1phone:"On your phone, use the 0.5× camera for an extra wide view.",b2ok:"Focal length {v}: nicely zoomed in, you bring the detail close.",b2mid:"Focal length {v}: slightly zoomed in. For real detail: 85 mm or more.",b2bad:"Focal length {v}: that's still wide. Zoom in to 85 mm or more.",b2phone:"Use your phone's 2× or 3× camera. Zooming in further than that is digital and costs sharpness.",b3first:"Photo 1 is ready ({v}). Now choose your second photo, with a very different focal length.",b3ok:"Photo 1: {a}, photo 2: {b}. A big difference, so you see the compression well. Look at how big the background is compared to your subject.",b3small:"Photo 1: {a}, photo 2: {b}. The difference is small. Choose focal lengths further apart, for example 24 and 135 mm, and keep your subject about the same size in both.",b3reset:"Start over",b3photo:"Photo",bNoFl:"This photo has no focal length data. Use the original file so I can review your focal length.",bCrop:"Your camera didn't record a 35 mm equivalent. If it has a smaller sensor (APS-C), the effect is about 1.5× more zoomed in than the number suggests.",toolF:"Looking for a place with a wide view to compare wide angle and telephoto? Find viewpoints in PhotoByArno Scout.",tryIt:"Try it yourself",tryLead:"Tap Tour for a guided walkthrough, or use the sliders. Each slider step is one stop.",dark:"Too dark",good:"Good",light:"Too bright",aperture:"Aperture",shutter:"Shutter",iso:"ISO",hA:"Smaller number = bigger opening = more light, blurrier background",hS:"Longer = more light, motion blur",hI:"Higher = brighter, but more noise",tour:"Tour",stop:"Stop",reset:"Reset",more:"too much light",less:"too little light",correct:"Correctly exposed",stop1:"stop",stopN:"stops",over:"overexposed",under:"underexposed",tours:["Starting point: f/5.6, 1/125 s, ISO 100. Well exposed, background fairly sharp.","Open the aperture to f/1.8: three stops more light. Lovely soft background, but far too bright.","Compensate with a faster shutter, 1/1000 s. Well exposed again, cyclist frozen, background stays soft.","Now f/16 to get everything sharp: six stops less light. Far too dark.","ISO 6400 brightens it again, but look at the noise.","Alternative: ISO back down, shutter to 1/15 s. No noise, but a blurred cyclist. Every choice has a cost.","That's the triangle: what you gain in one, you give up in another."],quiz:"Test yourself",check:"Check",pick:"Pick an answer first",right:"Correct!",wrong:"Not quite.",score:"Score",qs:[{q:"You want a blurry background for a portrait. What do you change?",o:["Aperture to f/16","Aperture to f/1.8","ISO to 6400"],a:1,e:"A small f-number gives a shallow depth of field."},{q:"Your photo of a running dog is blurred by motion. What helps?",o:["Longer shutter speed","Shorter shutter speed","Larger f-number"],a:1,e:"A short shutter speed freezes motion."},{q:"You go from f/4 to f/8, two stops less light. How do you keep the same exposure without changing the shutter?",o:["ISO 400 to 1600","ISO 400 to 800","ISO 400 to 100"],a:0,e:"Two stops means doubling twice: 400, 800, 1600."},{q:"Your photo is too dark and you don't want to change shutter speed or aperture. What do you do?",o:["Raise the ISO","Lower the ISO","Turn off the flash"],a:0,e:"A higher ISO makes your photo brighter, with a bit more noise as a side effect."},{q:"What is the side effect of a high ISO?",o:["More noise","A blurry background","Motion blur"],a:0,e:"The higher the ISO, the more grain or noise you see in your photo."},{q:"How much more light do you get when you open the aperture by one stop?",o:["Twice as much","Ten percent more","Four times as much"],a:0,e:"One stop always doubles or halves the light."},{q:"Which shutter speed lets in more light?",o:["1/60 s","1/500 s","Both the same"],a:0,e:"1/60 s stays open longer than 1/500 s, so more light comes in."},{q:"Which aperture lets in the most light?",o:["f/16","f/8","f/2"],a:2,e:"Smaller number = bigger opening = more light."},{q:"You want to capture flowing water as soft and silky. Which shutter speed fits best?",o:["1/1000 s","1/2 s","1/250 s"],a:1,e:"A long shutter speed shows motion as soft streaks."},{q:"You go from 1/250 s to 1/500 s. How do you keep the same brightness without changing ISO?",o:["Open the aperture one stop, for example from f/8 to f/5.6","Close the aperture one stop, from f/8 to f/11","Nothing, it stays the same"],a:0,e:"1/500 s gives one stop less light. You make up for it with one stop wider aperture."}]},nl:{title:"PhotoByArno Academy – gratis fotografie leren met animaties",blkH:"Deze les staat op photobyarno.com",blkP:"De PhotoByArno Academy is gratis te gebruiken, maar alleen op de eigen website. Daar vind je ook altijd de nieuwste versie.",blkGo:"Naar de Academy",copy:"© 2026 PhotoByArno. Alle rechten voorbehouden. Je mag de lessen gratis in je eigen les laten zien, rechtstreeks vanaf photobyarno.com en met vermelding van de bron.",footer:"Gratis, geen account nodig. Nieuwe lessen komen er regelmatig bij.",privacy:"Anonieme bezoekersstatistieken, zonder cookies.",homeTitle:"Leer fotografie, stap voor stap",homeLead:"Korte lessen met animaties die je zelf kunt bedienen. Schuif, kijk wat er gebeurt en begrijp waarom.",lessons:"Lessen",available:"Start les",soon:"Binnenkort",back:"Alle lessen",k3load:"3D laden…",k3fail:"3D wordt niet ondersteund in deze browser. De rest van de les werkt gewoon.",k3drag:"Sleep om te draaien",k3front:"Voor",k3angle:"Schuin",k3side:"Zijkant",k3top:"Boven",k3behind:"Achter camera",k3photo:"Foto",k3view3d:"3D-weergave",k3irisH:"Kijk in de camera",k3irisLead:"Het diafragma is een ring van dunne metalen lamellen. Schuif en zie de opening kleiner worden: er valt minder licht op de sensor, die daardoor donkerder wordt.",k3shutLead:"Vlak voor de sensor zitten twee gordijntjes. Het eerste gaat open, het tweede volgt en sluit weer. Bij een korte sluitertijd schuift er maar een smalle spleet over de sensor, maar elke regel van de sensor krijgt precies even lang licht.",k3light:"Licht t.o.v. f/1.8",k3stops:"Stops minder licht",k3open:"Opening bij 50 mm",k3fire:"Ontspan sluiter",k3slit:"Open spleet",k3slitAll:"Hele sensor",k3time:"Belichtingstijd",k3slow:"Vertraagd",k3fLead:"Het gekleurde vlak is waar de camera op scherpstelt. Groen: de hond staat in dat vlak en is scherp. Rood: de hond is uit het vlak gelopen.",k3dLead:"Het groene blok is alles wat scherp lijkt, het blauwe vlak is waar je op scherpstelt. Verander diafragma, afstand of brandpuntsafstand en zie het blok groeien of krimpen.",k3bLead:"De blauwe vorm is wat de camera ziet. Hoe langer de brandpuntsafstand, hoe smaller. Bij 'Onderwerp even groot' loopt de camera naar achteren: de persoon blijft even groot en de berg lijkt dichterbij te komen.",k3bokH:"Waarom lichtvlekjes een vorm krijgen",k3bokLead:"Lichtjes in een vage achtergrond krijgen de vorm van de diafragma-opening (bokeh). Wijd open zijn ze groot en zacht. Knijp je het diafragma dicht, dan worden ze kleiner en hoekig: hier zevenhoekig, omdat dit objectief 7 lamellen heeft.",l0:"Je camera leren kennen",l0d:"Hoe heten alle knoppen en wat zit er binnenin?",cIntro:"Voordat je gaat instellen: dit is je camera. Draai hem rond, tik op de nummers en kijk ook naar binnen, waar het licht zijn weg naar de sensor vindt. Je hoeft niet alles in één keer te onthouden; je kunt hier altijd terugkijken.",cOut:"Buitenkant: bedienen",cOutd:"Knoppen, wielen en ringen waarmee je de camera instelt. De ontspanknop, het instelwiel en het programmakeuzewiel gebruik je het meest.",cIn:"Binnenkant: de weg van het licht",cInd:"Het licht gaat door de lenzen, het diafragma en de sluiter en valt dan op de sensor. In een spiegelreflexcamera zit daar nog een spiegel tussen, in deze systeemcamera niet.",cPh:"En je telefoon?",cPhd:"Die heeft dezelfde onderdelen, alleen piepklein: lenzen, een sensor en een processor. Het diafragma staat meestal vast, de sluiter is elektronisch, en zoomen doe je door te wisselen tussen lenzen (0,5×, 1×, 3×).",cKey:"Zo houd je hem stil",cKeyd:"Rechterhand om de handgreep, wijsvinger op de ontspanknop. Leg het objectief van onderen in je linkerhand en houd je ellebogen tegen je lichaam. Zo maak je minder bewogen foto's.",cTryLead:"Sleep om de camera te draaien. Tik op een nummer of op een naam in de lijst. Met 'Binnenkant' kijk je door de camera heen.",cOutside:"Buitenkant",cInside:"Binnenkant",cPick:"Tik op een nummer om te zien hoe dat onderdeel heet en wat het doet. Zie je een nummer niet? Draai de camera of kies Achter of Boven.",cPickIn:"Volg het licht: door de lenzen (A), het diafragma (B) en de sluiter (C) naar de sensor (D). Tik op een letter voor uitleg.",cMore:"Meer hierover in:",k3back:"Achter",cGameStart:"Speel: wijs het aan",cGameStop:"Stop het spel",cGameAgain:"Nog een keer spelen",cGameN:"Vraag {i} van {n}",cGameQ:"Waar zit: {p}?",cGameHint:"Tik op het juiste punt op de camera. Zie je het niet? Draai de camera.",cGameOk:"Goed!",cGameNo:"Niet goed. Het groene punt is: {p}.",cNext:"Volgende",cGameScore:"Bekijk je score",cGameEnd:"Je had er {s} van de {n} goed.",cGameTop:"Jij kent je camera. Op naar de belichtingsdriehoek!",cGameMid:"Al aardig! Tik de onderdelen nog eens langs en speel opnieuw.",cGameLow:"Geen zorgen, dit is nieuw. Tik de onderdelen rustig langs en probeer het nog een keer.",cParts:{shutter:["Ontspanknop","Half indrukken: de camera stelt scherp en meet het licht. Helemaal indrukken: de foto wordt gemaakt. Dat half indrukken komt terug in de les over scherpstelmodi."],dial:["Instelwiel","Hiermee verander je de instelling die bij de gekozen stand hoort, zoals de sluitertijd of het diafragma. Veel camera's hebben er twee: één voor en één achter."],mode:["Programmakeuzewiel","Kiest wie wat bepaalt. AUTO: de camera doet alles. P: de camera kiest, jij kunt bijsturen. A (of Av): jij kiest het diafragma. S (of Tv): jij kiest de sluitertijd. M: jij kiest alles zelf."],hotshoe:["Flitsschoen","Een sleuf met contacten bovenop de camera. Hier schuif je een losse flitser, een microfoon of een draadloze afstandsbediening op."],evf:["Zoeker","Hier kijk je met je oog doorheen. Bij een systeemcamera is dit een klein schermpje dat precies laat zien hoe je foto wordt. Met het wieltje ernaast (dioptrie) stel je hem scherp voor je eigen ogen."],screen:["Scherm","Laat het live beeld, het menu en je gemaakte foto's zien. Vaak kun je het kantelen en aanraken: handig voor foto's laag bij de grond of boven je hoofd."],buttons:["Knoppen en joystick","Met de joystick verplaats je het scherpstelpunt. De knoppen eromheen openen het menu, laten je foto's terugzien of wissen ze. De indeling verschilt per camera, de functies zijn bijna altijd hetzelfde."],lens:["Objectief","Het oog van de camera. Op de rand staan twee getallen: de brandpuntsafstand (hier 24-70 mm) en de grootste diafragma-opening (hier 1:2.8, dus f/2.8)."],zoom:["Zoomring","Draai eraan om in en uit te zoomen: je verandert de brandpuntsafstand. Een objectief met één vaste brandpuntsafstand heeft geen zoomring."],focus:["Scherpstelring","Hiermee stel je met de hand scherp (MF). Handig bij close-ups, sterren of foto's door een raam, waar de autofocus twijfelt."],release:["Ontgrendelknop objectief","Indrukken en het objectief draaien om het los te maken. Wissel met de camera naar beneden gericht, dan valt er minder stof op de sensor."],card:["Geheugenkaartklep","Achter dit klepje zit het slot voor de geheugenkaart (meestal SD). Wacht tot het lampje uit is voordat je de kaart eruit haalt."],tripod:["Statiefaansluiting","Een schroefdraad aan de onderkant voor een statief. Bijna alle camera's en statieven gebruiken dezelfde maat (1/4 inch)."],lenses:["Lenzen","Binnen in het objectief zitten meerdere glazen lenzen achter elkaar. Samen buigen ze het licht zo dat er een scherp beeld op de sensor valt. Bij zoomen of scherpstellen schuiven sommige lenzen heen en weer."],iris:["Diafragma","Een ring van lamellen die een grotere of kleinere opening maakt. Groot gat: meer licht en een vagere achtergrond. Klein gat: minder licht en meer scherpte van voor tot achter."],shutterc:["Sluiter","Twee gordijntjes vlak voor de sensor. Ze bepalen hoe lang het licht op de sensor valt: de sluitertijd. Veel camera's en alle telefoons kunnen ook elektronisch belichten, zonder bewegend gordijn."],sensor:["Sensor","Het hart van de camera: een chip met miljoenen lichtgevoelige pixels. Zie je dat het beeld op zijn kop staat? Zo komt het licht door de lenzen binnen; de camera draait het weer om. Een grote sensor (full frame) vangt meer licht dan een kleinere (APS-C of telefoon)."],proc:["Beeldprocessor","De kleine computer van de camera. Maakt van de sensorgegevens een JPEG, onderdrukt ruis en rekent de autofocus uit. Fotografeer je in RAW, dan bewaart de camera de ruwe gegevens, zodat jij ze later zelf bewerkt."],battery:["Accu","Zit meestal in de handgreep. Het scherm en de zoeker gebruiken veel stroom: neem bij een dag fotograferen een reserve-accu mee en houd hem warm als het koud is."]},cQs:[{q:"Wat gebeurt er als je de ontspanknop half indrukt?",o:["De camera stelt scherp en meet het licht","De foto wordt gemaakt","Het menu gaat open"],a:0,e:"Half indrukken is scherpstellen en meten. Pas als je helemaal indrukt, wordt de foto gemaakt."},{q:"Waar valt het licht uiteindelijk op?",o:["De sensor","De zoeker","De geheugenkaart"],a:0,e:"Het licht gaat door de lenzen, het diafragma en de sluiter en valt dan op de sensor."},{q:"Op je objectief staat 24-70 mm. Wat betekent dat?",o:["De brandpuntsafstand loopt van 24 tot 70 mm","Het objectief is 24 tot 70 mm lang","De grootste diafragma-opening"],a:0,e:"Het is de brandpuntsafstand: 24 mm is groothoek, 70 mm al wat ingezoomd."},{q:"Met welk onderdeel kies je tussen AUTO, P, A, S en M?",o:["Het programmakeuzewiel","De scherpstelring","De zoomring"],a:0,e:"Het programmakeuzewiel bepaalt wie wat kiest: jij of de camera."},{q:"Hoe wissel je het objectief het veiligst?",o:["Met de camera naar beneden gericht","Met de opening naar boven, zodat je goed ziet wat je doet","Het maakt niet uit"],a:0,e:"Met de opening naar beneden valt er minder stof op de sensor."},{q:"Wat doet de sluiter?",o:["Bepaalt hoe lang het licht op de sensor valt","Bepaalt hoe groot de opening is","Zoomt in en uit"],a:0,e:"De sluiter regelt de sluitertijd. De grootte van de opening is het diafragma."},{q:"Waarom staat het beeld op de sensor op zijn kop?",o:["Zo buigen de lenzen het licht; de camera draait het weer om","De sensor zit verkeerd om in de camera","Dat gebeurt alleen bij goedkope camera's"],a:0,e:"Elke lens zet het beeld op zijn kop, ook die in je oog. Je hersenen en je camera draaien het gewoon weer om."},{q:"Waarvoor is de schroefdraad aan de onderkant?",o:["Voor een statief","Voor een flitser","Voor de geheugenkaart"],a:0,e:"Daar schroef je de camera op een statief. De flitser gaat op de flitsschoen bovenop."},{q:"Wat heeft een telefoon meestal níet?",o:["Een diafragma dat je kunt verstellen","Een sensor","Een lens"],a:0,e:"Bij de meeste telefoons staat het diafragma vast. Lenzen en een sensor hebben ze allemaal."}],l1:"De belichtingsdriehoek",l1d:"Diafragma, sluitertijd en ISO: hoe ze samen je foto bepalen.",l2:"Scherptediepte",l2d:"Wat bepaalt hoeveel van je foto scherp is?",l3:"Brandpuntsafstand",l3d:"Groothoek of tele: wat doet het met je beeld?",l4:"Het histogram lezen",l4d:"Zie in één oogopslag of je foto goed belicht is.",l5:"Witbalans",l5d:"Waarom foto's soms te blauw of te oranje worden.",l7:"Lichtinval",l7d:"Waarom de richting van het licht je foto maakt of breekt.",l6:"Compositie",l6d:"Derdenregel, lijnen en ruimte in je beeld.",intro:"Elke foto is een balans tussen drie instellingen. Verander je er één, dan moet een andere meebewegen om dezelfde helderheid te houden. Elke instelling heeft ook een bijwerking.",cA:"Diafragma",cAd:"De opening in je lens. Het voelt omgekeerd: hoe kleiner het getal, hoe groter de opening. Dat komt doordat het f-getal een breuk is: f/2 betekent een opening van 1/2, f/16 maar 1/16. Een halve pizza is meer dan een zestiende. Grote opening (f/1.8) = veel licht en een wazige achtergrond. Kleine opening (f/16) = minder licht en alles scherp.",cS:"Sluitertijd",cSd:"Hoe lang de sensor licht vangt. Kort (1/1000 s) bevriest beweging. Lang (1/15 s) laat bewegende onderwerpen vegen.",cI:"ISO",cId:"Hoe sterk het signaal versterkt wordt. Hoger maakt je foto lichter, maar geeft meer ruis.",cK:"Zo werken ze samen",cKd:"Fotografen meten licht in stops. Een stop is gewoon één stap: twee keer zoveel licht, of de helft. Zet je het diafragma één stop verder open, dan krijg je twee keer zoveel licht. Dat maak je weer goed met één stop snellere sluitertijd of één stop lagere ISO. Elke tik op een schuifje hieronder is precies één stop.",lf:"Scherpstelmodi",lfd:"Enkelvoudig, continu, automatisch of handmatig: wanneer kies je wat?",fIntro:"Je camera kan op vier manieren scherpstellen. Het verschil zit in wat er gebeurt nadat hij scherp heeft gesteld: blijft de scherpte vastliggen, of beweegt hij mee met je onderwerp?",fS:"Enkelvoudig (AF-S)",fSd:"De camera stelt één keer scherp en zet de scherpte dan vast. Ideaal voor stilstaande onderwerpen zoals landschappen, gebouwen en portretten.",fC:"Continu (AF-C)",fCd:"De camera blijft scherpstellen zolang je de knop half indrukt. Voor alles wat beweegt: sport, dieren, spelende kinderen.",fA:"Automatisch (AF-A)",fAd:"De camera kiest zelf. Hij begint enkelvoudig en schakelt over naar continu als het onderwerp gaat bewegen. Handig als je twijfelt, maar soms net te laat.",fM:"Handmatig (MF)",fMd:"Jij draait zelf aan de scherpstelring. Handig bij macro, sterren of als de autofocus blijft zoeken, bijvoorbeeld door glas of in het donker.",fKey:"Zo start je het scherpstellen",fKeyd:"Bij de meeste camera's druk je de ontspanknop half in om scherp te stellen, en helemaal in om de foto te maken. De namen verschillen soms per camera: enkelvoudig heet ook wel 'One Shot' en continu 'Servo'.",fTryLead:"Kies een stand en kijk wat er met de hond gebeurt. Groen kader = scherp, rood = onscherp.",fMode:"Stand",fSubj:"Onderwerp",moving:"Bewegend",still:"Stilstaand",fDist:"Scherpstellen op",sharp:"Scherp",blurry:"Onscherp",near:"Dichtbij",far:"Ver weg",subjLbl:"Hond",focusLbl:"Scherpte",switched:"schakelt naar continu",fTours:["Een stilstaande hond in enkelvoudige stand: één keer scherpstellen is genoeg. Scherp.","Nu rent de hond op je af. Enkelvoudig houdt de scherpte vast op de beginafstand, dus de hond wordt steeds onscherper.","Continu schuift mee met de hond. Hij blijft scherp, tot dichtbij.","Automatisch begint enkelvoudig en schakelt over zodra de hond beweegt. Let op het korte moment ervoor.","Handmatig op 8 meter: de hond is alleen scherp als hij precies daar is. Zo werkt ook 'vooraf scherpstellen'.","Vuistregel: stilstaand = enkelvoudig, bewegend = continu."],fQs:[{q:"Je fotografeert een landschap vanaf statief. Welke stand?",o:["Continu","Enkelvoudig","Handmatig is verplicht"],a:1,e:"Een landschap beweegt niet, één keer scherpstellen is genoeg."},{q:"Je kind rent op je af tijdens een voetbalwedstrijd. Welke stand?",o:["Enkelvoudig","Continu","Automatisch is altijd beter"],a:1,e:"Continu blijft het bewegende onderwerp volgen."},{q:"De autofocus blijft zoeken bij een foto door een raam. Wat helpt?",o:["Handmatig scherpstellen","Hogere ISO","Snellere sluitertijd"],a:0,e:"Met de hand stel jij zelf scherp, zodat het glas de camera niet afleidt."},{q:"Wat doet de camera in de continue stand (AF-C) zolang je de knop half indrukt?",o:["Blijft scherpstellen op het bewegende onderwerp","Stelt één keer scherp en zet het vast","Stelt helemaal niet scherp"],a:0,e:"Continu blijft je onderwerp volgen zolang je de knop half ingedrukt houdt."},{q:"Hoe start je bij de meeste camera's het scherpstellen?",o:["Ontspanknop half indrukken","Ontspanknop twee keer snel indrukken","De lens eraf en weer erop zetten"],a:0,e:"Half indrukken stelt scherp, helemaal indrukken maakt de foto."},{q:"Je fotografeert iemand die stilzit voor een portret. Welke stand is het eenvoudigst?",o:["Enkelvoudig (AF-S)","Continu (AF-C)","Altijd handmatig"],a:0,e:"Iemand die stilzit beweegt nauwelijks, dus één keer scherpstellen is genoeg."},{q:"Je wilt de sterrenhemel fotograferen en de autofocus vindt niets. Wat doe je?",o:["Handmatig scherpstellen op een heldere ster","De continue stand gebruiken","De ISO verlagen"],a:0,e:"In het donker vindt autofocus vaak niets. Met de hand en vergroting op een heldere ster lukt het wel."},{q:"Wat is een nadeel van de automatische stand (AF-A)?",o:["Hij schakelt soms net te laat over naar continu","Hij werkt alleen bij daglicht","Hij maakt de foto donkerder"],a:0,e:"AF-A moet eerst zien dat iets beweegt, en die korte vertraging kan je een scherpe foto kosten."},{q:"Wat betekent 'vooraf scherpstellen'?",o:["Scherpstellen op een plek waar je onderwerp straks langskomt","Scherpstellen voordat je de camera aanzet","Scherpstellen nadat je de foto hebt gemaakt"],a:0,e:"Je zet de scherpte alvast op de juiste plek en drukt af zodra je onderwerp daar is."},{q:"Je stelt in de enkelvoudige stand scherp op een hond op 10 meter, die daarna naar je toe rent. Wat gebeurt er?",o:["De hond wordt onscherp, want de scherpte blijft op 10 meter","De hond blijft scherp","De foto wordt donkerder"],a:0,e:"Enkelvoudig zet de scherpte vast. Komt de hond dichterbij, dan valt hij buiten het scherpe gebied."}],toolTry:"Verder met je eigen foto's",tool1:"Bekijk met welk diafragma, welke sluitertijd en ISO je eigen foto's zijn gemaakt, in de EXIF-tab van de Photography Suite.",toolGo:"Ga zelf oefenen",tool2:"Oefenen met bewegende onderwerpen? Vind plekken voor wildlife en natuur in PhotoByArno Scout.",asgTitle:"Opdracht: nu jij",asgLead:"Kies een opdracht, maak de foto en kies hem hieronder. Je krijgt meteen tips. Je foto blijft op je eigen apparaat: niemand anders ziet hem.",asgFileHint:"Gebruik een JPG rechtstreeks uit je camera of telefoon, of een export uit je bewerkingsprogramma met de metadata behouden. Foto's die via WhatsApp of sociale media zijn verstuurd, missen de gegevens die de tool nodig heeft.",a1:"Wazige achtergrond",a1d:"Fotografeer een onderwerp dichtbij met een rustige, wazige achtergrond. Doel: diafragma f/4 of een kleiner getal.",a2:"Beweging bevriezen",a2d:"Fotografeer iets dat snel beweegt, zoals een rennende hond, een fietser of opspattend water, zodat het scherp en stil staat. Doel: sluitertijd 1/500 s of korter.",a3:"Bewust bewegen",a3d:"Laat beweging zien als zachte vegen, bijvoorbeeld stromend water of langsrijdend verkeer. Doel: sluitertijd 1/15 s of langer. Gebruik een statief of leun ergens tegenaan.",choose:"Kies je foto",analyzing:"Bezig met bekijken…",yourSettings:"Jouw instellingen",goodH:"Goed bezig",tipsH:"Tips voor de volgende keer",noExif:"Deze foto bevat geen opnamegegevens (EXIF). Dat gebeurt vaak bij foto's die via WhatsApp of sociale media zijn verstuurd. Gebruik het originele bestand, dan kan ik je instellingen beoordelen. De belichting heb ik wel bekeken.",badFile:"Deze foto kan ik niet openen. Probeer een JPG-bestand.",phoneNote:"Je fotografeert met een telefoon, prima om mee te leren. Let wel op: bij telefoons zit het diafragma vast.",a1ok:"Diafragma {v}: mooi open, dat geeft een wazige achtergrond.",a1mid:"Diafragma {v}: al redelijk open. Voor nog meer wazigheid: probeer f/2.8, of zo laag als je lens toelaat.",a1bad:"Diafragma {v}: daarmee blijft veel scherp. Zet je camera op A of Av (diafragmavoorkeur) en kies het laagste f-getal, bijvoorbeeld f/2.8 of f/4.",a1extra:"Nog waziger: ga dichter bij je onderwerp staan en zorg dat de achtergrond ver weg is. Iets inzoomen helpt ook.",a1phone:"Gebruik de portretmodus van je telefoon, ga dicht bij je onderwerp staan en zorg dat de achtergrond ver weg is.",a2ok:"Sluitertijd {v}: snel genoeg om beweging te bevriezen.",a2mid:"Sluitertijd {v}: genoeg voor rustige bewegingen, maar net te langzaam voor snelle actie. Probeer 1/1000 s.",a2bad:"Sluitertijd {v}: te langzaam om beweging te bevriezen. Zet je camera op S of Tv (sluitertijdvoorkeur) en kies 1/500 s of sneller. Te donker? Verhoog de ISO.",a3ok:"Sluitertijd {v}: lang genoeg om beweging als vegen te laten zien.",a3mid:"Sluitertijd {v}: er is wat beweging te zien, maar het kan zachter. Probeer 1/4 s of langer.",a3bad:"Sluitertijd {v}: te kort, de beweging staat dan stil. Kies 1/15 s of langer, met een lage ISO en een groter f-getal (bijvoorbeeld f/11) zodat je niet te veel licht krijgt.",a3light:"Overdag te licht met een lange sluitertijd? Een ND-filter werkt als een zonnebril voor je lens.",a3phone:"Veel telefoons hebben een nachtmodus of een 'lange belichting'-effect hiervoor. Met een pro-modus of pro-app kies je de sluitertijd zelf.",shake:"Sluitertijd {v} uit de hand is lang voor dit brandpunt. Kans op beweging van je handen: houd de sluitertijd korter dan 1/{f} s of gebruik een statief.",isoLow:"ISO {v}: lekker laag, weinig ruis.",isoHigh:"ISO {v}: hoog, dus kans op zichtbare ruis. Kan het met meer licht of een opener diafragma?",expOk:"Belichting ziet er goed uit: geen grote delen helemaal wit of zwart.",expHi:"{p}% van je foto is helemaal wit. Dat detail is weg en later niet meer terug te halen. Volgende keer iets donkerder: kortere sluitertijd, lagere ISO of belichtingscorrectie min.",expLo:"{p}% van je foto is helemaal zwart. Iets lichter kan: langere sluitertijd, hogere ISO of opener diafragma.",expDark:"De foto is in zijn geheel vrij donker. Bewust gedaan? Prima. Zo niet, geef wat meer licht.",expBright:"De foto is in zijn geheel vrij licht. Bewust gedaan? Prima. Zo niet, geef wat minder licht.",sharpNo:"Ik zie nergens echt scherpe details. Controleer je scherpstelling en houd de camera stil.",sharpOk:"Er zijn scherpe details in je foto.",encourage:"Elke foto is oefening. Probeer het nog eens met deze tips en vergelijk het resultaat.",faNoExif:"Deze foto bevat geen opnamegegevens (EXIF), bijvoorbeeld omdat hij via WhatsApp of sociale media is verstuurd. De scherpte heb ik wel bekeken.",fa1:"Stilstaand en scherp",fa1d:"Fotografeer iets dat stilstaat, zoals een bloem, een gebouw of een voorwerp, in de enkelvoudige stand (AF-S). Zet het scherpstelpunt precies op je onderwerp.",fa2:"Bewegend en scherp",fa2d:"Fotografeer een onderwerp dat naar je toe beweegt, zoals een hond, fietser of spelend kind, in de continue stand (AF-C). Houd de knop half ingedrukt en volg je onderwerp.",fa3:"Vooraf scherpstellen",fa3d:"Kies een plek waar je onderwerp straks langskomt. Stel daar vooraf scherp (handmatig of enkelvoudig) en druk af zodra je onderwerp die plek bereikt.",faWhere:"Het groene kader toont waar je foto het scherpst is. Ligt het op je onderwerp? Dan zat je scherpstelling goed. Ligt het ernaast, dan stelde de camera daar scherp op: zet je scherpstelpunt de volgende keer op je onderwerp.",faMode:"Je camera slaat niet op een vaste manier op welke scherpstelstand je gebruikte. Daarom kijkt de tool naar het resultaat: waar is je foto scherp?",faSharpOk:"Je foto heeft duidelijk scherpe delen.",faSharpNo:"Ik zie nergens echt scherpe details. Onscherpte heeft meestal een van deze drie oorzaken: scherpstelling op de verkeerde plek, beweging van je onderwerp of beweging van je handen.",fa2ok:"Sluitertijd {v}: snel genoeg, dus eventuele onscherpte komt niet door beweging van je onderwerp.",fa2slow:"Sluitertijd {v}: vrij langzaam voor een bewegend onderwerp. Bewegingsonscherpte lijkt veel op een scherpstelfout. Kies 1/500 s of sneller, zodat je alleen de scherpstelling test.",faPhone:"Op een telefoon tik je op het scherm op je onderwerp om daar scherp te stellen. Voor bewegende onderwerpen werkt de serie- of burstmodus goed.",dIntro:"Scherptediepte is het gebied vóór en achter je scherpstelpunt dat er nog scherp uitziet. Soms wil je alles scherp, zoals bij een landschap. Soms juist alleen je onderwerp, zoals bij een portret. Drie dingen bepalen hoe diep dat gebied is.",dA:"Diafragma",dAd:"Groot f-getal (f/11, f/16) = veel scherptediepte. Klein f-getal (f
